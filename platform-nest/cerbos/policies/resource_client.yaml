apiVersion: api.cerbos.dev/v1
resourcePolicy:
  version: default
  resource: client
  importDerivedRoles: ["gaiada_scopes"]
  variables:
    import: ["gaiada_common"]
  rules:
    - actions: ["*"]
      effect: EFFECT_ALLOW
      derivedRoles: ["platform_admin"]
    - actions: ["read"]
      effect: EFFECT_ALLOW
      derivedRoles: ["company_admin", "manager", "member", "viewer"]
      condition: { match: { expr: "variables.inTenant && variables.notLow" } }
    - actions: ["create", "update", "delete"]
      effect: EFFECT_ALLOW
      derivedRoles: ["company_admin", "manager"]
      condition: { match: { expr: "variables.inTenant && variables.notLow" } }
    # ⚠ OWNER DECISION 2026-08-18 — `delete` REMOVED from this rule; member keeps create/update.
    # Found while preparing the sensitivity-flag review: `core.client.delete` appeared in the
    # BASELINE `member` bundle, and a live probe (principal whose only grant is member@company)
    # returned EFFECT_ALLOW on create/update/delete — tenant-wide, no `owns` carve-out, and
    # `clients.controller.ts:80` passes no ownership attribute to narrow it. So every staff member
    # could remove any client in their company. Soft-delete and audited, therefore recoverable, but
    # real reach over a core business entity. Rationale for the split rather than removing the rule:
    # agency staff plausibly onboard and edit clients as ordinary work; nobody plausibly needs every
    # staffer able to remove one. Deleting stays manager+ (the rule above).
    # Pinned by `client-member-delete-denied.test.ts`, which probes the live engine both ways.
    - actions: ["create", "update"]
      effect: EFFECT_ALLOW
      derivedRoles: ["member"]
      condition: { match: { expr: "variables.inTenant && variables.notLow" } }
    # ══════════ IAM-04-ROLLOUT-B4 — permission-matching arm. PURELY ADDITIVE: every rule above ═══
    # is byte-for-byte unchanged. One rule per action; the combined company_admin+manager+member
    # reach on create/update/delete is safe to fold into a single generic mirror per action (both
    # role-arm rules above use the IDENTICAL inTenant&&notLow condition, no resource-instance
    # carve-out anywhere in this file). No exclusion needed anywhere (zero team_lead mixing).
    - actions: ["read"]
      effect: EFFECT_ALLOW
      derivedRoles: ["perm_client_read"]
      condition: { match: { expr: "variables.inTenant && variables.notLow && variables.inRoot" } }
    - actions: ["create"]
      effect: EFFECT_ALLOW
      derivedRoles: ["perm_client_create"]
      condition: { match: { expr: "variables.inTenant && variables.notLow && variables.inRoot" } }
    - actions: ["update"]
      effect: EFFECT_ALLOW
      derivedRoles: ["perm_client_update"]
      condition: { match: { expr: "variables.inTenant && variables.notLow && variables.inRoot" } }
    - actions: ["delete"]
      effect: EFFECT_ALLOW
      derivedRoles: ["perm_client_delete"]
      condition: { match: { expr: "variables.inTenant && variables.notLow && variables.inRoot" } }
