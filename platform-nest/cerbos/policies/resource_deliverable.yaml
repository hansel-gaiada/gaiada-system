apiVersion: api.cerbos.dev/v1
resourcePolicy:
  version: default
  resource: deliverable
  importDerivedRoles: ["gaiada_scopes"]
  variables:
    import: ["gaiada_common"]
  rules:
    - actions: ["*"]
      effect: EFFECT_ALLOW
      derivedRoles: ["platform_admin"]
    - actions: ["read"]
      effect: EFFECT_ALLOW
      derivedRoles: ["company_admin", "manager", "member", "viewer"]
      condition: { match: { expr: "variables.inTenant && variables.notLow" } }
    - actions: ["create", "update", "delete"]
      effect: EFFECT_ALLOW
      derivedRoles: ["company_admin", "manager", "member"]
      condition: { match: { expr: "variables.inTenant && variables.notLow" } }
    # ══════════ IAM-04-ROLLOUT-B4 — permission-matching arm. PURELY ADDITIVE: every rule above ═══
    # is byte-for-byte unchanged. No exclusion needed (zero team_lead mixing on this kind).
    - actions: ["read"]
      effect: EFFECT_ALLOW
      derivedRoles: ["perm_deliverable_read"]
      condition: { match: { expr: "variables.inTenant && variables.notLow" } }
    - actions: ["create"]
      effect: EFFECT_ALLOW
      derivedRoles: ["perm_deliverable_create"]
      condition: { match: { expr: "variables.inTenant && variables.notLow" } }
    - actions: ["update"]
      effect: EFFECT_ALLOW
      derivedRoles: ["perm_deliverable_update"]
      condition: { match: { expr: "variables.inTenant && variables.notLow" } }
    - actions: ["delete"]
      effect: EFFECT_ALLOW
      derivedRoles: ["perm_deliverable_delete"]
      condition: { match: { expr: "variables.inTenant && variables.notLow" } }
