# TR-07 — the `reports.admin` authz tier of the tracker/reporting program (design §8's last matrix
# row: "facts recompute / calendars — Self ⛔ · Dept lead ⛔ · Exec group ✅ · HR-appraisal ⛔ ·
# served-dept ⛔"). Today its only action is `recompute` on
# POST /api/:tenantId/reports/facts/recompute; TR-06's calendar-config writes will land here too.
#
# Why a NEW resource kind rather than reuse: §8 introduces resource_report_document /
# report_period / checkin / appraisal for the READ + seal + person-axis surfaces, none of which
# describes "re-derive the fact fabric". The closest existing analogue is
# resource_rollup_recompute.yaml (a system-of-record recompute, admin/ops-gated) and this file is
# deliberately modelled on it — but tightened to §8's matrix: `manager` (the dept lead) is
# EXCLUDED, because a lead who can trigger a re-derivation of a whole window can move numbers that
# feed their own team's appraisal inputs. Exec + company admin + platform admin only.
#
# ══════════════ TR-25 finding ③: REVIEWED AGAINST §8 — VERDICT: CORRECT AS SHIPPED ══════════════
# TR-07 added this kind under time pressure (an unlisted resource kind is denied by default, so the
# endpoint would have been 403 for everyone including a group executive) and flagged it for TR-25 to
# fold into the parity matrix. Done — it is now covered by `reports-cerbos.test.ts`'s matrix. The
# audit against §8's last row ("facts recompute / calendars — Self ⛔ · Dept lead ⛔ · Exec ✅ ·
# HR-appraisal ⛔ · served-dept ⛔") found NO discrepancy. Recorded explicitly so it is not
# re-litigated:
#   · `manager`/`team_lead` EXCLUDED — matches §8's "Dept lead ⛔". TR-07's reasoning is sound and
#     worth restating: a lead who can re-derive a window can move the numbers feeding their own team's
#     appraisal inputs. This is also the ONE person-axis-adjacent surface where in-app narrowing would
#     NOT help — a recompute is tenant-wide by construction, so there is no per-unit slice to narrow
#     to. Excluding the tier outright is the only correct answer.
#   · `hr_people_ops`/`hr_people_reader` EXCLUDED — matches §8's "HR-appraisal ⛔". HR consumes the
#     fact fabric; it does not get to rebuild it.
#   · Served-dept tier EXCLUDED (`module_staff`/`module_manager` appear nowhere here) — matches §8's
#     "served-dept ⛔". A provider must never trigger a recompute in the served company.
#   · `company_admin` + `group_executive` + `platform_admin` only, all `notLow`. §8's "Exec ✅", plus
#     the tenant's own admin under the same reading of "lead" that resource_report_period.yaml's
#     header establishes for seal/amend.
# The `calendars` half of §8's row ("facts recompute / calendars") still has no endpoint (TR-06's
# calendar-config writes never landed a route). When it does, it belongs on THIS kind with THIS tier —
# not a fifth resource.
apiVersion: api.cerbos.dev/v1
resourcePolicy:
  version: default
  resource: report_admin
  importDerivedRoles: ["gaiada_scopes"]
  variables:
    import: ["gaiada_common"]
  rules:
    - actions: ["*"]
      effect: EFFECT_ALLOW
      derivedRoles: ["platform_admin"]
    # group_executive is a GLOBAL cross-company role, so it is gated on `notLow` only — NOT
    # `inTenant`, which requires the resource's tenant to be in principal.companies and therefore
    # never holds for a global exec grant. Same shape and same reasoning as
    # resource_work_activity.yaml's exec rule (derived roles do not cascade).
    - actions: ["recompute"]
      effect: EFFECT_ALLOW
      derivedRoles: ["group_executive"]
      condition: { match: { expr: "variables.notLow" } }
    # The company's own admin may re-derive its own company's facts (ops path: an n8n nightly flow
    # runs under a company_admin service principal). Bounded to that tenant, and never low-assurance
    # — a chat-session principal must not be able to trigger a window recompute.
    - actions: ["recompute"]
      effect: EFFECT_ALLOW
      derivedRoles: ["company_admin"]
      condition: { match: { expr: "variables.inTenant && variables.notLow" } }
