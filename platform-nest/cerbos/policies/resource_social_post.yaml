# SMM-30 — authz for the `social_post` kind: master posts, their per-network variants, and the
# content campaigns that group them (design §11 folds all three into one kind on purpose — they are
# one editorial object at the authorization layer). THE most consequential policy in this module:
# three of its actions put content in front of the public, irreversibly.
# Restart `gaiada-test-cerbos` after editing; the bind-mount does not hot-reload.
#
# Handlers pass resource.attr = {kind:"social_post", tenantId, module:"social", id?}.
#
# ── ACTIONS ──────────────────────────────────────────────────────────────────────────────────────
#   read              — calendar, composer, post/variant detail.
#   create/update     — author a post and its per-network variants. Drafting is a staff act.
#   delete            — remove an UNPUBLISHED post/variant (soft delete). Not the same power as
#                       `delete_published`, which reaches the public internet — see below.
#   submit            — file a variant into the WS4 approval queue. Deliberately separate from
#                       `update`: proposing is weaker than approving, and this is the action an
#                       AI/agent draft path is allowed to reach (design §07, the whole point of the
#                       agent surface is that it may propose and can never publish).
#   publish           — DECIDE that approved content ships, and thereby execute it. This is the
#                       gate the entire module is built around; holding it is holding the ability to
#                       say something publicly in a client's name. Manager tier and above, never
#                       module_staff, never `member`.
#   cancel            — pull a SCHEDULED (not yet public) post out of the queue. A mutation of
#                       outbound state, hence its own action rather than part of `update`.
#   delete_published  — delete something ALREADY PUBLIC. Irreversible in the direction that matters
#                       (the internet may have already seen it) and separately revocable from
#                       `publish` for the same reason `pay` is separate from `sign` on the portal:
#                       different powers, different blast radii.
#   import_native     — record a post that was published BY HAND in the network's own app.
#                       Bookkeeping only (0105's `svar_native_import_is_bookkeeping` CHECK makes
#                       that structural: no approval, no provider id, published only). Staff-tier
#                       because it cannot cause an outbound action — it describes one that already
#                       happened.
#
# ── WHY A PERMISSION IS NOT THE APPROVAL ────────────────────────────────────────────────────────
# Holding `publish` does NOT let a principal publish unapproved content. Every outbound-public tool
# is registered `write:true, impact:"high"`, so it SUSPENDS into WS4, and dispatch consumes a
# single-use approval grant whose `argsSha256` must match the variant's own hash (addendum D-14/
# D-15). This policy decides WHO MAY BE THE HUMAN IN THAT LOOP. The two gates are independent and
# both required; neither substitutes for the other. Do not "simplify" by widening this action list
# on the reasoning that the approval gate already protects it.
#
# ── THE INVARIANT THIS FILE MUST NOT BREAK ───────────────────────────────────────────────────────
# `client` appears NOWHERE here. Client sign-off on a post is `portal.approve_post` on the portal
# kind, against `social_post_client_reviews` — a different resource, a different wall, and never a
# grant on this one. A client must DENY on every action in this file, including `read`.
#
# ── TRAP #4 ─────────────────────────────────────────────────────────────────────────────────────
# `group_executive` is global-scope and has no `company_memberships` row in most companies, so
# `inTenant` is FALSE for them there — it gets its own `notLow`-only rule, never folded into the
# company_admin/manager rule. Read-only here: overseeing is not publishing.
#
# ── PERMISSION ARM (IAM-04-B6, 2026-08-13) — PARTIAL, deliberately ──────────────────────────────
# See resource_social_engagement.yaml's header for why this batch is unblocked (IAM-SEC-03 closed
# the wildcard-bleed detection gap this file used to cite) and for the confirm-reliable method.
# ONLY `read`/`create`/`update`/`delete`/`import_native` are mirrored — the 5 actions
# `src/modules/social/social.controller.ts` actually implements (`listPosts`/`createPost`/`getPost`/
# `updatePost`/`deletePost`/`createVariant`/`updateVariant`/`deleteVariant`/`getVariantValidation`/
# `importNative`, every one hardcoding `module: "social"`). `submit`/`publish`/`cancel`/
# `delete_published` — the three most consequential, outbound-public actions this kind has — have
# NO handler anywhere in the tree (grepped: zero `authorize(...)` call sites for any of the four).
# Since "module is a kind-constant" cannot be confirmed by handler evidence for actions nobody has
# written yet, these stay UNMIRRORED — a documented deferral, not a guess, and not to be widened by
# a future ticket without the same grep-based confirmation this file's other 5 actions got.
apiVersion: api.cerbos.dev/v1
resourcePolicy:
  version: default
  resource: social_post
  importDerivedRoles: ["gaiada_scopes"]
  variables:
    import: ["gaiada_common"]
  rules:
    - actions: ["*"]
      effect: EFFECT_ALLOW
      derivedRoles: ["platform_admin"]
    - actions: ["read", "create", "update", "delete", "submit", "publish", "cancel",
                "delete_published", "import_native"]
      effect: EFFECT_ALLOW
      derivedRoles: ["company_admin", "manager"]
      condition: { match: { expr: "variables.inTenant && variables.notLow" } }
    # ORG-6 module tiers -> social_manager / social_staff (0106). The manager/staff split IS the
    # publish line: staff author, validate and submit; the manager is the human who decides that
    # something becomes public and who can take it back down.
    - actions: ["read", "create", "update", "delete", "submit", "publish", "cancel",
                "delete_published", "import_native"]
      effect: EFFECT_ALLOW
      derivedRoles: ["module_manager"]
      condition: { match: { expr: "variables.inTenant && variables.notLow" } }
    - actions: ["read", "create", "update", "submit", "import_native"]
      effect: EFFECT_ALLOW
      derivedRoles: ["module_staff"]
      condition: { match: { expr: "variables.inTenant && variables.notLow" } }

    # ═══ IAM-04-B6 — permission-matching arm, PARTIAL (see this file's header). PURELY ADDITIVE: ═══
    # every rule above is byte-for-byte unchanged. `submit`/`publish`/`cancel`/`delete_published`
    # are deliberately ABSENT below — no handler exists to confirm the module attribute is reliable
    # for those four, and they are this kind's most consequential (outbound-public) actions.
    - actions: ["read"]
      effect: EFFECT_ALLOW
      derivedRoles: ["perm_social_post_read"]
      condition: { match: { expr: "variables.inTenant && variables.notLow && variables.inRoot" } }
    - actions: ["create"]
      effect: EFFECT_ALLOW
      derivedRoles: ["perm_social_post_create"]
      condition: { match: { expr: "variables.inTenant && variables.notLow && variables.inRoot" } }
    - actions: ["update"]
      effect: EFFECT_ALLOW
      derivedRoles: ["perm_social_post_update"]
      condition: { match: { expr: "variables.inTenant && variables.notLow && variables.inRoot" } }
    - actions: ["delete"]
      effect: EFFECT_ALLOW
      derivedRoles: ["perm_social_post_delete"]
      condition: { match: { expr: "variables.inTenant && variables.notLow && variables.inRoot" } }
    - actions: ["import_native"]
      effect: EFFECT_ALLOW
      derivedRoles: ["perm_social_post_import_native"]
      condition: { match: { expr: "variables.inTenant && variables.notLow && variables.inRoot" } }

    # ═══ SCP-1b (PERMISSION-CONTRACT §53.2-§53.4, §53.10) — the content pipeline's eight actions ═══
    # author, proofread, approve, design, schedule, manage, record_client, boost. Every rule above is byte-for-byte
    # unchanged. Each attribute-dependent rule stands alone (the HIER-2 authoring rule), every relationship condition on a
    # real role is INLINE (never a policy variable, so the bundle generator and the hazard scans see the self-scope), and
    # every ALLOW keeps `variables.inTenant && variables.notLow`. company_admin, manager, module_manager and module_staff
    # are named in NONE of these rules (SCP-Q9, SCP-Q18, SCP-Q19). `client` stays absent. platform_admin has them through
    # the wildcard above.
    #
    # Handlers send {kind:"social_post", id, tenantId, module:"social", ownerId, creatorId, approverIds, assigneeIds,
    # creativeSource}, every value read from the rows (modules/social/pipeline-authz.ts), never from a body.

    # The read tier gains the two scope-only roles (the copywriter reads what they proofread; the in-team designer reads
    # what they design). No `member` rule: a self-scoped read beside perm_social_post_read is a Pattern B hazard.
    - actions: ["read"]
      effect: EFFECT_ALLOW
      derivedRoles: ["social_copywriter", "social_designer"]
      condition: { match: { expr: "variables.inTenant && variables.notLow" } }

    # The client's OFFICER (`ownerId` = the engagement's owner_id), held as `member`: the writing, the hand scheduling, and
    # the team's own steps. Self-scoped, inline: an unfed ownerId ("") matches nobody.
    - actions: ["author", "schedule", "manage", "record_client", "boost"]
      effect: EFFECT_ALLOW
      derivedRoles: ["member"]
      condition:
        match:
          expr: >-
            variables.inTenant && variables.notLow &&
            has(request.resource.attr.ownerId) && request.resource.attr.ownerId != "" &&
            request.resource.attr.ownerId == request.principal.id

    # The COPYWRITER: suggest, approve the copy, return it.
    - actions: ["proofread"]
      effect: EFFECT_ALLOW
      derivedRoles: ["social_copywriter"]
      condition: { match: { expr: "variables.inTenant && variables.notLow" } }

    # The SEAT approvers (the HoD and the GM: the company's live lead seats on its Social Media and GM units, fed as
    # `approverIds`). `approve` is one of the five approver-only actions: its arms are exactly this rule, its perm_* mirror
    # and the platform_admin wildcard.
    - actions: ["approve"]
      effect: EFFECT_ALLOW
      derivedRoles: ["social_approver_seat"]
      condition: { match: { expr: "variables.inTenant && variables.notLow" } }
    # The seats also hold the team's own steps, beside the officer. The owner does not (no mirror: Pattern B).
    - actions: ["manage", "record_client", "boost"]
      effect: EFFECT_ALLOW
      derivedRoles: ["social_approver_seat"]
      condition: { match: { expr: "variables.inTenant && variables.notLow" } }

    # The DESIGNER, per the post's creative source (SCP-Q2). `creatives`: an assignee of the month request's PM task, held
    # as `member`, self-scoped by membership. `in_team`: a holder of social_designer. Each rule tests creativeSource, so a
    # designer of one route never acts on a post of the other, and an unfed source ("") matches neither.
    - actions: ["design"]
      effect: EFFECT_ALLOW
      derivedRoles: ["member"]
      condition:
        match:
          expr: >-
            variables.inTenant && variables.notLow &&
            request.resource.attr.creativeSource == "creatives" &&
            has(request.resource.attr.assigneeIds) &&
            request.principal.id in request.resource.attr.assigneeIds
    - actions: ["design"]
      effect: EFFECT_ALLOW
      derivedRoles: ["social_designer"]
      condition:
        match:
          expr: >-
            variables.inTenant && variables.notLow &&
            request.resource.attr.creativeSource == "in_team"

    # Permission arm: proofread (one scope-only role, so the mirror grants no more than the role arm) and approve (the
    # owner's arm; no real role reaches the key through a self-scoped rule, and the key is uiGrantable:false). author,
    # design, schedule, manage, record_client and boost are deliberately UNMIRRORED (§53.10).
    - actions: ["proofread"]
      effect: EFFECT_ALLOW
      derivedRoles: ["perm_social_post_proofread"]
      condition: { match: { expr: "variables.inTenant && variables.notLow && variables.inRoot" } }
    - actions: ["approve"]
      effect: EFFECT_ALLOW
      derivedRoles: ["perm_social_post_approve"]
      condition: { match: { expr: "variables.inTenant && variables.notLow && variables.inRoot" } }

    # ═══ The two DENY rules (§53.3). `roles: ["user"]`, so under deny-overrides they beat every ALLOW above, the
    # platform_admin wildcard and the mirrors included. ═══
    # Maker/checker: nobody passes proofread or approve on a post they drafted (creatorId = author_id) or whose client they
    # are the officer of (ownerId). The invoice `approve` shape: `has() && != ""` before the equality, so it fires only on a
    # KNOWN maker (a scope-level probe that sends no post is not denied by it).
    - actions: ["proofread", "approve"]
      effect: EFFECT_DENY
      roles: ["user"]
      condition:
        match:
          expr: >-
            (has(request.resource.attr.creatorId) && request.resource.attr.creatorId != "" &&
              request.resource.attr.creatorId == request.principal.id) ||
            (has(request.resource.attr.ownerId) && request.resource.attr.ownerId != "" &&
              request.resource.attr.ownerId == request.principal.id)
    # Unattended automations and bots never act in the pipeline (the resource_work_request.yaml shape). An agent acting for
    # a person arrives as that person (users.kind = 'employee'), so this does not fire for it. `read` stays allowed.
    - actions: ["author", "proofread", "approve", "design", "schedule", "manage", "record_client", "boost"]
      effect: EFFECT_DENY
      roles: ["user"]
      condition:
        match:
          expr: >-
            has(request.principal.attr.kind) &&
            request.principal.attr.kind in ["automation", "bot"]
