# TR-13 — the tracker/reporting program's read-surface authz (design §8's per-grain matrix), for
# `GET /api/:tenantId/reports/{document,overview,metrics}`. §8 names FOUR resource kinds
# (report_document / report_period / checkin / appraisal); this file is the FIRST of those four —
# report_period (seal/amend, TR-15) and checkin/appraisal (TR-09/TR-11/TR-24) are separate tickets'
# resource kinds and are NOT added here.
#
# Why one action PER GRAIN rather than a single "read" + a resource.attr.grain condition: the
# shared `Resource` type (src/rbac/cerbos.ts) has no `grain` attribute (kind/id/tenantId/ownerId/
# projectId/teamId/module/subjectUserId only), and §8's matrix genuinely differs per grain — most
# sharply, company-grain is EXEC-ONLY (no dept-lead, no HR-appraisal, no served-dept row at all),
# which a single shared "read" action could only express with a brittle attribute smuggled through
# one of the existing fields. Four explicit actions make the matrix legible in the policy itself.
#
# reports.controller.ts calls the SAME action for both the single-scope `document` read and the
# multi-scope `overview` listing — deliberately: `overview`'s caller never sets `ownerId`/
# `projectId`/`teamId` (there IS no single scope), so `member`'s `variables.owns` condition (which
# requires `has(resource.attr.ownerId)`) correctly fails CLOSED for a listing request, while
# manager/company_admin/exec/hr_people_ops (gated on `inTenant` only, not `owns`) are unaffected —
# no second policy needed to express "a plain member cannot list everyone's report".
#
# KNOWN APPROXIMATION, flagged for TR-25 (the Cerbos parity-matrix ticket) rather than silently
# assumed correct: §8's "dept lead (own unit)" / "project member" columns are approximated here by
# the existing `manager`/`member` derived roles' COMPANY/PROJECT-scoped grants (gaiada_scopes has
# no per-org-unit grant scope — org nodes are a free-form JSONB tree, 0029, not a grantable entity
# today). A company-scoped `manager` grant therefore reads every unit's report in that company, not
# only their own — broader than the design's literal "own unit only", never narrower (fails toward
# more access within the SAME tenant boundary, never a cross-tenant leak). Tightening this to true
# per-unit scoping needs either a new grant scopeType or a resource-side "is this scopeRef within
# the grant-holder's unit subtree" check this ticket does not implement.
apiVersion: api.cerbos.dev/v1
resourcePolicy:
  version: default
  resource: report_document
  importDerivedRoles: ["gaiada_scopes"]
  variables:
    import: ["gaiada_common"]
  rules:
    - actions: ["*"]
      effect: EFFECT_ALLOW
      derivedRoles: ["platform_admin"]

    # Group executive (global, cross-company): every grain, including company (§8: exec is the
    # ONLY column with a checkmark on the company-grain row).
    - actions: ["read_person", "read_project", "read_department", "read_company"]
      effect: EFFECT_ALLOW
      derivedRoles: ["group_executive"]
      condition: { match: { expr: "variables.notLow" } }

    # Company admin: same tenant, every grain incl. company (the company's own admin can see its
    # own company-wide numbers — §8 has no row that forbids this, only cross-tenant/served-dept
    # access is restricted at company grain).
    - actions: ["read_person", "read_project", "read_department", "read_company"]
      effect: EFFECT_ALLOW
      derivedRoles: ["company_admin"]
      condition: { match: { expr: "variables.inTenant && variables.notLow" } }

    # HR-appraisal role (§8 column): person/project/department reads (appraisal auto-inputs draw
    # on all three), but NOT company-grain — "person data yes, company strategy no" (§8's exact
    # wording for this column).
    - actions: ["read_person", "read_project", "read_department"]
      effect: EFFECT_ALLOW
      derivedRoles: ["hr_people_ops"]
      condition: { match: { expr: "variables.inTenant && variables.notLow" } }

    # Dept lead / manager tier: person/project/department, NOT company (§8: dept lead is EXCLUDED
    # from the company-grain row). See the file header's KNOWN APPROXIMATION note on unit scoping.
    - actions: ["read_person", "read_project", "read_department"]
      effect: EFFECT_ALLOW
      derivedRoles: ["manager", "team_lead"]
      condition: { match: { expr: "variables.inTenant && variables.notLow" } }

    # Project member: project-grain read for a project they hold a grant on (gaiada_scopes' own
    # project-scope cascade — see derived_roles.yaml's `member` definition).
    - actions: ["read_project"]
      effect: EFFECT_ALLOW
      derivedRoles: ["member"]
      condition: { match: { expr: "variables.inTenant && variables.notLow" } }

    # Self: person-grain read of ONE's own document only. `owns` requires
    # `has(resource.attr.ownerId)`, so an `overview` listing call (which never sets ownerId) fails
    # this condition closed rather than silently granting a broad list.
    - actions: ["read_person"]
      effect: EFFECT_ALLOW
      derivedRoles: ["member"]
      condition: { match: { expr: "variables.inTenant && variables.notLow && variables.owns" } }
