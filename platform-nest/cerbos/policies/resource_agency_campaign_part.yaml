# DW-5a (docs/FRONTEND-BFF-CONTRACT.md §31.2; plan docs/plans/2026-10-13-department-workspaces.md §7.1, ruling
# DW-D13) — authz for the NEW `agency_campaign_part` resource kind (module `agency`): one PART of a shared
# campaign, belonging to one taking-part department. Five actions:
#   read      — see a campaign's parts. Mirrors `agency_campaign` read (company_admin, manager, member, viewer).
#   create    — add a department to a campaign.
#   delete    — remove a department from a campaign (a soft delete; cancelling is the normal path).
#   allocate  — ANY write that sets or changes a part's `budgetMinor`. Kept apart from `update` so that a part's
#               owner or a department head can never move money (§31.3: the campaign budget is the one spend
#               authority).
#   update    — status, owner, brief, due date and links. company_admin and manager everywhere; the part's OWNER
#               on their own part; an `org_unit_lead` on a part whose department sits under their unit.
#
# ── THE TWO ATTRIBUTE-DEPENDENT RULES EACH STAND ALONE ───────────────────────────────────────────
# `update` is reachable by three different kinds of authority, so it is three rules, never one:
#   1. company_admin / manager        — scope-only roles, unconditional beyond `inTenant && notLow`.
#   2. the part's OWNER               — `variables.owns` (resource.attr.ownerId == principal.id), on `member`.
#                                       Its own rule: it is self-scoped, and role-permission-bundles.json marks
#                                       it so (member·update is a `selfScoped` pair).
#   3. org_unit_lead                  — `request.resource.attr.unitAncestors` (the part's `unit_id` expanded
#                                       through `org_unit_closure`, the HIER-2 shape) contains the grant's unit.
#                                       Its own rule, NEVER mixed with a scope role (the HIER-2 binding authoring
#                                       rule, derived_roles.yaml): mixing would let a future permission mirror
#                                       over-grant what this arm reaches only by attribute.
# Both attributes are fed by the HANDLER (agency.controller.ts): `ownerId` from the part row and `unitAncestors`
# from `loadUnitAncestors(part.unit_id)`. Neither is ever read from a request body. An unfed resource fails
# closed (`ownerId` "" never equals a principal id; `unitAncestors` [] contains nothing).
#
# ── NO PERMISSION MIRROR FOR `update` ─────────────────────────────────────────────────────────
# Rules 2 and 3 are exactly the shapes a flat `perms` mirror cannot express (permission-arm-hazard-scan.test.ts
# Pattern B for the owner rule, iam-04-reg1-mirror-reach-invariant.test.ts for both). A `perm_*update` rule would
# let any holder of the key reach every part, not just their own or their unit's. So read/create/delete/allocate
# carry the generic permission arm (`inTenant && notLow && inRoot`) and `update` does not, the same call
# resource_time_entry.yaml makes for its self-scoped update/delete. Consequence: the permission-native `owner`
# role (zero role-arm rules) holds the `update` key in its bundle but cannot act on it; `owner` reaches
# update only if it also holds company_admin/manager.
#
# `owner` (the permission-native role) mirrors company_admin in role-permission-bundles.json: the same five keys.
apiVersion: api.cerbos.dev/v1
resourcePolicy:
  version: default
  resource: agency_campaign_part
  importDerivedRoles: ["gaiada_scopes"]
  variables:
    import: ["gaiada_common"]
  rules:
    - actions: ["*"]
      effect: EFFECT_ALLOW
      derivedRoles: ["platform_admin"]
    - actions: ["read"]
      effect: EFFECT_ALLOW
      derivedRoles: ["company_admin", "manager", "member", "viewer"]
      condition: { match: { expr: "variables.inTenant && variables.notLow" } }
    - actions: ["create", "delete", "allocate", "update"]
      effect: EFFECT_ALLOW
      derivedRoles: ["company_admin", "manager"]
      condition: { match: { expr: "variables.inTenant && variables.notLow" } }

    # The part's owner updates THEIR OWN part (status, owner, brief, due date, links) — never its money (`allocate`
    # is not in this rule). `variables.owns` also requires has(resource.attr.ownerId), so a call that never fed
    # the owner denies.
    - actions: ["update"]
      effect: EFFECT_ALLOW
      derivedRoles: ["member"]
      condition: { match: { expr: "variables.inTenant && variables.notLow && variables.owns" } }

    # Department head — OWN rule, never mixed (HIER-2 §1.4). Containment is the derived role's: the grant's
    # scopeId must be in resource.attr.unitAncestors (this part's unit and every ancestor of it).
    - actions: ["update"]
      effect: EFFECT_ALLOW
      derivedRoles: ["org_unit_lead"]
      condition: { match: { expr: "variables.inTenant && variables.notLow" } }

    # =========== permission-matching arm: read / create / delete / allocate ONLY (see the header) =========
    # Generic global-or-company mirror per action. The platform_admin wildcard is deliberately NOT mirrored
    # (IAM-04c: the tier bypass never enters the permission catalog).
    - actions: ["read"]
      effect: EFFECT_ALLOW
      derivedRoles: ["perm_agency_campaign_part_read"]
      condition: { match: { expr: "variables.inTenant && variables.notLow && variables.inRoot" } }
    - actions: ["create"]
      effect: EFFECT_ALLOW
      derivedRoles: ["perm_agency_campaign_part_create"]
      condition: { match: { expr: "variables.inTenant && variables.notLow && variables.inRoot" } }
    - actions: ["delete"]
      effect: EFFECT_ALLOW
      derivedRoles: ["perm_agency_campaign_part_delete"]
      condition: { match: { expr: "variables.inTenant && variables.notLow && variables.inRoot" } }
    - actions: ["allocate"]
      effect: EFFECT_ALLOW
      derivedRoles: ["perm_agency_campaign_part_allocate"]
      condition: { match: { expr: "variables.inTenant && variables.notLow && variables.inRoot" } }
