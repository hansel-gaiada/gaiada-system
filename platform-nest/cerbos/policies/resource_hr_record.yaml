# WSD-2 (HR module). hr_record = contract|document|note references per subject. More sensitive
# than hr_case: per design §1 Scope, subject self-read of records is OUT in v1 (no `member` rule
# here — deliberately). Same served-company slicing as hr_case (design §2.2). Nothing here trusts
# client-supplied scope; tenantId is the URL/served tenant, matched against the materialized grant.
#
# group_executive is intentionally DENIED here (no rule below grants it, unlike resource_hr_case.yaml
# which does) — hr_record holds raw per-subject rows (contracts/documents/notes), and those stay
# sensitive even to the holding-level executive. group_executive's cross-company visibility is
# served exclusively through rollups (D12 aggregates), never raw hr_record reads.
apiVersion: api.cerbos.dev/v1
resourcePolicy:
  version: default
  resource: hr_record
  importDerivedRoles: ["gaiada_scopes"]
  variables:
    import: ["gaiada_common"]
  rules:
    - actions: ["*"]
      effect: EFFECT_ALLOW
      derivedRoles: ["platform_admin"]
    # HR staff / manager (served-company grant) + the served company's own admin.
    - actions: ["read", "create", "update"]
      effect: EFFECT_ALLOW
      derivedRoles: ["module_staff", "module_manager", "company_admin"]
      condition: { match: { expr: "variables.inTenant && variables.notLow" } }
    # Destructive: manager + company admin only.
    - actions: ["delete"]
      effect: EFFECT_ALLOW
      derivedRoles: ["module_manager", "company_admin"]
      condition: { match: { expr: "variables.inTenant && variables.notLow" } }
    # Export gated on the D4 high-assurance tier.
    - actions: ["export"]
      effect: EFFECT_ALLOW
      derivedRoles: ["module_manager", "company_admin"]
      condition:
        match:
          expr: >-
            variables.inTenant && request.principal.attr.assurance == "high"

    # =========== IAM-04-ROLLOUT-B12 -- permission-matching arm. PURELY ADDITIVE: every rule =====
    # above is byte-for-byte unchanged. Generic global-or-company mirror per action (see this
    # kind's entry in docs/superpowers/plans/2026-08-10-iam-04-rollout-b12-report.md for the
    # per-kind safety argument). Any group_executive-only or platform_admin wildcard rule on this
    # kind is deliberately NOT mirrored here (IAM-04c: the tier bypass never enters the permission
    # catalog).

    - actions: ["read"]
      effect: EFFECT_ALLOW
      derivedRoles: ["perm_hr_record_read"]
      condition: { match: { expr: "variables.inTenant && variables.notLow" } }
    - actions: ["create"]
      effect: EFFECT_ALLOW
      derivedRoles: ["perm_hr_record_create"]
      condition: { match: { expr: "variables.inTenant && variables.notLow" } }
    - actions: ["update"]
      effect: EFFECT_ALLOW
      derivedRoles: ["perm_hr_record_update"]
      condition: { match: { expr: "variables.inTenant && variables.notLow" } }
    - actions: ["delete"]
      effect: EFFECT_ALLOW
      derivedRoles: ["perm_hr_record_delete"]
      condition: { match: { expr: "variables.inTenant && variables.notLow" } }

    # perm_hr_record_export — REMOVED by IAM-04-REG2 (2026-08-12), RESTORED by IAM-04-REG3
    # (2026-08-13) at the CORRECT tier. Keeping REG2's own account here rather than deleting it:
    # that mirror was wired at `inTenant && notLow`, strictly WIDER than this rule's own
    # `inTenant && assurance == "high"` D4 tier. Both `company_admin` and `hr_manager` hold
    # hr.record.export in role-permission-bundles.json, but their ONLY real role-arm path to this
    # action (the "export" rule above) requires `assurance == "high"` — `_variables.yaml`:
    # `notLow = assurance != "low"`, so "linked" assurance (every real SSO login without MFA, per
    # `src/auth/oidc.ts::assuranceFor()`) satisfied `notLow` but not `"high"`. That let a
    # "linked"-assurance holder export raw per-subject HR records (contracts/documents/notes)
    # through the flat permission arm even though the role arm's own D4 high-assurance tier denied
    # them. REG2 fixed that by deleting the mirror outright — which also deleted the
    # permission-driven access path entirely, contrary to the owner's confirmed design intent that
    # anyone whose ROLE carries enough PERMISSION should be able to act, not only named roles.
    #
    # REG3's fix: restore the mirror, but carry the SAME high-assurance condition in the mirror's
    # OWN rule below — exactly `resource_hr_case.yaml`'s `perm_hr_case_export` precedent (compare
    # that file's identical rule shape). This satisfies both the D4 tier and the permission-arm
    # intent: a permission-only holder gets export ONLY at `assurance == "high"`, matching the
    # role arm exactly, never at `notLow`/`linked`. Do not lower this back to `notLow` — that is
    # the exact mistake REG2 caught and removed. See
    # docs/superpowers/plans/2026-08-12-iam-04-reg2-report.md (the removal) and
    # docs/superpowers/plans/2026-08-13-iam-04-reg3-report.md (this restoration).
    - actions: ["export"]
      effect: EFFECT_ALLOW
      derivedRoles: ["perm_hr_record_export"]
      condition:
        match:
          expr: >-
            variables.inTenant && request.principal.attr.assurance == "high"
