# Search-marketing module (SM-03; docs/blueprints/seo-sem-design.md §11). resource_search_report =
# the engagement's periodic report (metrics snapshot + AI-drafted narrative). `approve` and
# `deliver` (design §11: "actions incl. approve, deliver") back `search:report:approve` — a
# client-facing artifact leaving the platform, so drafting (read/create/update, `search:report:
# write`) stays baseline but approve/deliver are elevated-only, matching the parity matrix's
# "a member cannot ... approve" deny case.
apiVersion: api.cerbos.dev/v1
resourcePolicy:
  version: default
  resource: resource_search_report
  importDerivedRoles: ["gaiada_scopes"]
  variables:
    import: ["gaiada_common"]
  rules:
    - actions: ["*"]
      effect: EFFECT_ALLOW
      derivedRoles: ["platform_admin"]
    - actions: ["read", "create", "update"]
      effect: EFFECT_ALLOW
      derivedRoles: ["module_staff", "module_manager", "company_admin"]
      condition: { match: { expr: "variables.inTenant && variables.notLow" } }
    # Elevated: destructive + approve + deliver — manager + company admin only.
    - actions: ["delete", "approve", "deliver"]
      effect: EFFECT_ALLOW
      derivedRoles: ["module_manager", "company_admin"]
      condition: { match: { expr: "variables.inTenant && variables.notLow" } }

    # =========== IAM-04-ROLLOUT-B12 -- permission-matching arm. PURELY ADDITIVE: every rule =====
    # above is byte-for-byte unchanged. Generic global-or-company mirror per action (see this
    # kind's entry in docs/superpowers/plans/2026-08-10-iam-04-rollout-b12-report.md for the
    # per-kind safety argument). Any group_executive-only or platform_admin wildcard rule on this
    # kind is deliberately NOT mirrored here (IAM-04c: the tier bypass never enters the permission
    # catalog).

    - actions: ["read"]
      effect: EFFECT_ALLOW
      derivedRoles: ["perm_resource_search_report_read"]
      condition: { match: { expr: "variables.inTenant && variables.notLow && variables.inRoot" } }
    - actions: ["create"]
      effect: EFFECT_ALLOW
      derivedRoles: ["perm_resource_search_report_create"]
      condition: { match: { expr: "variables.inTenant && variables.notLow && variables.inRoot" } }
    - actions: ["update"]
      effect: EFFECT_ALLOW
      derivedRoles: ["perm_resource_search_report_update"]
      condition: { match: { expr: "variables.inTenant && variables.notLow && variables.inRoot" } }
    - actions: ["delete"]
      effect: EFFECT_ALLOW
      derivedRoles: ["perm_resource_search_report_delete"]
      condition: { match: { expr: "variables.inTenant && variables.notLow && variables.inRoot" } }
    - actions: ["approve"]
      effect: EFFECT_ALLOW
      derivedRoles: ["perm_resource_search_report_approve"]
      condition: { match: { expr: "variables.inTenant && variables.notLow && variables.inRoot" } }
    - actions: ["deliver"]
      effect: EFFECT_ALLOW
      derivedRoles: ["perm_resource_search_report_deliver"]
      condition: { match: { expr: "variables.inTenant && variables.notLow && variables.inRoot" } }
