# WS2 §5 — MCP hub tool-call authorization, versioned. The hub delegates its per-call and
# tool-visibility decisions to this policy (replacing the in-code policy module; the hub keeps the
# same logic as a fail-closed fallback when Cerbos is unreachable). The hub principal is coarse:
# an assurance level plus, for n8n automation callers, the workflow's scoped tool allow-list.
#
# Parity with mcp-hub/src/policy.ts:
#   - assurance rank gate: anonymous(0) < low(1) < verified(2); caller rank >= tool.minAssurance.
#   - automation (isAutomation): the tool must be in the workflow's scope, AND unattended runs may
#     only perform LOW-impact writes — medium/high/unclassified writes are denied (the hub turns
#     that denial into a "suspend for human approval", WS4 §3 / D14).
#   - D14-13: …UNLESS the hub presents a VERIFIED single-use execution grant for exactly this call,
#     surfaced as the `approvalId` resource attribute (see below).
#
# ───────────────────────────────────────────────────────────────────────────────────────────────────
# D14-13 — the grant-aware impact conjunct (architect ruling, mechanism (b)+(c);
# docs/superpowers/plans/2026-08-05-d14-and-assistant-tickets.md Amendment (2) + §1).
#
# WHY IT EXISTS: this policy is the impact gate's SECOND, independent encoding. Cerbos is
# authoritative whenever CERBOS_URL is set (it is, for mcp-hub and mcp-hub-central in
# infra/compose/docker-compose.vps.yml), so D14-04's hub-side grant alone would leave every
# origin='automation' re-drive Cerbos-DENIED and the approval row `failed`. Lifting the suspension
# requires BOTH encodings to know about the grant.
#
# `request.resource.attr.approvalId` is set by mcp-hub/src/cerbos.ts EXCLUSIVELY from D14-04's
# branded VerifiedExecutionGrant — an object only verifyExecutionGrant() can mint (HMAC over the
# payload + canonical args digest + ≤120s expiry + the platform-side single-use `pending → executing`
# claim). It is NEVER read from caller args, a caller header, or any unverified source, and it is only
# attached to the resource whose `name` the grant itself names.
#
# PLACEMENT IS LOAD-BEARING: the disjunct hangs off the IMPACT term ONLY, INSIDE the
# `automationScope` conjunction. One level out and a grant would also bypass the workflow's
# AUTOMATION_ALLOWLIST — i.e. an approval for one tool would unlock every tool. The assurance
# conjunct above is a separate `all.of` entry and is likewise unreachable from here: a grant can
# never buy assurance rank. (Regression-tested: mcp-hub/src/cerbos.test.ts, cases
# "misplacement detector" and "assurance still binds with a grant".)
#
# THE EXECUTABLE-TOOL LIST BELOW MIRRORS platform-nest/src/core/approval-executables.ts. It is the
# containment for the one dangerous bug class (attribute set without verification): even then, only
# these tools can be lifted. Every ticket that registers a new executable approval MUST add the tool
# name in BOTH places — and drift fails CLOSED (registry entry without a policy entry ⇒ Cerbos deny
# ⇒ a visible `failed` approval row, never a silent allow). MONEY-SPENDING TOOLS
# (search.setBudget / search.applyNegatives / search.launchCampaign — SM-55 / architect ruling A13)
# ARE PERMANENTLY BARRED FROM BOTH LISTS.
#
# PRV-03 (2026-08-09) — `webdev.provisionSite` added. It is `write:true`/`impact:"medium"` (creates a
# private org repo + a server directory + an nginx vhost + a TLS cert — public infrastructure, not a
# row edit), so an `origin='automation'` re-drive needs the SAME grant-lift disjunct deploy.* needed.
# The suspension is the human beat the design's "auto-generates" ask requires (provision-erp-seam-
# design.md §04 D-P3) — do NOT lower `minAssurance` or widen `wf:delivery`'s allow-list scope to dodge
# it; the tool's registry entry (approval-executables.ts) re-derives run/prd_sign-gate state under
# the SAME lock at execution time, never trusting approval-time state.
#
# The `has()` + string-type + non-empty triple is fail-closed for every shape a request can carry:
# attribute absent (every pre-existing request), empty string, and JSON null all fall through to the
# unchanged deny. Without the `type(...) == string` guard, CEL's heterogeneous `!=` would let a null
# satisfy `!= ""` — so that guard is load-bearing, not decoration.
#
# SMM-09 (2026-08-18) — `social.publishPost` added, and `social.publishPostMetered` deliberately NOT.
# The free publish path is `write:true`/`impact:"high"` (it puts content on a client's live public
# feed — the most irreversible action in the estate), so an `origin='automation'` re-drive needs the
# same grant-lift disjunct `deploy.*` needs, and its registry entry
# (platform-nest/src/core/approval-executables.ts, SMM-09 section) re-derives scope → quota → hash →
# unconsumed → budget → creator-info under the approval-exec lock at execution time, trusting no
# approval-time state.
#
# THE TWIN'S ABSENCE IS THE POINT, not an omission. Addendum D-14 splits publishing across two tool
# NAMES so the money bar stays intact without an owner amendment: any variant on a metered network
# (X — the only one in v1, and it ships DISABLED in every scope per OQ-2) rides
# `social.publishPostMetered`, which is BARRED in approval-executables.ts and appears in neither
# list. Adding it here would be the bug, not a missing feature — exactly as for the three
# `search.*` money tools named above. Both halves of the D14-13 mirror must move together, and the
# drift direction is safe: a registry entry without a policy entry is a Cerbos deny and a visible
# `failed` row, never a silent allow.
#
# D14-17 (2026-08-06) — Assistant write-tool entries evaluated, ZERO NET-NEW ENTRIES, so this list is
# UNCHANGED by that ticket. Full evidence in platform-nest/src/core/approval-executables.ts's own
# D14-17 section; summary: the assistant broker's ENTIRE tool universe (`ASSISTANT_AGENT_TOOLS` in
# modules/assistant/broker.ts) is two read-only agents, and `ai-agents/src/agent-write-guard.test.ts`'s
# `RERUN_CAPABLE_HIGH_WRITES` allowlist — which gates every `high_write` any AgentDef anywhere may
# declare — is `[]`. No `origin='agent'` write proposal can exist today, so nothing needs the grant-
# lift disjunct below. Separately, and independently of that: `pm.createTask`/`pm.createDoc` (D14-15,
# the PM entries this ticket was told to reuse) were correctly NOT added here either, because they are
# `impact:"low"` at the hub (`mcp-hub/src/pm-tools.ts`) — the disjunct they'd need is
# `impact == "low"`, which already short-circuits the `all.of` before the grant term is ever reached,
# for BOTH automation and agent principals. A tool only needs an entry in the list below when it is
# `write:true` AND `impact != "low"` AND an `origin='automation'` (n8n) re-drive of it must be able to
# pass this conjunct — none of today's registry entries beyond `deploy.*` meet that bar.
# ---------------------------------------------------------------------------------------------------
# P4-J1/P4-J3 (2026-08-07) -- the four new PM read tools (pm.listTasks / pm.getTask / pm.listProjects /
# pm.taskAssignmentHistory, mcp-hub/src/pm-tools.ts) needed NO new rule or conjunct here, and that is
# deliberate, not an oversight -- read this before assuming a gap:
#
#   - each is write:false (unset), minAssurance:"low" -- the SAME shape as every pre-existing
#     thin-front read tool this policy already authorizes generically (projects.list, tasks.list,
#     workActivity.feed, ...). The all.of above matches on tool ATTRIBUTES, not tool NAME, so a new
#     read tool with this shape is authorized by the existing rule the instant it registers; nothing
#     tool-specific needs adding.
#   - the automation conjunct's "!request.resource.attr.write" disjunct already lets any in-scope
#     workflow call a read tool -- but no AUTOMATION_ALLOWLIST entry names any of these four, so no
#     n8n workflow can reach them regardless (deny-by-default; add an entry only if a workflow
#     genuinely needs a PM read).
#   - this policy is ONLY the hub's coarse "may this principal call this MCP tool at all" gate (one
#     shared hub_caller role; no per-tenant/per-company-role attribute exists on the principal it
#     sees here). The actual PM RBAC -- company_admin/manager/member/viewer/team_lead, tenant
#     scoping, and the client-tier/cross-tenant denial the P4-J1 adversarial tests exercise -- is a
#     SEPARATE, already-existing gate: this repo's own resource_pm_task.yaml / resource_pm_project.yaml,
#     evaluated when the OBO envelope these tools forward resolves to a real principal on the
#     platform side. Duplicating that check here would be a second, driftable copy of the same rule
#     -- the same "one policy per resource" discipline this file's own header already follows for
#     the executable-tool list above.
apiVersion: api.cerbos.dev/v1
resourcePolicy:
  version: default
  resource: mcp_tool
  rules:
    - actions: ["call"]
      effect: EFFECT_ALLOW
      roles: ["hub_caller"]
      condition:
        match:
          all:
            of:
              # Assurance sufficient for the tool's minimum.
              - expr: >
                  request.principal.attr.assurance == "verified" ||
                  (request.principal.attr.assurance == "low" && request.resource.attr.minAssurance != "verified") ||
                  (request.principal.attr.assurance == "anonymous" && request.resource.attr.minAssurance == "anonymous")
              # Automation callers: in-scope AND (read/probe OR a low-impact write OR a write whose
              # exact call carries a verified execution grant AND whose tool is an approved
              # executable). See the D14-13 header block above before touching this expression.
              - expr: >
                  !request.principal.attr.isAutomation ||
                  (request.resource.attr.name in request.principal.attr.automationScope &&
                   (!request.resource.attr.write ||
                    request.resource.attr.impact == "low" ||
                    (has(request.resource.attr.approvalId) &&
                     type(request.resource.attr.approvalId) == string &&
                     request.resource.attr.approvalId != "" &&
                     request.resource.attr.name in ["deploy.staging", "deploy.production", "webdev.provisionSite",
                                                    "social.publishPost"])))
