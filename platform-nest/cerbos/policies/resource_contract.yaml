apiVersion: api.cerbos.dev/v1
resourcePolicy:
  version: default
  resource: contract
  importDerivedRoles: ["gaiada_scopes"]
  variables:
    import: ["gaiada_common"]
  rules:
    # MON-00c split: platform_admin is the SaaS operator tier and keeps unconditional cross-root
    # reach on purpose — that is the operator's job, not a leak (docs/plans/2026-08-20-monitoring-
    # gated-rulings.md §1.3). group_executive is root-bounded instead: cross-company within its OWN
    # root only, via `variables.inRoot`.
    - actions: ["*"]
      effect: EFFECT_ALLOW
      derivedRoles: ["platform_admin"]
    - actions: ["read", "create", "update", "delete", "send"]
      effect: EFFECT_ALLOW
      derivedRoles: ["company_admin"]
      condition: { match: { expr: "variables.inTenant && variables.notLow" } }
    # COUNTERSIGNING IS OWNER-ONLY, and that is the point of splitting it out. Binding the company to
    # a contract worth real money should not be reachable by the same grant that lets someone tidy up
    # a draft, so company_admin is deliberately NOT given `countersign` above, and neither is any
    # permission-arm rule below. Who countersigns (PV3-01, 2026-10-11):
    #   - an `owner` of the contract's company: the rule just below;
    #   - `platform_admin`, through the wildcard above (the operator tier).
    # Nobody else. No `perm_*` rule names countersign, so a permission key cannot reach it: neither
    # company_admin nor any custom role, however many `core.contract.*` keys it holds. The catalog
    # does list `core.contract.countersign` (every literal action here must be catalogued), but only
    # as `uiGrantable: false`, bundled onto platform_admin alone, and read by no rule.
    #
    # ⚠ THIS IS NOT THE CLIENT'S SIGNATURE PATH. A client never touches this resource: their
    # countersignature goes through `resource_portal`'s `sign` action, scoped to their own contracts by
    # portal-scope.ts. The two parties are authorized by two different policies on purpose, so widening
    # one can never accidentally widen the other.

    # PV3-01 (2026-10-11): the owner arm the comment above always described and nothing implemented
    # (plan trap 7). The recorded intent ("owner-only, deliberately narrower than company_admin",
    # docs/plans/2026-08-04-client-portal-deployment.md) is unchanged; this only makes it true.
    #
    # Company-scope grant only (owner is never global — owner-role.db.test.ts), and ON THIS tenant:
    # an owner of another company gets nothing here. Written inline under `roles: ["user"]` for the
    # reason resource_report_document.yaml's PV1-06a rule gives: `owner` has no derived role
    # (permission-native, IAM-04c §3), and countersign must not gain a perm_* rule. Owner's bundle is
    # unchanged: this rule reads the GRANT, never `attr.perms`.
    - actions: ["countersign"]
      effect: EFFECT_ALLOW
      roles: ["user"]
      condition:
        match:
          expr: >-
            variables.inTenant && variables.notLow &&
            request.principal.attr.grants.exists(g, g.role == "owner" &&
              g.scopeType == "company" && g.scopeId == request.resource.attr.tenantId)

    - actions: ["read"]
      effect: EFFECT_ALLOW
      derivedRoles: ["manager"]
      condition: { match: { expr: "variables.inTenant && variables.notLow" } }

    # =========== IAM-04-ROLLOUT-B12 -- permission-matching arm. PURELY ADDITIVE: every rule =====
    # above is byte-for-byte unchanged. Generic global-or-company mirror per action (see this
    # kind's entry in docs/superpowers/plans/2026-08-10-iam-04-rollout-b12-report.md for the
    # per-kind safety argument). Any group_executive-only or platform_admin wildcard rule on this
    # kind is deliberately NOT mirrored here (IAM-04c: the tier bypass never enters the permission
    # catalog).

    - actions: ["read"]
      effect: EFFECT_ALLOW
      derivedRoles: ["perm_contract_read"]
      condition: { match: { expr: "variables.inTenant && variables.notLow && variables.inRoot" } }
    - actions: ["create"]
      effect: EFFECT_ALLOW
      derivedRoles: ["perm_contract_create"]
      condition: { match: { expr: "variables.inTenant && variables.notLow && variables.inRoot" } }
    - actions: ["update"]
      effect: EFFECT_ALLOW
      derivedRoles: ["perm_contract_update"]
      condition: { match: { expr: "variables.inTenant && variables.notLow && variables.inRoot" } }
    - actions: ["delete"]
      effect: EFFECT_ALLOW
      derivedRoles: ["perm_contract_delete"]
      condition: { match: { expr: "variables.inTenant && variables.notLow && variables.inRoot" } }
    - actions: ["send"]
      effect: EFFECT_ALLOW
      derivedRoles: ["perm_contract_send"]
      condition: { match: { expr: "variables.inTenant && variables.notLow && variables.inRoot" } }

    # ══════════ PV5-02 (2026-10-12) — `mark_certified` (PV-D8). A NEW ACTION on this existing kind.
    # Staff mark a contract for the certified (PSrE) signature tier at send. It moves the signing
    # route, not the content, so it is held by exactly the roles that hold `send` (company_admin on the
    # role arm, platform_admin by the wildcard) and reached by the same permission-arm shape `send`
    # uses, which is how `owner` reaches it. Every rule above is byte-for-byte unchanged.
    - actions: ["mark_certified"]
      effect: EFFECT_ALLOW
      derivedRoles: ["company_admin"]
      condition: { match: { expr: "variables.inTenant && variables.notLow" } }
    - actions: ["mark_certified"]
      effect: EFFECT_ALLOW
      derivedRoles: ["perm_contract_mark_certified"]
      condition: { match: { expr: "variables.inTenant && variables.notLow && variables.inRoot" } }
