apiVersion: api.cerbos.dev/v1
resourcePolicy:
  version: default
  resource: client_contact
  importDerivedRoles: ["gaiada_scopes"]
  variables:
    import: ["gaiada_common"]
  rules:
    - actions: ["*"]
      effect: EFFECT_ALLOW
      derivedRoles: ["platform_admin"]

    # Inviting an EXTERNAL person into a tenant is a governance action, so it is manager-tier and up —
    # never plain `member`. `manager` is included on the owner's explicit ratification (D-2, 2026-08-03):
    # "a PM delegates internally and starts the external setup", and the PM who owns the engagement is
    # the person who actually knows who the client's stakeholders are. Requiring a company_admin for
    # every contact would either bottleneck the PM or push admins into rubber-stamping.
    - actions: ["create", "update", "revoke"]
      effect: EFFECT_ALLOW
      derivedRoles: ["company_admin", "manager"]
      condition: { match: { expr: "variables.inTenant && variables.notLow" } }

    # Reading the contact list is team-level: anyone delivering the work needs to know who on the
    # client side is watching and who can sign. It exposes names/emails and a capability, never a
    # credential — `hasAccount`-style booleans only, exactly like the connections vault's `hasToken`.
    # HIER-3 (2026-08-11): `team_lead` used to be listed here for grid parity despite being a DEAD
    # TIER on this kind (it required a TEAM-scoped grant matching `resource.attr.teamId`, and this
    # resource never carried one). `team_lead` is now retired entirely, so the dead entry is gone
    # too, not just renamed.
    - actions: ["read"]
      effect: EFFECT_ALLOW
      derivedRoles: ["company_admin", "manager", "member", "viewer"]
      condition: { match: { expr: "variables.inTenant && variables.notLow" } }

    # ══════════ WSK-49f / WSK-D60 (amended 2026-10-11) — the client-website grant path ═══════════════
    # Two actions, ROLE-ARM ONLY (no perm_* mirror, deliberately: the client-admin arm below is attribute-
    # gated, and a flat permission key cannot express "this client").
    #
    #   manage_website_editor — grant / revoke the `client_website_editor` role to a contact of a client,
    #                           and list who holds it. The callers differ by WHAT THE HANDLER FEEDS:
    #       * STAFF route (/clients/:clientId/contacts/:contactId/website-editor): resource carries NO
    #         clientId, so the client-admin arm below cannot match and only the staff rules can.
    #       * PORTAL route (/portal/clients/:clientId/...): resource carries the route's clientId, which
    #         the handler then verifies against the caller's own portal scope and the target contact's row.
    #   manage_admin          — grant / revoke the `admin` client-contact capability. STAFF ONLY: there is
    #                           deliberately no client-admin rule for it, so a client admin can never mint
    #                           another admin (WSK-D60 amendment: "assigned only by Gaiada staff").
    - actions: ["manage_website_editor"]
      effect: EFFECT_ALLOW
      derivedRoles: ["company_admin", "manager"]
      condition: { match: { expr: "variables.inTenant && variables.notLow" } }
    - actions: ["manage_admin"]
      effect: EFFECT_ALLOW
      derivedRoles: ["company_admin"]
      condition: { match: { expr: "variables.inTenant && variables.notLow" } }
    # The client-admin arm: THIS action only, THIS client only (the derived role pins clientId + tenant).
    # `inRoot` mirrors the portal rules' second wall; `inTenant` is pinned to the caller's own contact rows.
    - actions: ["manage_website_editor"]
      effect: EFFECT_ALLOW
      derivedRoles: ["client_contact_admin"]
      condition: { match: { expr: "variables.inTenant && variables.notLow && variables.inRoot" } }

    # ══════════ IAM-04-ROLLOUT-B4 — permission-matching arm. PURELY ADDITIVE: every rule above ═══
    # is byte-for-byte unchanged. group_executive's own notLow-only rule above is DELIBERATELY not
    # mirrored (IAM-04c/TRAP-4: the exec tier never enters the permission catalog via this file's
    # own already-correct split). Only company_admin/manager's create/update/revoke reach and
    # company_admin/manager/member/viewer's read reach are mirrored — no exclusion needed (zero
    # team_lead mixing anywhere on this kind, per HIER-3's own header note above).
    - actions: ["create"]
      effect: EFFECT_ALLOW
      derivedRoles: ["perm_client_contact_create"]
      condition: { match: { expr: "variables.inTenant && variables.notLow && variables.inRoot" } }
    - actions: ["update"]
      effect: EFFECT_ALLOW
      derivedRoles: ["perm_client_contact_update"]
      condition: { match: { expr: "variables.inTenant && variables.notLow && variables.inRoot" } }
    - actions: ["revoke"]
      effect: EFFECT_ALLOW
      derivedRoles: ["perm_client_contact_revoke"]
      condition: { match: { expr: "variables.inTenant && variables.notLow && variables.inRoot" } }
    - actions: ["read"]
      effect: EFFECT_ALLOW
      derivedRoles: ["perm_client_contact_read"]
      condition: { match: { expr: "variables.inTenant && variables.notLow && variables.inRoot" } }
