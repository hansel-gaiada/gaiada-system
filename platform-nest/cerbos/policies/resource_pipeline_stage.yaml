apiVersion: api.cerbos.dev/v1
resourcePolicy:
  version: default
  resource: pipeline_stage
  importDerivedRoles: ["gaiada_scopes"]
  variables:
    import: ["gaiada_common"]
  rules:
    - actions: ["*"]
      effect: EFFECT_ALLOW
      derivedRoles: ["platform_admin"]
    # Automation accounts advance stages (running -> awaiting_gate -> done) as the workflow progresses.
    - actions: ["create"]
      effect: EFFECT_ALLOW
      derivedRoles: ["company_admin", "manager", "member"]
      condition: { match: { expr: "variables.inTenant && variables.notLow" } }
    # WD-03 (D-3): stage PATCH now also carries human artifact edits (PRD/Scope/Report text), so
    # "update" is elevated + automation-tier only — automation accounts authenticate at "manager"
    # tier (seedAutomationAccounts), never "member", so workflows are unaffected. A plain "member"
    # role is denied per the D-3 AC ("non-elevated member denied").
    - actions: ["update"]
      effect: EFFECT_ALLOW
      derivedRoles: ["company_admin", "manager"]
      condition: { match: { expr: "variables.inTenant && variables.notLow" } }
    # IAM-TRAP4: `group_executive` is a GLOBAL-scope-only role (derived_roles.yaml: `g.scopeType ==
    # "global"`), so a holder never has a `company_memberships` row and `variables.inTenant` is
    # FALSE for every resource. Folding it into the rule above denied it outright, defeating the
    # role's entire cross-company-oversight purpose. Own rule, `variables.notLow` only — matching
    # `resource_appraisal.yaml`'s `group_executive` rule exactly. See
    # docs/superpowers/plans/2026-08-11-hier-5-report.md §5 / 2026-08-12-iam-trap4-report.md.
    - actions: ["update"]
      effect: EFFECT_ALLOW
      derivedRoles: ["group_executive"]
      condition: { match: { expr: "variables.notLow" } }
    - actions: ["read"]
      effect: EFFECT_ALLOW
      derivedRoles: ["company_admin", "manager"]
      condition: { match: { expr: "variables.inTenant && variables.notLow" } }
    # IAM-TRAP4: same fold-in defect as `update` above — own rule, `variables.notLow` only.
    - actions: ["read"]
      effect: EFFECT_ALLOW
      derivedRoles: ["group_executive"]
      condition: { match: { expr: "variables.notLow" } }

    # ══════════ IAM-04-B4 — permission-matching arm. PURELY ADDITIVE: every rule above is byte-
    # for-byte unchanged. Mirrors ONLY the company_admin/manager/member `inTenant && notLow` reach
    # above. `group_executive`'s own `variables.notLow`-only rules (IAM-TRAP4) are DELIBERATELY not
    # mirrored (IAM-04c: the cross-company owner tier never enters the permission catalog).
    - actions: ["create"]
      effect: EFFECT_ALLOW
      derivedRoles: ["perm_pipeline_stage_create"]
      condition: { match: { expr: "variables.inTenant && variables.notLow" } }
    - actions: ["update"]
      effect: EFFECT_ALLOW
      derivedRoles: ["perm_pipeline_stage_update"]
      condition: { match: { expr: "variables.inTenant && variables.notLow" } }
    - actions: ["read"]
      effect: EFFECT_ALLOW
      derivedRoles: ["perm_pipeline_stage_read"]
      condition: { match: { expr: "variables.inTenant && variables.notLow" } }
