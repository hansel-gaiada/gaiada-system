# Scope cascade (RBAC spec §2) as Cerbos derived roles. The platform passes the principal's
# raw grants as attr.grants=[{role,scopeType,scopeId}] and the authorized tenant set as
# attr.companies; these derived roles compute "does a grant COVER this resource" — grants
# cascade downward (global → company → project → record).
apiVersion: api.cerbos.dev/v1
description: Gaiada scope-cascade derived roles
derivedRoles:
  name: gaiada_scopes
  definitions:
    - name: platform_admin
      parentRoles: ["user"]
      condition:
        match:
          expr: >-
            request.principal.attr.grants.exists(g,
              g.role == "platform_admin" && g.scopeType == "global")

    - name: group_executive
      parentRoles: ["user"]
      condition:
        match:
          expr: >-
            request.principal.attr.grants.exists(g,
              g.role == "group_executive" && g.scopeType == "global")

    - name: company_admin
      parentRoles: ["user"]
      condition:
        match:
          expr: >-
            request.principal.attr.grants.exists(g, g.role == "company_admin" && (
              g.scopeType == "global" ||
              (g.scopeType == "company" && g.scopeId == request.resource.attr.tenantId)))

    - name: manager
      parentRoles: ["user"]
      condition:
        match:
          expr: >-
            request.principal.attr.grants.exists(g, g.role == "manager" && (
              g.scopeType == "global" ||
              (g.scopeType == "company" && g.scopeId == request.resource.attr.tenantId) ||
              (g.scopeType == "project" && (g.scopeId == request.resource.attr.projectId || g.scopeId == request.resource.attr.id))))

    - name: member
      parentRoles: ["user"]
      condition:
        match:
          expr: >-
            request.principal.attr.grants.exists(g, g.role == "member" && (
              g.scopeType == "global" ||
              (g.scopeType == "company" && g.scopeId == request.resource.attr.tenantId) ||
              (g.scopeType == "project" && (g.scopeId == request.resource.attr.projectId || g.scopeId == request.resource.attr.id))))

    - name: viewer
      parentRoles: ["user"]
      condition:
        match:
          expr: >-
            request.principal.attr.grants.exists(g, g.role == "viewer" && (
              g.scopeType == "global" ||
              (g.scopeType == "company" && g.scopeId == request.resource.attr.tenantId)))

    # ══════════════ HIER-2 (DR-9) — org_unit_lead: the org-chart subtree cascade ══════════════
    # `team_lead`'s replacement for department-scoped authority (HIER-3, 2026-08-11: `team_lead`
    # itself — the `team`-scoped raw-grant role this comment used to sit directly below — is now
    # RETIRED: the `team` scope, `teams`/`team_memberships`, and the `team_lead` derived role are
    # all gone in the same change; see docs/superpowers/plans/2026-08-11-hier-3-report.md). A
    # grant at unit U covers every
    # resource whose OWN unit is U or a descendant of U — expressed as ANCESTOR CONTAINMENT rather
    # than a subtree walk: the RESOURCE carries `unitAncestors` = every ancestor of its own unit
    # (IAM-09's org_unit_closure table, self-inclusive at depth 0 — org-unit-closure.ts's header),
    # and the grant matches if its scopeId is anywhere in that list. A grant at 'd-web' therefore
    # covers a 'dv-frontend' resource (whose ancestor chain includes 'd-web') with no per-request
    # tree walk — containment falls out of the closure's own precomputation. `unitAncestors` is
    # populated ONLY by the two handlers that resolve it (reports.controller.ts for
    # report_document's read_department; appraisals.controller.ts for appraisal's read, off the
    # SUBJECT's current unit) — an unfed resource fails closed (an empty/absent list contains
    # nothing, so no grant can ever satisfy `in`).
    #
    # ⚠ BINDING AUTHORING RULE (the §1.4 guard from docs/superpowers/plans/2026-08-10-iam-hier-01-
    # plan.md): org_unit_lead is ALWAYS its own rule in every resource policy that uses it, NEVER
    # mixed with a scope-only role (company_admin/manager/member/viewer/...) in the SAME rule. That
    # same-rule mixing is exactly the `team_lead` defect this role replaces — a flat `perms` bundle
    # records what a rule NAMES, not what it can REACH, so mixing would let a future permission-arm
    # mirror over-grant. Classified UNSAFE by permission-arm-hazard-scan.test.ts's own structural
    # detector (no global/company disjunction) — correctly: this role IS attribute-dependent, by
    # design, and must never be treated as if it were scope-only.
    - name: org_unit_lead
      parentRoles: ["user"]
      condition:
        match:
          expr: >-
            request.principal.attr.grants.exists(g, g.role == "org_unit_lead" &&
              g.scopeType == "org_unit" && g.scopeId in request.resource.attr.unitAncestors)

    # IT staff (it_admin/it_manager/it) covering the IT device registry for their company.
    - name: it_staff
      parentRoles: ["user"]
      condition:
        match:
          expr: >-
            request.principal.attr.grants.exists(g,
              (g.role == "it_admin" || g.role == "it_manager" || g.role == "it") && (
                g.scopeType == "global" ||
                (g.scopeType == "company" && g.scopeId == request.resource.attr.tenantId)))

    # IAM Phase 2 (P2-02) — the `it_account` kind's OWN, NARROWER IT tier: it_admin OR it_manager
    # only, deliberately EXCLUDING the baseline `it` role. Design §5.4/§6.2 name the it_account
    # authority set as "it_admin/it_manager + company_admin" — narrower than it_staff's generic
    # it_admin||it_manager||it used everywhere else (device registry, etc). SAFE shape (global +
    # company-tenant disjunction, no top-level attribute gate) per
    # permission-arm-hazard-scan.test.ts's own classifier — mixable with company_admin in one rule.
    - name: it_managers
      parentRoles: ["user"]
      condition:
        match:
          expr: >-
            request.principal.attr.grants.exists(g,
              (g.role == "it_admin" || g.role == "it_manager") && (
                g.scopeType == "global" ||
                (g.scopeType == "company" && g.scopeId == request.resource.attr.tenantId)))

    # External client (WS11 portal): a `client` grant covers the client-portal surface for its
    # company. Client-to-run isolation (a client sees only THEIR runs) is enforced in the portal
    # controller by run.client_id, not here — this only establishes "is an authenticated client of
    # this tenant". Deliberately NOT a parent of any staff role, so it matches no other resource policy.
    - name: client
      parentRoles: ["user"]
      condition:
        match:
          expr: >-
            request.principal.attr.grants.exists(g, g.role == "client" && (
              (g.scopeType == "company" && g.scopeId == request.resource.attr.tenantId)))

    # Module-elevated approver (e.g. agency_approver) covering its module's resources.
    - name: module_approver
      parentRoles: ["user"]
      condition:
        match:
          expr: >-
            request.resource.attr.module != "" &&
            request.principal.attr.grants.exists(g,
              g.role == (request.resource.attr.module + "_approver") && (
                g.scopeType == "global" ||
                (g.scopeType == "company" && g.scopeId == request.resource.attr.tenantId)))

    # WSD-2 (HR module linchpin). Generic module-staff / module-manager pair: the role name is
    # string-composed from the resource's `module` attribute, so ONE pair serves hr/finance/legal/
    # it-as-a-service — no per-module policy explosion. Every module handler passes
    # resource.attr = {module: "<key>", tenantId: <SERVED company>, ...}; a reconciler-materialized
    # grant `{role:"<key>_staff", scopeType:"company", scopeId:<served tenant>}` (ORG-6) matches
    # only when the resource's tenantId equals the served company, so a served-company grant lights
    # up ONLY that module's surface in that company. Byte-level sibling of module_approver above.
    - name: module_staff
      parentRoles: ["user"]
      condition:
        match:
          expr: >-
            has(request.resource.attr.module) && request.resource.attr.module != "" &&
            request.principal.attr.grants.exists(g,
              g.role == (request.resource.attr.module + "_staff") && (
                g.scopeType == "global" ||
                (g.scopeType == "company" && g.scopeId == request.resource.attr.tenantId)))

    - name: module_manager
      parentRoles: ["user"]
      condition:
        match:
          expr: >-
            has(request.resource.attr.module) && request.resource.attr.module != "" &&
            request.principal.attr.grants.exists(g,
              g.role == (request.resource.attr.module + "_manager") && (
                g.scopeType == "global" ||
                (g.scopeType == "company" && g.scopeId == request.resource.attr.tenantId)))

    # ══════════════════ §8's "HR-appraisal role" column — SPLIT IN TWO by TR-25 ══════════════════
    #
    # TR-13 introduced ONE derived role, `hr_people_ops` == (hr_staff OR hr_manager), and flagged the
    # reuse for TR-25 to "confirm or replace". TR-25 AUDITED IT AND IT OVER-GRANTED. The finding, and
    # why it is not theoretical:
    #
    #   `hr_staff` is not a hand-picked appraisal role. `service-reconciler.ts` MATERIALIZES
    #   `<module>_staff` scoped to a SERVED company for EVERY member of a providing unit's subtree
    #   (0026 A12: "_manager to the lead, _staff to the rest"). So the moment company A's HR
    #   department serves company B under a service assignment, every rank-and-file member of A's HR
    #   unit held `hr_staff` on B — and, through the old single derived role, `cycle_admin` +
    #   `finalize` on B's appraisals plus every person's appraisal pack in B. An HR assistant whose
    #   whole legitimate job is filing leave requests could read and finalize the performance record
    #   of everyone in a company they do not work for.
    #
    #   The estate ALREADY draws this line everywhere else and TR-13's reuse crossed it:
    #   `platform-ui/src/lib/rbac.ts` grants `hr_staff → ["hr.view"]` (read-only) and
    #   `hr_manager → ["hr.view","hr.manage"]` (acting), and `resource_hr_case.yaml` distinguishes the
    #   two for hr_case's destructive actions. Appraisal data is strictly MORE sensitive than general
    #   HR module access, so collapsing the tiers there and nowhere else was backwards.
    #
    # Ruling: two derived roles, so the reuse survives where it is correct (reading person-grain
    # reports IS `hr.view`-shaped work) and is withdrawn where it is not (appraisals, and excusing a
    # check-in — which moves an appraisal-SAFE metric, §5 metric #18).
    #
    #   hr_people_ops    = hr_manager ONLY.  The ACTING HR tier: appraisal cycle_admin/finalize/read/
    #                      confirm_evidence, check-in `excuse`.
    #   hr_people_reader = hr_staff OR hr_manager.  The BASELINE HR read tier: person/project/
    #                      department report documents, check-in `read`, period `view`. NEVER
    #                      appraisal, NEVER excuse.
    #
    # Still deliberately NOT a new `hr_appraisal` role name: the platform has no seed or grant path
    # for one (0026 seeds only hr_staff/hr_manager), so minting it would produce a policy nobody can
    # ever satisfy — the same "unreachable tier written into a contract" defect §15 recorded for
    # `checkin.submit`'s `minAssurance: "verified"`. If a dedicated appraisal role is ever seeded,
    # `hr_people_ops` is the ONE line to change.
    - name: hr_people_ops
      parentRoles: ["user"]
      condition:
        match:
          expr: >-
            request.principal.attr.grants.exists(g, g.role == "hr_manager" && (
              g.scopeType == "global" ||
              (g.scopeType == "company" && g.scopeId == request.resource.attr.tenantId)))

    # The baseline HR read tier (see the block above). `hr_manager` is included so every rule that
    # admits the reader tier automatically admits the acting tier too — a policy must never have to
    # list both, which is how the two spellings drifted apart in the first place.
    - name: hr_people_reader
      parentRoles: ["user"]
      condition:
        match:
          expr: >-
            request.principal.attr.grants.exists(g, (g.role == "hr_staff" || g.role == "hr_manager") && (
              g.scopeType == "global" ||
              (g.scopeType == "company" && g.scopeId == request.resource.attr.tenantId)))

    # ═══════════════════════════ IAM-04a — PERMISSION-MATCHING DERIVED ROLES ═══════════════════════
    # Compat shim (IAM Phase 1, D-2): a permission-based alternative to the role-name derived roles
    # above, so a resource-policy rule can eventually match EITHER a role name OR a resolved
    # permission and reach the same decision. `cerbos.ts::principalPayload()` now sends
    # `attr.perms = [{key, scopeType, scopeId}]` alongside the pre-existing `attr.grants` — the flat
    # (permissions.key, scope) rows IAM-03a's `assemblePrincipal()` resolves through
    # `role_permissions` (0094). NOTHING in this repo's rules consumed these until IAM-04b's pilot
    # below wired the first two resources; every existing rule (and every derived role above this
    # line) is untouched.
    #
    # SCOPE SEMANTICS (do not widen beyond this — matches the ticket's own instruction and
    # `principal.ts::principalHasPermission()`'s documented boundary): a GLOBAL-scope permission
    # grant covers every tenant; a COMPANY-scope grant covers EXACTLY the company it was granted at
    # (`scopeId == request.resource.attr.tenantId`) — nothing narrower, nothing broader. The
    # project-scope cascade (manager/member's project scope) is DELIBERATELY NOT reproduced here:
    # `perms` carries scope copied verbatim from whichever grant produced it, with no record of
    # which named role that was, so a permission-arm rule can only safely test the ONE cascade shape
    # that is unambiguous regardless of origin (global-covers-all, company-covers-itself). Project-
    # scoped grants simply are not recognized by these derived roles — which is SAFE, not a gap: the
    # pre-existing, byte-unchanged role-name rules still grant that case exactly as before, so a
    # decision that depended on project scope is untouched.
    #
    # WHY NOT ONE GENERIC PARAMETERIZED DERIVED ROLE: Cerbos derived-role conditions have no access
    # to the action currently being evaluated (that's why `module_staff`/`module_manager` above
    # string-compose from `resource.attr.module`, never from the action) — so "does the principal
    # hold the permission this specific action requires" cannot be expressed as one reusable
    # condition. Each permission key needs its own concretely-named derived role, mirroring how
    # `module_staff`/`module_manager` already need one companion resource-policy rule per action.
    #
    # ⚠ FOUND WHILE BUILDING THIS (read before adding a THIRD resource, IAM-04-ROLLOUT): the flat
    # `perms` array cannot distinguish "holds this key via an unconditional/full-access role" from
    # "holds this SAME key via a resource-instance-scoped carve-out" (self-ownership, high-assurance-
    # only, etc.) — `role_permissions`' own bundling methodology (0094's header) deliberately treats
    # such resource-instance conditions as "satisfied" when computing a role's reach, so e.g.
    # `member`'s bundle contains `hr.case.read`/`create`/`cancel` from ITS OWN self-service-only rule
    # in resource_hr_case.yaml, indistinguishable at the permission layer from `company_admin`
    # holding the SAME keys unconditionally. A permission-arm rule that grants an action whenever
    # ANY role's bundle contains that key, without re-imposing the SAME resource-instance condition
    # the role-arm rule uses, would silently widen access. See resource_hr_case.yaml's own comment
    # for the concrete pairs this blocked (unconditional read/create) and the ones it did not
    # (update/delete/export, cancel-self) — each new rule below re-applies whatever condition its
    # role-arm counterpart uses; none of them are just "if perms has the key, allow".
    #
    # pm_task (IAM-04b pilot resource #1).
    #
    # HIER-3 (2026-08-11): this block used to carry a `team_lead` exclusion clause on every rule
    # below — `team_lead` sat in resource_pm_task.yaml's role list ALONGSIDE company_admin/manager/
    # member/viewer, so 0094 bundled it `pm.task.*` too, but `team_lead`'s OWN derived role matched
    # ONLY `scopeType == "team" && scopeId == resource.attr.teamId` and `pm.controller.ts` never set
    # `resource.attr.teamId` — so a `team_lead` grant at COMPANY or GLOBAL scope produced a `perms`
    # entry indistinguishable from a legitimate company_admin/manager/member/viewer grant at that
    # same scope, and each rule below excluded exactly that scope value via `attr.grants` as a
    # corroborating witness. `team_lead` is now retired (role, derived role, and every writer that
    # could mint the grant) — there is nothing left to distinguish, so the exclusion clause is
    # removed and these are now plain global-or-company mirrors of their role-arm counterparts,
    # matching every other IAM-04-ROLLOUT-B12 pair below. See
    # docs/superpowers/plans/2026-08-11-hier-3-report.md for the retirement's full account.
    - name: perm_pm_task_read
      parentRoles: ["user"]
      condition:
        match:
          expr: >-
            request.principal.attr.perms.exists(g, g.key == "pm.task.read" && (
              g.scopeType == "global" ||
              (g.scopeType == "company" && g.scopeId == request.resource.attr.tenantId)))

    - name: perm_pm_task_update
      parentRoles: ["user"]
      condition:
        match:
          expr: >-
            request.principal.attr.perms.exists(g, g.key == "pm.task.update" && (
              g.scopeType == "global" ||
              (g.scopeType == "company" && g.scopeId == request.resource.attr.tenantId)))

    - name: perm_pm_task_create
      parentRoles: ["user"]
      condition:
        match:
          expr: >-
            request.principal.attr.perms.exists(g, g.key == "pm.task.create" && (
              g.scopeType == "global" ||
              (g.scopeType == "company" && g.scopeId == request.resource.attr.tenantId)))

    - name: perm_pm_task_delete
      parentRoles: ["user"]
      condition:
        match:
          expr: >-
            request.principal.attr.perms.exists(g, g.key == "pm.task.delete" && (
              g.scopeType == "global" ||
              (g.scopeType == "company" && g.scopeId == request.resource.attr.tenantId)))

    - name: perm_pm_task_manage
      parentRoles: ["user"]
      condition:
        match:
          expr: >-
            request.principal.attr.perms.exists(g, g.key == "pm.task.manage" && (
              g.scopeType == "global" ||
              (g.scopeType == "company" && g.scopeId == request.resource.attr.tenantId)))

    # hr_case (IAM-04b pilot resource #2 — exercises module-role composition). Only the actions with
    # NO resource-instance ambiguity get a companion here; see the header block above and
    # resource_hr_case.yaml's comment for the read/create exclusion.
    - name: perm_hr_case_update
      parentRoles: ["user"]
      condition:
        match:
          expr: >-
            request.principal.attr.perms.exists(g, g.key == "hr.case.update" && (
              g.scopeType == "global" ||
              (g.scopeType == "company" && g.scopeId == request.resource.attr.tenantId)))

    - name: perm_hr_case_delete
      parentRoles: ["user"]
      condition:
        match:
          expr: >-
            request.principal.attr.perms.exists(g, g.key == "hr.case.delete" && (
              g.scopeType == "global" ||
              (g.scopeType == "company" && g.scopeId == request.resource.attr.tenantId)))

    - name: perm_hr_case_export
      parentRoles: ["user"]
      condition:
        match:
          expr: >-
            request.principal.attr.perms.exists(g, g.key == "hr.case.export" && (
              g.scopeType == "global" ||
              (g.scopeType == "company" && g.scopeId == request.resource.attr.tenantId)))

    # Self-scoped tier: the derived role tests ONLY permission+scope, exactly mirroring how the
    # role-arm's "member" derived role above carries no self-check of its own — the self-check
    # (`subjectUserId == principal.id`) is layered on separately, in the resource-policy rule's own
    # `condition`, matching resource_hr_case.yaml's existing member-self rule structure exactly.
    - name: perm_hr_case_read_self
      parentRoles: ["user"]
      condition:
        match:
          expr: >-
            request.principal.attr.perms.exists(g, g.key == "hr.case.read" && (
              g.scopeType == "global" ||
              (g.scopeType == "company" && g.scopeId == request.resource.attr.tenantId)))

    - name: perm_hr_case_create_self
      parentRoles: ["user"]
      condition:
        match:
          expr: >-
            request.principal.attr.perms.exists(g, g.key == "hr.case.create" && (
              g.scopeType == "global" ||
              (g.scopeType == "company" && g.scopeId == request.resource.attr.tenantId)))

    - name: perm_hr_case_cancel_self
      parentRoles: ["user"]
      condition:
        match:
          expr: >-
            request.principal.attr.perms.exists(g, g.key == "hr.case.cancel" && (
              g.scopeType == "global" ||
              (g.scopeType == "company" && g.scopeId == request.resource.attr.tenantId)))

    # =============== IAM-04-ROLLOUT-B12 - batches 1+2 permission-matching derived roles ========
    # Purely additive (IAM-04a shim, IAM-04b pattern). All generic global-or-company mirrors -- no
    # exclusion clause needed for any kind/action below: the register
    # (docs/superpowers/plans/2026-08-10-iam-04-rollout-scan.md) classified every kind touched here
    # SAFE (17, batch 1) or confirm-reliable module-mechanism (9, batch 2 -- module_staff/manager/
    # approver's resource.attr.module is verified hardcoded-literal for every real handler call site
    # on these kinds; no team_lead/client/group_executive mixing occurs in any rule these roles
    # mirror). Where a kind also carries a group_executive-only or platform_admin-wildcard rule,
    # that rule is DELIBERATELY not mirrored here (per IAM-04c: the tier bypass never enters the
    # permission catalog) -- only the company_admin/manager/member/viewer/module_staff/module_manager/
    # module_approver reach for each action is mirrored, exactly matching each kind's own SAFE
    # non-wildcard, non-group_executive-only rule(s). See
    # docs/superpowers/plans/2026-08-10-iam-04-rollout-b12-report.md for the full per-kind account.

