    # =============== HIER-2 rollout batch 3 — checkin's permission arm ==========================
    # (docs/superpowers/plans/2026-08-10-iam-04-rollout-scan.md §3, "checkin is the one Mechanism-4
    # kind with NO team_lead involvement at all — it needs only the self-scoped-mirror treatment").
    # `read` is Pattern B (member's self-scoped rule coexists with group_executive/
    # hr_people_reader/company_admin/manager's unconditional reach on the SAME action) — mitigation
    # 3 (selective self-scoped mirroring): a SELF-SCOPED-ONLY arm, never an unconditional mirror for
    # that action. `submit` has no unconditional counterpart at all (member-self is the ONLY role
    # that ever holds it), so it gets the identical self-scoped shape for the same reason hr_case's
    # create/cancel got one — not because it is hazardous, but because "self-scoped" is still the
    # correct, non-widening shape. `excuse`/`pending_reminders`/`missed_by_unit` have no self path
    # whatsoever (no Pattern-B ambiguity) and no team_lead mixing either, so they get the plain
    # IAM-04-ROLLOUT-B12-style generic global-or-company mirror, one action per rule/role (pm_task
    # pilot's own rule: "each action gets its OWN rule + its OWN permission-derived-role").
