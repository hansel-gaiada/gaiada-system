# SMM-30 — authz for the `social_report` kind: the client-facing monthly/campaign engagement report
# (0105). A different grain from the reports module's four internal grains, exactly as
# search_reports is; rendering and delivery reuse the existing report-renderer + print-payload
# pipeline rather than a second renderer.
# Restart `gaiada-test-cerbos` after editing; the bind-mount does not hot-reload.
#
# Handlers pass resource.attr = {kind:"social_report", tenantId, module:"social", id?}.
#
# ── ACTIONS ──────────────────────────────────────────────────────────────────────────────────────
#   read                — the report list/detail in the console.
#   create/update       — assemble the metric snapshot and edit the AI-drafted narrative.
#   delete              — soft-delete a draft.
#   approve             — sign off that the numbers and the narrative are right. Maker/checker: the
#                         same person may author and approve only if they hold both, and the
#                         module_staff tier deliberately does not.
#   deliver             — send it to the client (Shared Drive + deliverable + notification). Its own
#                         action, separate from `approve`, because delivery is the outward-facing
#                         half: approving is an internal judgment, delivering puts a document in a
#                         client's hands and cannot be un-sent.
#
# ── THE INVARIANT THIS FILE MUST NOT BREAK ───────────────────────────────────────────────────────
# `client` appears NOWHERE. A delivered report reaches the client as a `deliverables` row + a Drive
# file through the existing delivery path — never by granting a client read on this kind.
#
# ── TRAP #4 ─────────────────────────────────────────────────────────────────────────────────────
# `group_executive` gets its own `notLow`-only rule, read-only.
#
# ── PERMISSION ARM: read, approve, deliver (SCP-1b, 2026-10-26, PERMISSION-CONTRACT §53.7/§53.10) ──
# Superseding the deferral below: the kind now has real handlers (social-reports.controller.ts, SMM-23), every one of
# whose call sites hardcodes `module: "social"`, so the module tiers' gate never excludes anything here in practice.
#
# ── (superseded) NO PERMISSION ARM (IAM-04-B6, 2026-08-13) ──────────────────────────────────────
# Considered and DEFERRED, not overlooked — same reasoning as resource_social_account.yaml: every
# action (`read`/`create`/`update`/`delete`/`approve`/`deliver`) is also held by `social_manager`/
# `social_staff` via `module_manager`/`module_staff`, and no real handler for `social_report` exists
# anywhere in the tree yet (grepped: zero call sites) — `deliver` in particular puts a document in a
# client's hands (see the ACTIONS note above). Left unmirrored; re-audit once this kind gets a real
# handler.
apiVersion: api.cerbos.dev/v1
resourcePolicy:
  version: default
  resource: social_report
  importDerivedRoles: ["gaiada_scopes"]
  variables:
    import: ["gaiada_common"]
  rules:
    - actions: ["*"]
      effect: EFFECT_ALLOW
      derivedRoles: ["platform_admin"]
    # SCP-5a (PERMISSION-CONTRACT §53.7, SCP-Q20): `approve` and `deliver` were cut from the two rules below. They now
    # belong to the four social approvers only (the seat rule, the owner's mirrors and the wildcard, further down).
    - actions: ["read", "create", "update", "delete"]
      effect: EFFECT_ALLOW
      derivedRoles: ["company_admin", "manager"]
      condition: { match: { expr: "variables.inTenant && variables.notLow" } }
    # ORG-6 module tiers -> social_manager / social_staff (0106). Staff draft; the manager edits and deletes. Neither
    # signs off or delivers any more (SCP-Q20).
    - actions: ["read", "create", "update", "delete"]
      effect: EFFECT_ALLOW
      derivedRoles: ["module_manager"]
      condition: { match: { expr: "variables.inTenant && variables.notLow" } }
    - actions: ["read", "create", "update"]
      effect: EFFECT_ALLOW
      derivedRoles: ["module_staff"]
      condition: { match: { expr: "variables.inTenant && variables.notLow" } }

    # ═══ SCP-5a / SCP-1b (§53.7, §53.10) — the HoD check and sending ═══
    # The four social approvers: the Social Media and GM lead seats (`approverIds`, social_approver_seat), the owner
    # (the two mirrors), platform_admin (the wildcard). Sending a report BACK from in_review to draft is the other answer
    # of the same check and authorizes as `approve` (social-reports.controller.ts). Every call site sends
    # {kind:"social_report", id?, tenantId, module:"social", approverIds}; the module literal is what makes the read
    # mirror faithful (IAM-04-B6 condition).
    - actions: ["approve", "deliver"]
      effect: EFFECT_ALLOW
      derivedRoles: ["social_approver_seat"]
      condition: { match: { expr: "variables.inTenant && variables.notLow" } }
    # Permission arm: read (so the permission-native owner opens what it checks; every holder holds it unconditionally),
    # approve and deliver (the owner's arm; uiGrantable:false keys).
    - actions: ["read"]
      effect: EFFECT_ALLOW
      derivedRoles: ["perm_social_report_read"]
      condition: { match: { expr: "variables.inTenant && variables.notLow && variables.inRoot" } }
    - actions: ["approve"]
      effect: EFFECT_ALLOW
      derivedRoles: ["perm_social_report_approve"]
      condition: { match: { expr: "variables.inTenant && variables.notLow && variables.inRoot" } }
    - actions: ["deliver"]
      effect: EFFECT_ALLOW
      derivedRoles: ["perm_social_report_deliver"]
      condition: { match: { expr: "variables.inTenant && variables.notLow && variables.inRoot" } }
    # Unattended automations and bots never sign off or send a client's report (§53.3). Beats the wildcard.
    - actions: ["approve", "deliver"]
      effect: EFFECT_DENY
      roles: ["user"]
      condition:
        match:
          expr: >-
            has(request.principal.attr.kind) &&
            request.principal.attr.kind in ["automation", "bot"]
