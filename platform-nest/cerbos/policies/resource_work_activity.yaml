apiVersion: api.cerbos.dev/v1
resourcePolicy:
  version: default
  resource: work_activity
  importDerivedRoles: ["gaiada_scopes"]
  variables:
    import: ["gaiada_common"]
  rules:
    - actions: ["*"]
      effect: EFFECT_ALLOW
      derivedRoles: ["platform_admin"]
    - actions: ["read"]
      effect: EFFECT_ALLOW
      derivedRoles: ["company_admin", "manager", "member", "viewer"]
      condition: { match: { expr: "variables.inTenant && variables.notLow" } }
    # Ingest is an admin/service-principal write (the P1-05 outbox consumer, or an admin backfill
    # script) — NOT an everyday staff action, mirrors resource_rollup_recompute.yaml's create tier.
    - actions: ["create"]
      effect: EFFECT_ALLOW
      derivedRoles: ["company_admin"]
      condition: { match: { expr: "variables.inTenant && variables.notLow" } }

    # ══════════ IAM-04-ROLLOUT-B4 — permission-matching arm. PURELY ADDITIVE: every rule above ═══
    # is byte-for-byte unchanged. group_executive's own notLow-only rule above is DELIBERATELY not
    # mirrored (IAM-04c/TRAP-4 — same WD-20-R1 reasoning the file's own header already documents).
    # No exclusion needed on the mirrored actions (zero team_lead mixing).
    - actions: ["read"]
      effect: EFFECT_ALLOW
      derivedRoles: ["perm_work_activity_read"]
      condition: { match: { expr: "variables.inTenant && variables.notLow && variables.inRoot" } }
    - actions: ["create"]
      effect: EFFECT_ALLOW
      derivedRoles: ["perm_work_activity_create"]
      condition: { match: { expr: "variables.inTenant && variables.notLow && variables.inRoot" } }
