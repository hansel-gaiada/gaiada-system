# WSD-2 (HR module). hr_case = the generic HR container (onboarding|offboarding|review|grievance|
# other); leave requests inherit these decisions via their own controller path (design §2.2).
# Every HR handler passes resource.attr = {kind, tenantId: <SERVED company>, module: "hr",
# subjectUserId: <subject>, ...}; tenantId is the URL/served tenant, so a materialized
# (hr_staff|hr_manager, company, <served>) grant lights up ONLY this company's HR surface.
# Three independent walls back this: this Cerbos gate, the ORG-3 tenant choke-point, and the
# module-sliced RLS (app_module_allowed('hr'), WSD-3). Nothing here trusts client-supplied scope.
apiVersion: api.cerbos.dev/v1
resourcePolicy:
  version: default
  resource: hr_case
  importDerivedRoles: ["gaiada_scopes"]
  variables:
    import: ["gaiada_common"]
  rules:
    - actions: ["*"]
      effect: EFFECT_ALLOW
      derivedRoles: ["platform_admin"]
    - actions: ["read", "create", "update"]
      effect: EFFECT_ALLOW
      derivedRoles: ["module_staff", "module_manager", "company_admin"]
      condition: { match: { expr: "variables.inTenant && variables.notLow" } }
    # Elevated destructive/administrative actions: manager + company admin only (NOT plain staff).
    - actions: ["delete"]
      effect: EFFECT_ALLOW
      derivedRoles: ["module_manager", "company_admin"]
      condition: { match: { expr: "variables.inTenant && variables.notLow" } }
    # Bulk export is the first real use of the D4 high-assurance tier (design §2.2).
    - actions: ["export"]
      effect: EFFECT_ALLOW
      derivedRoles: ["module_manager", "company_admin"]
      condition:
        match:
          expr: >-
            variables.inTenant && request.principal.attr.assurance == "high"
    # Subject self-service: read own case, file own leave/case, cancel own pending. Guarded with
    # has() so the rule fails CLOSED on any handler that omits subjectUserId (fail-safe, not a leak).
    - actions: ["read", "create", "cancel"]
      effect: EFFECT_ALLOW
      derivedRoles: ["member"]
      condition:
        match:
          expr: >-
            variables.inTenant && variables.notLow &&
            has(request.resource.attr.subjectUserId) &&
            request.resource.attr.subjectUserId == request.principal.id
    # ══════════ IAM-04b — permission-matching arm (dual-match pilot #2: module-role composition). ══
    # PURELY ADDITIVE: every rule above is byte-for-byte unchanged.
    #
    # Unconditional (module_staff/module_manager/company_admin-equivalent) tier — added ONLY for
    # update/delete/export. Safe because no OTHER rule in this file grants those three specific
    # actions to any role under a narrower condition (`member`'s self-only rule above never lists
    # update/delete/export), so "holds the permission" cannot be satisfied by anyone whose real
    # access is actually narrower than this rule's condition.
    - actions: ["update"]
      effect: EFFECT_ALLOW
      derivedRoles: ["perm_hr_case_update"]
      condition: { match: { expr: "variables.inTenant && variables.notLow && variables.inRoot" } }
    - actions: ["delete"]
      effect: EFFECT_ALLOW
      derivedRoles: ["perm_hr_case_delete"]
      condition: { match: { expr: "variables.inTenant && variables.notLow && variables.inRoot" } }
    - actions: ["export"]
      effect: EFFECT_ALLOW
      derivedRoles: ["perm_hr_case_export"]
      condition:
        match:
          expr: >-
            variables.inTenant && request.principal.attr.assurance == "high"
    # Self-scoped tier — mirrors the member-self rule immediately above EXACTLY, subjectUserId check
    # included as this rule's OWN condition (not folded into the derived role — see derived_roles.yaml).
    #
    # ⚠ DELIBERATELY NOT extended to an unconditional read/create mirror. `member`'s role_permissions
    # bundle (migration 0094) carries `hr.case.read` / `hr.case.create` / `hr.case.cancel` from ITS
    # OWN self-only rule above — 0094's bundling methodology treats a resource-instance condition
    # (self-ownership) as "satisfied" when computing reach, so those three keys sit in `member`'s
    # bundle indistinguishably from how `company_admin`/`module_staff`/`module_manager` hold the SAME
    # keys UNCONDITIONALLY. `attr.perms` carries no record of which role a grant came through, so a
    # permission-arm rule testing only "does `perms` contain hr.case.read" cannot tell those two
    # apart — adding an unconditional mirror for read/create would silently let any `member` read or
    # create ANY hr_case in the tenant, not just their own. This is a real granularity gap in the
    # current 215-permission catalog (self-scoped vs. unconditional reach are ONE key), not something
    # fixable from this ticket's owned files (derived_roles.yaml / resource policies / cerbos.ts) —
    # flagged for IAM-04-ROLLOUT / a catalog owner, not resolved here by narrowing `member` or
    # widening the mirror. `update`/`delete`/`export` above have no such ambiguity: no other role
    # reaches them through a narrower condition anywhere in this file.
    - actions: ["read"]
      effect: EFFECT_ALLOW
      derivedRoles: ["perm_hr_case_read_self"]
      condition:
        match:
          expr: >-
            variables.inTenant && variables.notLow &&
            has(request.resource.attr.subjectUserId) &&
            request.resource.attr.subjectUserId == request.principal.id
    - actions: ["create"]
      effect: EFFECT_ALLOW
      derivedRoles: ["perm_hr_case_create_self"]
      condition:
        match:
          expr: >-
            variables.inTenant && variables.notLow &&
            has(request.resource.attr.subjectUserId) &&
            request.resource.attr.subjectUserId == request.principal.id
    - actions: ["cancel"]
      effect: EFFECT_ALLOW
      derivedRoles: ["perm_hr_case_cancel_self"]
      condition:
        match:
          expr: >-
            variables.inTenant && variables.notLow &&
            has(request.resource.attr.subjectUserId) &&
            request.resource.attr.subjectUserId == request.principal.id
