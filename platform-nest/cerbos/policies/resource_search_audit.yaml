# Search-marketing module (SM-03; docs/blueprints/seo-sem-design.md §11). resource_search_audit
# covers technical/CWV/content/links/geo audits + findings + backlink snapshots + AI-visibility
# (design §11: "resource_search_audit (audits/findings/backlinks/ai-visibility)"), backing
# `search:audit:run` (trigger a crawl/CWV/content audit — the $0 🟢 P1 surface). `run` is the
# job-trigger action (SEONaut/open-seo-crawler/Unlighthouse, egress-guarded, $0 cost); it is kept
# distinct from `create` so a policy diff can grant/deny "trigger a job" independently of "write a
# finding/annotation row" if that need ever arises, mirroring hr_case's action granularity.
apiVersion: api.cerbos.dev/v1
resourcePolicy:
  version: default
  resource: resource_search_audit
  importDerivedRoles: ["gaiada_scopes"]
  variables:
    import: ["gaiada_common"]
  rules:
    - actions: ["*"]
      effect: EFFECT_ALLOW
      derivedRoles: ["platform_admin"]
    - actions: ["read", "create", "update", "delete", "run"]
      effect: EFFECT_ALLOW
      derivedRoles: ["group_executive"]
      condition: { match: { expr: "variables.notLow && variables.inRoot" } }
    # Search staff / manager (served-company grant) + the served company's own admin: baseline set
    # INCLUDING running $0 audit/crawl jobs (design §08: no elevated gate on 🟢 actions).
    - actions: ["read", "create", "update", "run"]
      effect: EFFECT_ALLOW
      derivedRoles: ["module_staff", "module_manager", "company_admin"]
      condition: { match: { expr: "variables.inTenant && variables.notLow" } }
    # Destructive: manager + company admin only.
    - actions: ["delete"]
      effect: EFFECT_ALLOW
      derivedRoles: ["module_manager", "company_admin"]
      condition: { match: { expr: "variables.inTenant && variables.notLow" } }

    # =========== IAM-04-ROLLOUT-B12 -- permission-matching arm. PURELY ADDITIVE: every rule =====
    # above is byte-for-byte unchanged. Generic global-or-company mirror per action (see this
    # kind's entry in docs/superpowers/plans/2026-08-10-iam-04-rollout-b12-report.md for the
    # per-kind safety argument). Any group_executive-only or platform_admin wildcard rule on this
    # kind is deliberately NOT mirrored here (IAM-04c: the tier bypass never enters the permission
    # catalog).

    - actions: ["read"]
      effect: EFFECT_ALLOW
      derivedRoles: ["perm_resource_search_audit_read"]
      condition: { match: { expr: "variables.inTenant && variables.notLow && variables.inRoot" } }
    - actions: ["create"]
      effect: EFFECT_ALLOW
      derivedRoles: ["perm_resource_search_audit_create"]
      condition: { match: { expr: "variables.inTenant && variables.notLow && variables.inRoot" } }
    - actions: ["update"]
      effect: EFFECT_ALLOW
      derivedRoles: ["perm_resource_search_audit_update"]
      condition: { match: { expr: "variables.inTenant && variables.notLow && variables.inRoot" } }
    - actions: ["delete"]
      effect: EFFECT_ALLOW
      derivedRoles: ["perm_resource_search_audit_delete"]
      condition: { match: { expr: "variables.inTenant && variables.notLow && variables.inRoot" } }
    - actions: ["run"]
      effect: EFFECT_ALLOW
      derivedRoles: ["perm_resource_search_audit_run"]
      condition: { match: { expr: "variables.inTenant && variables.notLow && variables.inRoot" } }
