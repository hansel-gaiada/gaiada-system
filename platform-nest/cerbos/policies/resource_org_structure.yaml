apiVersion: api.cerbos.dev/v1
resourcePolicy:
  version: default
  resource: org_structure
  importDerivedRoles: ["gaiada_scopes"]
  variables:
    import: ["gaiada_common"]
  rules:
    - actions: ["*"]
      effect: EFFECT_ALLOW
      derivedRoles: ["platform_admin"]
    - actions: ["read"]
      effect: EFFECT_ALLOW
      derivedRoles: ["company_admin", "manager", "member", "viewer"]
      condition: { match: { expr: "variables.inTenant && variables.notLow" } }
    # Editing the structure is elevated: company admins (in-tenant).
    - actions: ["update"]
      effect: EFFECT_ALLOW
      derivedRoles: ["company_admin"]
      condition: { match: { expr: "variables.inTenant && variables.notLow" } }

    # ══════════ IAM-04-ROLLOUT-B4 — permission-matching arm. PURELY ADDITIVE: every rule above ═══
    # is byte-for-byte unchanged. group_executive's own notLow-only rule above is DELIBERATELY not
    # mirrored (IAM-04c/TRAP-4). No exclusion needed on the mirrored actions (zero team_lead mixing).
    - actions: ["read"]
      effect: EFFECT_ALLOW
      derivedRoles: ["perm_org_structure_read"]
      condition: { match: { expr: "variables.inTenant && variables.notLow && variables.inRoot" } }
    - actions: ["update"]
      effect: EFFECT_ALLOW
      derivedRoles: ["perm_org_structure_update"]
      condition: { match: { expr: "variables.inTenant && variables.notLow && variables.inRoot" } }
