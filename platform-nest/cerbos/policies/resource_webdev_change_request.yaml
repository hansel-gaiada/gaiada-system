# MI-03 (webdev maintenance intake, D-7 §4.2) — the STAFF half of change-request authz.
#
# webdev_change_request = a maintenance/change ask against a client website. The CLIENT half of this
# feature does NOT live here: a portal submission authorizes `portal : request_change` on
# resource_portal.yaml, and portal GETs ride that file's existing `read`.
#
# ── THE INVARIANT THIS FILE MUST NOT BREAK ───────────────────────────────────────────────────────
# The `client` derived role appears NOWHERE in this policy, deliberately. Migration 0072's header
# proved the portal design safe on exactly this property — "a principal holding just the client grant
# can therefore satisfy exactly one policy (resource_portal.yaml), so making `inTenant` true for them
# opens nothing else". Adding a `client` rule here (even a read-only one) would silently retire that
# argument for every future reader of the decision log. A client-only principal must DENY on all
# three actions below; webdev-change-requests.test.ts probes that positively rather than assuming it.
#
# ── ACTIONS ──────────────────────────────────────────────────────────────────────────────────────
#   create — staff logging an INTERNAL-source request (source='internal'); manager+ per OQ-2's
#            default. Widening to plain `member` later is a one-line policy edit, no schema change.
#   read   — list/detail, including the triage queue. Deliberately elevated: the queue exposes every
#            client's asks tenant-wide, the same rationale that made `pipeline_gate:read` elevated
#            (resource_pipeline_gate.yaml:18). Plain `member` is therefore excluded.
#   triage — the WHOLE disposition: decline AND convert (which spawns a run or a pm_task). One
#            action, mirroring `pipeline_gate`'s single `decide` covering approve/reject/sign, because
#            the decision is one act with one audit row and splitting it would invite a policy where
#            someone can convert but not decline.
#
# Handlers pass resource.attr = {kind:"webdev_change_request", tenantId, module:"webdev", id?}.
# `attr.module` is a CERBOS attribute and has nothing whatever to do with the `app.scopes` GUC that
# app_module_allowed() reads: `webdev_change_requests` takes the PLAIN tenant wall (D-2a, migration
# 0088's header) and passing this attr must never be read as licence to add a module wall back onto
# the table. What it buys is the ORG-6 shared-service future for free — a serving webdev dept's
# reconciler-materialized `webdev_manager` grant lights up triage in the SERVED tenant, because
# module_manager/module_staff string-compose the role name from this attr (derived_roles.yaml:126–135).
apiVersion: api.cerbos.dev/v1
resourcePolicy:
  version: default
  resource: webdev_change_request
  importDerivedRoles: ["gaiada_scopes"]
  variables:
    import: ["gaiada_common"]
  rules:
    - actions: ["*"]
      effect: EFFECT_ALLOW
      derivedRoles: ["platform_admin"]
    - actions: ["create", "read", "triage"]
      effect: EFFECT_ALLOW
      derivedRoles: ["company_admin", "manager"]
      condition: { match: { expr: "variables.inTenant && variables.notLow" } }
    # ORG-6 module tiers (derived_roles.yaml:108–135). The webdev dept's own manager disposes of
    # requests; its staff can read the queue but not decide it, and cannot log internal requests
    # against a client on the dept's behalf (that is a manager-tier act per OQ-2).
    - actions: ["read", "triage"]
      effect: EFFECT_ALLOW
      derivedRoles: ["module_manager"]
      condition: { match: { expr: "variables.inTenant && variables.notLow" } }
    - actions: ["read"]
      effect: EFFECT_ALLOW
      derivedRoles: ["module_staff"]
      condition: { match: { expr: "variables.inTenant && variables.notLow" } }

    # =========== IAM-04-ROLLOUT-B12 -- permission-matching arm. PURELY ADDITIVE: every rule =====
    # above is byte-for-byte unchanged. Generic global-or-company mirror per action (see this
    # kind's entry in docs/superpowers/plans/2026-08-10-iam-04-rollout-b12-report.md for the
    # per-kind safety argument). Any group_executive-only or platform_admin wildcard rule on this
    # kind is deliberately NOT mirrored here (IAM-04c: the tier bypass never enters the permission
    # catalog).

    - actions: ["read"]
      effect: EFFECT_ALLOW
      derivedRoles: ["perm_webdev_change_request_read"]
      condition: { match: { expr: "variables.inTenant && variables.notLow && variables.inRoot" } }
    - actions: ["create"]
      effect: EFFECT_ALLOW
      derivedRoles: ["perm_webdev_change_request_create"]
      condition: { match: { expr: "variables.inTenant && variables.notLow && variables.inRoot" } }
    - actions: ["triage"]
      effect: EFFECT_ALLOW
      derivedRoles: ["perm_webdev_change_request_triage"]
      condition: { match: { expr: "variables.inTenant && variables.notLow && variables.inRoot" } }
