# Finance F4 — `finance_ar`: the receivables subledger.
#
# Covers customers, invoices, receipts and allocations (202608241019). The actions map onto the
# DUTIES in the segregation-of-duties matrix rather than onto CRUD, because that is what the matrix
# can then bind against:
#
#   read          see customers, invoices, receipts, aging
#   manage        maintain customers and DRAFT invoices (nothing has hit the books yet)
#   issue         post an invoice to the ledger — it becomes a receivable
#   receipt       record money arriving and allocate it to invoices
#   write_off     void an issued invoice / forgive a receivable
#   reconcile     run finance_ar_reconcile() — the subledger-vs-GL check
#
# ── WHY `issue`, `receipt` AND `write_off` ARE THREE SEPARATE RIGHTS ────────────────────────────
# Because `202608241013_finance_sod_and_elevation.sql` seeds this as a BLOCKING conflict:
#
#     ar_receipt_posting  +  ar_writeoff_approve   —   "pocket the cash, then write off the debt"
#
# That is the classic receivables fraud, and it is only preventable if the two are separately
# grantable. Folding them into one `manage` action would make the seeded conflict unenforceable —
# the same mistake the F1 ledger policy header made once and had corrected.
#
# ⚠ AND THE SAME CAVEAT APPLIES HERE, stated up front this time: `finance_manager` holds all three.
# That is not an oversight and it is not the SoD control. Roles grant CAPABILITY; the SoD matrix
# binds per company, per PERSON, through `finance_duty_assignments` + `finance_sod_check()`. A
# controller who is actually assigned both `ar_receipt_posting` and `ar_writeoff_approve` shows up
# as a conflict there and needs a recorded waiver naming a compensating control. Separating the
# ACTIONS here is what gives the duty matrix something to bind to.
#
# ── `write_off` IS HELD ABOVE THE OTHERS ────────────────────────────────────────────────────────
# It is the action that makes money owed to the company disappear, and it is the half of the fraud
# pair that has no other trace. High assurance (D4), matching `finance.period.close` and
# `finance.statement.export`.
#
# ── `reconcile` IS DELIBERATELY WIDE ────────────────────────────────────────────────────────────
# Same reasoning as `finance_ledger.verify`: it returns problems, not figures, and a check that only
# the person who could have broken the tie may run is not a check.
#
# ── WHAT IS DELIBERATELY ABSENT ─────────────────────────────────────────────────────────────────
#   * `delete` on anything issued. An issued invoice is voided by reversal, never removed — the
#     ledger entry behind it is immutable, so deleting the subledger row would break the tie the
#     whole phase exists to hold.
#   * `client`. A client contact seeing the company's receivables ledger — including other
#     customers' invoices — is exactly the leak §10.3b warns about. The client portal exposes a
#     client's OWN invoices through the portal kind, which is a different surface with a different
#     scope rule.
#   * A `perm_*` mirror arm — role-arm only, same posture as every finance kind.
#   * `owner`. Permission-native; company scope comes from the ownership graph (ruling D-F8).
#
# ── THE HANDLER CONTRACT ────────────────────────────────────────────────────────────────────────
# Handlers pass resource.attr = {kind:"finance_ar", tenantId, module:"finance", invoiceId?}.
# The `module` value is load-bearing — derived_roles.yaml string-composes the module tiers from it.
apiVersion: api.cerbos.dev/v1
resourcePolicy:
  version: default
  resource: finance_ar
  importDerivedRoles: ["gaiada_scopes"]
  variables:
    import: ["gaiada_common"]
  rules:
    - actions: ["*"]
      effect: EFFECT_ALLOW
      derivedRoles: ["platform_admin"]

    - actions: ["read", "reconcile"]
      effect: EFFECT_ALLOW
      derivedRoles: ["module_staff", "module_manager", "company_admin"]
      condition: { match: { expr: "variables.inTenant && variables.notLow" } }

    # Customer master and DRAFT invoices — nothing has reached the books, so the AR officer owns it.
    - actions: ["manage"]
      effect: EFFECT_ALLOW
      derivedRoles: ["module_staff", "module_manager", "company_admin"]
      condition: { match: { expr: "variables.inTenant && variables.notLow" } }

    # Issuing posts to the ledger, and recording a receipt moves the control account. Both are the
    # AR officer's day job — deliberately available to finance_staff, or the department cannot run.
    - actions: ["issue", "receipt"]
      effect: EFFECT_ALLOW
      derivedRoles: ["module_staff", "module_manager"]
      condition: { match: { expr: "variables.inTenant && variables.notLow" } }

    # Forgiving a debt. High assurance, and NOT held by finance_staff — the other half of the
    # receipt/write-off fraud pair.
    - actions: ["write_off"]
      effect: EFFECT_ALLOW
      derivedRoles: ["module_manager", "company_admin"]
      condition:
        match:
          expr: >-
            variables.inTenant && request.principal.attr.assurance == "high"
