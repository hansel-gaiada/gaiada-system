apiVersion: api.cerbos.dev/v1
resourcePolicy:
  version: default
  resource: pipeline_run
  importDerivedRoles: ["gaiada_scopes"]
  variables:
    import: ["gaiada_common"]
  rules:
    - actions: ["*"]
      effect: EFFECT_ALLOW
      derivedRoles: ["platform_admin"]
    # The dispatcher/delivery automation accounts (member/manager) create + advance runs; elevated
    # humans may too. Same low-privilege create posture as automation_approval.
    - actions: ["create", "update"]
      effect: EFFECT_ALLOW
      derivedRoles: ["company_admin", "manager", "member"]
      condition: { match: { expr: "variables.inTenant && variables.notLow" } }
    # Reading pipeline runs (the internal dashboard) is elevated.
    - actions: ["read"]
      effect: EFFECT_ALLOW
      derivedRoles: ["company_admin", "manager"]
      condition: { match: { expr: "variables.inTenant && variables.notLow" } }
    # ══════════ IAM-04-B4 — permission-matching arm. PURELY ADDITIVE: every rule above is byte-
    # for-byte unchanged. Mirrors ONLY the company_admin/manager/member `inTenant && notLow` reach
    # above. `group_executive`'s own `variables.notLow`-only rule (IAM-TRAP4) is DELIBERATELY not
    # mirrored (IAM-04c: the cross-company owner tier never enters the permission catalog).
    - actions: ["create"]
      effect: EFFECT_ALLOW
      derivedRoles: ["perm_pipeline_run_create"]
      condition: { match: { expr: "variables.inTenant && variables.notLow && variables.inRoot" } }
    - actions: ["update"]
      effect: EFFECT_ALLOW
      derivedRoles: ["perm_pipeline_run_update"]
      condition: { match: { expr: "variables.inTenant && variables.notLow && variables.inRoot" } }
    - actions: ["read"]
      effect: EFFECT_ALLOW
      derivedRoles: ["perm_pipeline_run_read"]
      condition: { match: { expr: "variables.inTenant && variables.notLow && variables.inRoot" } }
