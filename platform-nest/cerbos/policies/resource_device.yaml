apiVersion: api.cerbos.dev/v1
resourcePolicy:
  version: default
  resource: device
  importDerivedRoles: ["gaiada_scopes"]
  variables:
    import: ["gaiada_common"]
  rules:
    # MON-00c split: platform_admin is the SaaS operator tier and keeps unconditional cross-root
    # reach on purpose — that is the operator's job, not a leak (docs/plans/2026-08-20-monitoring-
    # gated-rulings.md §1.3). group_executive is root-bounded instead: cross-company within its OWN
    # root only, via `variables.inRoot`.
    - actions: ["*"]
      effect: EFFECT_ALLOW
      derivedRoles: ["platform_admin"]
    - actions: ["*"]
      effect: EFFECT_ALLOW
      derivedRoles: ["group_executive"]
      condition: { match: { expr: "variables.inRoot" } }
    # Any member of the company can view the device registry / topology / monitoring.
    - actions: ["read"]
      effect: EFFECT_ALLOW
      derivedRoles: ["company_admin", "manager", "member", "viewer"]
      condition: { match: { expr: "variables.inTenant && variables.notLow" } }
    # Register / edit / heartbeat-ingest — company admins and IT staff only.
    - actions: ["create", "update", "delete"]
      effect: EFFECT_ALLOW
      derivedRoles: ["company_admin", "it_staff"]
      condition: { match: { expr: "variables.inTenant && variables.notLow" } }
    # ══════════ IAM-04-ROLLOUT-B4 — permission-matching arm. PURELY ADDITIVE: every rule above ═══
    # is byte-for-byte unchanged. Wildcard platform_admin+group_executive rule DELIBERATELY not
    # mirrored (IAM-04c). it_staff's own derived role is a plain global-or-company grants check
    # (SAFE, re-verified structurally this ticket) so folding its create/update/delete reach into
    # the SAME generic mirror as company_admin's is safe. No exclusion needed anywhere.
    - actions: ["read"]
      effect: EFFECT_ALLOW
      derivedRoles: ["perm_device_read"]
      condition: { match: { expr: "variables.inTenant && variables.notLow && variables.inRoot" } }
    - actions: ["create"]
      effect: EFFECT_ALLOW
      derivedRoles: ["perm_device_create"]
      condition: { match: { expr: "variables.inTenant && variables.notLow && variables.inRoot" } }
    - actions: ["update"]
      effect: EFFECT_ALLOW
      derivedRoles: ["perm_device_update"]
      condition: { match: { expr: "variables.inTenant && variables.notLow && variables.inRoot" } }
    - actions: ["delete"]
      effect: EFFECT_ALLOW
      derivedRoles: ["perm_device_delete"]
      condition: { match: { expr: "variables.inTenant && variables.notLow && variables.inRoot" } }
