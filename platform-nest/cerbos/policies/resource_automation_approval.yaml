apiVersion: api.cerbos.dev/v1
resourcePolicy:
  version: default
  resource: automation_approval
  importDerivedRoles: ["gaiada_scopes"]
  variables:
    import: ["gaiada_common"]
  rules:
    - actions: ["*"]
      effect: EFFECT_ALLOW
      derivedRoles: ["platform_admin"]
    # Filing a suspension is a low-privilege ask ("please review this action"): any scoped
    # automation service account (member/manager/company_admin) or an elevated human may create.
    - actions: ["create"]
      effect: EFFECT_ALLOW
      derivedRoles: ["company_admin", "manager", "member"]
      condition: { match: { expr: "variables.inTenant && variables.notLow" } }
    # Reading the inbox is elevated (it exposes intended writes across the tenant's workflows).
    - actions: ["read"]
      effect: EFFECT_ALLOW
      derivedRoles: ["company_admin", "manager"]
      condition: { match: { expr: "variables.inTenant && variables.notLow" } }
    # IAM-TRAP4: `group_executive` is a GLOBAL-scope-only role (derived_roles.yaml: `g.scopeType ==
    # "global"`), so a holder never has a `company_memberships` row and `variables.inTenant` is
    # FALSE for every resource. Folding it into the rule above (as `company_admin`/`manager`'s
    # `inTenant && notLow` companion) denied it outright, defeating the role's entire cross-company-
    # oversight purpose. Own rule, `variables.notLow` only — matching `resource_appraisal.yaml`'s
    # `group_executive` rule exactly (the cross-company owner tier is by definition never "in
    # tenant"). See docs/superpowers/plans/2026-08-11-hier-5-report.md §5 / 2026-08-12-iam-trap4-report.md.
    - actions: ["read"]
      effect: EFFECT_ALLOW
      derivedRoles: ["group_executive"]
      condition: { match: { expr: "variables.notLow && variables.inRoot" } }
    # Deciding (approve/reject) is a human governance action — company admins and owners only.
    #
    # D14-06 adds `retry`: re-running the EXECUTION of an already-approved row (D14-07's endpoint)
    # after `execution_status='failed'`. It carries the same real-world consequence as the original
    # decision — a medium+/unclassified write actually happening — so it gets the same decider set
    # rather than a weaker one. A plain `manager` is deliberately excluded from both (they hold
    # `read` above, so the inbox is visible but not actionable).
    #
    # OQ-1 note (superadmin approves, and as the fallback): NO addition was needed for it. The
    # `actions: ["*"]` / `platform_admin` rule at the top of this file already covers `decide` and
    # now `retry` for the platform superadmin, on every origin. A second explicit rule would be
    # redundant and would invite someone to later "tidy" one of the two and change behaviour.
    - actions: ["decide", "retry"]
      effect: EFFECT_ALLOW
      derivedRoles: ["company_admin"]
      condition: { match: { expr: "variables.inTenant && variables.notLow" } }
    # IAM-TRAP4: same fold-in defect as `read` above — own rule, `variables.notLow` only.
    - actions: ["decide", "retry"]
      effect: EFFECT_ALLOW
      derivedRoles: ["group_executive"]
      condition: { match: { expr: "variables.notLow && variables.inRoot" } }
    # WSD-2: hr-origin approvals (leave). Rows carry resource.attr.module == "hr". Both sides of
    # the shared-service relationship can unblock people: the served company's admin (via the
    # company_admin rules above) AND the PROVIDING unit's hr_manager (module_manager here). Scoped
    # tightly to module == "hr" so a stray "<other>_manager" grant never reaches non-hr approvals.
    - actions: ["read", "decide"]
      effect: EFFECT_ALLOW
      derivedRoles: ["module_manager"]
      condition:
        match:
          expr: >-
            variables.inTenant && variables.notLow &&
            request.resource.attr.module == "hr"

    # ══════════ IAM-GAP-01 (2026-08-13) — HR leave gets its OWN decision right, separate from the
    # generic `decide` above. NEW literal action `decide_leave`, requested by
    # automation-approvals.controller.ts's decide() ONLY for origin='hr' rows whose workflow_id is
    # 'hr:leave' (hr.controller.ts's fileLeave()) — loan requests ('hr:loan', loans.controller.ts)
    # and every other origin keep using the generic `decide` action above, byte-unchanged. This
    # lets "who may approve leave" be scoped in the permission catalog/authoring layer separately
    # from "who may decide automation approvals in general" (PERMISSION-CONTRACT.md §9's open item),
    # without forking the endpoint (still one POST .../:id/decide route, per this file's own WSD-4
    # "no fork" design note).
    #
    # Owner-approved defaults: platform superadmin always acts (the wildcard rule at the top of this
    # file already covers `decide_leave`, needing no new rule), and approval authority sits with the
    # department-manager tier — hr_manager, via `module_manager` gated to module=='hr' AND
    # subKind=='leave' (belt-and-suspenders: the controller already only asks for this action on
    # genuine leave rows, but the attribute check means a future caller cannot get this rule to fire
    # on a loan row by accident). company_admin and group_executive are ALSO given `decide_leave` —
    # not a widening, a NON-REGRESSION: both could already decide hr-origin leave rows through the
    # generic `decide` rules above, and omitting them here would silently narrow who can approve
    # leave the moment the controller stops asking for `decide`.
    - actions: ["decide_leave"]
      effect: EFFECT_ALLOW
      derivedRoles: ["company_admin"]
      condition: { match: { expr: "variables.inTenant && variables.notLow" } }
    # IAM-TRAP4 shape (same reason as `read`/`decide` above): group_executive is global-scope-only,
    # so `variables.inTenant` is always false for it — own rule, `variables.notLow` only.
    - actions: ["decide_leave"]
      effect: EFFECT_ALLOW
      derivedRoles: ["group_executive"]
      condition: { match: { expr: "variables.notLow && variables.inRoot" } }
    - actions: ["decide_leave"]
      effect: EFFECT_ALLOW
      derivedRoles: ["module_manager"]
      condition:
        match:
          expr: >-
            variables.inTenant && variables.notLow &&
            request.resource.attr.module == "hr" && request.resource.attr.subKind == "leave"
    # NO perm_hr_leave_decide mirror: hr_manager's ONLY role-arm path to `decide_leave` is the
    # `module_manager` rule immediately above, gated on `module=='hr' && subKind=='leave'` — the
    # exact attribute-gated shape IAM-04-REG1 already excludes for this kind's `read`/`decide`
    # (see this file's own comment above, and derived_roles.yaml's IAM-04a header). A flat mirror
    # would grant hr_manager `decide_leave` on ANY automation_approval resource regardless of
    # module/subKind, which the catalog's flat `perms` array cannot re-narrow. Do not wire one.

    # ══════════ IAM-04-B4 — permission-matching arm. PURELY ADDITIVE: every rule above is byte-
    # for-byte unchanged. Mirrors ONLY the company_admin/manager/member `inTenant && notLow` reach
    # above. `group_executive`'s own `variables.notLow`-only rule (IAM-TRAP4) is DELIBERATELY not
    # mirrored (IAM-04c: the cross-company owner tier never enters the permission catalog).
    - actions: ["create"]
      effect: EFFECT_ALLOW
      derivedRoles: ["perm_automation_approval_create"]
      condition: { match: { expr: "variables.inTenant && variables.notLow && variables.inRoot" } }
    # IAM-04-REG1 (2026-08-12): `read` and `decide` are DELIBERATELY NOT mirrored here, reverting
    # Batch 4's over-grant. `role-permission-bundles.json` shows `core.automation_approval.read`
    # AND `.decide` are held by `hr_manager` — but hr_manager's ONLY role-arm path to either action
    # is the `module_manager` rule two blocks up, gated to `resource.attr.module == "hr"`. A flat
    # `perm_automation_approval_read`/`_decide` mirror at `inTenant && notLow` (no module gate)
    # would grant hr_manager `read`/`decide` on EVERY approval in the tenant, not just hr-origin
    # ones — the exact defect `src/**/org14-preflight-adversarial.test.ts` T6(c) pinned. The
    # catalog's flat `perms` array has no attribute dimension to re-express "only when
    # resource.attr.module == 'hr'", so this is a permanent deferral, not a gap to "fix" by adding
    # the attr check into a `perm_*` rule (IAM-04's own brief forbids that shape — see
    # derived_roles.yaml's IAM-04a header). `retry` has NO hr_manager (or any other
    # module_manager-shaped) holder — module_manager's rule above only ever grants `read`/`decide`
    # — so it is unaffected and stays mirrored below.
    # perm_automation_approval_read / perm_automation_approval_decide REMOVED — see above; their
    # derived-role definitions were also removed from derived_roles.yaml (IAM-04-REG1).
    # See src/rbac/iam-04-reg1-mirror-reach-invariant.test.ts for the mechanical invariant that
    # would have caught this, and docs/superpowers/plans/2026-08-12-iam-04-reg1-report.md.
    - actions: ["retry"]
      effect: EFFECT_ALLOW
      derivedRoles: ["perm_automation_approval_retry"]
      condition: { match: { expr: "variables.inTenant && variables.notLow && variables.inRoot" } }

    # ══════════ P2-08 part B (design §6.5) — `decide_override`: the ROUTED OVERRIDE decision ══════
    #
    # An override is a per-person grant beyond what their POSITION confers. A dept head requests it
    # (`POST /api/:t/role-grants/overrides`, which files an automation_approvals row with
    # origin='iam' and workflow_id='iam:override'); a ROUTED approver decides it here; and an
    # approving decision executes the grant in-band through GrantWriteService, tagged with
    # `expires_at` + `origin_approval_id`.
    #
    # WHY ITS OWN LITERAL ACTION, rather than riding the generic `decide`: the generic action is held
    # by `manager` and the module tiers on ordinary approvals. Overrides hand out AUTHORITY, so the
    # decider set has to be narrower than "whoever can approve an expense". Same reasoning, and the
    # same one-route/no-fork mechanism, as IAM-GAP-01's `decide_leave`
    # (automation-approvals.controller.ts picks the action from origin + workflow_id).
    #
    # WHO DECIDES — design §6.5's routing map is code-defined this wave
    # (role-grants.controller.ts::routeFor): hr.*-sensitive -> hr_manager + company_admin;
    # everything else -> company_admin. Cerbos is deliberately the UNION of every routable approver
    # (company_admin + hr_people_ops), and the controller narrows to the ONE routed approver for that
    # request. Cerbos cannot express "the approver this row was routed to" — that is a per-row fact,
    # not a role — so the authority layer holds the outer bound and the router holds the inner one.
    - actions: ["decide_override"]
      effect: EFFECT_ALLOW
      derivedRoles: ["company_admin"]
      condition: { match: { expr: "variables.inTenant && variables.notLow" } }
    # hr_people_ops == hr_manager (the ACTING HR tier), for hr.*-sensitive overrides.
    - actions: ["decide_override"]
      effect: EFFECT_ALLOW
      derivedRoles: ["hr_people_ops"]
      condition: { match: { expr: "variables.inTenant && variables.notLow" } }
    # IAM-TRAP4 shape: group_executive is global-scope-only, so `variables.inTenant` is always false
    # for it — its own rule, `variables.notLow` only. Same treatment `read`/`decide`/`decide_leave`
    # already get in this file.
    - actions: ["decide_override"]
      effect: EFFECT_ALLOW
      derivedRoles: ["group_executive"]
      condition: { match: { expr: "variables.notLow && variables.inRoot" } }
    #
    # ══════════ REQUESTER ≠ DECIDER — structural, deny-overrides ══════════════════════════════════
    # Copies resource_invoice.yaml's IAM-GAP-02 maker/checker pattern verbatim, for the same reason:
    # `roles: ["user"]` matches EVERY principal, and Cerbos combines a kind's rules with
    # deny-overrides, so this beats every ALLOW above INCLUDING platform_admin's wildcard. Nobody
    # approves their own override request, superadmin included — that is D-9's no-self-escalation
    # expressed in the authority layer rather than in a controller that a second writer could forget.
    #
    # `creatorId` is the requester (`automation_approvals.requested_by`), fed by the decide handler.
    # FAIL CLOSED on an absent/empty value: `has() && != ""` means a row whose requester cannot be
    # resolved is refused rather than waved through — an override with an unknown author is exactly
    # the one nobody should be able to rubber-stamp.
    - actions: ["decide_override"]
      effect: EFFECT_DENY
      roles: ["user"]
      condition:
        match:
          expr: >-
            !has(request.resource.attr.creatorId) || request.resource.attr.creatorId == "" ||
            request.resource.attr.creatorId == request.principal.id

    # ══════════ `decide_assignment` — the DEPT HEAD's placement request (owner split, 2026-08-19) ═══
    #
    # Split out of `decide_override` at the owner's instruction. Both are "an IAM exception somebody
    # senior agreed to" and both were initially one action — but the catalog key described granting a
    # ROLE, which read narrowly once assignment requests started riding it, and one action cannot be
    # narrowed for one kind of request without narrowing the other.
    #
    # ⚠ NO BEHAVIOUR CHANGE TODAY, deliberately: the tiers below are identical to `decide_override`'s,
    # so the same four roles decide both. What the split buys is the ABILITY to diverge (e.g. letting a
    # senior lead approve placements but never role grants) plus an honest audit trail — a decision row
    # now records which kind of exception was approved, rather than one action covering both.
    - actions: ["decide_assignment"]
      effect: EFFECT_ALLOW
      derivedRoles: ["company_admin"]
      condition: { match: { expr: "variables.inTenant && variables.notLow" } }
    - actions: ["decide_assignment"]
      effect: EFFECT_ALLOW
      derivedRoles: ["hr_people_ops"]
      condition: { match: { expr: "variables.inTenant && variables.notLow" } }
    # IAM-TRAP4 shape: group_executive is global-scope-only, so inTenant is always false for it.
    - actions: ["decide_assignment"]
      effect: EFFECT_ALLOW
      derivedRoles: ["group_executive"]
      condition: { match: { expr: "variables.notLow && variables.inRoot" } }
    #
    # The SAME structural requester-not-decider DENY as decide_override, restated for this action
    # rather than shared: a DENY that silently covered two actions would be one edit away from
    # covering neither. deny-overrides beats every ALLOW above, platform_admin's wildcard included.
    - actions: ["decide_assignment"]
      effect: EFFECT_DENY
      roles: ["user"]
      condition:
        match:
          expr: >-
            !has(request.resource.attr.creatorId) || request.resource.attr.creatorId == "" ||
            request.resource.attr.creatorId == request.principal.id
