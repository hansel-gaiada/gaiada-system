apiVersion: api.cerbos.dev/v1
resourcePolicy:
  version: default
  resource: automation_approval
  importDerivedRoles: ["gaiada_scopes"]
  variables:
    import: ["gaiada_common"]
  rules:
    - actions: ["*"]
      effect: EFFECT_ALLOW
      derivedRoles: ["platform_admin"]
    # Filing a suspension is a low-privilege ask ("please review this action"): any scoped
    # automation service account (member/manager/company_admin) or an elevated human may create.
    - actions: ["create"]
      effect: EFFECT_ALLOW
      derivedRoles: ["company_admin", "manager", "member"]
      condition: { match: { expr: "variables.inTenant && variables.notLow" } }
    # Reading the inbox is elevated (it exposes intended writes across the tenant's workflows).
    - actions: ["read"]
      effect: EFFECT_ALLOW
      derivedRoles: ["company_admin", "manager"]
      condition: { match: { expr: "variables.inTenant && variables.notLow" } }
    # IAM-TRAP4: `group_executive` is a GLOBAL-scope-only role (derived_roles.yaml: `g.scopeType ==
    # "global"`), so a holder never has a `company_memberships` row and `variables.inTenant` is
    # FALSE for every resource. Folding it into the rule above (as `company_admin`/`manager`'s
    # `inTenant && notLow` companion) denied it outright, defeating the role's entire cross-company-
    # oversight purpose. Own rule, `variables.notLow` only — matching `resource_appraisal.yaml`'s
    # `group_executive` rule exactly (the cross-company owner tier is by definition never "in
    # tenant"). See docs/superpowers/plans/2026-08-11-hier-5-report.md §5 / 2026-08-12-iam-trap4-report.md.
    - actions: ["read"]
      effect: EFFECT_ALLOW
      derivedRoles: ["group_executive"]
      condition: { match: { expr: "variables.notLow" } }
    # Deciding (approve/reject) is a human governance action — company admins and owners only.
    #
    # D14-06 adds `retry`: re-running the EXECUTION of an already-approved row (D14-07's endpoint)
    # after `execution_status='failed'`. It carries the same real-world consequence as the original
    # decision — a medium+/unclassified write actually happening — so it gets the same decider set
    # rather than a weaker one. A plain `manager` is deliberately excluded from both (they hold
    # `read` above, so the inbox is visible but not actionable).
    #
    # OQ-1 note (superadmin approves, and as the fallback): NO addition was needed for it. The
    # `actions: ["*"]` / `platform_admin` rule at the top of this file already covers `decide` and
    # now `retry` for the platform superadmin, on every origin. A second explicit rule would be
    # redundant and would invite someone to later "tidy" one of the two and change behaviour.
    - actions: ["decide", "retry"]
      effect: EFFECT_ALLOW
      derivedRoles: ["company_admin"]
      condition: { match: { expr: "variables.inTenant && variables.notLow" } }
    # IAM-TRAP4: same fold-in defect as `read` above — own rule, `variables.notLow` only.
    - actions: ["decide", "retry"]
      effect: EFFECT_ALLOW
      derivedRoles: ["group_executive"]
      condition: { match: { expr: "variables.notLow" } }
    # WSD-2: hr-origin approvals (leave). Rows carry resource.attr.module == "hr". Both sides of
    # the shared-service relationship can unblock people: the served company's admin (via the
    # company_admin rules above) AND the PROVIDING unit's hr_manager (module_manager here). Scoped
    # tightly to module == "hr" so a stray "<other>_manager" grant never reaches non-hr approvals.
    - actions: ["read", "decide"]
      effect: EFFECT_ALLOW
      derivedRoles: ["module_manager"]
      condition:
        match:
          expr: >-
            variables.inTenant && variables.notLow &&
            request.resource.attr.module == "hr"

    # ══════════ IAM-04-B4 — permission-matching arm. PURELY ADDITIVE: every rule above is byte-
    # for-byte unchanged. Mirrors ONLY the company_admin/manager/member `inTenant && notLow` reach
    # above. `group_executive`'s own `variables.notLow`-only rule (IAM-TRAP4) is DELIBERATELY not
    # mirrored (IAM-04c: the cross-company owner tier never enters the permission catalog).
    # `module_manager`'s hr-scoped rule is ALSO deliberately not mirrored — a different hazard
    # mechanism (top-level-attr-gate) out of this ticket's remit; see the B4 report.
    - actions: ["create"]
      effect: EFFECT_ALLOW
      derivedRoles: ["perm_automation_approval_create"]
      condition: { match: { expr: "variables.inTenant && variables.notLow" } }
    - actions: ["read"]
      effect: EFFECT_ALLOW
      derivedRoles: ["perm_automation_approval_read"]
      condition: { match: { expr: "variables.inTenant && variables.notLow" } }
    - actions: ["decide"]
      effect: EFFECT_ALLOW
      derivedRoles: ["perm_automation_approval_decide"]
      condition: { match: { expr: "variables.inTenant && variables.notLow" } }
    - actions: ["retry"]
      effect: EFFECT_ALLOW
      derivedRoles: ["perm_automation_approval_retry"]
      condition: { match: { expr: "variables.inTenant && variables.notLow" } }
