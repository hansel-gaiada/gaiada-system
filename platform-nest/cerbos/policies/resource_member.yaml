apiVersion: api.cerbos.dev/v1
resourcePolicy:
  version: default
  resource: member
  importDerivedRoles: ["gaiada_scopes"]
  variables:
    import: ["gaiada_common"]
  rules:
    - actions: ["*"]
      effect: EFFECT_ALLOW
      derivedRoles: ["platform_admin"]
    # Tenant directory (owner/assignee pickers): any in-tenant role may read it.
    - actions: ["read"]
      effect: EFFECT_ALLOW
      derivedRoles: ["company_admin", "manager", "member", "viewer"]
      condition: { match: { expr: "variables.inTenant && variables.notLow" } }
    # WSD-2: HR staff may read the SERVED company's directory — but only on the HR-workspace
    # directory path, where the members controller sets resource.attr.module = "hr". The
    # module_staff derived role self-gates on module != "", so on every other members read (no
    # module attr) this rule cannot fire and other modules' staff never inherit directory access.
    - actions: ["read"]
      effect: EFFECT_ALLOW
      derivedRoles: ["module_staff"]
      condition: { match: { expr: "variables.inTenant && variables.notLow" } }

    # perm_member_read REMOVED (IAM-04-REG2, 2026-08-12). This header used to explain why
    # module_staff's OWN rule (above) was never mirrored — but the mirror that WAS wired here
    # over-granted anyway. `role-permission-bundles.json` UNIONS every rule that grants a role
    # reach regardless of which rule granted it, so `hr_staff`/`reports_staff`/`search_staff`/
    # `social_staff`/`webdev_staff` (bundle holders of core.member.read, via module_staff's
    # gated rule above) ALSO satisfied this flat `inTenant && notLow` mirror — which does not
    # check `resource.attr.module` at all. Unlike hr_case/hr_record (module is a hardcoded
    # literal for every real call site on those kinds), `member`'s `module` attribute is resolved
    # from a CALLER-SUPPLIED query parameter (core.controller.ts:292-294, `module: moduleQ ||
    # undefined`) that genuinely varies per request — so the flat mirror let e.g. `hr_staff` read
    # the tenant directory via ANY module context (or none), not just the HR-workspace path
    # module_staff's own gate restricts them to. Removing this mirror does not narrow
    # `company_admin`/`manager`/`member`/`viewer` — they hold the key via the FIRST rule above
    # (same `inTenant && notLow` condition, exact match, unaffected). See
    # docs/superpowers/plans/2026-08-12-iam-04-reg2-report.md for the live-exposure finding (zero
    # of the five affected roles carry any live grant today).
