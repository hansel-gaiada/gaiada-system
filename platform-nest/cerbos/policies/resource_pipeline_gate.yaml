apiVersion: api.cerbos.dev/v1
resourcePolicy:
  version: default
  resource: pipeline_gate
  importDerivedRoles: ["gaiada_scopes"]
  variables:
    import: ["gaiada_common"]
  rules:
    - actions: ["*"]
      effect: EFFECT_ALLOW
      derivedRoles: ["platform_admin"]
    # Opening a gate ("please review/sign this") is the low-privilege ask — automation accounts or
    # elevated humans, mirroring automation_approval.create.
    - actions: ["create"]
      effect: EFFECT_ALLOW
      derivedRoles: ["company_admin", "manager", "member"]
      condition: { match: { expr: "variables.inTenant && variables.notLow" } }
    # Reading the gate inbox is elevated (exposes in-flight review state across the tenant).
    - actions: ["read"]
      effect: EFFECT_ALLOW
      derivedRoles: ["company_admin", "manager"]
      condition: { match: { expr: "variables.inTenant && variables.notLow" } }
    - actions: ["decide"]
      effect: EFFECT_ALLOW
      derivedRoles: ["company_admin"]
      condition: { match: { expr: "variables.inTenant && variables.notLow" } }
    # ══════════ IAM-04-B4 — permission-matching arm. PURELY ADDITIVE: every rule above is byte-
    # for-byte unchanged. Mirrors ONLY the company_admin/manager/member `inTenant && notLow` reach
    # above. `group_executive`'s own `variables.notLow`-only rules (IAM-TRAP4) are DELIBERATELY not
    # mirrored (IAM-04c: the cross-company owner tier never enters the permission catalog).
    - actions: ["create"]
      effect: EFFECT_ALLOW
      derivedRoles: ["perm_pipeline_gate_create"]
      condition: { match: { expr: "variables.inTenant && variables.notLow && variables.inRoot" } }
    - actions: ["read"]
      effect: EFFECT_ALLOW
      derivedRoles: ["perm_pipeline_gate_read"]
      condition: { match: { expr: "variables.inTenant && variables.notLow && variables.inRoot" } }
    - actions: ["decide"]
      effect: EFFECT_ALLOW
      derivedRoles: ["perm_pipeline_gate_decide"]
      condition: { match: { expr: "variables.inTenant && variables.notLow && variables.inRoot" } }
