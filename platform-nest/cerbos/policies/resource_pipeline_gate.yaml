apiVersion: api.cerbos.dev/v1
resourcePolicy:
  version: default
  resource: pipeline_gate
  importDerivedRoles: ["gaiada_scopes"]
  variables:
    import: ["gaiada_common"]
  rules:
    - actions: ["*"]
      effect: EFFECT_ALLOW
      derivedRoles: ["platform_admin"]
    # Opening a gate ("please review/sign this") is the low-privilege ask — automation accounts or
    # elevated humans, mirroring automation_approval.create.
    - actions: ["create"]
      effect: EFFECT_ALLOW
      derivedRoles: ["company_admin", "manager", "member"]
      condition: { match: { expr: "variables.inTenant && variables.notLow" } }
    # Reading the gate inbox is elevated (exposes in-flight review state across the tenant).
    - actions: ["read"]
      effect: EFFECT_ALLOW
      derivedRoles: ["company_admin", "manager"]
      condition: { match: { expr: "variables.inTenant && variables.notLow" } }
    # IAM-TRAP4: `group_executive` is a GLOBAL-scope-only role (derived_roles.yaml: `g.scopeType ==
    # "global"`), so a holder never has a `company_memberships` row and `variables.inTenant` is
    # FALSE for every resource. Folding it into the rule above denied it outright, defeating the
    # role's entire cross-company-oversight purpose. Own rule, `variables.notLow` only — matching
    # `resource_appraisal.yaml`'s `group_executive` rule exactly. See
    # docs/superpowers/plans/2026-08-11-hier-5-report.md §5 / 2026-08-12-iam-trap4-report.md.
    - actions: ["read"]
      effect: EFFECT_ALLOW
      derivedRoles: ["group_executive"]
      condition: { match: { expr: "variables.notLow && variables.inRoot" } }
    # Deciding a gate (approve / request-changes / reject / sign) is a human governance action.
    # NOTE: client-side gates (prd_sign, customer_feedback, scope_signoff) will be decided by the
    # client principal through the portal BFF (WS11 build item 4); this rule covers staff decisions
    # and staff-recorded client sign-offs in the interim.
    - actions: ["decide"]
      effect: EFFECT_ALLOW
      derivedRoles: ["company_admin"]
      condition: { match: { expr: "variables.inTenant && variables.notLow" } }
    # IAM-TRAP4: same fold-in defect as `read` above — own rule, `variables.notLow` only.
    - actions: ["decide"]
      effect: EFFECT_ALLOW
      derivedRoles: ["group_executive"]
      condition: { match: { expr: "variables.notLow && variables.inRoot" } }

    # ══════════ IAM-04-B4 — permission-matching arm. PURELY ADDITIVE: every rule above is byte-
    # for-byte unchanged. Mirrors ONLY the company_admin/manager/member `inTenant && notLow` reach
    # above. `group_executive`'s own `variables.notLow`-only rules (IAM-TRAP4) are DELIBERATELY not
    # mirrored (IAM-04c: the cross-company owner tier never enters the permission catalog).
    - actions: ["create"]
      effect: EFFECT_ALLOW
      derivedRoles: ["perm_pipeline_gate_create"]
      condition: { match: { expr: "variables.inTenant && variables.notLow && variables.inRoot" } }
    - actions: ["read"]
      effect: EFFECT_ALLOW
      derivedRoles: ["perm_pipeline_gate_read"]
      condition: { match: { expr: "variables.inTenant && variables.notLow && variables.inRoot" } }
    - actions: ["decide"]
      effect: EFFECT_ALLOW
      derivedRoles: ["perm_pipeline_gate_decide"]
      condition: { match: { expr: "variables.inTenant && variables.notLow && variables.inRoot" } }
