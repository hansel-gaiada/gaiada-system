apiVersion: api.cerbos.dev/v1
resourcePolicy:
  version: default
  resource: notification
  importDerivedRoles: ["gaiada_scopes"]
  variables:
    import: ["gaiada_common"]
  rules:
    - actions: ["*"]
      effect: EFFECT_ALLOW
      derivedRoles: ["platform_admin"]
    # Any tenant member may read/mark their own notifications; the route scopes rows to
    # user_id = principal, so this is a per-user inbox even though RLS is tenant-level.
    - actions: ["read", "update"]
      effect: EFFECT_ALLOW
      derivedRoles: ["company_admin", "manager", "member", "viewer"]
      condition: { match: { expr: "variables.inTenant && variables.notLow" } }
    # Raising a notification FOR another member is an elevated/automation action: company
    # admins, managers (their team), and scoped automation service accounts granted those roles.
    - actions: ["create"]
      effect: EFFECT_ALLOW
      derivedRoles: ["company_admin", "manager"]
      condition: { match: { expr: "variables.inTenant && variables.notLow" } }
    # ══════════ IAM-04-ROLLOUT-B4 — permission-matching arm. PURELY ADDITIVE: every rule above ═══
    # is byte-for-byte unchanged. No exclusion needed (zero team_lead mixing on this kind).
    - actions: ["read"]
      effect: EFFECT_ALLOW
      derivedRoles: ["perm_notification_read"]
      condition: { match: { expr: "variables.inTenant && variables.notLow" } }
    - actions: ["update"]
      effect: EFFECT_ALLOW
      derivedRoles: ["perm_notification_update"]
      condition: { match: { expr: "variables.inTenant && variables.notLow" } }
    - actions: ["create"]
      effect: EFFECT_ALLOW
      derivedRoles: ["perm_notification_create"]
      condition: { match: { expr: "variables.inTenant && variables.notLow" } }
