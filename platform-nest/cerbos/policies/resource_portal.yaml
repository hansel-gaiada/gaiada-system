apiVersion: api.cerbos.dev/v1
resourcePolicy:
  version: default
  resource: portal
  importDerivedRoles: ["gaiada_scopes"]
  variables:
    import: ["gaiada_common"]
  rules:
    - actions: ["*"]
      effect: EFFECT_ALLOW
      derivedRoles: ["platform_admin"]
    # An authenticated client of this tenant may read the portal and act on their own items:
    #   read           — every portal GET (overview/projects/timeline/deliverables/invoices/contracts/
    #                    profile/files/stream)
    #   decide         — client-side pipeline gates (feedback, approvals)
    #   sign           — scope agreements and contracts
    #   pay            — CP-3: record a payment against their own invoice. Its own action, NOT folded
    #                    into `decide`, because these are different powers with different blast radii
    #                    and one day one of them may need revoking without the other.
    #   update_profile — CP-4: their own name/title, and profile change REQUESTS. Deliberately narrow-
    #                    named: a generic `update` would silently widen the day someone reuses it.
    #   request_change — MI-02 (webdev maintenance intake, D-7): submit a webdev change request.
    #                    Narrow-named for the same reason as update_profile. Deliberately available to
    #                    EVERY active contact regardless of `capability` — design doc §5.1's ratified
    #                    ruling is that submitting is a viewer-permitted act ("paying is not signing",
    #                    and reporting a bug is strictly weaker than recording a payment); capability
    #                    gates only the resulting mini-run's own sign gates, never this action. Do NOT
    #                    condition this action on a signer-only derived role or attribute — that would
    #                    silently re-tighten a ratified decision.
    #
    # ⚠ THIS POLICY IS NOT THE ROW-LEVEL BOUNDARY. Cerbos does not see rows, so `read` here means "may
    # ask the portal", never "may see any client's data". Per-client and per-project isolation is
    # src/core/portal-scope.ts's SQL predicate, applied on every portal query; RLS is the tenant wall
    # beneath both. Widening this list does NOT widen which rows a client can reach — but REMOVING the
    # scope predicate from a query would, so read that file before adding a portal route.
    - actions: ["read", "decide", "sign", "pay", "update_profile", "request_change"]
      effect: EFFECT_ALLOW
      derivedRoles: ["client"]
      condition: { match: { expr: "variables.inTenant" } }
    # IAM-DR12 (2026-08-11): there is DELIBERATELY no staff read rule here — no
    # `company_admin`/`manager`/`group_executive` grant of any kind on this resource. The next
    # person to read this file must NOT "restore" one for consistency with neighbouring
    # policies' admin wildcards, or because `group_executive` looks conspicuously absent —
    # it isn't an oversight, see below.
    #
    # There USED to be one — "staff read-only, for support" — granting `company_admin`/`manager`/
    # `group_executive` a `read` on this resource. IAM-VERIFY-01
    # (docs/superpowers/plans/2026-08-11-iam-verify-01-report.md, Defect B) drove the real API as a
    # real `company_admin`/`manager` persona, not inferred from the policy text, and found the grant
    # was dead: `src/core/portal-scope.ts`'s `callerClientIds()` unconditionally throws `"not a
    # portal client"` for any principal with zero `client_contacts` rows, which is every staff
    # member by construction (clients are deliberately excluded from `company_memberships` —
    # `principal.ts`'s own header). So the Cerbos grant could never be exercised: no staff member
    # has ever reached this branch, live evidence was `{"error":"not a portal client"}` on every
    # attempt, and none can with `portal-scope.ts` as it stands.
    #
    # OWNER DECISION (DR-12, 2026-08-11): DELETE the dead rule rather than wire it up. Staff have no
    # portal access — this matches what the system has always actually done end to end, so removing
    # the rule makes the policy honest rather than aspirational. Client-portal data is another
    # company's commercial information; if staff/support read access is ever wanted, it must be
    # built deliberately — its own capability, its own audit trail — not inherited by every manager
    # from a rule nobody had noticed was inert. `callerClientIds()`'s throw is the ratified
    # behaviour and is NOT to be changed to accommodate this.
    #
    # `group_executive` was part of the same dead grant and is removed for the identical reason —
    # this is not a partial rollback, the whole staff-support branch was unreachable.
