apiVersion: api.cerbos.dev/v1
resourcePolicy:
  version: default
  resource: pm_project
  importDerivedRoles: ["gaiada_scopes"]
  variables:
    import: ["gaiada_common"]
  rules:
    # MON-00c split: platform_admin is the SaaS operator tier and keeps unconditional cross-root
    # reach on purpose — that is the operator's job, not a leak (docs/plans/2026-08-20-monitoring-
    # gated-rulings.md §1.3). group_executive is root-bounded instead: cross-company within its OWN
    # root only, via `variables.inRoot`.
    - actions: ["*"]
      effect: EFFECT_ALLOW
      derivedRoles: ["platform_admin"]
    - actions: ["*"]
      effect: EFFECT_ALLOW
      derivedRoles: ["group_executive"]
      condition: { match: { expr: "variables.inRoot" } }
    - actions: ["read"]
      effect: EFFECT_ALLOW
      derivedRoles: ["company_admin", "manager", "member", "viewer"]
      condition: { match: { expr: "variables.inTenant && variables.notLow" } }
    # Owner/status + milestones + docs are managed by leads/admins (UI gates on pm.manage).
    - actions: ["manage"]
      effect: EFFECT_ALLOW
      derivedRoles: ["company_admin", "manager"]
      condition: { match: { expr: "variables.inTenant && variables.notLow" } }
    # ══════════ IAM-04-ROLLOUT-B4 — permission-matching arm. PURELY ADDITIVE: every rule above ═══
    # is byte-for-byte unchanged. Wildcard platform_admin+group_executive rule DELIBERATELY not
    # mirrored (IAM-04c). No exclusion needed on the mirrored actions (zero team_lead mixing).
    - actions: ["read"]
      effect: EFFECT_ALLOW
      derivedRoles: ["perm_pm_project_read"]
      condition: { match: { expr: "variables.inTenant && variables.notLow" } }
    - actions: ["manage"]
      effect: EFFECT_ALLOW
      derivedRoles: ["perm_pm_project_manage"]
      condition: { match: { expr: "variables.inTenant && variables.notLow" } }
