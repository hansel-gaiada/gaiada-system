# WSK-47 (docs/plans/2026-10-10-webdesk-write-plane-design.md §6 + §7; owner ruling WSK-D46 in
# docs/blueprints/webdesk-design-v2.md §14) — authz for the NEW `webdesk_content_item` resource kind:
# one editorial item (a page, post, guide …) in a WebDesk site, authored from the ERP and carried to
# Zone B over the control channel. Nothing existed for this kind before this file; an unlisted
# kind/action is a SILENT DENY that reads exactly like a logic bug. Restart `gaiada-test-cerbos` and
# the live sidecar after adding this file — the bind-mount does not hot-reload.
#
# Handlers pass resource.attr = {kind:"webdesk_content_item", tenantId, module:"webdev", id?,
#   collectionKey, locale,                  ← from ZONE B's read (WSK-51), never from the request body
#   approvalId, creatorId, itemCount}       ← publish/schedule only, set by WSK-66's decide() executor
#
# ── ACTIONS ──────────────────────────────────────────────────────────────────────────────────────
#   read · create · update · request_publish — the editor tier (§7). request_publish files ONE WS4
#                approval (impact HIGH); it changes nothing a production key can see.
#   unpublish · delete — MEDIUM, the publisher tier, run immediately (a takedown must not wait for a
#                second person — WSK-D46).
#   publish · schedule — HIGH for every principal class. Reachable ONLY at decide() of an approved
#                WS4 row: the approval id must be present (a DENY enforces this for every principal,
#                platform_admin included), and maker ≠ checker applies (below).
#
# ── MAKER ≠ CHECKER, AND THE R4 SELF-PUBLISH EXCEPTION (WSK-D46) ────────────────────────────────
# `creatorId` is the approval row's `requested_by` (the maker); `principal.id` is the decider (the
# checker). Default: they must differ. The owner adopted R4: a publisher may approve their OWN
# `publish` when it covers exactly ONE item. Batches always need a second person. R4 as proposed and
# adopted was "single-item, NON-SCHEDULED", so `schedule` keeps strict maker ≠ checker.
#   `itemCount` = the number of items in the approval's tool_args.items, computed by the executor
#   from the stored approval row (never client-supplied). It defaults to 0 in resourcePayload(), so
#   a caller that forgets it falls into the strict two-person rule — fail CLOSED.
# Two layers, the invoice precedent (resource_invoice.yaml):
#   1. the ALLOW rules for company_admin/module_manager carry the maker-checker test INLINE (never a
#      `variables.local` — that factoring mis-routes IAM overrides, cerbos-local-variables trap);
#   2. an EFFECT_DENY on `roles: ["user"]` that every principal carries, so the platform_admin
#      wildcard (and any future ALLOW) loses to it under deny-overrides. It fires only when the
#      creator is KNOWN and equals the caller, and the R4 exception does not apply.
# An unknown/empty creatorId never satisfies an ALLOW below (fail closed); the DENY ignores it, so
# only the platform_admin wildcard can act on such a row — the same posture as a legacy invoice.
#
# ── NO AUTOMATION OR BOT PRINCIPAL EVER PUBLISHES OR SCHEDULES (T7, WebDesk M3) ─────────────────
# `publish`/`schedule` are the two actions that make content reachable by a production key, and they
# are a HUMAN decision (the decide() of an approved WS4 row). The live gaiada.com import files its batch
# as the automation principal `automation+webdesk-importer@gaiada.system` (users.kind=automation, role
# webdev_manager); today only the importer's own code stops it publishing. This DENY makes Cerbos refuse
# too, so a future caller, a mis-granted role or a platform_admin grant on an automation row cannot get
# there. It reads `principal.attr.kind` (users.kind, sent by principalPayload()), and it names ONLY
# `publish` and `schedule`: `request_publish` stays ALLOWED, because filing the approval is exactly the
# importer's job. DELEGATION: authorize() (core/http.ts) checks the CALLER and, when `actFor` is set, the
# acting human too, and either denial refuses. A persona (kind=bot) acting for a human publisher is
# therefore denied here as the CALLER; the human's own principal is unaffected. An absent `kind`
# ("" — a fixture, ANONYMOUS) matches nothing and falls back to the rules above.
#
# ── THE INVARIANTS THIS FILE MUST NOT BREAK ─────────────────────────────────────────────────────
#  - the `client` ROLE appears NOWHERE: editorial drafts are staff-only. `member` appears nowhere either (§7).
#    WSK-49c adds exactly ONE non-staff consumer, the derived role `client_website_editor` (WSK-D58/D60, below): an
#    attribute-gated role (a grant scoped to ONE client record, matched against `resource.attr.clientId`), never a
#    role name, never a `perm_*` mirror, never reachable without the server-loaded site -> client link.
#  - NO perm_* mirror (IAM-04c): publish/schedule are attribute-instance checks (approvalId, creator
#    vs decider) that a flat `perms` array cannot express; a mirror would hand a self-approving maker
#    the publish right (iam-04-reg1-mirror-reach-invariant.test.ts's over-grant class).
#  - group_executive is NOT folded into any rule (TRAP #4, resource_webdev_contract_snapshot.yaml).
#  - Module-tier rules pin `module == "webdev"`: module_staff/module_manager compose the role name
#    from resource.attr.module, so without the pin a handler passing another module would arm that
#    module's staff. With it, the bundle resolvers' webdev_staff/webdev_manager mapping is literal.
#  - `collectionKey`/`locale` were carried but read by no rule until M5-W1a; the writers' room derived
#    roles (below) now read them, together with `siteId`. All three default to "" (fail closed).
#
# ── M5-W1a · THE WRITERS' ROOM (docs/plans/2026-10-11-m5-writers-room-design.md §2, §7) ──────────
# Six NEW actions on this kind, all of them steps of the per-version review flow WebDesk owns (W2):
#   submit (also withdraw) · comment · request_changes · seo_signoff · approve · assign
# and four NEW roles that are grants stored as data, never bundles: webdesk_writer, webdesk_translator,
# webdesk_seo_reviewer, webdesk_editor. Each is a `company`-scoped `user_roles` row PLUS scope rows (site;
# collections or all; locales or all) that assemblePrincipal() attaches as `grants[].editorialScopes` (W1b).
# They match through the attribute-gated derived roles in derived_roles.yaml (`webdesk_editorial_reader`
# for read, one per role for everything else), which compare the grant's scope rows with
# resource.attr.siteId / collectionKey / locale. NO bundle and NO perm_* mirror, for the same reason as
# publish: a flat key cannot say "this site, these collections, these locales" (PERMISSION-CONTRACT §27).
#
# Additional resource attributes, every one from WebDesk's own read or a validated route param, never a
# body (design §2.3): `siteId` (route :siteId after resolveEditableSite()), `reviewState` (WebDesk
# editorial_items.state: draft | in_review | changes_requested | approved; for a translator's twin
# `create`, the SOURCE item's), `published` (publishedVersion !== null; for a twin `create`, the
# source's), `ownerId` (= editorial_items.author_sub), `creatorId` (for `approve`: created_by of the
# version being approved). Until W1c sends `siteId` and `reviewState`, every rule that reads them reads
# "" and DENIES; the staff tiers below read neither, so nothing that works today changes.
#
# Authoring rules held here:
#   - Each editorial derived role sits in its OWN rule, never in one rule with a scope-only role (the
#     org_unit_lead authoring rule, derived_roles.yaml) — so a flat bundle can never mistake one for the other.
#   - Every instance condition is INLINE (variables.owns, reviewState, creatorId), never variables.local.
#   - approve is maker != checker against the CREATOR OF THE VERSION being approved, enforced twice:
#     inline on every approve ALLOW, and as a `roles: ["user"]` DENY that beats the platform_admin
#     wildcard. An approve with no known creator is DENIED for everyone (four eyes cannot be proven).
#   - automation, bot and contributor principals never approve; automation and bot never seo_signoff.
#   - Review state lives in WebDesk; this file only gates WHO may ask for a transition. Whether the
#     transition is legal (version = submitted, state machine) is WebDesk's 409, not a policy question.
apiVersion: api.cerbos.dev/v1
resourcePolicy:
  version: default
  resource: webdesk_content_item
  importDerivedRoles: ["gaiada_scopes"]
  variables:
    import: ["gaiada_common"]
  rules:
    # Operator tier. Subject to the DENY rules at the bottom of this file (deny-overrides): no
    # publish/schedule without an approval id, and no self-approval outside R4.
    - actions: ["*"]
      effect: EFFECT_ALLOW
      derivedRoles: ["platform_admin"]

    # ══════════ editor tier — read / create / update / request_publish ══════════════════════════
    - actions: ["read", "create", "update", "request_publish"]
      effect: EFFECT_ALLOW
      derivedRoles: ["company_admin", "manager"]
      condition: { match: { expr: "variables.inTenant && variables.notLow" } }
    - actions: ["read", "create", "update", "request_publish"]
      effect: EFFECT_ALLOW
      derivedRoles: ["module_manager", "module_staff"]
      condition:
        match:
          expr: >-
            variables.inTenant && variables.notLow &&
            request.resource.attr.module == "webdev"

    # ══════════ publisher tier — unpublish / delete (MEDIUM, immediate) ═════════════════════════
    - actions: ["unpublish", "delete"]
      effect: EFFECT_ALLOW
      derivedRoles: ["company_admin"]
      condition: { match: { expr: "variables.inTenant && variables.notLow" } }
    - actions: ["unpublish", "delete"]
      effect: EFFECT_ALLOW
      derivedRoles: ["module_manager"]
      condition:
        match:
          expr: >-
            variables.inTenant && variables.notLow &&
            request.resource.attr.module == "webdev"

    # ══════════ publish — HIGH: approval id required; maker ≠ checker unless exactly ONE item ═══
    - actions: ["publish"]
      effect: EFFECT_ALLOW
      derivedRoles: ["company_admin"]
      condition:
        match:
          expr: >-
            variables.inTenant && variables.notLow &&
            has(request.resource.attr.approvalId) &&
            type(request.resource.attr.approvalId) == string &&
            request.resource.attr.approvalId != "" &&
            has(request.resource.attr.creatorId) &&
            type(request.resource.attr.creatorId) == string &&
            request.resource.attr.creatorId != "" &&
            (request.resource.attr.creatorId != request.principal.id ||
              (has(request.resource.attr.itemCount) && request.resource.attr.itemCount == 1))
    - actions: ["publish"]
      effect: EFFECT_ALLOW
      derivedRoles: ["module_manager"]
      condition:
        match:
          expr: >-
            variables.inTenant && variables.notLow &&
            request.resource.attr.module == "webdev" &&
            has(request.resource.attr.approvalId) &&
            type(request.resource.attr.approvalId) == string &&
            request.resource.attr.approvalId != "" &&
            has(request.resource.attr.creatorId) &&
            type(request.resource.attr.creatorId) == string &&
            request.resource.attr.creatorId != "" &&
            (request.resource.attr.creatorId != request.principal.id ||
              (has(request.resource.attr.itemCount) && request.resource.attr.itemCount == 1))

    # ══════════ schedule — HIGH: approval id required; STRICT maker ≠ checker (R4 excludes it) ══
    - actions: ["schedule"]
      effect: EFFECT_ALLOW
      derivedRoles: ["company_admin"]
      condition:
        match:
          expr: >-
            variables.inTenant && variables.notLow &&
            has(request.resource.attr.approvalId) &&
            type(request.resource.attr.approvalId) == string &&
            request.resource.attr.approvalId != "" &&
            has(request.resource.attr.creatorId) &&
            type(request.resource.attr.creatorId) == string &&
            request.resource.attr.creatorId != "" &&
            request.resource.attr.creatorId != request.principal.id
    - actions: ["schedule"]
      effect: EFFECT_ALLOW
      derivedRoles: ["module_manager"]
      condition:
        match:
          expr: >-
            variables.inTenant && variables.notLow &&
            request.resource.attr.module == "webdev" &&
            has(request.resource.attr.approvalId) &&
            type(request.resource.attr.approvalId) == string &&
            request.resource.attr.approvalId != "" &&
            has(request.resource.attr.creatorId) &&
            type(request.resource.attr.creatorId) == string &&
            request.resource.attr.creatorId != "" &&
            request.resource.attr.creatorId != request.principal.id

    # ══════════ CLIENT EDITORS — WSK-49c (rulings WSK-D58, D59, D60) ═════════════════════════════
    # The derived role `client_website_editor` (derived_roles.yaml, WSK-49f) matches only when the principal holds the
    # `client_website_editor` grant for the client the RESOURCE is about (`resource.attr.clientId`) AND the grant's
    # tenant is the resource's tenant. Every rule below also keeps the tenant, assurance and module tests the staff
    # editor tier has, and none uses `variables.local` (it hides the self-scope and mis-routes IAM overrides).
    #
    # `clientId` is fed ONLY by the portal BFF (webdesk-client-website.service.ts), from the site -> client link it
    # loaded in the request's tenant (`webdesk_site_clients`), never from a body; an unfed resource ("") matches
    # nothing. WHAT A CLIENT EDITOR CAN NEVER DO appears here as ABSENCE: `delete`, `unpublish`, `schedule` and the
    # whole of `webdesk_collection` (schema) are in no client rule, so Cerbos denies them by default.
    #
    # read / create / update / request_publish: the editor tier, narrowed to one client. WHICH FIELDS a client may
    # change (WSK-D59) is not a Cerbos question: the BFF and WebDesk both enforce it from the composition.
    - actions: ["read", "create", "update", "request_publish"]
      effect: EFFECT_ALLOW
      derivedRoles: ["client_website_editor"]
      condition:
        match:
          expr: >-
            variables.inTenant && variables.notLow &&
            request.resource.attr.module == "webdev"

    # publish (WSK-D58): reachable only at the decide step of an approved WS4 row (approval id present, a KNOWN
    # creator), and
    #   * the editor may approve a publish THEY requested only when it covers exactly ONE item
    #     (creatorId == principal.id && itemCount == 1: the client-side analogue of R4), or
    #   * a batch (or anyone's request) needs a DIFFERENT person: creatorId != principal.id. The BFF only offers
    #     this for a request another client editor of the same client filed (the approval row carries the client).
    # `itemCount` is computed by the executor from the STORED row, never from a request; omitted -> 0 -> the
    # two-person rule applies (fail closed). The roles:["user"] DENYs at the bottom of this file still apply to
    # every principal, client editors included: a self-approved batch is denied twice.
    - actions: ["publish"]
      effect: EFFECT_ALLOW
      derivedRoles: ["client_website_editor"]
      condition:
        match:
          expr: >-
            variables.inTenant && variables.notLow &&
            request.resource.attr.module == "webdev" &&
            has(request.resource.attr.approvalId) &&
            type(request.resource.attr.approvalId) == string &&
            request.resource.attr.approvalId != "" &&
            has(request.resource.attr.creatorId) &&
            type(request.resource.attr.creatorId) == string &&
            request.resource.attr.creatorId != "" &&
            ((request.resource.attr.creatorId == request.principal.id &&
              has(request.resource.attr.itemCount) && request.resource.attr.itemCount == 1) ||
             request.resource.attr.creatorId != request.principal.id)

    # ══════════ M5-W1a · the review actions for the EXISTING tiers (design §2.4) ═════════════════
    # webdev_staff (module_staff, the unscoped editor tier) gains submit and comment. webdev_manager
    # (module_manager) and company_admin (owner mirrors it through its bundle; platform_admin by the
    # wildcard) gain every review action. `manager` and `member` gain nothing here.
    - actions: ["submit", "comment"]
      effect: EFFECT_ALLOW
      derivedRoles: ["module_staff"]
      condition:
        match:
          expr: >-
            variables.inTenant && variables.notLow &&
            request.resource.attr.module == "webdev"
    - actions: ["submit", "comment", "request_changes", "seo_signoff", "assign"]
      effect: EFFECT_ALLOW
      derivedRoles: ["company_admin"]
      condition: { match: { expr: "variables.inTenant && variables.notLow" } }
    - actions: ["submit", "comment", "request_changes", "seo_signoff", "assign"]
      effect: EFFECT_ALLOW
      derivedRoles: ["module_manager"]
      condition:
        match:
          expr: >-
            variables.inTenant && variables.notLow &&
            request.resource.attr.module == "webdev"
    # approve: the item must be in review and its version's creator KNOWN and NOT the caller (inline;
    # the DENYs at the bottom of this file repeat it for every principal).
    - actions: ["approve"]
      effect: EFFECT_ALLOW
      derivedRoles: ["company_admin"]
      condition:
        match:
          expr: >-
            variables.inTenant && variables.notLow &&
            has(request.resource.attr.reviewState) && request.resource.attr.reviewState == "in_review" &&
            has(request.resource.attr.creatorId) &&
            type(request.resource.attr.creatorId) == string &&
            request.resource.attr.creatorId != "" &&
            request.resource.attr.creatorId != request.principal.id
    - actions: ["approve"]
      effect: EFFECT_ALLOW
      derivedRoles: ["module_manager"]
      condition:
        match:
          expr: >-
            variables.inTenant && variables.notLow &&
            request.resource.attr.module == "webdev" &&
            has(request.resource.attr.reviewState) && request.resource.attr.reviewState == "in_review" &&
            has(request.resource.attr.creatorId) &&
            type(request.resource.attr.creatorId) == string &&
            request.resource.attr.creatorId != "" &&
            request.resource.attr.creatorId != request.principal.id

    # ══════════ M5-W1a · the writers' room roles (design §2.1) — each derived role in its OWN rule ══
    # read: any editorial grant whose scope covers the item's site and collection, in any locale.
    - actions: ["read"]
      effect: EFFECT_ALLOW
      derivedRoles: ["webdesk_editorial_reader"]
      condition: { match: { expr: "variables.inTenant && variables.notLow" } }

    # writer — creates in scope; edits, submits and comments on its OWN items only, and edits only
    # while the item is a draft or has changes requested (never while it is being reviewed).
    - actions: ["create"]
      effect: EFFECT_ALLOW
      derivedRoles: ["webdesk_writer"]
      condition: { match: { expr: "variables.inTenant && variables.notLow" } }
    - actions: ["update"]
      effect: EFFECT_ALLOW
      derivedRoles: ["webdesk_writer"]
      condition:
        match:
          expr: >-
            variables.inTenant && variables.notLow && variables.owns &&
            has(request.resource.attr.reviewState) &&
            request.resource.attr.reviewState in ["draft", "changes_requested"]
    - actions: ["submit", "comment"]
      effect: EFFECT_ALLOW
      derivedRoles: ["webdesk_writer"]
      condition: { match: { expr: "variables.inTenant && variables.notLow && variables.owns" } }

    # translator — creates ONLY a locale twin whose SOURCE item has an approved or a live version (for a
    # twin `create` the handler passes the source's reviewState/published, and the twin's own locale; a
    # fresh item has neither, so a translator can never start an original). Otherwise the writer's rights.
    - actions: ["create"]
      effect: EFFECT_ALLOW
      derivedRoles: ["webdesk_translator"]
      condition:
        match:
          expr: >-
            variables.inTenant && variables.notLow &&
            ((has(request.resource.attr.reviewState) && request.resource.attr.reviewState == "approved") ||
              (has(request.resource.attr.published) && request.resource.attr.published == true))
    - actions: ["update"]
      effect: EFFECT_ALLOW
      derivedRoles: ["webdesk_translator"]
      condition:
        match:
          expr: >-
            variables.inTenant && variables.notLow && variables.owns &&
            has(request.resource.attr.reviewState) &&
            request.resource.attr.reviewState in ["draft", "changes_requested"]
    - actions: ["submit", "comment"]
      effect: EFFECT_ALLOW
      derivedRoles: ["webdesk_translator"]
      condition: { match: { expr: "variables.inTenant && variables.notLow && variables.owns" } }

    # SEO reviewer — edits only while the item is in review (fixing meta in place); comments, requests
    # changes and signs off in scope. No create, no submit, no approve, no request_publish (design D9).
    - actions: ["update"]
      effect: EFFECT_ALLOW
      derivedRoles: ["webdesk_seo_reviewer"]
      condition:
        match:
          expr: >-
            variables.inTenant && variables.notLow &&
            has(request.resource.attr.reviewState) && request.resource.attr.reviewState == "in_review"
    - actions: ["comment", "request_changes", "seo_signoff"]
      effect: EFFECT_ALLOW
      derivedRoles: ["webdesk_seo_reviewer"]
      condition: { match: { expr: "variables.inTenant && variables.notLow" } }

    # editor (scoped) — the review desk for its scope: everything up to and including request_publish,
    # plus approve under maker != checker. No seo_signoff (the SEO check is a separate person's record),
    # and never publish/schedule/unpublish/delete (the publisher tier, D46).
    - actions: ["create", "update", "submit", "comment", "request_changes", "assign", "request_publish"]
      effect: EFFECT_ALLOW
      derivedRoles: ["webdesk_editor"]
      condition: { match: { expr: "variables.inTenant && variables.notLow" } }
    - actions: ["approve"]
      effect: EFFECT_ALLOW
      derivedRoles: ["webdesk_editor"]
      condition:
        match:
          expr: >-
            variables.inTenant && variables.notLow &&
            has(request.resource.attr.reviewState) && request.resource.attr.reviewState == "in_review" &&
            has(request.resource.attr.creatorId) &&
            type(request.resource.attr.creatorId) == string &&
            request.resource.attr.creatorId != "" &&
            request.resource.attr.creatorId != request.principal.id

    # ══════════ the self-approval DENYs — every principal, platform_admin included ══════════════
    # `roles: ["user"]` matches every principal Cerbos evaluates (principalPayload() sets the base
    # role unconditionally). These name no derived role, so the static reach computations
    # (iam-215-boundary-pin, role-permission-parity, generate-role-bundles) ignore them by
    # construction; they bite only at decision time.
    - actions: ["publish"]
      effect: EFFECT_DENY
      roles: ["user"]
      condition:
        match:
          expr: >-
            has(request.resource.attr.creatorId) && request.resource.attr.creatorId != "" &&
            request.resource.attr.creatorId == request.principal.id &&
            !(has(request.resource.attr.itemCount) && request.resource.attr.itemCount == 1)
    - actions: ["schedule"]
      effect: EFFECT_DENY
      roles: ["user"]
      condition:
        match:
          expr: >-
            has(request.resource.attr.creatorId) && request.resource.attr.creatorId != "" &&
            request.resource.attr.creatorId == request.principal.id

    # ══════════ HIGH for EVERY principal (WSK-D46): no approval id, no publish/schedule ═════════
    # Without this, the platform_admin wildcard at the top of this file would publish with no WS4
    # approval at all. `roles: ["user"]` (the invoice precedent) matches every principal, so under
    # deny-overrides this beats the wildcard and any future ALLOW. resourcePayload() always sends
    # approvalId ("" when unset), so the has()/type() arms are defence against a raw caller.
    - actions: ["publish", "schedule"]
      effect: EFFECT_DENY
      roles: ["user"]
      condition:
        match:
          expr: >-
            !has(request.resource.attr.approvalId) ||
            type(request.resource.attr.approvalId) != string ||
            request.resource.attr.approvalId == ""

    # ══════════ automation and bot principals never publish or schedule (T7, WebDesk M3) ═════════
    # Same `roles: ["user"]` DENY shape as the two blocks above, so it beats the platform_admin
    # wildcard and every ALLOW under deny-overrides. `request_publish` is deliberately NOT listed.
    # `has()` makes a raw caller that omits the attribute evaluate to false (no deny) rather than
    # raise a CEL error; principalPayload() always sends it, "" when unknown.
    - actions: ["publish", "schedule"]
      effect: EFFECT_DENY
      roles: ["user"]
      condition:
        match:
          expr: >-
            has(request.principal.attr.kind) &&
            request.principal.attr.kind in ["automation", "bot"]

    # ══════════ M5-W1a · approve is four-eyed on the exact bytes — DENYs for every principal ══════
    # `creatorId` here is the created_by of the VERSION being approved (WebDesk's read, never a body), so an
    # editor who rewrites a draft during review cannot approve their own rewrite. Same `roles: ["user"]`
    # shape as the publish DENYs above: under deny-overrides each beats the platform_admin wildcard and
    # every ALLOW. The second DENY refuses an approve whose creator is unknown: four eyes cannot be shown,
    # so nobody (platform_admin included) approves it. resourcePayload() always sends creatorId ("" when
    # unset); the has()/type() arms cover a raw caller.
    - actions: ["approve"]
      effect: EFFECT_DENY
      roles: ["user"]
      condition:
        match:
          expr: >-
            has(request.resource.attr.creatorId) && request.resource.attr.creatorId != "" &&
            request.resource.attr.creatorId == request.principal.id
    - actions: ["approve"]
      effect: EFFECT_DENY
      roles: ["user"]
      condition:
        match:
          expr: >-
            !has(request.resource.attr.creatorId) ||
            type(request.resource.attr.creatorId) != string ||
            request.resource.attr.creatorId == ""

    # ══════════ M5-W1a · machine and outside principals never approve (design D7, §3.1) ═════════════
    # Approval and the SEO sign-off are recorded human judgements. `kind` is users.kind, sent by
    # principalPayload(); an absent kind ("") matches nothing. `contributor` (design §3.1, owner question
    # O-4) is listed for approve; a contributor MAY sign off SEO (its command allow-list includes
    # seoSignoff), so seo_signoff names automation and bot only. The rest of the contributor DENYs
    # (§3.1 item 6) are the M5-W1d block at the end of this file.
    - actions: ["approve"]
      effect: EFFECT_DENY
      roles: ["user"]
      condition:
        match:
          expr: >-
            has(request.principal.attr.kind) &&
            request.principal.attr.kind in ["automation", "bot", "contributor"]
    - actions: ["seo_signoff"]
      effect: EFFECT_DENY
      roles: ["user"]
      condition:
        match:
          expr: >-
            has(request.principal.attr.kind) &&
            request.principal.attr.kind in ["automation", "bot"]

    # ══════════ M5-W1d · what a freelance contributor never does here (design §3.1 item 6, WSK-D84) ══════════
    # A contributor (users.kind = contributor) holds only the writer, translator and SEO-reviewer roles, and those already
    # lack these actions; this DENY makes it structural, so a mis-granted role (even webdesk_editor or a staff tier) or a
    # future ALLOW still cannot give a contributor assign, filing a publish request, publish, schedule, unpublish or delete.
    # `approve` is denied above (with automation and bot). Left OPEN for contributors, decided by their grants: read,
    # create, update, submit, comment, request_changes and seo_signoff (WebDesk's CONTRIBUTOR_COMMANDS, W1e).
    - actions: ["assign", "request_publish", "publish", "schedule", "unpublish", "delete"]
      effect: EFFECT_DENY
      roles: ["user"]
      condition:
        match:
          expr: >-
            has(request.principal.attr.kind) &&
            request.principal.attr.kind == "contributor"
