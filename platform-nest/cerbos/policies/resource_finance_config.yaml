# Finance F0-09 — `finance_config`: THE ACCOUNTING VOCABULARY.
#
# Covers the chart of accounts, accounting dimensions and their values, the fiscal calendar's
# STRUCTURE (years and periods as date ranges), currencies-in-use, exchange rates, and the company's
# accounting settings (functional/presentation currency, PKP status, NPWP).
#
# One kind rather than six because they share exactly one sensitivity posture and one holder set:
# they are the company's accounting *vocabulary*, they carry no figures, and they are all edited by
# the same person — the controller/accountant. Six near-identical policies is how six drift.
#
# ── WHY THIS IS SEPARATE FROM `finance_period` AND `finance_control` ─────────────────────────────
# Both splits follow a segregation-of-duties line, not a code-layout preference
# (docs/blueprints/finance-accounting-foundation.md §2.2):
#
#   * `finance_period` — LOCKING a period is the `period_close` duty, control function AUTHORISE.
#     Editing the chart of accounts is the `record` function. The blueprint's matrix forbids one
#     person holding `journal_post` + `period_close`; keeping the kinds separate is what makes that
#     grantable separately at all. Folded together, "may edit the CoA" would silently carry
#     "may close the books".
#   * `finance_control` — who holds which duty, and who may elevate into another company. Granting
#     that alongside CoA editing would let the accountant widen their own reach.
#
# ── READ IS DELIBERATELY WIDER THAN WRITE ───────────────────────────────────────────────────────
# `module_staff` (i.e. `finance_staff`) can READ. That is on purpose and it is not a leak: an
# account code and name carry no money. Someone coding an expense claim, or a department head
# reading a cost-centre list, needs the vocabulary; hiding it produces a support ticket, not a
# posture. The same reasoning resource_hr_policy.yaml applies to a holiday calendar.
#
# WRITE is the controller tier (`module_manager` == `finance_manager`) plus the served company's own
# admin. An account is not a label: re-typing one moves every balance that ever touched it, which is
# why 202608241011's freeze trigger exists in the database as well as here. Defence in depth —
# Cerbos decides who may ask, the trigger decides what is possible.
#
# ── WHAT IS DELIBERATELY ABSENT ─────────────────────────────────────────────────────────────────
#   * `org_unit_lead` — a department head editing the group's chart of accounts is not a thing.
#     Reading it is covered by finance_staff where the person actually works in finance.
#   * `client` — an external client contact has no business in any company's accounting vocabulary.
#   * A `perm_*` mirror arm. ROLE-ARM ONLY this wave, matching resource_hr_payroll.yaml and
#     resource_employee.yaml: new kinds get a permission arm only after their handlers exist and
#     their holders have been audited against a live grant set. The handlers do NOT exist yet — F0
#     is schema only — so a mirror now would grant reach to a surface nobody can serve.
#   * `owner`. NOT an omission and NOT an oversight: `owner` is a permission-native role (IAM-04c
#     §3) with no Cerbos rules anywhere, whose reach is its bundle alone. The holding owner's
#     all-company visibility comes from the ownership graph resolved in
#     202608241010_finance_ownership_and_scope.sql, per ruling D-F8 — not from a rule here.
#
# ── THE HANDLER CONTRACT ────────────────────────────────────────────────────────────────────────
# Handlers pass resource.attr = {kind:"finance_config", tenantId, module:"finance", id?}. The
# `module` value is LOAD-BEARING, not decoration: derived_roles.yaml string-composes the module
# tiers from it (`module` + `_staff`/`_manager`), so `finance_staff` and `finance_manager` are the
# only role names Cerbos will ever match here. A handler that omits it matches no module rule and
# the request is denied — fail-closed, but silently, so pass it.
apiVersion: api.cerbos.dev/v1
resourcePolicy:
  version: default
  resource: finance_config
  importDerivedRoles: ["gaiada_scopes"]
  variables:
    import: ["gaiada_common"]
  rules:
    - actions: ["*"]
      effect: EFFECT_ALLOW
      derivedRoles: ["platform_admin"]

    # READ — the vocabulary tier. Wide on purpose (see header).
    - actions: ["read"]
      effect: EFFECT_ALLOW
      derivedRoles: ["module_staff", "module_manager", "company_admin"]
      condition: { match: { expr: "variables.inTenant && variables.notLow" } }

    # WRITE — the controller tier. Creating an account, adding a dimension, cutting a fiscal
    # calendar, entering an exchange rate.
    - actions: ["create", "update"]
      effect: EFFECT_ALLOW
      derivedRoles: ["module_manager", "company_admin"]
      condition: { match: { expr: "variables.inTenant && variables.notLow" } }

    # DESTRUCTIVE. Note what this can and cannot reach: an account that has ever been posted to is
    # frozen by trigger and can only be ARCHIVED (a status update), never deleted or re-coded. So
    # `delete` here governs the pre-posting window — a mistyped account nobody used — and the
    # database, not this policy, is what makes that guarantee hold.
    - actions: ["delete"]
      effect: EFFECT_ALLOW
      derivedRoles: ["module_manager", "company_admin"]
      condition: { match: { expr: "variables.inTenant && variables.notLow" } }

    # ══════════ PV5-02 (2026-10-12) — `set_bank_details`. A NEW ACTION on this existing kind.
    # Changing the bank account clients pay an issued invoice into redirects real money, with no fake
    # invoice needed (the `vendor_master` reasoning in F5, applied to the receiving side). So it is NOT
    # part of the controller tier's `update` and not reachable by `company_admin`.
    #
    # WHO: an `owner` of this company, or its `finance_manager`, and nobody else. The rule reads the
    # GRANT, never `attr.perms`, and is written inline under `roles: ["user"]` for the reason
    # resource_contract.yaml's `countersign` rule gives:
    #   * `owner` is permission-native (no derived role), so an inline grant check is how it is named;
    #   * `finance_manager` is written inline too, not through `module_manager`, so the generator does
    #     not bundle the key onto it. A bundled, `ui_grantable = false` key would make `finance_manager`
    #     unattachable to positions (position_roles_guard); bundling it with `ui_grantable = true` would
    #     advertise a key a UI-built role could hold. Same reach, no bundle row either way.
    # COMPANY SCOPE ON THIS TENANT ONLY: no global grant matches, and an owner or finance_manager of
    # another company gets nothing. `platform_admin` reaches it through the wildcard at the top of this
    # file, and that is deliberate: owner ruling PV-D26 (2026-10-12) keeps the operator's reach, and
    # instead requires high assurance of EVERYONE, platform_admin included (the DENY below). Every
    # change also notifies all owners of the company (PV5-04).
    #
    # NO `perm_*` mirror and no `module_manager` rule: a custom role holding the catalogued key
    # `finance.config.set_bank_details` reaches nothing. `inTenant && notLow` is the same gate every
    # other rule on this kind uses; the high-assurance requirement is the separate DENY below (PV-D26).
    - actions: ["set_bank_details"]
      effect: EFFECT_ALLOW
      roles: ["user"]
      condition:
        match:
          expr: >-
            variables.inTenant && variables.notLow &&
            request.principal.attr.grants.exists(g,
              (g.role == "owner" || g.role == "finance_manager") &&
              g.scopeType == "company" && g.scopeId == request.resource.attr.tenantId)

    # Bots and automation never change the bank details, for ANY grant (T7's `roles: ["user"]` DENY
    # shape, resource_webdesk_content_item.yaml). Beats the platform_admin wildcard and the rule above
    # under deny-overrides. No agent tool sets bank details (PV5-12): an agent-driven change cannot
    # even be proposed. As on `invoice`, an agent under a human's own envelope assembles as that human
    # and is not seen here; the missing tool is what closes that path.
    - actions: ["set_bank_details"]
      effect: EFFECT_DENY
      roles: ["user"]
      condition:
        match:
          expr: >-
            has(request.principal.attr.kind) &&
            request.principal.attr.kind in ["automation", "bot"]

    # PV-D26 (owner ruling, 2026-10-12): changing the bank details clients pay into needs HIGH ASSURANCE
    # (a fresh second factor) from EVERYONE, platform_admin included. The operator keeps its reach (the
    # wildcard above is unchanged); this DENY is what stops it from going around the step-up. It is the
    # same bar as `vendor_master` in resource_finance_ap.yaml, and it reads the same attribute,
    # `request.principal.attr.assurance` (values "low" | "linked" | "high"; a plain SSO login is "linked").
    # `roles: ["user"]` matches every principal, so under deny-overrides it beats the wildcard and the
    # inline owner / finance_manager rule. FAIL-CLOSED: a principal that omits the attribute has no
    # assurance, so it is denied (principalPayload() always sends it; the has() arm covers a raw caller).
    # Every successful change also notifies all owners of the company (PV5-04).
    #
    # PV-D29 (2026-10-13): interim until MFA is enabled (infra/runbooks/enable-mfa.md); then restore
    # PV-D26's unconditional high-assurance DENY. Live Keycloak emits no `amr` claim, so no web session
    # ever reaches "high" and the unconditional DENY made our own bank details unsettable. Until then the
    # DENY fires only for a principal that is below high AND holds NO owner / finance_manager grant at
    # company scope on this tenant (the same grant expression as the ALLOW above). So an owner or
    # finance_manager of the company may change the bank details at "linked" assurance ("low" is still
    # refused by `notLow` in the ALLOW), while platform_admin, which holds neither grant, still needs
    # high (unreachable today, so the operator cannot). Bots and automation have their own DENY above.
    # Fail-closed is unchanged: no assurance attribute and no such grant means denied.
    - actions: ["set_bank_details"]
      effect: EFFECT_DENY
      roles: ["user"]
      condition:
        match:
          expr: >-
            (!has(request.principal.attr.assurance) ||
              request.principal.attr.assurance != "high") &&
            !request.principal.attr.grants.exists(g,
              (g.role == "owner" || g.role == "finance_manager") &&
              g.scopeType == "company" && g.scopeId == request.resource.attr.tenantId)
