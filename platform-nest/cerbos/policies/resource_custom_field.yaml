apiVersion: api.cerbos.dev/v1
resourcePolicy:
  version: default
  resource: custom_field
  importDerivedRoles: ["gaiada_scopes"]
  variables:
    import: ["gaiada_common"]
  rules:
    - actions: ["*"]
      effect: EFFECT_ALLOW
      derivedRoles: ["platform_admin"]
    # Any member may read field defs (the UI renders dynamic forms from them).
    - actions: ["read"]
      effect: EFFECT_ALLOW
      derivedRoles: ["company_admin", "manager", "member", "viewer"]
      condition: { match: { expr: "variables.inTenant && variables.notLow" } }
    # Only admins/managers define fields.
    - actions: ["create", "update", "delete"]
      effect: EFFECT_ALLOW
      derivedRoles: ["company_admin", "manager"]
      condition: { match: { expr: "variables.inTenant && variables.notLow" } }
    # ══════════ IAM-04-ROLLOUT-B4 — permission-matching arm. PURELY ADDITIVE: every rule above ═══
    # is byte-for-byte unchanged. No exclusion needed (zero team_lead mixing on this kind).
    - actions: ["read"]
      effect: EFFECT_ALLOW
      derivedRoles: ["perm_custom_field_read"]
      condition: { match: { expr: "variables.inTenant && variables.notLow && variables.inRoot" } }
    - actions: ["create"]
      effect: EFFECT_ALLOW
      derivedRoles: ["perm_custom_field_create"]
      condition: { match: { expr: "variables.inTenant && variables.notLow && variables.inRoot" } }
    - actions: ["update"]
      effect: EFFECT_ALLOW
      derivedRoles: ["perm_custom_field_update"]
      condition: { match: { expr: "variables.inTenant && variables.notLow && variables.inRoot" } }
    - actions: ["delete"]
      effect: EFFECT_ALLOW
      derivedRoles: ["perm_custom_field_delete"]
      condition: { match: { expr: "variables.inTenant && variables.notLow && variables.inRoot" } }
