# PRV-03 (provision <-> ERP seam, docs/blueprints/provision-erp-seam-design.md §06) — authz for the
# NEW `webdev_provisioned_site` resource kind. Nothing existed for this kind before this file landed;
# an unlisted kind/action is a SILENT DENY that reads exactly like a logic bug (standing estate trap)
# — `webdev.controller.ts`'s own header already called this out while it waited for this policy.
# Restart `gaiada-test-cerbos` after editing this file; the bind-mount does not hot-reload.
#
# webdev_provisioned_site = the ERP-side mirror row for one provision (repo+hosting) attempt —
# `provider`, `provider_ref`, slug, framework, status, urls (0090). Handlers pass
# resource.attr = {kind:"webdev_provisioned_site", tenantId, module:"webdev", id?} — same shape as
# the sibling `webdev_change_request` resource (resource_webdev_change_request.yaml), which this file
# is a byte-level sibling of.
#
# ── ACTIONS ──────────────────────────────────────────────────────────────────────────────────────
#   read      — list/detail (the run workspace's "Site & repo" card, PRV-04).
#   provision — POST …/provision. Creates PUBLIC infrastructure (a private org repo, a server
#               directory, an nginx vhost, a TLS cert) — never a plain-member action. A human calling
#               this endpoint directly IS the approval on the manual/staff trigger (design §04's
#               secondary trigger); the AUTOMATION trigger never reaches this policy as a human at
#               all — it suspends into WS4 (D14) and the APPROVER's decision is what unlocks a
#               `resource_mcp_tool.yaml`-gated re-drive, not a grant on THIS resource.
#   reconcile — POST …/reconcile. Also gated with `provision`'s tier (not folded into `read`)
#               because a resume-path reconcile can itself cause an egress (provisioning.service.ts's
#               own header: "reconcile can cause an egress").
#
# ── THE INVARIANT THIS FILE MUST NOT BREAK ──────────────────────────────────────────────────────
# The `client` derived role appears NOWHERE in this policy, deliberately — same invariant
# resource_webdev_change_request.yaml states for its own sibling table. A provisioned-site row is
# never portal-readable (v1 has no client-facing surface for it at all, design §06's UI row is
# staff-only) and a principal holding only the `client` grant must DENY on every action here.
#
# ── TRAP #4 (repeated verbatim; this file is the Nth application of it) ─────────────────────────
# `group_executive` is a GLOBAL cross-company grant (`scopeType == "global"`,
# derived_roles.yaml:19-24). `variables.inTenant` is `resource.tenantId in principal.companies`, and
# `principal.companies` is built exclusively from the caller's `company_memberships` rows — so an
# owner who holds the global grant but has NO membership row in a given company has an empty (or
# non-matching) `companies` set and `inTenant` is FALSE for them there. Folding the exec into the
# company_admin/manager rule below would produce a global grant that never fires for exactly the
# case it exists to cover. The shipped correct shape is resource_integration_connection.yaml:29-33 /
# resource_webdev_change_request.yaml:44-58, copied here. `notLow` still applies — a low-assurance
# session gets nothing, owner or not. QA probes this positively: exec with NO membership row => ALLOW
# on read/provision/reconcile.
apiVersion: api.cerbos.dev/v1
resourcePolicy:
  version: default
  resource: webdev_provisioned_site
  importDerivedRoles: ["gaiada_scopes"]
  variables:
    import: ["gaiada_common"]
  rules:
    - actions: ["*"]
      effect: EFFECT_ALLOW
      derivedRoles: ["platform_admin"]
    - actions: ["read", "provision", "reconcile"]
      effect: EFFECT_ALLOW
      derivedRoles: ["company_admin", "manager"]
      condition: { match: { expr: "variables.inTenant && variables.notLow" } }
    # ORG-6 module tiers (derived_roles.yaml:108-135), string-composed from resource.attr.module —
    # the webdev dept's own manager may provision/reconcile; its staff may only read. Mirrors
    # resource_webdev_change_request.yaml's manager/staff split exactly (same module, same table
    # family, same reasoning: creating infrastructure is a manager-tier act, reading the card is not).
    - actions: ["read", "provision", "reconcile"]
      effect: EFFECT_ALLOW
      derivedRoles: ["module_manager"]
      condition: { match: { expr: "variables.inTenant && variables.notLow" } }
    - actions: ["read"]
      effect: EFFECT_ALLOW
      derivedRoles: ["module_staff"]
      condition: { match: { expr: "variables.inTenant && variables.notLow" } }

    # ══════════ WSK-31 (docs/blueprints/webdesk-design.md §07/§09) — TWO NEW ACTIONS, additive ══════
    # only; nothing above this block is touched. §09 names the REAL, eventual resource kind for the
    # WebDesk control surface as `resource_webdesk_site (read/operate/promote)` — owned by WSK-23, not
    # built yet. This ticket needs SOME company-scoped authz for its own Zone A stub control-plane
    # endpoints (`webdesk-control.controller.ts` — every route there is an honest 501, see that file's
    # header for why) and reusing THIS kind, the closest already-registered, already-tested sibling,
    # avoids the SIX-artifact cost of standing up a brand-new kind for a controller that is itself a
    # placeholder. Action names are taken VERBATIM from §09's own description so WSK-23 can re-point
    # the controller at the real kind later with NO action-name rewrite, only a kind-name change.
    #   operate — the §07 MEDIUM-impact control-plane commands (schema.apply, site.provision (the
    #             WebDesk/Zone-B one, distinct from this kind's own `provision` action above),
    #             deploy.staging). Same tier as `provision`/`reconcile` above — a manager-level act.
    #   promote — the §07 HIGH-impact, always-WS4 commands (site.promote/rollback/setDomain,
    #             key.mint/rotate/revoke, site.archive). Company-scoped authz here is NECESSARY but
    #             NOT SUFFICIENT for these: it only answers "is this principal a webdev operator in
    #             this tenant at all". What makes them suspend for WS4 regardless of caller
    #             attendance is mcp-hub's `ALWAYS_WS4_TOOLS` gate (policy.ts) + its mirror in
    #             resource_mcp_tool.yaml's always-WS4 conjunct, enforced BEFORE the hub ever calls
    #             into this endpoint.
    - actions: ["operate", "promote"]
      effect: EFFECT_ALLOW
      derivedRoles: ["company_admin", "manager"]
      condition: { match: { expr: "variables.inTenant && variables.notLow" } }
    - actions: ["operate", "promote"]
      effect: EFFECT_ALLOW
      derivedRoles: ["module_manager"]
      condition: { match: { expr: "variables.inTenant && variables.notLow" } }
    # NO IAM-04-ROLLOUT-B12 PERMISSION-MIRROR ARM for `operate`/`promote` (deliberate, flagged — same
    # call resource_webdev_zoneb_event.yaml already made for its own `record` action): a mirror rule
    # would need `perm_webdev_provisioned_site_operate`/`_promote` hand-registered in
    # `derived_roles.yaml` first, which is an existing file outside this ticket's owned scope for a
    # controller that is itself a placeholder. The role arms above already give full coverage without
    # the catalog arm. Reported in the ticket output as the exact addition to make if/when the B12
    # mirror is wanted for these two actions.

    # =========== IAM-04-ROLLOUT-B12 -- permission-matching arm. PURELY ADDITIVE: every rule =====
    # above is byte-for-byte unchanged. Generic global-or-company mirror per action (see this
    # kind's entry in docs/superpowers/plans/2026-08-10-iam-04-rollout-b12-report.md for the
    # per-kind safety argument). Any group_executive-only or platform_admin wildcard rule on this
    # kind is deliberately NOT mirrored here (IAM-04c: the tier bypass never enters the permission
    # catalog).

    - actions: ["read"]
      effect: EFFECT_ALLOW
      derivedRoles: ["perm_webdev_provisioned_site_read"]
      condition: { match: { expr: "variables.inTenant && variables.notLow && variables.inRoot" } }
    - actions: ["provision"]
      effect: EFFECT_ALLOW
      derivedRoles: ["perm_webdev_provisioned_site_provision"]
      condition: { match: { expr: "variables.inTenant && variables.notLow && variables.inRoot" } }
    - actions: ["reconcile"]
      effect: EFFECT_ALLOW
      derivedRoles: ["perm_webdev_provisioned_site_reconcile"]
      condition: { match: { expr: "variables.inTenant && variables.notLow && variables.inRoot" } }
