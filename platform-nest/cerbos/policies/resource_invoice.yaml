apiVersion: api.cerbos.dev/v1
resourcePolicy:
  version: default
  resource: invoice
  importDerivedRoles: ["gaiada_scopes"]
  variables:
    import: ["gaiada_common"]
  rules:
    # MON-00c split: platform_admin is the SaaS operator tier and keeps unconditional cross-root
    # reach on purpose — that is the operator's job, not a leak (docs/plans/2026-08-20-monitoring-
    # gated-rulings.md §1.3). group_executive is root-bounded instead: cross-company within its OWN
    # root only, via `variables.inRoot`.
    - actions: ["*"]
      effect: EFFECT_ALLOW
      derivedRoles: ["platform_admin"]
    - actions: ["*"]
      effect: EFFECT_ALLOW
      derivedRoles: ["group_executive"]
      condition: { match: { expr: "variables.inRoot" } }
    # Finance surface — company admins manage invoices for their company (UI gates company.manage).
    - actions: ["read", "create", "update", "delete"]
      effect: EFFECT_ALLOW
      derivedRoles: ["company_admin"]
      condition: { match: { expr: "variables.inTenant && variables.notLow" } }
    # Managers may view invoices but not issue/edit them.
    - actions: ["read"]
      effect: EFFECT_ALLOW
      derivedRoles: ["manager"]
      condition: { match: { expr: "variables.inTenant && variables.notLow" } }

    # ══════════ IAM-GAP-01 (2026-08-13) — the maker/checker seam. NEW action. Owner-approved
    # defaults: approval authority sits with the department-manager tier (`manager`, alongside a
    # SECOND `company_admin` — "Finance surface" per this file's own header comment), and the
    # approver must NOT be the invoice's own creator. `manager` previously held only `read` here;
    # this is a deliberate widening (the alternative — restricting `approve` to `company_admin`
    # only — would leave "department manager tier" unimplemented for this gap; flagged in the
    # ticket report for the owner to adjust).
    #
    # IAM-GAP-02 (2026-08-13) — "approval is based on managers related" — CONFIRMED reading, NOT a
    # narrowing: the owner's own words. This rule's `manager` reach is exactly what
    # `derived_roles.yaml`'s `manager` definition already grants at `scopeType == "company"` —
    # ANY manager holding a company-scope grant for THIS invoice's tenant, stated PLAINLY as the
    # interpretation actually implemented, per the ticket's own instruction not to silently equate
    # "related" with "any manager in the tenant" without flagging it:
    #   - `invoices` carries only `client_id`; its lines are computed at creation from
    #     `time_entries` across potentially MULTIPLE of that client's projects (one line per
    #     project) and frozen as JSONB `{description, hours, rate, amount}` — no `project_id` is
    #     stored per line, only the project's NAME. There is therefore no persisted per-invoice
    #     project identifier this policy could check against `manager`'s existing project-scope
    #     branch (`g.scopeType == "project" && g.scopeId == request.resource.attr.projectId`).
    #   - `clients` carries no manager/account-owner column at all (`0001_core.sql`); `projects`
    #     has `owner_id`, but that is an arbitrary PM-tool assignee field, not a Cerbos grant scope
    #     — it cannot be compared against `request.principal.attr.grants` without a second lookup
    #     Cerbos's resource-attribute model doesn't support here.
    #   - A tighter relation (e.g. "a manager scoped to ANY project this invoice's lines were drawn
    #     from") is NOT cheaply expressible without a schema change (storing `project_id` per
    #     invoice line, or a `projectIds` resource attribute + widening `manager`'s own derived-role
    #     condition to check array containment instead of equality) — both are bigger than this
    #     ticket's authorized surface (the manager derived role is shared by ~30 other resource
    #     kinds; widening its shape belongs with the schema owner, not a policy-only pass).
    # So: same-company `manager`, exactly as this rule already read before this pass — flagged so
    # the owner can tighten it in a follow-up (e.g. by capturing project_id per invoice line) if
    # "related" was meant to be narrower than "any manager in the tenant".
    #
    # FAIL CLOSED on an unknown creator: `has(...) && != ""` before the `!=` comparison. Without
    # the non-empty check, an unset/legacy `creatorId` ("" — see cerbos.ts's resourcePayload
    # default) would satisfy `creatorId != principal.id` VACUOUSLY (empty string is never equal to
    # a real user id), which would read "we don't know who made this" as "definitely not you" and
    # ALLOW — exactly backwards. Migration 0107 adds `invoices.created_by` with NO backfill (no
    # reliable historical actor exists), so every pre-existing invoice is PERMANENTLY unapprovable
    # by company_admin/manager until an operator sets `created_by` by hand — only the
    # platform_admin/group_executive wildcard rules at the top of this file (pre-existing bypass
    # unchanged by this ticket; MON-00c later split the one combined rule into two — platform_admin
    # unconditional, group_executive gated on `variables.inRoot` — but both still bypass this
    # maker/checker rule the same way a single combined rule would have) can still approve a legacy
    # row, same as they already bypass create/read/update/delete... EXCEPT that the DENY rule
    # immediately below now closes exactly that bypass for the one case where it was actually a
    # hole: the wildcard holder being the invoice's OWN creator. See that rule's own comment for the
    # full IAM-GAP-02 account.
    - actions: ["approve"]
      effect: EFFECT_ALLOW
      derivedRoles: ["company_admin", "manager"]
      condition:
        match:
          expr: >-
            variables.inTenant && variables.notLow &&
            has(request.resource.attr.creatorId) && request.resource.attr.creatorId != "" &&
            request.resource.attr.creatorId != request.principal.id
    # NO perm_invoice_approve mirror (IAM-04c doctrine, resource_hr_case.yaml's precedent): this
    # rule's condition is an attribute-instance check (creator != approver) that `0094`'s bundling
    # methodology treats as "satisfied" when computing company_admin/manager's reach — so a flat
    # `perms`-array mirror would grant `approve` to a company_admin/manager who IS the creator,
    # exactly the over-grant `iam-04-reg1-mirror-reach-invariant.test.ts` exists to catch. Do not
    # wire one; see derived_roles.yaml's IAM-04a header for the general rule this follows.

    # ══════════ IAM-GAP-02 (2026-08-13) — the self-approval hole, closed STRUCTURALLY. IAM-GAP-01's
    # own report (docs/superpowers/plans/2026-08-13-iam-gap-01-report.md §4.5) flagged this loudly:
    # the wildcard rule at the very top of this file (`actions: ["*"]`, `platform_admin` +
    # `group_executive`, NO condition) sits ABOVE the maker/checker ALLOW rule and grants `approve`
    # unconditionally — so either elevated role could approve an invoice it created itself. The
    # owner: a two-person rule means "1 superadmin + 1 owner" — being IN the approver set must
    # never mean being able to approve your OWN invoice, and that must hold for EVERY holder of
    # `approve`, platform_admin/group_executive included, not just company_admin/manager.
    #
    # SHAPE: `roles: ["user"]`, not `derivedRoles: [...]`. Every principal Cerbos ever evaluates
    # carries the BASE role `"user"` (cerbos.ts's `principalPayload()` sets it unconditionally,
    # for every caller), so this rule matches EVERYONE — company_admin, manager, platform_admin,
    # group_executive, and any future role ever added to the approver set — with no name to keep
    # in sync. Cerbos combines a kind's matching rules with deny-overrides semantics: if ANY rule
    # matching the requested action evaluates EFFECT_DENY, the final decision is DENY regardless of
    # how many EFFECT_ALLOW rules also matched, wildcard included. That is what makes this rule
    # "cannot be walked around" rather than "one more condition to remember to copy" — a future
    # rule (or a future wildcard on some other tier) that grants `approve` without repeating the
    # creator check still loses to this DENY, because DENY is evaluated independently of which
    # ALLOW rule fired. This is the FIRST `EFFECT_DENY` rule in this policy repository — the static
    # suites that assumed a "zero-EFFECT_DENY invariant" as a defensive simplification
    # (`iam-215-boundary-pin.test.ts`, `role-permission-parity.db.test.ts`) are unaffected: both
    # compute reach ONLY from `EFFECT_ALLOW` rules that name a role via `derivedRoles`, and this
    # rule names no derived role at all (`roles: ["user"]`), so it is invisible to — and does not
    # perturb — either computation. It is a genuine behavioural change ONLY at Cerbos decision time.
    #
    # GUARD SHAPE MIRRORS THE ALLOW RULE ABOVE ON PURPOSE: `has(...) && != ""` BEFORE the equality
    # check. This is NOT symmetrical with the ALLOW rule's fail-closed need (an unauthenticated-
    # feeling empty creatorId can never equal a real `principal.id`, so the guard is technically
    # unreachable either way) — it is kept so a future reader can never "simplify" this to a bare
    # `creatorId == principal.id` and change the empty-string case's behaviour without noticing.
    # Consequence, stated plainly per the ticket's own instruction: an UNKNOWN/empty creatorId
    # NEVER satisfies this DENY's condition, so it never fires for a legacy row — that row's fate
    # is decided entirely by the ALLOW rules' own fail-closed condition (no matching ALLOW =
    # default-deny for company_admin/manager; the wildcard still ALLOWs it for platform_admin/
    # group_executive, unchanged from IAM-GAP-01 — a legacy row has no recorded creator to conflict
    # with anyone). This rule narrows NOTHING about the unknown-creator case; it only ever fires
    # when creatorId is KNOWN and equals the caller.
    - actions: ["approve"]
      effect: EFFECT_DENY
      roles: ["user"]
      condition:
        match:
          expr: >-
            has(request.resource.attr.creatorId) && request.resource.attr.creatorId != "" &&
            request.resource.attr.creatorId == request.principal.id

    # =========== IAM-04-ROLLOUT-B12 -- permission-matching arm. PURELY ADDITIVE: every rule =====
    # above is byte-for-byte unchanged. Generic global-or-company mirror per action (see this
    # kind's entry in docs/superpowers/plans/2026-08-10-iam-04-rollout-b12-report.md for the
    # per-kind safety argument). Any group_executive-only or platform_admin wildcard rule on this
    # kind is deliberately NOT mirrored here (IAM-04c: the tier bypass never enters the permission
    # catalog).

    - actions: ["read"]
      effect: EFFECT_ALLOW
      derivedRoles: ["perm_invoice_read"]
      condition: { match: { expr: "variables.inTenant && variables.notLow && variables.inRoot" } }
    - actions: ["create"]
      effect: EFFECT_ALLOW
      derivedRoles: ["perm_invoice_create"]
      condition: { match: { expr: "variables.inTenant && variables.notLow && variables.inRoot" } }
    - actions: ["update"]
      effect: EFFECT_ALLOW
      derivedRoles: ["perm_invoice_update"]
      condition: { match: { expr: "variables.inTenant && variables.notLow && variables.inRoot" } }
    - actions: ["delete"]
      effect: EFFECT_ALLOW
      derivedRoles: ["perm_invoice_delete"]
      condition: { match: { expr: "variables.inTenant && variables.notLow && variables.inRoot" } }
