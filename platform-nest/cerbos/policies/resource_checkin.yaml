# TR-09 — the mandatory EOD check-in subsystem (Blueprint §5.3, §8's `resource_checkin` row).
# Actions: `submit` (POST /checkins), `read` (GET /checkins/today, /checkins history, /compliance),
# `excuse` (POST /checkins/:id/excuse), `pending_reminders` (GET /checkins/pending-reminders,
# the n8n-facing internal read, TR-11), `missed_by_unit` (GET /checkins/missed-yesterday, TR-11's
# escalation-flow read — same service/admin tier as pending_reminders, kept a separate action name
# only so the audit trail distinguishes the two n8n reads).
#
# `submit` is SELF ONLY, and it is the one action in this whole program where that must be
# airtight: `checkins.controller.ts` NEVER reads a subject id off the request body for submit — it
# is always `req.principal.userId`, so `request.resource.attr.subjectUserId` handed to Cerbos here
# is always the caller's own id, never client-chosen. The `member` rule below still requires the
# equality check explicitly (defense in depth, and it is what makes an OBO/MCP principal submitting
# on behalf of someone else fail here too, not just in the controller).
#
# `read`/`excuse` admit a `manager` grant, but Cerbos has NO primitive for "manager of THIS specific
# org unit" — `manager` (derived_roles.yaml) is scoped at company/project, not at an arbitrary org
# node. So this policy grants the COARSE tier (any manager grant in this tenant) and
# `checkins.controller.ts` narrows it the rest of the way in-app to the caller's own current unit
# (computed server-side from `org_unit_memberships`, never from a client-supplied query param) —
# see that file's header for the full reasoning. Flagged for TR-25 (Cerbos parity-matrix ticket):
# if a unit-scoped derived role is ever added for another ticket, this policy should adopt it too.
#
# `pending_reminders` is the one action §8 calls "service/admin" rather than naming a tier — kept
# narrow (company_admin/platform_admin only, no exec/HR/manager) because it exists for the n8n
# reminder flow (TR-11) to poll, not for a human console.
#
# Deliberately ABSENT: a "served-dept" (provider lead, company A→B) rule. §8 names that tier for
# checkin read/excuse, but every other cross-company view in this program is served exclusively
# through the D12 rollup/aggregate path (§8 hard rule 3: person-grain data outside your own line is
# structurally unreachable), and no report-document/rollup path for check-ins exists yet (TR-13+).
# Approximating it here would mean either a real cross-tenant person-grain leak or a silently
# wrong under-scope; left unimplemented and documented rather than faked. Also NOT modelled: HR's
# fine-grained staff-vs-manager split (`module_staff` vs `module_manager` with module='hr') is
# collapsed into one line below because §8 does not distinguish HR sub-roles for check-ins the way
# resource_hr_case.yaml distinguishes them for hr_case's destructive actions — both tiers get the
# full "HR-appraisal role" column here.
apiVersion: api.cerbos.dev/v1
resourcePolicy:
  version: default
  resource: checkin
  importDerivedRoles: ["gaiada_scopes"]
  variables:
    import: ["gaiada_common"]
  rules:
    - actions: ["*"]
      effect: EFFECT_ALLOW
      derivedRoles: ["platform_admin"]

    # Self-submit: subjectUserId MUST equal the principal (guarded with has() so a handler that
    # forgot to set it fails CLOSED, not open — same discipline as resource_hr_case.yaml's
    # subject-self rule).
    - actions: ["submit"]
      effect: EFFECT_ALLOW
      derivedRoles: ["member"]
      condition:
        match:
          expr: >-
            variables.inTenant && variables.notLow &&
            has(request.resource.attr.subjectUserId) &&
            request.resource.attr.subjectUserId == request.principal.id

    # Self-read: same self-only shape as submit, for GET /checkins/today and a self history query.
    - actions: ["read"]
      effect: EFFECT_ALLOW
      derivedRoles: ["member"]
      condition:
        match:
          expr: >-
            variables.inTenant && variables.notLow &&
            has(request.resource.attr.subjectUserId) &&
            request.resource.attr.subjectUserId == request.principal.id

    # ═══════════ §8's "HR-appraisal role" column — SPLIT BY TR-25 (finding ②) ═══════════
    # TR-09 expressed this tier as `module_staff`/`module_manager` + `module == "hr"`, which resolves
    # to the SAME two grant names (`hr_staff`/`hr_manager`) as `hr_people_*` — two spellings of one
    # tier, and the reason the HR boundary drifted between this file and resource_appraisal.yaml.
    # Consolidated onto the `hr_people_*` derived roles so there is exactly ONE spelling estate-wide,
    # and split by sensitivity:
    #
    #   read   → hr_people_reader (hr_staff OR hr_manager). Reading check-in history/compliance is
    #            `hr.view`-shaped baseline HR work.
    #   excuse → hr_people_ops (hr_manager ONLY). An excuse REWRITES a person's compliance record,
    #            and metric #18 `checkin_compliance` is appraisal-SAFE (§5) — i.e. this write moves a
    #            number that feeds an appraisal axis. That is an acting-tier decision, not a baseline
    #            one, and it is exactly the class of grant the finding-② audit found had leaked to
    #            every reconciler-materialized `hr_staff` holder on a served company.
    #
    # A side benefit worth stating: these rules no longer depend on the caller remembering to pass
    # `module: "hr"` on a `checkin` resource (an attribute-reuse trick that was orthogonal to the
    # actual module-sliced RLS wall). A handler that omits it no longer silently loses the HR tier.
    - actions: ["read"]
      effect: EFFECT_ALLOW
      derivedRoles: ["hr_people_reader"]
      condition: { match: { expr: "variables.inTenant && variables.notLow" } }

    - actions: ["excuse"]
      effect: EFFECT_ALLOW
      derivedRoles: ["hr_people_ops"]
      condition: { match: { expr: "variables.inTenant && variables.notLow" } }

    # The served company's own admin: full read + excuse within its own tenant.
    - actions: ["read", "excuse"]
      effect: EFFECT_ALLOW
      derivedRoles: ["company_admin"]
      condition: { match: { expr: "variables.inTenant && variables.notLow" } }

    # Dept lead ("own unit" per §8) — COARSE gate only; see the file header. The controller narrows
    # this to the caller's own current org unit before returning any row.
    - actions: ["read", "excuse"]
      effect: EFFECT_ALLOW
      derivedRoles: ["manager"]
      condition: { match: { expr: "variables.inTenant && variables.notLow" } }

    # ═══════════ TR-25 finding ③: `missed_by_unit` REVIEWED against §8 — VERDICT: KEEP AS IS ═══════
    # `missed_by_unit` (TR-11's `GET /checkins/missed-yesterday`) was added to satisfy an endpoint and
    # had never been reviewed against §8. §8 names no row for it, so TR-25 assessed it on its own
    # terms and the existing scoping is CORRECT — recorded here so the next reader does not
    # re-litigate it:
    #
    #  · Both actions return PERSON-GRAIN data spanning the whole tenant (who missed, grouped by
    #    unit), so they sit at the top of §8's sensitivity ordering and must NOT be widened to the
    #    dept-lead tier. `company_admin` is the tightest tier that can legitimately hold a
    #    tenant-wide ops view, and it is the tier the n8n service accounts actually run as (TR-22
    #    provisioned two scoped service accounts against exactly this pattern).
    #  · `manager` is EXCLUDED and must stay excluded. A `unit_scoped` caller has no business
    #    receiving the whole tenant's miss list, and unlike the `read` action there is no in-app
    #    narrowing on this route to fall back on — `missed-yesterday` returns EVERY unit's group by
    #    construction (that is its purpose: it is the input to a fan-out, not a console read).
    #  · `group_executive` is also excluded, deliberately. An exec CAN see all of this through
    #    `read`/`compliance`, which is the console path with the in-app narrowing and the audit trail
    #    attached; these two are ops POLLING surfaces and keeping them admin-only means a
    #    high-frequency automated poll never runs under a human oversight grant.
    #  · `notLow` matters more here than almost anywhere else in this file: these are the routes a
    #    chat-surface principal could most plausibly reach, and a tenant-wide miss list is exactly
    #    the "person-grain data outside your line" §8 hard rule 3 forbids.
    - actions: ["pending_reminders", "missed_by_unit"]
      effect: EFFECT_ALLOW
      derivedRoles: ["company_admin"]
      condition: { match: { expr: "variables.inTenant && variables.notLow" } }

    # ══════════ HIER-2 rollout batch 3 — permission arm (IAM-04-ROLLOUT-B12 pattern; Pattern-B ══════
    # mitigation per docs/superpowers/plans/2026-08-10-iam-04-rollout-scan.md §3). Purely additive;
    # every rule above is byte-unchanged. `submit`/`read` are self-scoped-ONLY mirrors (mitigation 3:
    # never build an unconditional mirror for a Pattern-B action) — each rule re-applies the IDENTICAL
    # `subjectUserId == principal.id` self-check the role-arm's own `member` self-rules use above, so
    # `permission-arm-hazard-scan.test.ts`'s regression guard finds the self-check present.
    # `excuse`/`pending_reminders`/`missed_by_unit` have no self path and no team_lead mixing, so each
    # gets one plain unconditional rule — one action, one role, per the pm_task pilot's own rule.
    - actions: ["submit"]
      effect: EFFECT_ALLOW
      derivedRoles: ["perm_checkin_submit_self"]
      condition:
        match:
          expr: >-
            variables.inTenant && variables.notLow &&
            has(request.resource.attr.subjectUserId) &&
            request.resource.attr.subjectUserId == request.principal.id

    - actions: ["read"]
      effect: EFFECT_ALLOW
      derivedRoles: ["perm_checkin_read_self"]
      condition:
        match:
          expr: >-
            variables.inTenant && variables.notLow &&
            has(request.resource.attr.subjectUserId) &&
            request.resource.attr.subjectUserId == request.principal.id

    - actions: ["excuse"]
      effect: EFFECT_ALLOW
      derivedRoles: ["perm_checkin_excuse"]
      condition: { match: { expr: "variables.inTenant && variables.notLow && variables.inRoot" } }

    - actions: ["pending_reminders"]
      effect: EFFECT_ALLOW
      derivedRoles: ["perm_checkin_pending_reminders"]
      condition: { match: { expr: "variables.inTenant && variables.notLow && variables.inRoot" } }

    - actions: ["missed_by_unit"]
      effect: EFFECT_ALLOW
      derivedRoles: ["perm_checkin_missed_by_unit"]
      condition: { match: { expr: "variables.inTenant && variables.notLow && variables.inRoot" } }
