# Search-marketing module (SM-03; docs/blueprints/seo-sem-design.md §11). resource_search_property
# = the client web property (crawl/rank/GEO/analytics anchor). Every search handler passes
# resource.attr = {module: "search", tenantId: <SERVED company>, ...} (SearchController), so a
# materialized (search_staff|search_manager, company, <served>) grant lights up ONLY that served
# company's search surface — same WSD-2 module_staff/module_manager linchpin as hr_case/hr_record.
# No dedicated `search:property:*` permission exists (design §11's permission list bundles property
# CRUD under `search:engagement:read|write`, matching the controller's shared authorize() call) —
# Cerbos itself only ever sees the resource kind + action + derived role, so that bundling is purely
# a module-registry/UI concern and does not change this policy's shape.
#
# SM-76 (docs/plans/2026-08-23-seo-audit-capability.md §6/§3.5) adds `attest`: recording a
# provenance-stamped property fact (search_property_facts) that a dependent security check can
# resolve from on a LATER run — e.g. an attested `wp.salts_unique_confirmed` fact can flip
# `security.wp_salts` from "not verified" to passing. SENSITIVE and elevated-only (grouped with
# `delete` below), same tier as monitoring's `maintenance.create`/`channel.manage`: an attested fact
# is an accountability record, not a routine property edit, and requires `recorded_by` (app-enforced).
#
# M5-V3-f (docs/plans/2026-10-12-m5-phase5-design.md §4.8, §6.3, O5) adds two SENSITIVE actions on this
# same kind, both personal data of identified website visitors (consented visitor profiles, V3; our own
# sampled session replay, V6):
#   read_visitors  list / read visitor profiles, timelines, interests, scores and the visitor-ingest status
#   view_replay    open a session recording (a separate action: a recording is more intrusive than a profile)
# Role arm: search manager (`module_manager`) and the served company's admin, in tenant, and nobody else.
# Plain `module_staff` keeps aggregate `read` only. They are NOT in the baseline rule above on purpose, and
# NOT granted to any member/client/webdev role. Perm arm: one mirror per action, each keyed on its own
# permission (search.property.read_visitors / search.property.view_replay), so holding one grants exactly
# that one action: neither implies the other, and neither is implied by `read`. The kind's usual root gate
# applies to the mirrors. `owner` reaches both through its role bundle (company_admin's set) via the mirror.
# Deploy: a Cerbos restart (nothing hot-reloads) and a probe (staff denied, manager allowed) at release.
apiVersion: api.cerbos.dev/v1
resourcePolicy:
  version: default
  resource: resource_search_property
  importDerivedRoles: ["gaiada_scopes"]
  variables:
    import: ["gaiada_common"]
  rules:
    - actions: ["*"]
      effect: EFFECT_ALLOW
      derivedRoles: ["platform_admin"]
    # Search staff / manager (served-company grant) + the served company's own admin: baseline set.
    # NOT attest (elevated below, SM-76).
    - actions: ["read", "create", "update"]
      effect: EFFECT_ALLOW
      derivedRoles: ["module_staff", "module_manager", "company_admin"]
      condition: { match: { expr: "variables.inTenant && variables.notLow" } }
    # Destructive + attest: manager + company admin only (NOT plain staff/member).
    - actions: ["delete", "attest"]
      effect: EFFECT_ALLOW
      derivedRoles: ["module_manager", "company_admin"]
      condition: { match: { expr: "variables.inTenant && variables.notLow" } }
    # M5-V3-f: visitor profiles + session replay. Search manager + company admin ONLY (NOT module_staff).
    - actions: ["read_visitors", "view_replay"]
      effect: EFFECT_ALLOW
      derivedRoles: ["module_manager", "company_admin"]
      condition: { match: { expr: "variables.inTenant && variables.notLow" } }

    # =========== IAM-04-ROLLOUT-B12 -- permission-matching arm. PURELY ADDITIVE: every rule =====
    # above is byte-for-byte unchanged. Generic global-or-company mirror per action (see this
    # kind's entry in docs/superpowers/plans/2026-08-10-iam-04-rollout-b12-report.md for the
    # per-kind safety argument). Any group_executive-only or platform_admin wildcard rule on this
    # kind is deliberately NOT mirrored here (IAM-04c: the tier bypass never enters the permission
    # catalog).

    - actions: ["read"]
      effect: EFFECT_ALLOW
      derivedRoles: ["perm_resource_search_property_read"]
      condition: { match: { expr: "variables.inTenant && variables.notLow && variables.inRoot" } }
    - actions: ["create"]
      effect: EFFECT_ALLOW
      derivedRoles: ["perm_resource_search_property_create"]
      condition: { match: { expr: "variables.inTenant && variables.notLow && variables.inRoot" } }
    - actions: ["update"]
      effect: EFFECT_ALLOW
      derivedRoles: ["perm_resource_search_property_update"]
      condition: { match: { expr: "variables.inTenant && variables.notLow && variables.inRoot" } }
    - actions: ["delete"]
      effect: EFFECT_ALLOW
      derivedRoles: ["perm_resource_search_property_delete"]
      condition: { match: { expr: "variables.inTenant && variables.notLow && variables.inRoot" } }
    - actions: ["attest"]
      effect: EFFECT_ALLOW
      derivedRoles: ["perm_resource_search_property_attest"]
      condition: { match: { expr: "variables.inTenant && variables.notLow && variables.inRoot" } }
    # M5-V3-f: one mirror per action, each on its own key; neither bleeds into the other or into `read`.
    - actions: ["read_visitors"]
      effect: EFFECT_ALLOW
      derivedRoles: ["perm_resource_search_property_read_visitors"]
      condition: { match: { expr: "variables.inTenant && variables.notLow && variables.inRoot" } }
    - actions: ["view_replay"]
      effect: EFFECT_ALLOW
      derivedRoles: ["perm_resource_search_property_view_replay"]
      condition: { match: { expr: "variables.inTenant && variables.notLow && variables.inRoot" } }
