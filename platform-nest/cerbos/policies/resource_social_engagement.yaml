# SMM-30 (docs/blueprints/smm-design.md §11, as amended by smm-design-addendum-2026-08-12.md) —
# authz for the `social_engagement` kind. Nothing existed for any social_* kind before this file;
# an unlisted kind/action is a SILENT DENY that reads exactly like a logic bug (standing estate
# trap). Restart `gaiada-test-cerbos` after editing — the bind-mount does not hot-reload, and a
# HEALTHY Cerbos container has served two-day-stale policy.
#
# social_engagement = the outcome-tracked client engagement (0105), carrying `tool_scope` (which
# networks, cadence, inbox SLA, AI toggles) and `usage_budget_usd`. Handlers pass
# resource.attr = {kind:"social_engagement", tenantId, module:"social", id?} — the same shape the
# webdev/search kinds use. The brand-voice profile is configuration OF an engagement's client and
# rides `update` rather than earning its own kind (design §11's own grouping).
#
# ── ACTIONS ──────────────────────────────────────────────────────────────────────────────────────
#   read      — list/detail, the console's engagement surface.
#   create/update/delete — ordinary CRUD on the engagement + its brand-voice config.
#   set_scope — write `tool_scope`/`usage_budget_usd`. ITS OWN ACTION, deliberately not folded into
#               `update`: the scope is what decides which networks may publish, whether AI drafting
#               is on, and how much metered spend is allowed before the stop-loss refuses. It is the
#               money-and-blast-radius dial, and it must be revocable without revoking the ability
#               to rename an engagement. Mirrors search.engagement.set_scope exactly.
#
# ── THE INVARIANT THIS FILE MUST NOT BREAK ───────────────────────────────────────────────────────
# The `client` derived role appears NOWHERE in this policy or in ANY social_* policy except the
# client-review seam (which lives on `resource_portal.yaml`'s own `approve_post` action, not here).
# A client principal must DENY on every action in this file. Client-facing post approval is a
# portal action on a portal resource; it is never a grant on the staff-side social kinds.
#
# ── TRAP #4 (repeated verbatim from resource_webdev_provisioned_site.yaml) ───────────────────────
# `group_executive` is a GLOBAL cross-company grant (`scopeType == "global"`). `variables.inTenant`
# is `resource.tenantId in principal.companies`, built exclusively from the caller's
# `company_memberships` rows — so an owner holding the global grant but with NO membership row in a
# given company has a non-matching `companies` set and `inTenant` is FALSE there. Folding the exec
# into the company_admin/manager rule below would produce a global grant that never fires for
# exactly the case it exists to cover. `notLow` still applies — a low-assurance session gets
# nothing, owner or not.
#
# ── NO PERMISSION ARM YET (deliberate, SMM-30) ──────────────────────────────────────────────────
# No `perm_social_*` derived-role mirror is shipped with this file. Role names — not permissions —
# still decide every live authorization (PERMISSION-CONTRACT.md §7), the IAM-04 rollout stands at
# 28 of 60 kinds with batches dissolved or unstarted, and §2/§9 of that contract record an
# UNRESOLVED hazard: the mirror does not exclude `platform_admin`/`group_executive`, and the
# detector's blind spot is awaiting an architect decision. Mirroring 8 brand-new kinds ahead of
# that decision would widen precisely the surface that is flagged open. These kinds join the
# rollout register as a deliberate batch once it is settled; the catalog entries land now, so
# nothing blocks that later step.
apiVersion: api.cerbos.dev/v1
resourcePolicy:
  version: default
  resource: social_engagement
  importDerivedRoles: ["gaiada_scopes"]
  variables:
    import: ["gaiada_common"]
  rules:
    - actions: ["*"]
      effect: EFFECT_ALLOW
      derivedRoles: ["platform_admin"]
    # group_executive — see TRAP #4. Gated on `notLow` ONLY, never `inTenant`. Read-only: an exec
    # oversees engagements across companies; they do not set another department's spend dial.
    - actions: ["read"]
      effect: EFFECT_ALLOW
      derivedRoles: ["group_executive"]
      condition: { match: { expr: "variables.notLow" } }
    - actions: ["read", "create", "update", "delete", "set_scope"]
      effect: EFFECT_ALLOW
      derivedRoles: ["company_admin", "manager"]
      condition: { match: { expr: "variables.inTenant && variables.notLow" } }
    # ORG-6 module tiers, string-composed from resource.attr.module ("social") — so the concrete
    # role names Cerbos needs are `social_manager` / `social_staff`, seeded by migration 0106.
    # The SMM department's own manager runs their engagements including the scope dial; their staff
    # read. Setting scope is a manager act for the same reason provisioning is in webdev: it decides
    # what the department is allowed to spend and publish.
    - actions: ["read", "create", "update", "delete", "set_scope"]
      effect: EFFECT_ALLOW
      derivedRoles: ["module_manager"]
      condition: { match: { expr: "variables.inTenant && variables.notLow" } }
    - actions: ["read"]
      effect: EFFECT_ALLOW
      derivedRoles: ["module_staff"]
      condition: { match: { expr: "variables.inTenant && variables.notLow" } }
