apiVersion: api.cerbos.dev/v1
resourcePolicy:
  version: default
  resource: pm_task
  importDerivedRoles: ["gaiada_scopes"]
  variables:
    import: ["gaiada_common"]
  rules:
    # MON-00c split: platform_admin is the SaaS operator tier and keeps unconditional cross-root
    # reach on purpose — that is the operator's job, not a leak (docs/plans/2026-08-20-monitoring-
    # gated-rulings.md §1.3). group_executive is root-bounded instead: cross-company within its OWN
    # root only, via `variables.inRoot`.
    - actions: ["*"]
      effect: EFFECT_ALLOW
      derivedRoles: ["platform_admin"]
    - actions: ["read", "update"]
      effect: EFFECT_ALLOW
      derivedRoles: ["company_admin", "manager", "member", "viewer"]
      condition: { match: { expr: "variables.inTenant && variables.notLow" } }
    # ── RAISING A TASK IS NOT A MANAGEMENT ACTION (2026-08-24, owner-accepted) ────────────────────
    # `create` used to sit in the same rule as `delete`/`manage`, so only the 5 department leads who
    # hold `manager` could raise a PM task at all — 14 of 19 staff could not file work against the
    # board their own department runs on. The general `/tasks` surface let them create a CORE task
    # instead, which is a dead end: that endpoint takes only title + customFields, fires no
    # notification, and has no PATCH at all, so the task could never be assigned, scheduled or
    # updated afterwards.
    #
    # `create` is therefore split out and opened to `member`. `delete` and `manage` are UNCHANGED and
    # stay leads/admins — and `manage` is the load-bearing half: it is what gates every ownership
    # change on PATCH and every tracker-suggestion confirm.
    #
    # ⚠ THE SPLIT ALONE IS NOT THE WHOLE GRANT. `createTask` authorizes `create` and then applies the
    # payload's `assignee` verbatim, so opening `create` would also have meant "any employee may
    # assign work to any colleague" — a different decision from "any employee may raise a task", and
    # not the one that was made. `pm.controller.ts`'s create handler now demands `manage` when the
    # payload names a responsible other than the caller, mirroring the ownership-change check the
    # PATCH path in that same file has always applied. Do not open `create` in some other surface
    # without carrying that guard with it.
    - actions: ["create"]
      effect: EFFECT_ALLOW
      derivedRoles: ["company_admin", "manager", "member"]
      condition: { match: { expr: "variables.inTenant && variables.notLow" } }
    # Management actions (delete + assignee/meta changes + suggestion confirm) — leads/admins.
    - actions: ["delete", "manage"]
      effect: EFFECT_ALLOW
      derivedRoles: ["company_admin", "manager"]
      condition: { match: { expr: "variables.inTenant && variables.notLow" } }
    # ══════════ IAM-04b — permission-matching arm (dual-match pilot). PURELY ADDITIVE: every ══════
    # rule above is byte-for-byte unchanged. Each action gets its OWN rule + its OWN permission-
    # derived-role (derived_roles.yaml's IAM-04a section) rather than being folded into the rules
    # above, because a single combined rule can't tell "holds pm.task.read" apart from "holds
    # pm.task.update" — a principal with only one of the two must never ride the other through here.
    # Safe to add without any self/instance-condition caveat (unlike hr_case): every role listed in
    # the rules above reaches these five actions under the IDENTICAL `inTenant && notLow` condition,
    # with no resource-instance carve-out anywhere in this file, so there is no role whose reach is
    # narrower than "holds the permission" for pm_task specifically.
    - actions: ["read"]
      effect: EFFECT_ALLOW
      derivedRoles: ["perm_pm_task_read"]
      condition: { match: { expr: "variables.inTenant && variables.notLow && variables.inRoot" } }
    - actions: ["update"]
      effect: EFFECT_ALLOW
      derivedRoles: ["perm_pm_task_update"]
      condition: { match: { expr: "variables.inTenant && variables.notLow && variables.inRoot" } }
    - actions: ["create"]
      effect: EFFECT_ALLOW
      derivedRoles: ["perm_pm_task_create"]
      condition: { match: { expr: "variables.inTenant && variables.notLow && variables.inRoot" } }
    - actions: ["delete"]
      effect: EFFECT_ALLOW
      derivedRoles: ["perm_pm_task_delete"]
      condition: { match: { expr: "variables.inTenant && variables.notLow && variables.inRoot" } }
    - actions: ["manage"]
      effect: EFFECT_ALLOW
      derivedRoles: ["perm_pm_task_manage"]
      condition: { match: { expr: "variables.inTenant && variables.notLow && variables.inRoot" } }
