apiVersion: api.cerbos.dev/v1
resourcePolicy:
  version: default
  resource: pm_task
  importDerivedRoles: ["gaiada_scopes"]
  variables:
    import: ["gaiada_common"]
  rules:
    # MON-00c split: platform_admin is the SaaS operator tier and keeps unconditional cross-root
    # reach on purpose — that is the operator's job, not a leak (docs/plans/2026-08-20-monitoring-
    # gated-rulings.md §1.3). group_executive is root-bounded instead: cross-company within its OWN
    # root only, via `variables.inRoot`.
    - actions: ["*"]
      effect: EFFECT_ALLOW
      derivedRoles: ["platform_admin"]
    - actions: ["*"]
      effect: EFFECT_ALLOW
      derivedRoles: ["group_executive"]
      condition: { match: { expr: "variables.inRoot" } }
    # Read + execution updates (progress/status/subtasks/time/tracker-run) — any member.
    - actions: ["read", "update"]
      effect: EFFECT_ALLOW
      derivedRoles: ["company_admin", "manager", "member", "viewer"]
      condition: { match: { expr: "variables.inTenant && variables.notLow" } }
    # Management actions (create/delete + assignee/meta changes + suggestion confirm) — leads/admins.
    - actions: ["create", "delete", "manage"]
      effect: EFFECT_ALLOW
      derivedRoles: ["company_admin", "manager"]
      condition: { match: { expr: "variables.inTenant && variables.notLow" } }
    # ══════════ IAM-04b — permission-matching arm (dual-match pilot). PURELY ADDITIVE: every ══════
    # rule above is byte-for-byte unchanged. Each action gets its OWN rule + its OWN permission-
    # derived-role (derived_roles.yaml's IAM-04a section) rather than being folded into the rules
    # above, because a single combined rule can't tell "holds pm.task.read" apart from "holds
    # pm.task.update" — a principal with only one of the two must never ride the other through here.
    # Safe to add without any self/instance-condition caveat (unlike hr_case): every role listed in
    # the rules above reaches these five actions under the IDENTICAL `inTenant && notLow` condition,
    # with no resource-instance carve-out anywhere in this file, so there is no role whose reach is
    # narrower than "holds the permission" for pm_task specifically.
    - actions: ["read"]
      effect: EFFECT_ALLOW
      derivedRoles: ["perm_pm_task_read"]
      condition: { match: { expr: "variables.inTenant && variables.notLow && variables.inRoot" } }
    - actions: ["update"]
      effect: EFFECT_ALLOW
      derivedRoles: ["perm_pm_task_update"]
      condition: { match: { expr: "variables.inTenant && variables.notLow && variables.inRoot" } }
    - actions: ["create"]
      effect: EFFECT_ALLOW
      derivedRoles: ["perm_pm_task_create"]
      condition: { match: { expr: "variables.inTenant && variables.notLow && variables.inRoot" } }
    - actions: ["delete"]
      effect: EFFECT_ALLOW
      derivedRoles: ["perm_pm_task_delete"]
      condition: { match: { expr: "variables.inTenant && variables.notLow && variables.inRoot" } }
    - actions: ["manage"]
      effect: EFFECT_ALLOW
      derivedRoles: ["perm_pm_task_manage"]
      condition: { match: { expr: "variables.inTenant && variables.notLow && variables.inRoot" } }
