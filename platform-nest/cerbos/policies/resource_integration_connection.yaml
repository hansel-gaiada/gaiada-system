# WSUX-14 (ex-P1-08) — F1 connections subsystem authz (locked decision #8).
#
# integration_connection = a person's (or a company's) link to an external provider (github|
# google_drive|claude) + the at-rest credential vault for it. Every handler passes
# resource.attr = {kind: "integration_connection", tenantId: <company>, id?, ownerId: <see below>}.
#
# Two tiers, per decision #8:
#   * SELF-SERVICE — a member manages THEIR OWN user-owned connection rows. The controller passes
#     ownerId = the row's owner_id ONLY when it is a user row; `owns` (gaiada_common:
#     resource.attr.ownerId == principal.id) then matches, so a plain member can read/create/update/
#     revoke their own link without any elevated role.
#   * COMPANY.MANAGE (manager+) — company-owned rows AND other people's user rows. For those the
#     controller passes ownerId = "" (a company id can never equal a user's principal.id, and other
#     users' ids never equal the caller's), so `owns` is false and only company_admin / manager /
#     group_executive (owner) / platform_admin qualify.
# tenant gate (inTenant) + assurance floor (notLow) apply on every non-admin rule. RLS + the
# controller's tenant-scoped row load are the independent second wall against a cross-tenant :id.
apiVersion: api.cerbos.dev/v1
resourcePolicy:
  version: default
  resource: integration_connection
  importDerivedRoles: ["gaiada_scopes"]
  variables:
    import: ["gaiada_common"]
  rules:
    - actions: ["*"]
      effect: EFFECT_ALLOW
      derivedRoles: ["platform_admin"]
    - actions: ["read", "create", "update", "delete"]
      effect: EFFECT_ALLOW
      derivedRoles: ["company_admin", "manager"]
      condition: { match: { expr: "variables.inTenant && variables.notLow" } }

    # ══════════ IAM-14c (2026-08-23) — `manage`: the company tier as a NAMED action ══════════
    # The four actions above stay EXACTLY as they were — this is additive, and deliberately so: a
    # company_admin acting on their OWN row still authorizes `read`/`update`/etc. and still matches
    # the rule above. Nothing that worked stops working.
    #
    # What `manage` adds is a name for "administer ANY connection in this company", which the four
    # actions previously expressed only by NOT carrying `owns`. The controllers now authorize
    # `manage` when the target row is not the caller's own, which:
    #   · leaves company_admin/manager allowed (they hold `manage` on the role arm, below),
    #   · leaves member/viewer denied, exactly as before — they hold no `manage`,
    #   · and finally lets a PERMISSION-NATIVE role (`owner`) reach the company tier, which was the
    #     one real coverage gap left after IAM-14b did the self tier.
    - actions: ["manage"]
      effect: EFFECT_ALLOW
      derivedRoles: ["company_admin", "manager"]
      condition: { match: { expr: "variables.inTenant && variables.notLow" } }

    # The permission arm for `manage`. Safe to mirror UNCONDITIONALLY (no `owns`) precisely because
    # the key is new: member and viewer do not hold it, so there is no Pattern-B holder to over-grant.
    # That is the whole reason the split was worth an extra action rather than a wider mirror of the
    # existing four — see derived_roles.yaml's IAM-14c block.
    - actions: ["manage"]
      effect: EFFECT_ALLOW
      derivedRoles: ["perm_integration_connection_manage"]
      condition: { match: { expr: "variables.inTenant && variables.notLow" } }
    # Self-service: a member (or higher, incl. viewer with a live grant) fully manages their OWN
    # user-owned connection. Guarded by `owns` so it fails CLOSED if a handler omits ownerId — the
    # rule simply doesn't match rather than leaking. viewer included so a read-only staffer can still
    # link their own tools; the `owns` clause keeps it to strictly their own rows.
    - actions: ["read", "create", "update", "delete"]
      effect: EFFECT_ALLOW
      derivedRoles: ["member", "viewer"]
      condition:
        match:
          expr: "variables.inTenant && variables.notLow && variables.owns"

    # ══════════ IAM-14b (2026-08-22) — SELF-SCOPED permission arm, and ONLY that ══════════
    # Each rule carries `variables.owns`, so a permission holder reaches exactly their OWN connection
    # row — never anyone else's, never a company-owned one. That is what makes adding these safe on a
    # Pattern-B kind: they grant member/viewer nothing they did not already have through the role arm
    # above, while giving a PERMISSION-NATIVE role (`owner`, IAM-04c §3 — zero policy rules) its own
    # links instead of nothing at all.
    #
    # The unconditional company tier stays unmirrored on purpose — see derived_roles.yaml's IAM-14b
    # block for the measurement: member and viewer hold all four keys, so an unconditional mirror
    # would give a plain member the whole company's connections and credential vault.
    - actions: ["read"]
      effect: EFFECT_ALLOW
      derivedRoles: ["perm_integration_connection_read_self"]
      condition:
        match:
          expr: "variables.inTenant && variables.notLow && variables.owns"
    - actions: ["create"]
      effect: EFFECT_ALLOW
      derivedRoles: ["perm_integration_connection_create_self"]
      condition:
        match:
          expr: "variables.inTenant && variables.notLow && variables.owns"
    - actions: ["update"]
      effect: EFFECT_ALLOW
      derivedRoles: ["perm_integration_connection_update_self"]
      condition:
        match:
          expr: "variables.inTenant && variables.notLow && variables.owns"
    - actions: ["delete"]
      effect: EFFECT_ALLOW
      derivedRoles: ["perm_integration_connection_delete_self"]
      condition:
        match:
          expr: "variables.inTenant && variables.notLow && variables.owns"

    # ══════════ IAM-04-B5 (2026-08-12) — why the COMPANY tier is still unmirrored ══════════
    # (Superseded in part by IAM-14b above, which added the SELF-scoped half. The reasoning below
    # is why the unconditional half remains absent, and it is unchanged.)
    # EVERY one of this kind's four actions (read/create/update/delete) is Pattern-B: the
    # member/viewer self-scoped `owns` rule immediately above coexists with the company_admin/
    # manager unconditional rule above it on the SAME four actions — there is no action left that is
    # "just" a plain company-scoped mirror. Building the unconditional half alone (mirroring
    # company_admin/manager's reach, skipping only the self-scoped companion) is not a safe partial
    # mirror: it is the exact over-grant Pattern B exists to catch (any permission holder — including
    # one who only ever held the key via the self-scoped grant's own bundled reach — would gain
    # UNCONDITIONAL access), and permission-arm-hazard-scan.test.ts's PART 3 guard enforces this
    # structurally. Self-scope mirroring itself (the mitigation hr_case/checkin already use
    # elsewhere) is an explicitly deferred hazard class for this ticket, per its own brief — not
    # invented here. group_executive's own notLow-only rule above is also left alone, unchanged
    # (Hazard 2: mirroring it would hand a company-scoped permission holder cross-tenant reach the
    # role arm never gave them). Net: this kind gets zero new rules this ticket. See
    # docs/superpowers/plans/2026-08-12-iam-04-b5-report.md for the full account.
