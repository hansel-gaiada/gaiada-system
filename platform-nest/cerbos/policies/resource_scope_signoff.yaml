apiVersion: api.cerbos.dev/v1
resourcePolicy:
  version: default
  resource: scope_signoff
  importDerivedRoles: ["gaiada_scopes"]
  variables:
    import: ["gaiada_common"]
  rules:
    - actions: ["*"]
      effect: EFFECT_ALLOW
      derivedRoles: ["platform_admin"]
    # Recording a party's scope-agreement signature is a governance action. Staff record it now;
    # the client's own countersignature arrives via the portal BFF (WS11 build item 4).
    #
    # `manager` added 2026-08-03 on the owner's explicit ratification (D-2): the PM owns the engagement
    # and signs the agency half. Before this, `scope_signoff.create` was company_admin/exec only, which
    # is why the automation account `wf:scope` (manager) was correctly refused during the server walk —
    # that 403 was right policy, and this widening is a deliberate scope change, not a fix for it.
    #
    # Deliberately still NOT `member`/`team_lead`: signing a scope agreement commits the agency
    # commercially, and the whole point of the dual-sign is that a named accountable person does it.
    - actions: ["create"]
      effect: EFFECT_ALLOW
      derivedRoles: ["company_admin", "manager"]
      condition: { match: { expr: "variables.inTenant && variables.notLow" } }
    - actions: ["read"]
      effect: EFFECT_ALLOW
      derivedRoles: ["company_admin", "manager"]
      condition: { match: { expr: "variables.inTenant && variables.notLow" } }
    # ══════════ IAM-04-B4 — permission-matching arm. PURELY ADDITIVE: every rule above is byte-
    # for-byte unchanged. Mirrors ONLY the company_admin/manager `inTenant && notLow` reach above
    # (this kind never grants `member`, on purpose — see the header note on the dual-sign design).
    # `group_executive`'s own `variables.notLow`-only rules (IAM-TRAP4) are DELIBERATELY not
    # mirrored (IAM-04c: the cross-company owner tier never enters the permission catalog).
    - actions: ["create"]
      effect: EFFECT_ALLOW
      derivedRoles: ["perm_scope_signoff_create"]
      condition: { match: { expr: "variables.inTenant && variables.notLow && variables.inRoot" } }
    - actions: ["read"]
      effect: EFFECT_ALLOW
      derivedRoles: ["perm_scope_signoff_read"]
      condition: { match: { expr: "variables.inTenant && variables.notLow && variables.inRoot" } }
