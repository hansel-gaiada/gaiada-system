# ASST-21 — agent_run: the ADDITIVE, narrow carve-out for handoff-run transcript reads.
#
# Ticket: docs/superpowers/plans/2026-08-05-d14-and-assistant-tickets.md ("### ASST-21").
# Design: docs/blueprints/assistant-foundation.md §8's "agent roster" line.
#
# ── THE AUTHZ DESIGN PIN (binding — do not widen) ──────────────────────────────────────────────────
# Reading a full agent-run transcript is `isElevated`-only PLATFORM-WIDE, by design
# (`admin/intelligence.controller.ts`'s `GET :t/agents/runs/:runId`) — that gate is a CODE-LEVEL
# check (`admin/elevated.ts`'s `isElevated`), not a Cerbos policy, and THIS FILE DOES NOT TOUCH IT.
# The controller calls `isElevated(req)` FIRST, completely unchanged; ONLY when that is false does it
# fall through to a Cerbos check against THIS resource kind. So this policy can only ever ADD an allow
# path for a caller isElevated() already rejected — it structurally cannot regress the elevated-only
# rule for every other run, because that rule never reaches Cerbos at all.
#
# WHY the additive path is safe (the ticket's own binding argument, restated): a handoff run
# (`POST /api/:t/assistant/threads/:id/handoff`, `modules/assistant/handoffs.ts`) executes under the
# CHATTING USER's own OBO envelope — `broker.ts`'s `oboEnvelopeFor`, the ONE function in this codebase
# that can spell one. The transcript is therefore output fetched under the READER's OWN authority, not
# someone else's — reading it back is not an elevation, unlike a transcript from a run some OTHER
# user's authority produced (which is exactly what stays elevated-only, unconditionally, above).
#
# ── IAM-SEC-01 (2026-08-10) — added `variables.notLow`. OWNER-SIGHTED, THIS NARROWS ACCESS. ──────
# WHAT CHANGED: the `read` rule below now also requires `variables.notLow`
# (`request.principal.attr.assurance != "low"`), matching `resource_assistant_thread.yaml`'s floor.
# A low-assurance owner who could read their own handoff run before this change is now DENIED.
#
# WHY: this rule's own sensitivity argument above ("the transcript is ... output fetched under the
# READER's OWN authority") is IDENTICAL to `resource_assistant_thread.yaml`'s — a handoff run's
# transcript is exactly as sensitive as the owning thread's transcript, because it's read by the same
# owner over the same class of tenant-scoped tool output. That sibling file carries `notLow` (D4: "low-
# assurance chat sessions get NO company data") and this file omitted it. Cross-checked against the
# other two Cerbos kinds that also lack `notLow` (`resource_mcp_tool.yaml`, `resource_rollup.yaml`):
# both have their OWN, more precise assurance mechanism in its place (mcp_tool's own per-tool
# `minAssurance` rank check; rollup's role-only gate to `platform_admin`/`group_executive`, roles that
# in practice never carry `low`) and both document that substitution at length. This file has neither
# an alternative mechanism nor any discussion of assurance at all — the header above analyzes
# `isElevated`, `owns`, and `origin` in depth but never once mentions assurance. That asymmetry is the
# signature of an oversight in the original ASST-21 rule, not a considered exclusion, so it is closed
# here rather than left as unreviewed drift (IAM-01b-2's boundary review was about `agent_run`'s
# absence from the SUPERADMIN 215-permission catalog — a different question already resolved
# separately — and did not examine this rule's assurance floor).
#
# ── THE RULE ITSELF: owner AND origin, both required ──────────────────────────────────────────────
# `variables.owns` (`resource.attr.ownerId == principal.id`) is necessary but NOT sufficient on its
# own — it must also be a run this policy actually knows is a handoff (`resource.attr.origin ==
# "assistant_handoff"`), so this rule can never accidentally cover a DIFFERENT kind of owner-
# attributed run this platform might grow later (e.g. a directly-triggered elevated goal that happens
# to record the triggering admin as its "owner" for audit purposes — that is NOT a handoff and must
# stay elevated-only). `intelligence.controller.ts` only ever calls this check after confirming (via
# `assistant_handoffs`, ASST-21's own linking table) that the runId IS a handoff row — this condition
# is defence in depth against that lookup being wrong, not the sole gate.
#
# ── CRITICAL ENVIRONMENT TRAP (verified repeatedly this program — see resource_assistant_thread.yaml
#    for the fullest writeup) ─────────────────────────────────────────────────────────────────────────
#   1. THIS IS A NEW POLICY FILE (no `agent_run` kind existed before ASST-21) — NOT hot-reloaded over
#      the Windows bind mount even though `cerbos.yaml` sets `watchForChanges: true`. You MUST restart
#      the Cerbos container that serves the environment you're testing against after adding this file.
#   2. An UNLISTED resource `kind` is a SILENT DENY — every check against `agent_run` before the
#      restart returns deny, with no error, indistinguishable from "the rule is wrong". Before
#      trusting any DENY result below, prove the owner-ALLOW path actually returns ALLOW with a
#      `matchedPolicy` (see `cerbos-agent-run.test.ts`'s smoke check).
#   3. The container the test suite reaches is `gaiada-test-cerbos` (publishes :3592) — NOT
#      `gaiada-cerbos-1`. Restarting the wrong container changes nothing the tests can see. Prod is
#      unaffected: the deploy pipeline's Cerbos-restart step already restarts the real container on
#      every deploy.
#   4. IAM-SEC-01's `notLow` addition is an EDIT to this now-EXISTING file, not a new file — ASST-23
#      observed same-file edits hot-reload live over the bind mount, unlike item 1's brand-new-file
#      case. Restart `gaiada-test-cerbos` anyway before trusting any result below: the restart costs
#      nothing and this is a narrowing change, so a stale in-memory policy silently PASSING the old,
#      wider rule is the one failure mode that must not go unnoticed here.
apiVersion: api.cerbos.dev/v1
resourcePolicy:
  version: default
  resource: agent_run
  variables:
    import: ["gaiada_common"]
  rules:
    - actions: ["read"]
      effect: EFFECT_ALLOW
      roles: ["user"]
      condition:
        match:
          expr: >-
            variables.inTenant && variables.notLow && variables.owns &&
            request.resource.attr.origin == "assistant_handoff"
