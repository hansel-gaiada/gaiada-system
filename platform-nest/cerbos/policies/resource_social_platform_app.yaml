# SMM-30 — authz for the `social_platform_app` kind: OUR OWN approved developer-app fleet
# (`social_platform_apps`, 0105) — the Meta/TikTok/LinkedIn/X/YouTube app registrations that every
# tenant's connections ride on.
# Restart `gaiada-test-cerbos` after editing; the bind-mount does not hot-reload.
#
# ── THIS KIND IS NOT TENANT-SCOPED, AND THAT IS THE WHOLE POINT ─────────────────────────────────
# The underlying table has NO tenant_id and NO RLS (design D-4): one approved app serves every
# tenant on that network. So there is nothing for `inTenant` to compare against, and a rule gated on
# it would be either meaningless or accidentally false. Handlers pass
# resource.attr = {kind:"social_platform_app", module:"social"} with NO tenantId, and the reach is
# GLOBAL-ROLE-ONLY by construction:
#   * `platform_admin` — the wildcard, as everywhere, and since IAM-15 the ONLY reach on this kind.
# IAM-15 (D-7) removed the `group_executive` read rule that used to sit here. Nothing replaced it:
# there is deliberately no company-scoped tier on this kind (see below), so the fleet is now
# platform-only. That is a narrowing, and an intended one — the role was the last unrestricted
# cross-company business role, and this kind is exactly where "cross-company" had the widest blast
# radius.
# No company_admin rule, no manager rule, and no module tier: a company admin in one tenant must not
# be able to edit the app fleet that carries every OTHER tenant's connections. That is a
# cross-tenant blast radius wearing a per-tenant role name.
#
# ── ACTIONS ──────────────────────────────────────────────────────────────────────────────────────
#   read  — the fleet's state: which networks are approved, which reviews are pending or rejected,
#           which credentials expire when. This is what makes "why can't I connect this client's
#           TikTok?" answerable instead of mysterious.
#   admin — register an app, record a review outcome, rotate the credential ALIAS. Never the secret
#           itself: `credential_ref` points into env/OpenBao and the value is injected into the
#           contained publisher at deploy (design D-5). No action in this policy exposes a secret,
#           because no column holds one.
#
# ── NO PERMISSION ARM (IAM-04-B6, 2026-08-13) ───────────────────────────────────────────────────
# Considered and DEFERRED, not overlooked — a DIFFERENT reason than this module's other kinds:
# `admin` has no non-wildcard holder at all (platform_admin only), and `read` has only
# `group_executive` besides platform_admin — a group_executive-ONLY rule is never mirrored (IAM-04c
# / IAM-04-B4/B5 precedent: mirroring it would hand a company-scoped permission holder cross-tenant
# reach the role arm never gave them). There is no company_admin/manager/module-tier rule on this
# kind to mirror in the first place (deliberate — see "THIS KIND IS NOT TENANT-SCOPED" above), so
# there is nothing left after excluding the wildcard and the exec-only rule. Zero rules, by design.
apiVersion: api.cerbos.dev/v1
resourcePolicy:
  version: default
  resource: social_platform_app
  importDerivedRoles: ["gaiada_scopes"]
  variables:
    import: ["gaiada_common"]
  rules:
    - actions: ["*"]
      effect: EFFECT_ALLOW
      derivedRoles: ["platform_admin"]
