apiVersion: api.cerbos.dev/v1
# Chat group administration (action-agent Phase F). The bot's group-admin actions
# (remove/promote/rename/pin) authorize against this resource before touching WhatsApp/
# Telegram. Highest-risk: only company_admin (or platform_admin) — never plain members —
# and never a low-assurance chat identity (notLow).
resourcePolicy:
  version: default
  resource: chat_group
  importDerivedRoles: ["gaiada_scopes"]
  variables:
    import: ["gaiada_common"]
  rules:
    - actions: ["*"]
      effect: EFFECT_ALLOW
      derivedRoles: ["platform_admin"]
    - actions: ["remove_member", "promote_member", "set_subject", "pin", "add_member"]
      effect: EFFECT_ALLOW
      derivedRoles: ["company_admin"]
      condition: { match: { expr: "variables.inTenant && variables.notLow" } }

    # =========== IAM-04-ROLLOUT-B12 -- permission-matching arm. PURELY ADDITIVE: every rule =====
    # above is byte-for-byte unchanged. Generic global-or-company mirror per action (see this
    # kind's entry in docs/superpowers/plans/2026-08-10-iam-04-rollout-b12-report.md for the
    # per-kind safety argument). Any group_executive-only or platform_admin wildcard rule on this
    # kind is deliberately NOT mirrored here (IAM-04c: the tier bypass never enters the permission
    # catalog).

    - actions: ["remove_member"]
      effect: EFFECT_ALLOW
      derivedRoles: ["perm_chat_group_remove_member"]
      condition: { match: { expr: "variables.inTenant && variables.notLow && variables.inRoot" } }
    - actions: ["promote_member"]
      effect: EFFECT_ALLOW
      derivedRoles: ["perm_chat_group_promote_member"]
      condition: { match: { expr: "variables.inTenant && variables.notLow && variables.inRoot" } }
    - actions: ["set_subject"]
      effect: EFFECT_ALLOW
      derivedRoles: ["perm_chat_group_set_subject"]
      condition: { match: { expr: "variables.inTenant && variables.notLow && variables.inRoot" } }
    - actions: ["pin"]
      effect: EFFECT_ALLOW
      derivedRoles: ["perm_chat_group_pin"]
      condition: { match: { expr: "variables.inTenant && variables.notLow && variables.inRoot" } }
    - actions: ["add_member"]
      effect: EFFECT_ALLOW
      derivedRoles: ["perm_chat_group_add_member"]
      condition: { match: { expr: "variables.inTenant && variables.notLow && variables.inRoot" } }
