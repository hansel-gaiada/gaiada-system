tests:
  - name: writer on webdesk_content_item
    input:
      principals: [writer]
      resources: [w_draft, w_changes, w_review, w_review_by_editor, w_review_by_pub, w_review_by_cadmin, w_review_by_padmin, w_review_creator_unknown, w_approved, other_author_draft, w_other_collection, w_other_locale, t_draft_id, twin_of_approved, twin_of_live, twin_of_draft, w_other_site, w_site_unfed, w_other_tenant]
      actions: [read, create, update, request_publish, submit, comment, request_changes, seo_signoff, approve, assign, publish, schedule, unpublish, delete]
    expected:
      - principal: writer
        resource: w_draft
        actions: {read: EFFECT_ALLOW, create: EFFECT_ALLOW, update: EFFECT_ALLOW, submit: EFFECT_ALLOW, comment: EFFECT_ALLOW}
      - principal: writer
        resource: w_changes
        actions: {read: EFFECT_ALLOW, create: EFFECT_ALLOW, update: EFFECT_ALLOW, submit: EFFECT_ALLOW, comment: EFFECT_ALLOW}
      - principal: writer
        resource: w_review
        actions: {read: EFFECT_ALLOW, create: EFFECT_ALLOW, submit: EFFECT_ALLOW, comment: EFFECT_ALLOW}
      - principal: writer
        resource: w_review_by_editor
        actions: {read: EFFECT_ALLOW, create: EFFECT_ALLOW, submit: EFFECT_ALLOW, comment: EFFECT_ALLOW}
      - principal: writer
        resource: w_review_by_pub
        actions: {read: EFFECT_ALLOW, create: EFFECT_ALLOW, submit: EFFECT_ALLOW, comment: EFFECT_ALLOW}
      - principal: writer
        resource: w_review_by_cadmin
        actions: {read: EFFECT_ALLOW, create: EFFECT_ALLOW, submit: EFFECT_ALLOW, comment: EFFECT_ALLOW}
      - principal: writer
        resource: w_review_by_padmin
        actions: {read: EFFECT_ALLOW, create: EFFECT_ALLOW, submit: EFFECT_ALLOW, comment: EFFECT_ALLOW}
