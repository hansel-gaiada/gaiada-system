# M5-W1a — the writers' room Cerbos matrix (docs/plans/2026-10-11-m5-writers-room-design.md §2.1, §2.4, §9 W1a).
# Every principal below is asked every action on every resource; an action NOT listed under `expected` is an
# expected DENY (Cerbos' test semantics), so each block is the complete answer for that principal, negatives
# included. Run (from platform-nest/, Git Bash needs MSYS_NO_PATHCONV=1):
#   docker run --rm -v "$PWD/cerbos/policies:/policies:ro" -v "$PWD/cerbos/tests:/tests:ro" \
#     ghcr.io/cerbos/cerbos:0.54.0 compile --tests=/tests /policies
# Principals carry `grants[].editorialScopes` exactly as rbac/cerbos.ts::principalPayload() sends them; resources
# carry every attribute resourcePayload() sends, with its fail-closed default. The live twin of this file, through
# the real check() path, is src/rbac/webdesk-writers-room-cerbos.test.ts.
#
# Fixture key: site-1 is the granted site; w_* items are authored by u-writer; `creatorId` is the creator of
# the version under review (approve's maker); twin_of_* carry the SOURCE item's reviewState/published, as the
# BFF passes them for a translator's twin `create`.
