# M5-P4 (WSK-D92) - resource_search_property manage_tags: who may set a site's tracking tags (the LinkedIn partner id).
# Every principal is asked read, read_visitors and manage_tags on the served company's property and on another company's,
# each listed explicitly ALLOW or DENY. Same tier as read_visitors/view_replay: search manager + company admin, NOT plain
# search staff (who keep `read`, so they can SEE the value). Run on the Linux gate (from platform-nest/; Git Bash needs
# MSYS_NO_PATHCONV=1):
#   docker run --rm -v "$PWD/cerbos/policies:/policies:ro" -v "$PWD/cerbos/tests:/tests:ro" #     ghcr.io/cerbos/cerbos:0.54.0 compile --tests=/tests /policies
# NOTE: the ci.yml pipeline does not run `cerbos compile --tests`; the live twin that CI does run is
# src/rbac/search-manage-tags-cerbos.test.ts (needs CERBOS_URL).
name: SearchManageTags
description: M5-P4 manage_tags x principals x resources, with every negative case.
