# M5-W1q -- the media REVIEW matrix (WSK-D84, docs/plans/2026-10-11-m5-writers-room-design.md section 3.1 item 6 and Q2):
# who may accept or reject a freelance contributor's QUARANTINED upload (`webdesk_media_asset:review`), and the DENYs that
# hold for every principal: nobody reviews their own upload, an unknown uploader is refused, and a contributor, an automation and a
# bot never review. Every principal is asked `review` on every resource; an action NOT listed under `expected` is an expected DENY
# (Cerbos' test semantics), so each block is the complete answer for that principal, negatives included. Run (from platform-nest/):
#   cerbos compile --tests=cerbos/tests cerbos/policies          (sumopod: bash ~/cerbos-tests.sh <branch>)
# `creatorId` is the UPLOADER of the asset (WebDesk's created_by, loaded by the BFF from WebDesk's own row, never a body).
# Generated by hand-checked script (gen_media_review.py, deleted after use); the file is the source of truth.
