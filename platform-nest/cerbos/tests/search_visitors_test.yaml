# M5-V3-f - resource_search_property read_visitors + view_replay (docs/plans/2026-10-12-m5-phase5-design.md sections 4.8, 8, O5).
# Every principal is asked every action on every resource, and every action is listed explicitly, ALLOW or DENY, so each
# row is the complete answer for that principal, negatives included. Run on the Linux gate, not on the laptop (from
# platform-nest/; Git Bash needs MSYS_NO_PATHCONV=1):
#   docker run --rm -v "$PWD/cerbos/policies:/policies:ro" -v "$PWD/cerbos/tests:/tests:ro" \
#     ghcr.io/cerbos/cerbos:0.54.0 compile --tests=/tests /policies
# Principals carry grants/perms exactly as rbac/cerbos.ts::principalPayload() sends them. Fixture key: prop = company 1's
# property, module "search"; prop_t2 = company 2's; prop_nomodule / prop_webdev carry module "" / "webdev" (the role arm
# is module-mediated; company_admin and the permission arm are not). The live twin is
# src/rbac/search-visitor-actions-cerbos.test.ts.
