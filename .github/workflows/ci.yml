# CI for the gaiada-system components. NOTE: GitHub only runs workflows from the
# REPOSITORY ROOT — this activates when gaiada-system is pushed as its own repository
# (currently it lives inside a larger working folder with no gaiada remote).
# Until then, run the same checks locally: sh infra/scripts/test-all.sh
name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # platform-nest has its own job below (it needs Postgres + Cerbos to actually run its
        # suite). These run standalone; their DB-backed suites self-skip without a test DB.
        # report-renderer (TR-19): its auth-gate tests (incl. the token-less-request-\>401
        # acceptance check) run against the plain Express app and need no Postgres/Chromium —
        # `npm ci` here will attempt Playwright's own browser download, which is expected to
        # succeed on GitHub-hosted runners (network egress allowed) even though it's unverified
        # in this offline dev environment.
        project: [wa-chat-bot, mcp-hub, ai-agents, report-renderer]
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.project }}/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  # platform-nest (WS1 core) — its suite is meaningful only against live Postgres + Cerbos, so
  # it gets a dedicated job. The vitest harness (src/testing/setup.ts) DROP SCHEMAs + applies
  # migrations itself and repoints at a NOBYPASSRLS role, so CI only supplies a superuser test DB,
  # Cerbos, and Redis (event/relay suites self-skip without REDIS_URL).
  platform-nest:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: platform-nest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: platform-nest/package-lock.json
      # Cerbos runs as a step (not a service) so it can mount the checked-out policy repo.
      - name: Start Cerbos
        run: |
          docker run -d --name cerbos -p 3592:3592 \
            -v "$PWD/cerbos:/config:ro" -v "$PWD/cerbos/policies:/policies:ro" \
            ghcr.io/cerbos/cerbos:latest server --config=/config/cerbos.yaml
          for i in $(seq 1 30); do
            curl -fsS http://localhost:3592/_cerbos/health && break || sleep 1
          done
      - run: npm ci
      - run: npm run typecheck
      # A1: grep/AST-lite guard on the withTenants() tenant-scoping choke-point — fails if any
      # file outside the sanctioned reconciler/allowlist passes a multi-tenant or computed
      # (non-single-element) tenant array. See scripts/lint-withtenants.mjs for the rationale.
      - run: npm run lint:withtenants
      # Migration-backfill RLS lint (2026-07-30 audit): fails a NEW migration whose UPDATE /
      # DELETE / INSERT...SELECT touches a FORCE-RLS table without setting app.current_tenant_ids
      # first — the exact silent-zero-rows shape 0050_pm_short_codes.sql shipped with (fixed by
      # 0051). Pure static analysis, no DB needed, so it fails at authoring/PR time rather than
      # only showing up as bad data after a real deploy. See scripts/lint-migration-rls.mjs.
      - run: npm run lint:migration-rls
      - run: npm test
        env:
          DATABASE_URL_TEST: postgres://postgres:postgres@localhost:5432/postgres
          CERBOS_URL: http://localhost:3592
          REDIS_URL: redis://localhost:6379
          # The suites read REDIS_URL_TEST, not REDIS_URL (reports PDF-export/print-token, HR
          # WSD-7, org14 preflight, service-assignments, the work-activity dead-letter path).
          # tr29-reconciliation.db.test.ts has a preflight that FAILS rather than skips when it is
          # missing — its comment says it exists so nobody chases "18 misleading failures" again —
          # so CI was walking into exactly the wall that preflight was written to prevent.
          REDIS_URL_TEST: redis://localhost:6379

  # ai-gateway is the Go service (ai-gateway-go/); it replaced the retired Node gateway.
  gateway-go:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-gateway-go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.4" # now has go.sum (WS9 OTel deps); setup-go caches on it
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...

  # sync-engine-go (WS1 T2 cross-site reconciliation). Runs the FULL suite incl. the DB-backed
  # convergence/chaos tests, against two databases with the platform-nest migrations applied and
  # a NOBYPASSRLS role (superusers bypass RLS and would test nothing).
  sync-engine-go:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: sync-engine-go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.4"
      - name: Install psql client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Provision two DBs + NOBYPASSRLS role + migrations
        env:
          PGPASSWORD: postgres
        run: |
          for dbname in gaiada_sync_test gaiada_sync_central; do
            psql -h localhost -U postgres -c "CREATE DATABASE $dbname;"
            for f in $(ls ../platform-nest/migrations/*.sql | sort); do
              psql -h localhost -U postgres -d "$dbname" -v ON_ERROR_STOP=1 -f "$f" >/dev/null
            done
            psql -h localhost -U postgres -d "$dbname" -c "DO \$\$ BEGIN CREATE ROLE sync_app LOGIN PASSWORD 'test' NOSUPERUSER NOBYPASSRLS; EXCEPTION WHEN duplicate_object THEN NULL; END \$\$; GRANT USAGE ON SCHEMA public TO sync_app; GRANT SELECT,INSERT,UPDATE,DELETE ON ALL TABLES IN SCHEMA public TO sync_app;"
          done
      - run: go build ./...
      - run: go vet ./...
      - name: go test (full suite incl. convergence/chaos)
        env:
          DATABASE_URL_TEST: postgres://sync_app:test@localhost:5432/gaiada_sync_test
          DATABASE_URL_CENTRAL: postgres://sync_app:test@localhost:5432/gaiada_sync_central
          DATABASE_URL_SITE_A: postgres://sync_app:test@localhost:5432/gaiada_sync_test
        run: go test ./...

  # P3-12: platform-ui build gate. `tsc` + vitest alone once passed while `next build` broke
  # (a `server-only` import reached a client component) and routes 500'd — `npm run build` here
  # is the actual gate for that class of bug. DEMO_MODE=1 so no backend is needed (demoFixtures).
  # The optional Playwright smoke check runs against that same build (`next start`, not
  # `next dev` — see platform-ui/playwright.config.ts) so it exercises the real build artifact.
  platform-ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform-ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: platform-ui/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          DEMO_MODE: "1"
      - name: Install Playwright browser (smoke only)
        run: npx playwright install chromium --with-deps
      - name: Smoke e2e against the built app
        run: npx playwright test --project=smoke --grep @smoke
        env:
          DEMO_MODE: "1"
          # src/lib/session.ts throws when this is unset, so the Playwright webServer never
          # booted and every test failed as a waitForURL timeout. CI-only dummy value.
          SESSION_SECRET: ci-smoke-secret-not-a-real-key

  # WS9 observability config-lint: promtool (rules + scrape), amtool (alertmanager, env-rendered),
  # and a YAML/JSON parse fallback. otelcol validate is skipped in CI (large binary); the collector
  # config is YAML-parsed here and otelcol-validated on a Docker host before deploy.
  observability-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install promtool + amtool
        run: |
          curl -fsSL https://github.com/prometheus/prometheus/releases/download/v3.1.0/prometheus-3.1.0.linux-amd64.tar.gz \
            | sudo tar xz -C /usr/local/bin --strip-components=1 prometheus-3.1.0.linux-amd64/promtool
          curl -fsSL https://github.com/prometheus/alertmanager/releases/download/v0.28.0/alertmanager-0.28.0.linux-amd64.tar.gz \
            | sudo tar xz -C /usr/local/bin --strip-components=1 alertmanager-0.28.0.linux-amd64/amtool
      - name: Install pyyaml + gettext (envsubst)
        run: pip3 install pyyaml && sudo apt-get update && sudo apt-get install -y gettext-base
      - run: sh infra/scripts/lint-observability.sh
