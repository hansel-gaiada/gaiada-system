# CI for the gaiada-system components. NOTE: GitHub only runs workflows from the
# REPOSITORY ROOT — this activates when gaiada-system is pushed as its own repository
# (currently it lives inside a larger working folder with no gaiada remote).
# Until then, run the same checks locally: sh infra/scripts/test-all.sh
name: ci

# ── COST CONTROL (2026-08-04) ─────────────────────────────────────────────────────────────────────
# This repo is PRIVATE, so every minute here is metered against the account's free allowance, and that
# allowance ran out — every job started failing with "spending limit needs to be increased". The owner's
# decision is to stay on the free tier, so this workflow has to stop wasting minutes. Three changes,
# cheapest first:
#
#   1. `paths-ignore` — a docs-only commit used to run all NINE jobs. Several commits on 2026-08-04
#      (CHANGELOG, blueprints, a runbook) did exactly that: ~20 minutes of compute to typecheck code
#      nobody had touched. Markdown and PDFs cannot break a build.
#   2. `push` narrowed to `main` — before this, a push to a feature branch ran the suite, and opening a
#      PR from it ran the SAME commit again. Now branch work is verified once, via its PR.
#   3. `concurrency` with `cancel-in-progress` — pushing three times in ten minutes used to run three
#      full suites to completion. Only the newest commit's result matters; the older two are cancelled.
#
# What is deliberately NOT done: per-component path filters (only run `gateway-go` when Go files
# change). That is the biggest remaining saving, and it is also how a cross-component break gets
# through — a change to a shared contract that only touches one folder still needs the other suites.
# Left as a decision for whoever measures the minutes again.
# ── AUTOMATIC CI RESTORED (2026-08-05, MAIL-21) ───────────────────────────────────────────────────
# The repo was made PUBLIC (2026-08-04), so Actions minutes are free and the billing wall that
# forced on-demand-only CI (below, kept for history) no longer applies. Verified before flipping
# this back on: ci.yml reads ZERO `secrets.*` anywhere in this file — a public repo's fork PRs
# reaching `pull_request` therefore have nothing sensitive to exfiltrate, and GitHub's own
# first-time-contributor approval gate (platform default on public, non-org repos; cannot be
# loosened per-repo without an org) still stands between an unknown fork and a runner.
#
# Restored exactly as pre-cost-tuned: main-only push, docs-paths ignored, superseded runs
# cancelled (see `concurrency` below) — nothing about the cost-control shape changed, only that
# it now also runs itself instead of requiring `gh workflow run ci.yml` by hand.
#
# ── history: ON-DEMAND ONLY (2026-08-04, owner decision, repo was PRIVATE) ────────────────────────
# The free Actions allowance was exhausted while the repo was private, so CI stopped running
# itself and fell back to `workflow_dispatch` — minutes spent only when asked for. That constraint
# is gone now that the repo is public; the workflow_dispatch entry point stays for manual runs
# (e.g. pre-merge checks on a branch that doesn't touch `main` yet).
on:
  workflow_dispatch:
    inputs:
      reason:
        description: "Why this run (shows in the run list — e.g. 'pre-merge check for CP-21')"
        required: false
        type: string
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "**/*.pdf"
      - "docs/**"
      - "legal/**"
      - "design/**"
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "**/*.pdf"
      - "docs/**"
      - "legal/**"
      - "design/**"

# Supersede in-flight runs of the same ref. NOT applied to deploy.yml, which sets
# `cancel-in-progress: false` on purpose — a half-applied migration is worse than a queued deploy.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # platform-nest has its own job below (it needs Postgres + Cerbos to actually run its
        # suite). These run standalone; their DB-backed suites self-skip without a test DB.
        # report-renderer (TR-19): its auth-gate tests (incl. the token-less-request-\>401
        # acceptance check) run against the plain Express app and need no Postgres/Chromium —
        # `npm ci` here will attempt Playwright's own browser download, which is expected to
        # succeed on GitHub-hosted runners (network egress allowed) even though it's unverified
        # in this offline dev environment.
        project: [wa-chat-bot, mcp-hub, ai-agents, report-renderer]
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.project }}/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  # platform-nest (WS1 core) — its suite is meaningful only against live Postgres + Cerbos, so
  # it gets a dedicated job. The vitest harness (src/testing/setup.ts) DROP SCHEMAs + applies
  # migrations itself and repoints at a NOBYPASSRLS role, so CI only supplies a superuser test DB,
  # Cerbos, and Redis (event/relay suites self-skip without REDIS_URL).
  platform-nest:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: platform-nest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: platform-nest/package-lock.json
      # Cerbos runs as a step (not a service) so it can mount the checked-out policy repo.
      - name: Start Cerbos
        run: |
          docker run -d --name cerbos -p 3592:3592 \
            -v "$PWD/cerbos:/config:ro" -v "$PWD/cerbos/policies:/policies:ro" \
            ghcr.io/cerbos/cerbos:0.54.0 server --config=/config/cerbos.yaml
          for i in $(seq 1 30); do
            curl -fsS http://localhost:3592/_cerbos/health && break || sleep 1
          done
      - run: npm ci
      - run: npm run typecheck
      # A1: grep/AST-lite guard on the withTenants() tenant-scoping choke-point — fails if any
      # file outside the sanctioned reconciler/allowlist passes a multi-tenant or computed
      # (non-single-element) tenant array. See scripts/lint-withtenants.mjs for the rationale.
      - run: npm run lint:withtenants
      # Migration-backfill RLS lint (2026-07-30 audit): fails a NEW migration whose UPDATE /
      # DELETE / INSERT...SELECT touches a FORCE-RLS table without setting app.current_tenant_ids
      # first — the exact silent-zero-rows shape 0050_pm_short_codes.sql shipped with (fixed by
      # 0051). Pure static analysis, no DB needed, so it fails at authoring/PR time rather than
      # only showing up as bad data after a real deploy. See scripts/lint-migration-rls.mjs.
      - run: npm run lint:migration-rls
      # 2026-08-19 — migration FILENAME lint. The sequential `NNNN_` scheme collided four times
      # (`0114`, `0117`, `0118`, plus the historic `0003`/`0018`) because this is a shared checkout
      # with concurrent sessions: two sessions that both `ls | sort | tail` in the same window both
      # see the same head and both take the next number. "Reserve it by creating the file first" was
      # tried and lost the race anyway — the reservation is not atomic and nothing arbitrates it.
      # The scheme is now CLOSED above 0118 in favour of UTC-minute timestamps, and this lint is what
      # makes that a gate rather than another convention in a README. See
      # platform-nest/migrations/README.md and scripts/lint-migration-names.mjs.
      - run: npm run lint:migration-names
      # SMM-05 — the AGPL containment line, as a build gate. smm-design.md §11 states it verbatim
      # ("lint-enforced zero Postiz deps in platform-nest"): the social publisher is reached over
      # HTTP+JSON from one adapter, and a single Postiz package or module import would put the
      # proprietary platform into the AGPL derivative-work conversation the whole design exists to
      # stay out of. Licensing boundary first, architecture second — not a reviewer's spot-check.
      - run: npm run lint:postiz-deps
      # MAIL-13 / design A13 — the inbound adversarial corpus as a NAMED, FAIL-FAST gate.
      #
      # A13 makes the committed corpus (platform-nest/src/mail/__fixtures__/inbound/) a permanent
      # regression suite, not dev scaffolding: "a live provider will never conveniently send forged
      # senders, replayed message-ids, oversized bodies, or hostile HTML on demand". `npm test` below
      # already runs it as part of the whole suite, so this step is deliberately redundant — it exists
      # so a corpus regression is legible as its own red step, fails BEFORE the 20-minute full suite,
      # and survives any future narrowing of `npm test`. Staging APPENDS real captured Brevo samples
      # here rather than replacing anything.
      - name: Mail inbound adversarial corpus (A13 — permanent regression gate)
        run: npm run test:mail-corpus
        env:
          DATABASE_URL_TEST: postgres://postgres:postgres@localhost:5432/postgres
          CERBOS_URL: http://localhost:3592
          # Distinct prefix so this step's per-file databases cannot collide with the full-suite step
          # that follows (src/testing/setup.ts derives the DB name from the test path, so two runs
          # against one Postgres would otherwise drop each other's schema mid-run).
          TEST_DB_PREFIX: mailcorpus
      # IAM-07b — promotes the wave-3 "Cerbos alignment audit" (previously a one-off manual run:
      # `cerbos compile` + a by-hand diff of the policy matrix against permission-catalog.json) into
      # a permanent, named, CI-enforced gate. Both files are STATIC (no DB, no live Cerbos PDP — pure
      # YAML/JSON parsing), so this step needs neither the Postgres nor the Cerbos container above;
      # it is redundant with the `npm test` step that follows (same two files run there too) by the
      # same deliberate design as the mail-corpus step immediately above: a chain-alignment
      # regression is legible as its own red step, fails fast (before the full suite), and survives
      # any future narrowing of `npm test`'s scope. See docs/superpowers/plans/2026-08-10-iam-07b-
      # report.md for the chain map this closes (links 1 and the catalog<->groups link).
      - name: IAM permission-contract chain alignment (IAM-07b — CI promotion of the wave-3 audit)
        run: npm run test:iam-chain-alignment
      - run: npm test
        env:
          DATABASE_URL_TEST: postgres://postgres:postgres@localhost:5432/postgres
          CERBOS_URL: http://localhost:3592
          REDIS_URL: redis://localhost:6379
          # REDIS_URL_TEST is the name every suite in the repo actually reads (18 files:
          # events/relay + consumer, collab, hr, service-assignments, the reports PDF-export
          # and TR-29 suites, ...). REDIS_URL alone is read by nothing under test, so the
          # redis service container above was running and being ignored, and the suites
          # skipped themselves — silently, until TR-29's preflight turned that skip into a
          # loud failure. Same URL, correct name; this is what un-skips them.
          REDIS_URL_TEST: redis://localhost:6379

  # ai-gateway is the Go service (ai-gateway-go/); it replaced the retired Node gateway.
  gateway-go:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-gateway-go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.4" # now has go.sum (WS9 OTel deps); setup-go caches on it
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...

  # sync-engine-go (WS1 T2 cross-site reconciliation). Runs the FULL suite incl. the DB-backed
  # convergence/chaos tests, against two databases with the platform-nest migrations applied and
  # a NOBYPASSRLS role (superusers bypass RLS and would test nothing).
  sync-engine-go:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: sync-engine-go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.4"
      - name: Install psql client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Provision two DBs + NOBYPASSRLS role + migrations
        env:
          PGPASSWORD: postgres
        run: |
          for dbname in gaiada_sync_test gaiada_sync_central; do
            psql -h localhost -U postgres -c "CREATE DATABASE $dbname;"
            for f in $(ls ../platform-nest/migrations/*.sql | sort); do
              psql -h localhost -U postgres -d "$dbname" -v ON_ERROR_STOP=1 -f "$f" >/dev/null
            done
            psql -h localhost -U postgres -d "$dbname" -c "DO \$\$ BEGIN CREATE ROLE sync_app LOGIN PASSWORD 'test' NOSUPERUSER NOBYPASSRLS; EXCEPTION WHEN duplicate_object THEN NULL; END \$\$; GRANT USAGE ON SCHEMA public TO sync_app; GRANT SELECT,INSERT,UPDATE,DELETE ON ALL TABLES IN SCHEMA public TO sync_app;"
          done
      - run: go build ./...
      - run: go vet ./...
      - name: go test (full suite incl. convergence/chaos)
        env:
          DATABASE_URL_TEST: postgres://sync_app:test@localhost:5432/gaiada_sync_test
          DATABASE_URL_CENTRAL: postgres://sync_app:test@localhost:5432/gaiada_sync_central
          DATABASE_URL_SITE_A: postgres://sync_app:test@localhost:5432/gaiada_sync_test
        run: go test ./...

  # P3-12: platform-ui build gate. `tsc` + vitest alone once passed while `next build` broke
  # (a `server-only` import reached a client component) and routes 500'd — `npm run build` here
  # is the actual gate for that class of bug. DEMO_MODE=1 so no backend is needed (demoFixtures).
  # The optional Playwright smoke check runs against that same build (`next start`, not
  # `next dev` — see platform-ui/playwright.config.ts) so it exercises the real build artifact.
  platform-ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform-ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: platform-ui/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          DEMO_MODE: "1"
      - name: Install Playwright browser (smoke only)
        run: npx playwright install chromium --with-deps
      - name: Smoke e2e against the built app
        run: npx playwright test --project=smoke --grep @smoke
        env:
          DEMO_MODE: "1"
          # src/lib/session.ts throws when this is unset, so the Playwright webServer never
          # booted and every test failed as a waitForURL timeout. CI-only dummy value.
          SESSION_SECRET: ci-smoke-secret-not-a-real-key

  # docs/MAP.md is GENERATED from the filesystem (scripts/gen-map.mjs) — the structural index:
  # components, compose services, module registry, migration head, the @Controller surface, UI
  # routes, workflow ids. Every hand-maintained orientation doc in this program has gone stale and
  # then misled someone (the 2026-07-09 root guide, archived in docs/history/, is the case in
  # point). This job is what makes staleness impossible rather than merely discouraged: add a
  # controller, a compose service or a migration without regenerating, and the build goes red.
  #
  # Cheapest job in the file — no npm ci, no services, one Node script over the checkout. Note the
  # workflow's `paths-ignore` means a docs-only commit skips it; that is correct, because the map
  # is derived from CODE, and code changes are exactly what this catches.
  # docs-map MOVED OUT of this workflow -> .github/workflows/docs-map.yml
  # It validated docs/MAP.md while this workflow's `paths-ignore` skips `docs/**` and
  # `**/*.md`, so the regenerated MAP that fixes the gate could never re-run it. The gate
  # was stuck red on main from Alpha 01.065.0141a until 2026-08-23 for that reason.
  # Do NOT move it back without also carving docs/MAP.md out of the filter above.

  # WS9 observability config-lint: promtool (rules + scrape), amtool (alertmanager, env-rendered),
  # and a YAML/JSON parse fallback. otelcol validate is skipped in CI (large binary); the collector
  # config is YAML-parsed here and otelcol-validated on a Docker host before deploy.
  observability-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install promtool + amtool
        run: |
          curl -fsSL https://github.com/prometheus/prometheus/releases/download/v3.1.0/prometheus-3.1.0.linux-amd64.tar.gz \
            | sudo tar xz -C /usr/local/bin --strip-components=1 prometheus-3.1.0.linux-amd64/promtool
          curl -fsSL https://github.com/prometheus/alertmanager/releases/download/v0.28.0/alertmanager-0.28.0.linux-amd64.tar.gz \
            | sudo tar xz -C /usr/local/bin --strip-components=1 alertmanager-0.28.0.linux-amd64/amtool
      - name: Install pyyaml + gettext (envsubst)
        run: pip3 install pyyaml && sudo apt-get update && sudo apt-get install -y gettext-base
      - run: sh infra/scripts/lint-observability.sh
