# CI for the gaiada-system components. NOTE: GitHub only runs workflows from the
# REPOSITORY ROOT — this activates when gaiada-system is pushed as its own repository
# (currently it lives inside a larger working folder with no gaiada remote).
# Until then, run the same checks locally: sh infra/scripts/test-all.sh
name: ci

# ── COST CONTROL (2026-08-04) ─────────────────────────────────────────────────────────────────────
# This repo is PRIVATE, so every minute here is metered against the account's free allowance, and that
# allowance ran out — every job started failing with "spending limit needs to be increased". The owner's
# decision is to stay on the free tier, so this workflow has to stop wasting minutes. Three changes,
# cheapest first:
#
#   1. `paths-ignore` — a docs-only commit used to run all NINE jobs. Several commits on 2026-08-04
#      (CHANGELOG, blueprints, a runbook) did exactly that: ~20 minutes of compute to typecheck code
#      nobody had touched. Markdown and PDFs cannot break a build.
#   2. `push` narrowed to `main` — before this, a push to a feature branch ran the suite, and opening a
#      PR from it ran the SAME commit again. Now branch work is verified once, via its PR.
#   3. `concurrency` with `cancel-in-progress` — pushing three times in ten minutes used to run three
#      full suites to completion. Only the newest commit's result matters; the older two are cancelled.
#
# What is deliberately NOT done: per-component path filters (only run `gateway-go` when Go files
# change). That is the biggest remaining saving, and it is also how a cross-component break gets
# through — a change to a shared contract that only touches one folder still needs the other suites.
# Left as a decision for whoever measures the minutes again.
# ── AUTOMATIC CI RESTORED (2026-08-05, MAIL-21) ───────────────────────────────────────────────────
# The repo was made PUBLIC (2026-08-04), so Actions minutes are free and the billing wall that
# forced on-demand-only CI (below, kept for history) no longer applies. Verified before flipping
# this back on: ci.yml reads ZERO `secrets.*` anywhere in this file — a public repo's fork PRs
# reaching `pull_request` therefore have nothing sensitive to exfiltrate, and GitHub's own
# first-time-contributor approval gate (platform default on public, non-org repos; cannot be
# loosened per-repo without an org) still stands between an unknown fork and a runner.
#
# Restored exactly as pre-cost-tuned: main-only push, docs-paths ignored, superseded runs
# cancelled (see `concurrency` below) — nothing about the cost-control shape changed, only that
# it now also runs itself instead of requiring `gh workflow run ci.yml` by hand.
#
# ── history: ON-DEMAND ONLY (2026-08-04, owner decision, repo was PRIVATE) ────────────────────────
# The free Actions allowance was exhausted while the repo was private, so CI stopped running
# itself and fell back to `workflow_dispatch` — minutes spent only when asked for. That constraint
# is gone now that the repo is public; the workflow_dispatch entry point stays for manual runs
# (e.g. pre-merge checks on a branch that doesn't touch `main` yet).
on:
  workflow_dispatch:
    inputs:
      reason:
        description: "Why this run (shows in the run list — e.g. 'pre-merge check for CP-21')"
        required: false
        type: string
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "**/*.pdf"
      - "docs/**"
      - "legal/**"
      - "design/**"
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "**/*.pdf"
      - "docs/**"
      - "legal/**"
      - "design/**"

# ── WSK-69 (2026-10-10, ruling WSK-D47) — RUN ONLY WHAT A CHANGE CAN AFFECT ─────────────────────
# The 2026-08 note above deliberately did NOT add per-component path filters, because a change to a
# shared contract that touches one folder still needs the other suites. That is solved here by
# making the dependency map EXPLICIT instead of absent: scripts/ci/config.mjs lists, per job group,
# the component's own directory PLUS every cross-component file its tests read (e.g. platform-ui
# reads platform-nest/cerbos; sync-engine-go applies platform-nest/migrations). The `plan` job
# below turns the diff into one boolean per group; jobs `needs: plan` and skip when theirs is false.
#
# What keeps this safe rather than merely fast:
#   * The diff base on `push` is the head of the LAST SUCCESSFUL ci run on main, not `github.event.before`.
#     With cancel-in-progress, `before` would silently drop the changes of a cancelled run; "last green"
#     cannot, because a cancelled or red run is never a base. So everything since the last fully
#     green commit is re-tested, and a red component stays red until it is fixed or re-run.
#   * A pull_request diffs against its own merge base (HEAD^1 of the merge commit).
#   * Anything uncertain (no base, base not in the clone, workflow_dispatch, a change to ci.yml or
#     scripts/ci/) runs EVERYTHING. A manual dispatch is therefore always a full run.
#   * version-gate stays unconditional on PRs; docs-map is its own workflow and is untouched.
#   * Skipped jobs are not billed. Tiny jobs that were each rounded UP to a billed minute are merged
#     (test, webdesk-light, nest-corpus-perf), with every step `if: !cancelled()` so one red step
#     neither hides nor aborts its neighbours.
# Unit tests for the planner: node --test scripts/ci/plan.test.mjs

# Supersede in-flight runs of the same ref. NOT applied to deploy.yml, which sets
# `cancel-in-progress: false` on purpose — a half-applied migration is worse than a queued deploy.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # WSK-69 — diff -> one boolean per job group. ~15s of real work (billed: 1 min).
  plan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read # list the last successful run (diff base)
    outputs:
      nest: ${{ steps.plan.outputs.nest }}
      ui: ${{ steps.plan.outputs.ui }}
      gateway: ${{ steps.plan.outputs.gateway }}
      sync: ${{ steps.plan.outputs.sync }}
      wa_chat_bot: ${{ steps.plan.outputs.wa_chat_bot }}
      mcp_hub: ${{ steps.plan.outputs.mcp_hub }}
      ai_agents: ${{ steps.plan.outputs.ai_agents }}
      report_renderer: ${{ steps.plan.outputs.report_renderer }}
      webdesk_root: ${{ steps.plan.outputs.webdesk_root }}
      webdesk_api: ${{ steps.plan.outputs.webdesk_api }}
      webdesk_blocks: ${{ steps.plan.outputs.webdesk_blocks }}
      webdesk_deploy: ${{ steps.plan.outputs.webdesk_deploy }}
      obs: ${{ steps.plan.outputs.obs }}
      any_test: ${{ steps.plan.outputs.any_test }}
      any_webdesk_light: ${{ steps.plan.outputs.any_webdesk_light }}
    steps:
      # Full history, no blobs: `git diff --name-only` between two commits only needs trees.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          case "$EVENT" in
            workflow_dispatch)
              node scripts/ci/plan.mjs ci --all ;;
            pull_request)
              # The checked-out ref is the PR's MERGE commit; its first parent is the base branch tip.
              node scripts/ci/plan.mjs ci --base "$(git rev-parse HEAD^1)" ;;
            *)
              # push to main: everything since the last fully green run (see the note at the top).
              base="$(gh api "repos/${REPO}/actions/workflows/ci.yml/runs?branch=main&event=push&status=success&per_page=1" \
                --jq '.workflow_runs[0].head_sha // empty' || true)"
              node scripts/ci/plan.mjs ci --base "$base" ;;
          esac

  # VERSION COLLISION GATE (2026-08-31). Several sessions cut releases against this repo at once. Two
  # of them picked `Alpha 01.071.0208a` minutes apart; because both wrote the SAME string into
  # /VERSION, git auto-merged with no conflict and nothing anywhere complained — but the tag resolves
  # to only one of the two commits, and the fix merged moments later was NOT in that build while
  # /VERSION still read `0208a`. Reading /VERSION would have told you the fix shipped. It had not.
  #
  # This fires ONLY when a PR actually edits /VERSION, so it stays quiet on ordinary commits (after a
  # release, /VERSION legitimately names an already-tagged version — gating that would be red always).
  # Needs full history + tags, hence fetch-depth: 0.
  version-gate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Does this PR change /VERSION?
        id: changed
        run: |
          git fetch --quiet origin "${{ github.base_ref }}"
          if git diff --quiet "origin/${{ github.base_ref }}...HEAD" -- VERSION; then
            echo "hit=false" >> "$GITHUB_OUTPUT"
            echo "/VERSION untouched — nothing to check."
          else
            echo "hit=true" >> "$GITHUB_OUTPUT"
            echo "/VERSION changed to: $(cat VERSION)"
          fi
      - name: The version being cut must not already be tagged
        if: steps.changed.outputs.hit == 'true'
        run: node scripts/next-version.mjs --check-file

  # wa-chat-bot, mcp-hub, ai-agents, report-renderer: four tiny suites (10-50s each) that used to be a
  # 4-way matrix, i.e. four runners each billed a minimum minute. WSK-69 runs them as steps of ONE job.
  # Every step is `if: !cancelled() && <this project changed>`, so a red project neither aborts nor
  # hides the next one (the same "a red step costs you the run's signal" reasoning as the shards).
  # These run standalone; their DB-backed suites self-skip without a test DB.
  # report-renderer (TR-19): its auth-gate tests (incl. the token-less-request-\>401
  # acceptance check) run against the plain Express app and need no Postgres/Chromium —
  # `npm ci` here will attempt Playwright's own browser download, which is expected to
  # succeed on GitHub-hosted runners (network egress allowed).
  test:
    needs: plan
    if: needs.plan.outputs.any_test == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            wa-chat-bot/package-lock.json
            mcp-hub/package-lock.json
            ai-agents/package-lock.json
            report-renderer/package-lock.json
      - name: wa-chat-bot — ci, typecheck, test
        if: ${{ !cancelled() && needs.plan.outputs.wa_chat_bot == 'true' }}
        working-directory: wa-chat-bot
        run: |
          npm ci
          npm run typecheck
          npm test
      - name: mcp-hub — ci, typecheck, test
        if: ${{ !cancelled() && needs.plan.outputs.mcp_hub == 'true' }}
        working-directory: mcp-hub
        run: |
          npm ci
          npm run typecheck
          npm test
      - name: ai-agents — ci, typecheck, test
        if: ${{ !cancelled() && needs.plan.outputs.ai_agents == 'true' }}
        working-directory: ai-agents
        run: |
          npm ci
          npm run typecheck
          npm test
      - name: report-renderer — ci, typecheck, test
        if: ${{ !cancelled() && needs.plan.outputs.report_renderer == 'true' }}
        working-directory: report-renderer
        run: |
          npm ci
          npm run typecheck
          npm test

  # platform-nest (WS1 core) — its suite is meaningful only against live Postgres + Cerbos, so it
  # gets a dedicated job. The vitest harness builds its own schema and repoints at a NOBYPASSRLS
  # role, so CI only supplies a superuser test DB, Cerbos, and Redis: src/testing/global-setup.ts
  # migrates ONE template database per run and src/testing/setup.ts gives each test file its own
  # database copied from it. (It used to re-run all 166 migrations per file, which was 1219s of a
  # 22.6-minute workflow — see those two files for the measurements.)
  platform-nest:
    needs: plan
    if: needs.plan.outputs.nest == 'true'
    runs-on: ubuntu-latest
    strategy:
      # fail-fast MUST stay false. The default cancels sibling jobs the moment one fails, which on a
      # sharded suite means one shard's failure destroys the other three shards' results — the same
      # "a red step costs you the run's signal" problem the static gates were lifted out for. Every
      # shard reports independently or the split is a downgrade.
      fail-fast: false
      matrix:
        # SHARDING (2026-08-25). The suite is ~425 files and grows with every feature; this is what
        # keeps that growth off the wall clock. Each shard runs `vitest --shard=N/4`, so wall clock
        # is roughly total/4 and the knob to turn as the backend grows is this list, not the tests.
        #
        # Vitest assigns files to shards by sorting on a SHA1 of the file path and slicing — so the
        # split is deterministic (a file always lands in the same shard) but uncorrelated with cost.
        # That matters here because the suite is heavy-tailed: 72 files carry 65% of the runtime, and
        # a path-alphabetical split would have stacked whole directories of slow DB suites onto one
        # runner. Scattering them is what makes four roughly-even shards.
        #
        # Each shard is a separate runner with its own Postgres, Cerbos and Redis, so they cannot
        # contend for a database — no coordination between them is needed or wanted.
        shard: [1, 2, 3, 4]
    name: platform-nest (shard ${{ matrix.shard }}/4)
    services:
      # Postgres is NOT a service container — see the "Start Postgres" step below. It needs server
      # command-line flags (`-c max_connections=...`), and `services:` has no way to pass any:
      # `options` reaches `docker create`, never the image's own entrypoint arguments. Cerbos in
      # this same job already runs as a step for the analogous reason (it needs a bind mount of the
      # checked-out policies), so this is the established shape here rather than a new one.
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: platform-nest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: platform-nest/package-lock.json
      # Durability is switched OFF and the connection ceiling raised. Both are specific to this
      # throwaway CI database; neither is a setting to put anywhere near the real estate:
      #   * fsync / full_page_writes / synchronous_commit off — the only cost of losing this data to
      #     a crash is re-running the job. Since the suite stopped replaying migrations per file
      #     (src/testing/global-setup.ts) its remaining I/O is ~292 `CREATE DATABASE ... TEMPLATE`
      #     data-directory copies plus fixture writes, and those copies are fsync-bound.
      #   * max_connections=200 — file parallelism (4 workers, several pg Pools each) plus the
      #     per-file maintenance connections sit uncomfortably close to the default 100, and
      #     exhausting it fails dozens of unrelated files in beforeAll at once, which reads like a
      #     code regression rather than a capacity limit.
      - name: Start Postgres (tuned for a disposable test cluster)
        run: |
          docker run -d --name postgres -p 5432:5432 \
            -e POSTGRES_PASSWORD=postgres \
            postgres:17-alpine \
            -c max_connections=200 -c fsync=off -c full_page_writes=off \
            -c synchronous_commit=off
          for i in $(seq 1 30); do
            docker exec postgres pg_isready -U postgres && break || sleep 1
          done
      # Cerbos runs as a step (not a service) so it can mount the checked-out policy repo.
      - name: Start Cerbos
        run: |
          docker run -d --name cerbos -p 3592:3592 \
            -v "$PWD/cerbos:/config:ro" -v "$PWD/cerbos/policies:/policies:ro" \
            ghcr.io/cerbos/cerbos:0.54.0 server --config=/config/cerbos.yaml
          for i in $(seq 1 30); do
            curl -fsS http://localhost:3592/_cerbos/health && break || sleep 1
          done
      - run: npm ci
      # NOTE: `npm run typecheck` is NOT here — it runs once in nest-static-gates. tsc is static
      # analysis over the whole project, identical in all four shards, so running it here compiled
      # the same code four times on four runners and, worse, reported ONE type error as FOUR red
      # jobs: on 2026-08-25 a single TS2322 in finance-ownership.test.ts failed every shard and
      # skipped every `npm test`, which reads like the suite broke rather than one line not
      # compiling.
      # `--` passes the flag through npm to vitest. Only this shard's slice of the suite runs here;
      # the four shards together cover every file exactly once (asserted by scripts/check-shards.mjs,
      # which nest-static-gates runs — a silently dropped file would otherwise look like a faster,
      # greener pipeline).
      - run: npm test -- --shard=${{ matrix.shard }}/4
        env:
          DATABASE_URL_TEST: postgres://postgres:postgres@localhost:5432/postgres
          CERBOS_URL: http://localhost:3592
          REDIS_URL: redis://localhost:6379
          # Per-shard prefix. Redundant while each shard owns its runner and Postgres, but this is
          # the value that keeps two shards from dropping each other's databases if they are ever
          # pointed at one shared server (a local repro, or a future consolidation).
          TEST_DB_PREFIX: shard${{ matrix.shard }}
          # REDIS_URL_TEST is the name every suite in the repo actually reads (18 files:
          # events/relay + consumer, collab, hr, service-assignments, the reports PDF-export
          # and TR-29 suites, ...). REDIS_URL alone is read by nothing under test, so the
          # redis service container above was running and being ignored, and the suites
          # skipped themselves — silently, until TR-29's preflight turned that skip into a
          # loud failure. Same URL, correct name; this is what un-skips them.
          REDIS_URL_TEST: redis://localhost:6379

  # ── STATIC GATES, LIFTED OUT OF platform-nest (2026-08-24) ───────────────────────────────────
  # These were steps INSIDE the platform-nest job, sequenced ahead of its `npm test`. Every one of
  # them is pure static analysis — YAML/JSON/source parsing, no Postgres, no Cerbos PDP, no Redis —
  # so they were paying for that job's container startup and `npm ci` for no reason, and, worse:
  #
  #   a failing gate ABORTED the full suite. A red step ends the job, so `npm test` never ran and
  #   the 20-minute suite produced NO signal at all. That is not hypothetical — on 2026-08-24 the
  #   IAM chain-alignment gate went red (permission-catalog.json gained five `finance_*` kinds
  #   whose `resource_finance_*.yaml` policies were not committed alongside it) and main went
  #   several commits with zero full-suite result while looking merely "red".
  #
  # In their own job they still fail loudly and still fail FAST — faster, in fact, since they no
  # longer queue behind `npm ci` + two containers — but they can no longer mask the suite. This
  # also drops ~75s of duplicated vitest boots out of the critical path.
  nest-static-gates:
    needs: plan
    if: needs.plan.outputs.nest == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform-nest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: platform-nest/package-lock.json
      - run: npm ci
      # Moved here from the platform-nest job (2026-08-25). It belongs with the static gates: no
      # database, no Cerbos, and one authoritative result instead of four identical ones. Kept
      # FIRST because a project that does not compile makes every gate below it noise.
      - run: npm run typecheck
      # A1: grep/AST-lite guard on the withTenants() tenant-scoping choke-point — fails if any
      # file outside the sanctioned reconciler/allowlist passes a multi-tenant or computed
      # (non-single-element) tenant array. See scripts/lint-withtenants.mjs for the rationale.
      - run: npm run lint:withtenants
      # Migration-backfill RLS lint (2026-07-30 audit): fails a NEW migration whose UPDATE /
      # DELETE / INSERT...SELECT touches a FORCE-RLS table without setting app.current_tenant_ids
      # first — the exact silent-zero-rows shape 0050_pm_short_codes.sql shipped with (fixed by
      # 0051). Pure static analysis, no DB needed, so it fails at authoring/PR time rather than
      # only showing up as bad data after a real deploy. See scripts/lint-migration-rls.mjs.
      - run: npm run lint:migration-rls
      # 2026-08-26 — migration IMMUTABILITY lint. Fails a change that EDITS a migration already
      # present on the deploy branch in a way that alters the SQL the database executes.
      #
      # Migrations run ONCE. Editing an applied one changes what a FRESH database gets and changes
      # nothing about an estate that already ran it — so the correction reaches every test and every
      # shard here, passes, and never reaches production. No other gate can see this, because the
      # suites build their schema FROM the migration files and therefore exercise the fixed version.
      #
      # Two finance functions were found running pre-fix code on the live estate on 2026-08-26 for
      # exactly this reason. One produced a permanently red tie-out (visible, annoying). The other
      # eliminated against the WRONG counterparty in a consolidated trial balance — which still
      # balanced, still looked finished, and was simply wrong in the artefact that goes to a bank.
      #
      # Comment-only edits pass; the comparison strips comments. See scripts/lint-migration-immutable.mjs.
      # The database-side counterpart is `npm run check:function-drift`, which needs an estate and so
      # cannot run here.
      - run: npm run lint:migration-immutable
      # 2026-08-19 — migration FILENAME lint. The sequential `NNNN_` scheme collided four times
      # (`0114`, `0117`, `0118`, plus the historic `0003`/`0018`) because this is a shared checkout
      # with concurrent sessions: two sessions that both `ls | sort | tail` in the same window both
      # see the same head and both take the next number. "Reserve it by creating the file first" was
      # tried and lost the race anyway — the reservation is not atomic and nothing arbitrates it.
      # The scheme is now CLOSED above 0118 in favour of UTC-minute timestamps, and this lint is what
      # makes that a gate rather than another convention in a README. See
      # platform-nest/migrations/README.md and scripts/lint-migration-names.mjs.
      - run: npm run lint:migration-names
      # SMM-05 — the AGPL containment line, as a build gate. smm-design.md §11 states it verbatim
      # ("lint-enforced zero Postiz deps in platform-nest"): the social publisher is reached over
      # HTTP+JSON from one adapter, and a single Postiz package or module import would put the
      # proprietary platform into the AGPL derivative-work conversation the whole design exists to
      # stay out of. Licensing boundary first, architecture second — not a reviewer's spot-check.
      - run: npm run lint:postiz-deps
      # Sharding's failure mode is a pipeline that gets FASTER and STAYS GREEN while testing less:
      # if the `shard:` matrix and the `--shard=N/4` denominator drift apart, part of the suite runs
      # nowhere and nothing goes red. This is the gate for that. Pure parsing of ci.yml — no vitest,
      # no database. See scripts/check-shards.mjs for what it can and cannot prove.
      - run: npm run check:shards
      # IAM-07b — promotes the wave-3 "Cerbos alignment audit" (previously a one-off manual run:
      # `cerbos compile` + a by-hand diff of the policy matrix against permission-catalog.json) into
      # a permanent, named, CI-enforced gate. Both files are STATIC (no DB, no live Cerbos PDP —
      # pure YAML/JSON parsing), which is exactly why it belongs in this job. It stays redundant
      # with the full suite (the same two files run there too) by deliberate design: a
      # chain-alignment regression is legible as its own red step and survives any future narrowing
      # of `npm test`'s scope. See docs/superpowers/plans/2026-08-10-iam-07b-report.md for the chain
      # map this closes (links 1 and the catalog<->groups link).
      - name: IAM permission-contract chain alignment (IAM-07b — CI promotion of the wave-3 audit)
        run: npm run test:iam-chain-alignment

  # MAIL-13 / design A13 — the inbound adversarial corpus as a NAMED, FAIL-FAST gate — and
  # IAM-03b's assemblePrincipal() benchmark. WSK-69 (2026-10-10) runs the two as steps of ONE job.
  #
  # They were separate jobs (mail-corpus 62s, nest-perf 59s) for a real reason, and it still holds:
  # neither may abort the ~430-file suite in `platform-nest`, and a red corpus must be legible as its
  # own red result. Both are kept as their own NAMED STEPS with `if: !cancelled()`, so a red corpus
  # does not stop the benchmark from running and vice versa. What the merge removes is one runner's
  # billed-minute rounding plus a duplicate Postgres/Cerbos start and `npm ci`.
  #
  # A13 makes the committed corpus (platform-nest/src/mail/__fixtures__/inbound/) a permanent
  # regression suite, not dev scaffolding: "a live provider will never conveniently send forged
  # senders, replayed message-ids, oversized bodies, or hostile HTML on demand". The full suite
  # runs it too, so this is deliberately redundant.
  #
  # The benchmark is excluded from `npm test` because that run is parallel and a benchmark sharing a
  # 4-vCPU runner with three sibling workers measures contention rather than the code (it blew the
  # 20s testTimeout outright). Here it runs AFTER the corpus step, sequentially, so the runner is
  # idle while it measures. Distinct TEST_DB_PREFIX values keep the two steps' databases apart on
  # the one shared Postgres.
  nest-corpus-perf:
    needs: plan
    if: needs.plan.outputs.nest == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform-nest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: platform-nest/package-lock.json
      - name: Start Postgres (tuned for a disposable test cluster — see platform-nest job)
        run: |
          docker run -d --name postgres -p 5432:5432 \
            -e POSTGRES_PASSWORD=postgres \
            postgres:17-alpine \
            -c max_connections=200 -c fsync=off -c full_page_writes=off \
            -c synchronous_commit=off
          for i in $(seq 1 30); do
            docker exec postgres pg_isready -U postgres && break || sleep 1
          done
      - name: Start Cerbos
        run: |
          docker run -d --name cerbos -p 3592:3592 \
            -v "$PWD/cerbos:/config:ro" -v "$PWD/cerbos/policies:/policies:ro" \
            ghcr.io/cerbos/cerbos:0.54.0 server --config=/config/cerbos.yaml
          for i in $(seq 1 30); do
            curl -fsS http://localhost:3592/_cerbos/health && break || sleep 1
          done
      - run: npm ci
      - name: mail-corpus (MAIL-13 inbound adversarial corpus)
        run: npm run test:mail-corpus
        env:
          DATABASE_URL_TEST: postgres://postgres:postgres@localhost:5432/postgres
          CERBOS_URL: http://localhost:3592
          TEST_DB_PREFIX: mailcorpus
      - name: nest-perf (IAM-03b assemblePrincipal benchmark)
        if: ${{ !cancelled() }}
        run: npm run test:perf
        env:
          DATABASE_URL_TEST: postgres://postgres:postgres@localhost:5432/postgres
          CERBOS_URL: http://localhost:3592
          TEST_DB_PREFIX: perfrun

  # ai-gateway is the Go service (ai-gateway-go/); it replaced the retired Node gateway.
  gateway-go:
    needs: plan
    if: needs.plan.outputs.gateway == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-gateway-go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.4" # now has go.sum (WS9 OTel deps); setup-go caches on it
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...

  # sync-engine-go (WS1 T2 cross-site reconciliation). Runs the FULL suite incl. the DB-backed
  # convergence/chaos tests, against two databases with the platform-nest migrations applied and
  # a NOBYPASSRLS role (superusers bypass RLS and would test nothing).
  sync-engine-go:
    needs: plan
    if: needs.plan.outputs.sync == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: sync-engine-go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.4"
      - name: Install psql client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Provision two DBs + NOBYPASSRLS role + migrations
        env:
          PGPASSWORD: postgres
        run: |
          for dbname in gaiada_sync_test gaiada_sync_central; do
            psql -h localhost -U postgres -c "CREATE DATABASE $dbname;"
            for f in $(ls ../platform-nest/migrations/*.sql | sort); do
              psql -h localhost -U postgres -d "$dbname" -v ON_ERROR_STOP=1 -f "$f" >/dev/null
            done
            psql -h localhost -U postgres -d "$dbname" -c "DO \$\$ BEGIN CREATE ROLE sync_app LOGIN PASSWORD 'test' NOSUPERUSER NOBYPASSRLS; EXCEPTION WHEN duplicate_object THEN NULL; END \$\$; GRANT USAGE ON SCHEMA public TO sync_app; GRANT SELECT,INSERT,UPDATE,DELETE ON ALL TABLES IN SCHEMA public TO sync_app;"
          done
      - run: go build ./...
      - run: go vet ./...
      - name: go test (full suite incl. convergence/chaos)
        env:
          DATABASE_URL_TEST: postgres://sync_app:test@localhost:5432/gaiada_sync_test
          DATABASE_URL_CENTRAL: postgres://sync_app:test@localhost:5432/gaiada_sync_central
          DATABASE_URL_SITE_A: postgres://sync_app:test@localhost:5432/gaiada_sync_test
        run: go test ./...

  # WSK-29 — WebDesk (Zone B) CI wiring. Before it, WebDesk appeared in no CI job at all. WSK-69
  # (2026-10-10) folds the three tiny, database-free WebDesk jobs (root 11s, deploy 13s, blocks 35s,
  # each previously billed a full minute) into ONE job of named steps, each `if: !cancelled()` and
  # gated on its own plan output. webdesk-api stays separate: it is heavy. (WSK-48b: the webdesk-payload
  # job, a `next build` of the Payload app, is deleted with Payload.)
  #
  # webdesk/ itself (WSK-01/04): the project-skeleton root — the migration RLS-backfill lint (ported
  # from platform-nest) and the RLS-integrity selftest, WSK-04's condition-1 CI gate ("stops a routine
  # migration from silently disarming RLS"). Neither needs a database.
  #
  # webdesk/blocks (WSK-16): no database, no external service. Its own `npm run build` already IS the
  # gate (vendor-drift check against ../delivery/vocabulary + the unit suite + `astro check`).
  #
  # webdesk/deploy (WSK-29): the Zone A frontend-deploy driver seam. Every test injects a fake
  # exec/driver (no test spawns a process).
  webdesk-light:
    needs: plan
    if: needs.plan.outputs.any_webdesk_light == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            webdesk/package-lock.json
            webdesk/blocks/package-lock.json
            webdesk/deploy/package-lock.json
      - name: webdesk-root — migration lint, RLS selftest, compose port gate
        if: ${{ !cancelled() && needs.plan.outputs.webdesk_root == 'true' }}
        working-directory: webdesk
        # WSK-28 (2026-08-27) — published-port collision gate. `docker compose config` exits 0 on a
        # file whose service DEFAULTS claim the same host port: it validates schema, not whether the
        # services can coexist. payload-gateway and redis both defaulted to 8384, so `--profile dev up`
        # died on a bind conflict for anyone without a local override. The selftest runs first so a
        # gate that has stopped being able to fail cannot report a pass.
        run: |
          npm ci
          npm test
          node scripts/check-compose-ports.mjs --selftest
          node scripts/check-compose-ports.mjs docker-compose.yml
      - name: webdesk-blocks — build (vendor drift + unit + astro check)
        if: ${{ !cancelled() && needs.plan.outputs.webdesk_blocks == 'true' }}
        working-directory: webdesk/blocks
        run: |
          npm ci
          npm run build
      - name: webdesk-deploy — typecheck, test
        if: ${{ !cancelled() && needs.plan.outputs.webdesk_deploy == 'true' }}
        working-directory: webdesk/deploy
        run: |
          npm ci
          npm run typecheck
          npm test

  # webdesk/api (Zone B NestJS service — WSK-05/07/10/11/12/21/37/38/schema-draft/privacy/control).
  # Postgres gets the SAME role bootstrap (init-roles.sh: owner/migrator/app, all NOBYPASSRLS) the
  # project's own verification runbooks use (webdesk/api/README.md) — a superuser test role would
  # test nothing, same reasoning platform-nest's job above gives. RustFS (WSK-D42; MinIO before it)
  # is included (WSK-07/38 read real objects); Redis backs BullMQ (WSK-11 mail) and the WSK-37 webhook queue.
  #
  # ⚠ HONEST STATE, recorded 2026-08-27 (see this ticket's report for the full breakdown): run
  # against a real Linux checkout with exactly this Postgres+Redis+object-storage trio (MinIO then, RustFS since WSK-52), `npm run typecheck`
  # is clean but `npm test` is NOT fully green today — 130/274 passed in this session's run. The
  # dominant cause was NOT missing infra: most failures traced to a `SchemaDraftModule` DI wiring
  # gap (`ControlAuthGuard` needs `CONTROL_CHANNEL_AUTHENTICATOR`, not provided in that module's own
  # `imports`) surfaced against this session's shared, uncommitted working tree — outside this
  # ticket's file ownership (`webdesk/api/src/schema-draft/` is a concurrent ticket's), reported
  # rather than fixed. A smaller, separate cluster needs ClamAV (WSK-07 EICAR/scan specs) and
  # Mailpit (WSK-11 delivery specs) — known gaps WSK-07/WSK-11 already flagged as needing their own
  # verification runbook (PROGRESS.md). This job is left as a REAL (non-`continue-on-error`) gate
  # regardless: CI failing here does not block `git push --tags` (release.yml is a separate,
  # independently-triggered workflow), so a red result costs nothing but is honest, visible signal
  # that a fully-green webdesk-api suite in CI does not exist yet — strictly better than the
  # previous zero signal.
  webdesk-api:
    needs: plan
    if: needs.plan.outputs.webdesk_api == 'true'
    runs-on: ubuntu-latest
    env:
      # Object storage (WSK-52). 127.0.0.1, NOT localhost: `docker run -p 9000:9000` binds IPv4
      # only, while `localhost` on the runner resolves to ::1 first. `pg` degrades gracefully
      # across address families; undici (which the S3 client's fetch uses) does not — it reports
      # the combined failure as a bare `AggregateError`, which surfaced here as every
      # storage-touching create returning 500 instead of 201, with nothing naming the port.
      STORAGE_ENDPOINT: http://127.0.0.1:9000
      # ROOT: used by the RustFS container and storage-bootstrap.mjs ONLY. The api (and the tests'
      # own clients) use the dedicated least-privilege STORAGE_ACCESS_KEY_ID below.
      RUSTFS_ROOT_USER: webdesk_root
      RUSTFS_ROOT_PASSWORD: ci-throwaway-root-password
      STORAGE_ACCESS_KEY_ID: webdesk_api
      STORAGE_SECRET_ACCESS_KEY: ci-throwaway-api-secret-key
      STORAGE_BUCKET_MEDIA: media
      STORAGE_BUCKET_VIDEO: video
      STORAGE_BUCKET_UPLOADS: uploads
      STORAGE_BUCKET_ARTIFACTS: artifacts
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: webdesk/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            webdesk/api/package-lock.json
            webdesk/package-lock.json
      - name: Start Postgres with the project's own role bootstrap (owner/migrator/app, NOBYPASSRLS)
        run: |
          docker run -d --name webdesk-postgres -p 5432:5432 \
            -e POSTGRES_PASSWORD=throwaway_superuser -e POSTGRES_DB=webdesk \
            -e POSTGRES_OWNER_USER=webdesk_owner -e POSTGRES_OWNER_PASSWORD=throwaway_owner \
            -e POSTGRES_MIGRATOR_USER=webdesk_migrator -e POSTGRES_MIGRATOR_PASSWORD=throwaway_migrator \
            -e POSTGRES_APP_USER=webdesk_app -e POSTGRES_APP_PASSWORD=throwaway_app \
            -v "$GITHUB_WORKSPACE/webdesk/postgres/init-roles.sh:/docker-entrypoint-initdb.d/10-init-roles.sh:ro" \
            postgres:16-alpine
          for i in $(seq 1 30); do
            docker exec webdesk-postgres pg_isready -U webdesk_owner -d webdesk && break || sleep 1
          done
      - name: Start RustFS as a STEP, not a service container
        # Same reason as Postgres above and ClamAV/Mailpit below: a STEP lets us name the container
        # and pass arguments (the old MinIO image needed `server /data`, which a `services:`
        # container cannot take). Pinned by digest (rustfs/rustfs:1.0.0, Apache-2.0). Root creds
        # are the job-level RUSTFS_ROOT_*; they are used ONLY by the bootstrap step below.
        run: |
          docker run -d --name webdesk-rustfs -p 9000:9000 \
            -e RUSTFS_ROOT_USER -e RUSTFS_ROOT_PASSWORD \
            rustfs/rustfs:1.0.0@sha256:8cc9801755448b71a786705ce76692c77e14936cccd87cf2fc31842e58f4d1ff
          # curl ships in the RustFS image (an `mc`/`rc` client is not); /health is unauthenticated.
          for i in $(seq 1 30); do
            docker exec webdesk-rustfs curl -sf http://127.0.0.1:9000/health >/dev/null && break || sleep 1
          done
          docker exec webdesk-rustfs curl -sf http://127.0.0.1:9000/health
      - name: Start ClamAV and Mailpit (the last two fixtures webdesk-api's suites need)
        # Both are STEPS rather than `services:` for the same reason RustFS and Postgres above are:
        # arguments and container NAMES are expressible here and not there. `mail-retry-backoff`
        # looks for a container literally named `wsk11-mailpit` (MAILPIT_CONTAINER_NAME), which a
        # service container cannot provide.
        #
        # Without these, 8 tests fail in a way that reads like application bugs rather than a
        # missing fixture: ClamAV-dependent uploads return 503 where the suite asserts 403/201,
        # and the Mailpit delivery test reports a bare "fetch failed".
        run: |
          docker run -d --name wsk11-mailpit -p 1025:1025 -p 8025:8025 axllent/mailpit:latest
          docker run -d --name webdesk-clamav -p 3310:3310 \
            -e CLAMAV_NO_FRESHCLAMD=true clamav/clamav:stable
          # Mailpit is up in about a second; ClamAV loads its signature database first and needs
          # far longer, so it gets its own generous budget. Both probes use bash's /dev/tcp for the
          # same reason the Postgres one does: neither image ships curl.
          for i in $(seq 1 30); do
            bash -c 'exec 3<>/dev/tcp/127.0.0.1/8025' 2>/dev/null && break || sleep 1
          done
          for i in $(seq 1 90); do
            bash -c 'exec 3<>/dev/tcp/127.0.0.1/3310' 2>/dev/null && break || sleep 2
          done
          docker ps --format '  {{.Names}} {{.Status}}'
      - run: npm ci
      - name: Bootstrap RustFS (buckets + versioning + GOVERNANCE lock + least-privilege api key)
        # webdesk/scripts/storage-bootstrap.mjs — S3 API + RustFS admin API, no `mc`. Needs
        # webdesk/api/node_modules (the step above). Idempotent: a re-run says changes=0.
        run: node ../scripts/storage-bootstrap.mjs
      - name: Apply Zone B migrations with the project's own runner (migrations/migrate.mjs)
        # `webdesk/` (the PARENT of `webdesk/api`) is a separate npm project (its own package.json,
        # `pg` dependency, own `migrate` script — see the webdesk-root job below) — migrate.mjs
        # resolves `pg` from ITS OWN node_modules, not webdesk/api's, so this step installs and runs
        # there rather than assuming node's directory walk-up finds a sibling's dependency.
        working-directory: webdesk
        run: |
          npm ci
          MIGRATE_DATABASE_URL="postgres://webdesk_migrator:throwaway_migrator@localhost:5432/webdesk" npm run migrate
      - run: npm run typecheck
      - run: npm test
        env:
          APP_DATABASE_URL: postgres://webdesk_app:throwaway_app@localhost:5432/webdesk
          # test/helpers/fixtures.ts reads THIS name and falls back to localhost:55450 without it
          # — the single variable behind the first wave of AggregateError failures.
          MIGRATE_DATABASE_URL: postgres://webdesk_migrator:throwaway_migrator@localhost:5432/webdesk
          WSK05_TEST_DATABASE_URL: postgres://webdesk_app:throwaway_app@localhost:5432/webdesk
          REDIS_URL: redis://localhost:6379
          API_KEY_PEPPER: ci-throwaway-pepper
          # Storage env (STORAGE_*, RUSTFS_ROOT_*) is job-level — see the `env:` block above.
          # Redis keeps `localhost` because it is a real service container on the job network,
          # not a published port (see the IPv4 note on STORAGE_ENDPOINT).
          # ── THE PER-TICKET ENV FRAGMENTATION, paid off here ────────────────────────────────
          # The suites read SEVEN different names for "the test database URL" — APP_, MIGRATE_,
          # WSK05_, WSK21_x2, WSK25_x3, WSK33_x2 — each with its OWN hardcoded localhost:555xx
          # fallback baked into the spec file. Any name this block misses does not fail loudly:
          # the spec silently falls back to a port nothing listens on, and the failure surfaces as
          # `AggregateError` / `expected 500 to be 201` with no host or port anywhere in it. That
          # cost a full debugging pass to trace back to a missing variable.
          #
          # They all point at the ONE Postgres this job starts. The tracker already flagged the
          # naming as needing normalisation (WSK-M0); until that happens, every alias must be
          # listed here or the job cannot pass.
          WSK21_TEST_DATABASE_URL: postgres://webdesk_app:throwaway_app@localhost:5432/webdesk
          WSK21_MIGRATE_DATABASE_URL: postgres://webdesk_migrator:throwaway_migrator@localhost:5432/webdesk
          WSK25_TEST_DATABASE_URL: postgres://webdesk_app:throwaway_app@localhost:5432/webdesk
          WSK25_MIGRATE_DATABASE_URL: postgres://webdesk_migrator:throwaway_migrator@localhost:5432/webdesk
          WSK25_TARGET_APP_DATABASE_URL: postgres://webdesk_app:throwaway_app@localhost:5432/webdesk
          WSK25_TARGET_MIGRATE_DATABASE_URL: postgres://webdesk_migrator:throwaway_migrator@localhost:5432/webdesk
          WSK33_TEST_DATABASE_URL: postgres://webdesk_app:throwaway_app@localhost:5432/webdesk
          WSK33_MIGRATE_DATABASE_URL: postgres://webdesk_migrator:throwaway_migrator@localhost:5432/webdesk
          # Throwaway secrets. Real values live only on the box; these exist so the suites that
          # assert on hashing/signing BEHAVIOUR have deterministic inputs.
          TENANT_WEBHOOK_SECRET_PEPPER: ci-throwaway-webhook-pepper
          WEBDESK_EVENT_SECRET: ci-throwaway-event-secret
          WEBDESK_APPROVAL_ASSERTION_KEY: ci-throwaway-ws4-key
          # ClamAV + Mailpit, matching the containers started above.
          CLAMAV_HOST: 127.0.0.1
          CLAMAV_PORT: "3310"
          MAIL_ENABLED: "true"
          MAIL_PROVIDER: smtp
          MAIL_SMTP_HOST: 127.0.0.1
          MAIL_SMTP_PORT: "1025"
          # MAIL_FROM_ADDRESS / MAIL_FROM_NAME are deliberately NOT set. WSK-11's identity rule is
          # that `resolveFromIdentity()` takes zero arguments — the sending identity is structural
          # and must not be overridable from outside. Setting them here made the delivery test fail
          # with `expected 'WebDesk CI' to be 'Gaiada WebDesk Forms'`, which is that test doing
          # precisely its job: catching an environment that tried to override the identity.
          MAILPIT_HTTP_URL: http://127.0.0.1:8025
          MAILPIT_CONTAINER_NAME: wsk11-mailpit
          # 64 KB, deliberately well UNDER Fastify's 1 MB default body limit. The oversize-upload
          # test builds a body just over this cap and asserts the application's own 400. Left
          # unset, the cap defaults to 8 MB, Fastify rejects the body itself with 413 before the
          # handler runs, and the app's error envelope never gets the chance to fire — the test
          # then fails on 413-vs-400 and looks like an assertion bug rather than a missing value.
          WEBDESK_MEDIA_MAX_UPLOAD_BYTES: "65536"
      # WSK-D51: the migration tests (webdesk/migrations/tests). Each builds throwaway scratch
      # databases next to the migrated `webdesk` one and drives the real runner against them, so
      # they need the cluster superuser as well as the migrator and app roles. Not part of
      # `npm test` (vitest), which is why they were silently never run before. Run from
      # webdesk/api like the rest of this job; `pg` resolves from webdesk/node_modules.
      # WSK-48b: 0009_v1_bytes.test.mjs is retired (it drove the deleted Payload router) and
      # 0011_drop_payload.test.mjs is added; WSK-61 adds 0012_content_schedules.test.mjs; WSK-46 adds 0013_preview_tokens.test.mjs; WSK-43a adds 0014_media_library.test.mjs; WSK-68 adds wsk68_backup_role.test.mjs (the read-only BYPASSRLS backup role). The list is exactly the files in migrations/tests/.
      - name: Migration tests — 0009 to 0014, against scratch databases
        if: ${{ !cancelled() }}
        env:
          SUPERUSER_DATABASE_URL: postgres://postgres:throwaway_superuser@localhost:5432/webdesk
          MIGRATE_DATABASE_URL: postgres://webdesk_migrator:throwaway_migrator@localhost:5432/webdesk
          APP_DATABASE_URL: postgres://webdesk_app:throwaway_app@localhost:5432/webdesk
          API_KEY_PEPPER: ci-throwaway-pepper
        run: |
          for t in 0009_content_write_plane 0010_slug_release_and_ledger 0011_drop_payload 0012_content_schedules 0013_preview_tokens 0014_media_library wsk68_backup_role; do
            echo "##### $t"
            node --import tsx ../migrations/tests/$t.test.mjs
          done
      # WSK-48b: the vocabulary tests (webdesk/delivery/test) had no CI home before: the webdesk-payload job
      # only ran `next build`, and the gate (qa/linux-gate.sh) was the only place they ran. They are plain
      # node scripts that need no database; they run from webdesk/api so `--import tsx` resolves from its
      # node_modules (installed above).
      - name: Vocabulary tests — webdesk/delivery
        if: ${{ !cancelled() }}
        run: |
          for t in wsk64-classifier wsk64-item-fields vocabulary wsk49-client-editable; do
            echo "##### $t"
            node --import tsx ../delivery/test/$t.test.mjs
          done

  # P3-12: platform-ui build gate. `tsc` + vitest alone once passed while `next build` broke
  # (a `server-only` import reached a client component) and routes 500'd — `npm run build` here
  # is the actual gate for that class of bug. DEMO_MODE=1 so no backend is needed (demoFixtures).
  # The optional Playwright smoke check runs against that same build (`next start`, not
  # `next dev` — see platform-ui/playwright.config.ts) so it exercises the real build artifact.
  platform-ui:
    needs: plan
    if: needs.plan.outputs.ui == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform-ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: platform-ui/package-lock.json
      - run: npm ci
      # Next's build cache. Keyed on the lockfile plus every source file, with a lockfile-only
      # prefix fallback: an exact hit is rare (any source edit misses it, and a source edit is what
      # triggers this workflow), but `restore-keys` means a MISS still restores the last build's
      # cache, which is the case that matters — Next then reuses unchanged compilation and the build
      # step drops from ~78s to well under half that. Never a correctness risk: the cache holds
      # compiler output keyed by content, and `next build` revalidates it.
      - name: Cache .next/cache
        uses: actions/cache@v4
        with:
          path: platform-ui/.next/cache
          key: next-${{ hashFiles('platform-ui/package-lock.json') }}-${{ hashFiles('platform-ui/src/**', 'platform-ui/*.ts', 'platform-ui/*.js', 'platform-ui/*.json') }}
          restore-keys: |
            next-${{ hashFiles('platform-ui/package-lock.json') }}-
            next-
      # `playwright install --with-deps` re-downloaded a ~120MB Chromium on every single run (26s).
      # The version is pinned by the lockfile, so the download is byte-identical until Playwright
      # itself is bumped — which is exactly what the key encodes. No restore-keys on purpose: a
      # PARTIAL match here would restore a browser build that does not match the installed
      # Playwright client, and the mismatch surfaces as an opaque launch failure rather than a
      # cache miss. Better to re-download on a version bump.
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('platform-ui/package-lock.json') }}
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          DEMO_MODE: "1"
          # This job deliberately builds/serves a PRODUCTION artifact against the demo fixtures
          # (there is no backend in CI). platform-ui refuses to start with DEMO_MODE in a
          # production runtime unless that is acknowledged BY NAME — see src/lib/demoMode.ts.
          DEMO_MODE_ACK_NON_PRODUCTION: "1"
      # Left running UNCONDITIONALLY, and still with `--with-deps`, even on a cache hit. The cache
      # above covers the ~120MB browser download in ~/.cache/ms-playwright; it cannot cover the
      # host apt libraries `--with-deps` installs, which live outside any cacheable path and would
      # leave Chromium unable to launch if skipped. This command is idempotent and detects the
      # already-present browser, so a cache hit turns it from "download + apt" into "apt" — the
      # saving comes from the cache, not from branching on it.
      - name: Install Playwright browser (smoke only)
        run: npx playwright install chromium --with-deps
      - name: Smoke e2e against the built app
        run: npx playwright test --project=smoke --grep @smoke
        env:
          DEMO_MODE: "1"
          # This job deliberately builds/serves a PRODUCTION artifact against the demo fixtures
          # (there is no backend in CI). platform-ui refuses to start with DEMO_MODE in a
          # production runtime unless that is acknowledged BY NAME — see src/lib/demoMode.ts.
          DEMO_MODE_ACK_NON_PRODUCTION: "1"
          # src/lib/session.ts throws when this is unset, so the Playwright webServer never
          # booted and every test failed as a waitForURL timeout. CI-only dummy value.
          SESSION_SECRET: ci-smoke-secret-not-a-real-key

  # docs/MAP.md is GENERATED from the filesystem (scripts/gen-map.mjs) — the structural index:
  # components, compose services, module registry, migration head, the @Controller surface, UI
  # routes, workflow ids. Every hand-maintained orientation doc in this program has gone stale and
  # then misled someone (the 2026-07-09 root guide, archived in docs/history/, is the case in
  # point). This job is what makes staleness impossible rather than merely discouraged: add a
  # controller, a compose service or a migration without regenerating, and the build goes red.
  #
  # Cheapest job in the file — no npm ci, no services, one Node script over the checkout. Note the
  # workflow's `paths-ignore` means a docs-only commit skips it; that is correct, because the map
  # is derived from CODE, and code changes are exactly what this catches.
  # docs-map MOVED OUT of this workflow -> .github/workflows/docs-map.yml
  # It validated docs/MAP.md while this workflow's `paths-ignore` skips `docs/**` and
  # `**/*.md`, so the regenerated MAP that fixes the gate could never re-run it. The gate
  # was stuck red on main from Alpha 01.065.0141a until 2026-08-23 for that reason.
  # Do NOT move it back without also carving docs/MAP.md out of the filter above.

  # WS9 observability config-lint: promtool (rules + scrape), amtool (alertmanager, env-rendered),
  # and a YAML/JSON parse fallback. otelcol validate is skipped in CI (large binary); the collector
  # config is YAML-parsed here and otelcol-validated on a Docker host before deploy.
  observability-lint:
    needs: plan
    if: needs.plan.outputs.obs == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install promtool + amtool
        run: |
          curl -fsSL https://github.com/prometheus/prometheus/releases/download/v3.1.0/prometheus-3.1.0.linux-amd64.tar.gz \
            | sudo tar xz -C /usr/local/bin --strip-components=1 prometheus-3.1.0.linux-amd64/promtool
          curl -fsSL https://github.com/prometheus/alertmanager/releases/download/v0.28.0/alertmanager-0.28.0.linux-amd64.tar.gz \
            | sudo tar xz -C /usr/local/bin --strip-components=1 alertmanager-0.28.0.linux-amd64/amtool
      - name: Install pyyaml + gettext (envsubst)
        run: pip3 install pyyaml && sudo apt-get update && sudo apt-get install -y gettext-base
      - run: sh infra/scripts/lint-observability.sh
