# WS10 — supply-chain-secure release pipeline (roadmap §"CI/CD with supply-chain security baked in":
# Sigstore signing + SBOM + SLSA provenance). Builds each component image, pushes to GHCR, then for
# every image: generates an SBOM, signs the image + SBOM with cosign KEYLESS (Sigstore OIDC — no keys
# in the repo, aligns with WS10 §1 "no secrets in repos"), and emits a SLSA build-provenance
# attestation. Runs on a version tag or manual dispatch (deploy is decoupled from build).
#
# Verify a released image before deploy:
#   cosign verify ghcr.io/<owner>/gaiada-<component>:<tag> \
#     --certificate-identity-regexp "https://github.com/<owner>/.+/.github/workflows/release.yml@.+" \
#     --certificate-oidc-issuer https://token.actions.githubusercontent.com
#   cosign verify-attestation --type spdxjson ...   # SBOM
#   gh attestation verify oci://ghcr.io/<owner>/gaiada-<component>:<tag> --owner <owner>  # SLSA provenance
name: release

on:
  push:
    # App-version tags (docs/modules/VERSIONING.md): the app version lowercased with spaces
    # hyphenated, e.g. `Alpha 01.001.0001a` -> `alpha-01.001.0001a`. `v*` is kept for any
    # pre-existing/ad-hoc tag. deploy.yml cross-checks the tag against /VERSION.
    tags: ["v*", "alpha-*", "beta-*", "rc-*", "stable-*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to publish (defaults to the git ref name)"
        required: false

permissions:
  contents: read
  packages: write # push images to GHCR
  id-token: write # Sigstore keyless signing + provenance (OIDC)
  attestations: write # actions/attest-build-provenance

jobs:
  build-sign:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        component:
          - wa-chat-bot
          - mcp-hub
          - ai-agents
          - ai-gateway-go
          - sync-engine-go
          - search-crawl-go
          - platform-nest
          - platform-ui
          - report-renderer
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/gaiada-${{ matrix.component }}
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.component }}
          push: true
          tags: ${{ env.IMAGE }}:${{ env.TAG }}
          provenance: false # we attach a richer SLSA attestation below
          sbom: false # we generate + attest the SBOM explicitly below

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Generate SBOM (SPDX)
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: sbom.spdx.json

      - name: Sign image (keyless)
        run: cosign sign --yes ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}

      - name: Attest SBOM to the image (keyless)
        run: cosign attest --yes --type spdxjson --predicate sbom.spdx.json ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}

      # GitHub refuses attestations on user-owned PRIVATE repos ("Feature not available for
      # user-owned private repositories") — it needs a public repo or an org plan. Non-blocking
      # until this repo moves to an organization, because the controls deploy.yml actually
      # ENFORCES are the two above (cosign keyless signature + attested SBOM), and both succeed.
      # Losing SLSA provenance is a real reduction in supply-chain assurance, not a formality:
      # re-enable by removing continue-on-error the moment the repo is org-owned.
      - name: SLSA build provenance attestation
        uses: actions/attest-build-provenance@v1
        continue-on-error: true
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      # ── GHCR RETENTION (2026-08-04) ───────────────────────────────────────────────────────────
      # Nothing has ever pruned the REGISTRY. The VPS side is pruned on every deploy (added after a
      # full disk rolled back a healthy release), but each release pushed 9 more images to GHCR and
      # none were ever removed: 594 versions across 9 private packages by 2026-08-04. Private package
      # storage is metered, the free allowance is 500 MB, and `report-renderer` alone carries Chromium
      # — so the account hit its spending limit and EVERY Actions job stopped starting, which reads as
      # a broken pipeline rather than a full disk in someone else's datacentre.
      #
      # Keeping 12 versions per package is a deliberate trade against rollback range, not a round
      # number: deploy.yml's rollback path re-pins a PREVIOUS TAG and needs that tag's image to still
      # exist, so this is the depth of history a rollback can reach. 12 releases at the current cadence
      # is a few weeks. Raise it if releases speed up; do not drop below ~5 or the rollback that
      # matters (two or three cuts back, when a regression is noticed late) silently stops working.
      #
      # `continue-on-error`: a retention failure must never fail a release whose image is already
      # pushed, signed and attested. Storage creeping back up is a smaller problem than a red release.
      - name: Prune old GHCR versions (keep the last 12)
        uses: actions/delete-package-versions@v5
        continue-on-error: true
        with:
          # `matrix.component` is a flat STRING (see the matrix above: `- wa-chat-bot`, ...), not an
          # object — this must match how IMAGE is built (`gaiada-${{ matrix.component }}`) or it
          # silently targets a package name that does not exist.
          package-name: gaiada-${{ matrix.component }}
          package-type: container
          min-versions-to-keep: 12
          # GITHUB_TOKEN can delete versions of a package OWNED BY this repo. These packages are
          # user-namespace (`ghcr.io/hansel-gaiada/...`), and if they are not linked to the repository
          # GitHub refuses and this step logs a 403 — which `continue-on-error` turns into a warning
          # rather than a failed release. If that happens, mint a PAT with `delete:packages`, store it
          # as the `GHCR_CLEANUP_TOKEN` secret, and it is used instead.
          token: ${{ secrets.GHCR_CLEANUP_TOKEN || secrets.GITHUB_TOKEN }}

  # The single deploy point: once EVERY component is built, signed and attested, hand the
  # tag to deploy.yml. `git push --tags` is therefore the whole release-and-deploy action.
  # Deploy is still independently runnable (workflow_dispatch) for rollback.
  deploy:
    needs: build-sign
    uses: ./.github/workflows/deploy.yml
    with:
      tag: ${{ github.event.inputs.tag || github.ref_name }}
    secrets: inherit
