# WS10 — supply-chain-secure release pipeline (roadmap §"CI/CD with supply-chain security baked in":
# Sigstore signing + SBOM + SLSA provenance). Builds each component image, pushes to GHCR, then for
# every image: generates an SBOM, signs the image + SBOM with cosign KEYLESS (Sigstore OIDC — no keys
# in the repo, aligns with WS10 §1 "no secrets in repos"), and emits a SLSA build-provenance
# attestation. Runs on a version tag or manual dispatch (deploy is decoupled from build).
#
# Verify a released image before deploy:
#   cosign verify ghcr.io/<owner>/gaiada-<component>:<tag> \
#     --certificate-identity-regexp "https://github.com/<owner>/.+/.github/workflows/release.yml@.+" \
#     --certificate-oidc-issuer https://token.actions.githubusercontent.com
#   cosign verify-attestation --type spdxjson ...   # SBOM
#   gh attestation verify oci://ghcr.io/<owner>/gaiada-<component>:<tag> --owner <owner>  # SLSA provenance
name: release

on:
  push:
    # App-version tags (docs/modules/VERSIONING.md): the app version lowercased with spaces
    # hyphenated, e.g. `Alpha 01.001.0001a` -> `alpha-01.001.0001a`. `v*` is kept for any
    # pre-existing/ad-hoc tag. deploy.yml cross-checks the tag against /VERSION.
    tags: ["v*", "alpha-*", "beta-*", "rc-*", "stable-*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to publish (defaults to the git ref name)"
        required: false

permissions:
  contents: read
  packages: write # push images to GHCR
  id-token: write # Sigstore keyless signing + provenance (OIDC)
  attestations: write # actions/attest-build-provenance

jobs:
  build-sign:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        component:
          - wa-chat-bot
          - mcp-hub
          - ai-agents
          - ai-gateway-go
          - sync-engine-go
          - search-crawl-go
          - platform-nest
          - platform-ui
          - report-renderer
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/gaiada-${{ matrix.component }}
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.component }}
          push: true
          tags: ${{ env.IMAGE }}:${{ env.TAG }}
          provenance: false # we attach a richer SLSA attestation below
          sbom: false # we generate + attest the SBOM explicitly below

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Generate SBOM (SPDX)
        if: matrix.component != 'report-renderer'
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: sbom.spdx.json

      # report-renderer is scoped to its SOURCE (package.json/package-lock.json under
      # ./report-renderer), not the built image — see the "SBOM SCOPING" note below the attest
      # step for why and the measured before/after numbers.
      #
      # SYFT_JAVASCRIPT_INCLUDE_DEV_DEPENDENCIES=true is REQUIRED, not cosmetic: `tsx` is listed
      # under devDependencies in report-renderer/package.json but is this image's actual CMD
      # (`npx tsx src/server.ts`) — syft drops devDependencies by default, which would silently
      # omit the real runtime entrypoint from the SBOM. The Dockerfile's `npm ci` has no
      # `--omit=dev`, so devDependencies are genuinely installed in the shipped image; the SBOM
      # should describe what's actually in the container, not just its "production" intent.
      - name: Generate SBOM (SPDX) — report-renderer, scoped to source
        if: matrix.component == 'report-renderer'
        uses: anchore/sbom-action@v0
        env:
          SYFT_JAVASCRIPT_INCLUDE_DEV_DEPENDENCIES: "true"
        with:
          path: ./report-renderer
          format: spdx-json
          output-file: sbom.spdx.json

      - name: Sign image (keyless)
        run: cosign sign --yes ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}

      # ── SBOM SCOPING (2026-08-06) — history + what changed ────────────────────────────────────
      #
      # This step failed RELIABLY for `report-renderer` on `alpha-01.017.0040a` — twice in a row,
      # each time after cosign's own 4 internal retries and ~2 minutes:
      #     POST https://rekor.sigstore.dev/api/v1/log/entries giving up after 4 attempt(s)
      # then SUCCEEDED on the `0040b` re-cut with no code change. That is fragility under Rekor
      # load, not a deterministic fault — worth stating plainly since an earlier pass at this
      # comment called it deterministic, which was wrong.
      #
      # Root cause: `report-renderer/Dockerfile` is the ONLY image in the estate built `FROM
      # mcr.microsoft.com/playwright:v1.61.1-noble` (it carries Chromium+Firefox+WebKit). SBOM'ing
      # the built image cataloged the whole base OS on top of the app: 826 packages (514 deb + ~306
      # npm + a few go/oci) at 17,080,639 bytes — by far the largest predicate of the nine
      # components, and Microsoft already owns that base image's own provenance; we don't control
      # or patch those OS packages ourselves, so cataloguing them added bulk without adding a
      # control.
      #
      # Fix: the "Generate SBOM (SPDX) — report-renderer, scoped to source" step above scans
      # `./report-renderer` directly (syft `dir:`, via anchore/sbom-action's `path` input) instead
      # of the built image, with `SYFT_JAVASCRIPT_INCLUDE_DEV_DEPENDENCIES=true` so the SBOM still
      # matches what `npm ci` actually installs into the container. Measured locally 2026-08-06
      # (syft 1.50.0, same base image, docker-archive scan of the built image vs dir scan of the
      # source): 17,080,639 bytes / 826 packages -> 451,910 bytes / 229 packages — a ~38x drop.
      # Spot-checked the scoped SBOM: `playwright`, `express`, `dotenv` (regular deps) and `tsx`,
      # `typescript`, `vitest`, `supertest` (dev deps, present because of the include-dev-deps flag
      # above) are all present as real packages with real versions.
      #
      # `continue-on-error` is REMOVED per the same sequencing already used below for SLSA
      # provenance: only pull the safety net once the fix is demonstrated, so a future genuine
      # attestation failure is loud again for every component, including this one.
      #
      # Honest limit of this proof: it is a local reproduction, not a real Rekor round-trip — the
      # actual test is the next release. A ~38x predicate reduction is a strong, directionally
      # correct fix for a size/load-based rejection, but if Rekor still rejects report-renderer's
      # (now much smaller) SBOM on the next cut, the release will now FAIL LOUD at this step
      # instead of silently degrading — that is the deliberate trade-off of removing the flag here.
      # If that happens, re-add `continue-on-error: true` to this step and reopen this note rather
      # than re-diagnosing from scratch.
      - name: Attest SBOM to the image (keyless)
        run: cosign attest --yes --type spdxjson --predicate sbom.spdx.json ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}

      # GitHub refuses attestations on user-owned PRIVATE repos ("Feature not available for
      # user-owned private repositories") — it needs a public repo or an org plan. Non-blocking
      # until then, because the controls deploy.yml actually ENFORCES are the two above (cosign
      # keyless signature + attested SBOM), and both succeed.
      #
      # ✅ 2026-08-05 RESOLVED: the outcome was observed rather than assumed, as intended. `0040a` failed
      # before reaching this step (Rekor would not take report-renderer's SBOM), so the check moved to the
      # `alpha-01.017.0040b` re-cut — where SLSA provenance succeeded on **all 9 components**. Precondition
      # met, so `continue-on-error` is now REMOVED: a future provenance failure is loud, which is the point.
      #
      # NOTE: the SBOM attestation step above went through the identical sequence — see the
      # "SBOM SCOPING (2026-08-06)" comment on that step for the report-renderer-specific history
      # and the before/after numbers that justified removing its `continue-on-error` too.
      - name: SLSA build provenance attestation
        uses: actions/attest-build-provenance@v1
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      # ── GHCR RETENTION (2026-08-04) ───────────────────────────────────────────────────────────
      # Nothing has ever pruned the REGISTRY. The VPS side is pruned on every deploy (added after a
      # full disk rolled back a healthy release), but each release pushed 9 more images to GHCR and
      # none were ever removed: 594 versions across 9 private packages by 2026-08-04. Private package
      # storage is metered, the free allowance is 500 MB, and `report-renderer` alone carries Chromium
      # — so the account hit its spending limit and EVERY Actions job stopped starting, which reads as
      # a broken pipeline rather than a full disk in someone else's datacentre.
      #
      # ⚠ 9 VERSIONS = 3 RELEASES. Every release pushes THREE versions per package:
      #     alpha-01.015.0036a                  the image
      #     sha256-<imageDigest>.sig            cosign signature
      #     sha256-<imageDigest>.att            attested SBOM
      # So this number is releases × 3, and reading it as "keep 9 releases" is the mistake to avoid.
      # `min-versions-to-keep: 3` would keep ONE release and delete the tag currently running on the
      # box — the state a rollback needs most.
      #
      # The .sig is load-bearing, not decorative: deploy.yml VERIFIES the cosign signature before it
      # deploys or rolls back, so a tag whose .sig has been pruned can no longer be deployed to at all.
      # Any change to this number must stay a multiple of 3 for that reason.
      #
      # 3 releases is the owner's call (2026-08-04) to stay inside the free Packages allowance. It is a
      # real trade: rollback now reaches two cuts back, not twelve. If a regression is noticed late,
      # the tag to roll back to may already be gone — re-cut from git instead.
      #
      # `continue-on-error`: a retention failure must never fail a release whose image is already
      # pushed, signed and attested. Storage creeping back up is a smaller problem than a red release.
      - name: Prune old GHCR versions (keep the last 3 releases = 9 versions)
        uses: actions/delete-package-versions@v5
        continue-on-error: true
        with:
          # `matrix.component` is a flat STRING (see the matrix above: `- wa-chat-bot`, ...), not an
          # object — this must match how IMAGE is built (`gaiada-${{ matrix.component }}`) or it
          # silently targets a package name that does not exist.
          package-name: gaiada-${{ matrix.component }}
          package-type: container
          # 30 = 10 RELEASES × 3 artifacts. Raised from 9 (3 releases) on 2026-08-05: that number was
          # chosen purely to fit inside the free PRIVATE Packages allowance, and the repo is public now,
          # so storage is no longer the constraint — rollback range is. 3 releases meant a regression
          # noticed late had no tag left to roll back to. Still a multiple of 3 for the reason below.
          min-versions-to-keep: 30
          # GITHUB_TOKEN can delete versions of a package OWNED BY this repo. These packages are
          # user-namespace (`ghcr.io/hansel-gaiada/...`), and if they are not linked to the repository
          # GitHub refuses and this step logs a 403 — which `continue-on-error` turns into a warning
          # rather than a failed release. If that happens, mint a PAT with `delete:packages`, store it
          # as the `GHCR_CLEANUP_TOKEN` secret, and it is used instead.
          token: ${{ secrets.GHCR_CLEANUP_TOKEN || secrets.GITHUB_TOKEN }}

  # The single deploy point: once EVERY component is built, signed and attested, hand the
  # tag to deploy.yml. `git push --tags` is therefore the whole release-and-deploy action.
  # Deploy is still independently runnable (workflow_dispatch) for rollback.
  deploy:
    needs: build-sign
    uses: ./.github/workflows/deploy.yml
    with:
      tag: ${{ github.event.inputs.tag || github.ref_name }}
    secrets: inherit
