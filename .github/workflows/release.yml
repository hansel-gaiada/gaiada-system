# WS10 — supply-chain-secure release pipeline (roadmap §"CI/CD with supply-chain security baked in":
# Sigstore signing + SBOM + SLSA provenance). Builds each component image, pushes to GHCR, then for
# every image: generates an SBOM, signs the image + SBOM with cosign KEYLESS (Sigstore OIDC — no keys
# in the repo, aligns with WS10 §1 "no secrets in repos"), and emits a SLSA build-provenance
# attestation. Runs on a version tag or manual dispatch (deploy is decoupled from build).
#
# Verify a released image before deploy:
#   cosign verify ghcr.io/<owner>/gaiada-<component>:<tag> \
#     --certificate-identity-regexp "https://github.com/<owner>/.+/.github/workflows/release.yml@.+" \
#     --certificate-oidc-issuer https://token.actions.githubusercontent.com
#   cosign verify-attestation --type spdxjson ...   # SBOM
#   gh attestation verify oci://ghcr.io/<owner>/gaiada-<component>:<tag> --owner <owner>  # SLSA provenance
#
# WSK-69 (2026-10-10, ruling WSK-D47) - BUILD ONLY WHAT CHANGED. A `plan` job (scripts/ci/plan.mjs,
# unit-tested in scripts/ci/plan.test.mjs) decides, per component, BUILD or RE-TAG:
#   * BUILD  - the component's build context changed since the newest previous release that has a
#              SIGNED image of it, or release.yml itself changed, or there is no such image, or that
#              image is older than 30 days (floating base-image tags: refresh them), or force_all.
#   * RE-TAG - otherwise the previous image's manifest is copied to the new tag BY DIGEST
#              (`docker buildx imagetools create`). The digest is unchanged, so the cosign signature
#              and SBOM attestation (stored as sha256-<digest>.sig / .att and keyed by DIGEST, not by
#              tag) remain valid, and deploy.yml's `cosign verify ghcr.io/<owner>/gaiada-<c>:<tag>`
#              resolves the new tag to that digest and finds the same signature. Every component
#              therefore still exists at every release tag, which `docker compose pull` and
#              rollback-to.sh rely on.
# Fully-built components still go through the unchanged build -> SBOM -> cosign -> SLSA steps below.
name: release

on:
  push:
    # App-version tags (docs/modules/VERSIONING.md): the app version lowercased with spaces
    # hyphenated, e.g. `Alpha 01.001.0001a` -> `alpha-01.001.0001a`. `v*` is kept for any
    # pre-existing/ad-hoc tag. deploy.yml cross-checks the tag against /VERSION.
    tags: ["v*", "alpha-*", "beta-*", "rc-*", "stable-*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to publish (defaults to the git ref name)"
        required: false
      force_all:
        description: "Rebuild EVERY component instead of re-tagging unchanged ones (WSK-69 escape hatch)"
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  packages: write # push images to GHCR
  id-token: write # Sigstore keyless signing + provenance (OIDC)
  attestations: write # actions/attest-build-provenance

jobs:
  # WSK-69 - decide BUILD vs RE-TAG per component. Needs full history + tags (fetch-depth 0, blobless:
  # only trees are diffed) and a GHCR login to look for the previous signed images (read-only).
  plan:
    runs-on: ubuntu-latest
    env:
      OWNER: ${{ github.repository_owner }}
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
      FORCE_ALL: ${{ github.event.inputs.force_all }}
    outputs:
      build: ${{ steps.plan.outputs.build }}
      retag: ${{ steps.plan.outputs.retag }}
      has_build: ${{ steps.plan.outputs.has_build }}
      has_retag: ${{ steps.plan.outputs.has_retag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Plan (build vs re-tag)
        id: plan
        run: |
          set -euo pipefail
          all=""
          [ "${FORCE_ALL:-false}" = "true" ] && all="--all"
          node scripts/ci/plan.mjs release --tag "$TAG" --owner "$OWNER" $all

  build-sign:
    needs: plan
    if: needs.plan.outputs.has_build == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # WSK-69: the list is no longer hand-maintained here. It is the `build` output of the plan job,
        # a subset of COMPONENTS in scripts/ci/config.mjs (the single list; add a component THERE).
        # History that used to live on the entries, kept because it still explains the shape:
        #   * webdesk-api (WSK-29) - webdesk/api/ NestJS service. NOT in deploy.yml's COMPONENTS on purpose
        #     (its own compose project); deployed by the deploy-webdesk job below (M4, 2026-10-12) onto
        #     webdesk/docker-compose.aicenter-release.yml.
        #   * webdesk-payload (WSK-28) - removed in WSK-48b with the Payload app (WSK-D37).
        #   * synthetic-prober (MON-09f) - lives under infra/observability/, see `context:` below. It is
        #     here because deploy.yml runs `up -d --no-build`: a service that exists only as a local
        #     `build:` has no image to start.
        component: ${{ fromJSON(needs.plan.outputs.build) }}
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/gaiada-${{ matrix.component }}
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # M6-P4r-a: the webdesk-api image carries the packed @gaiada/webdesk-blocks tarball. Pack it
      # BEFORE the build, with the Dockerfile's own `blocks` stage (so node, npm and the file list are
      # exactly the image's and the sha256 cannot differ from what the image builds), and hand its
      # sha256 + version to the real build as build-args. The Dockerfile re-checks them and fails the
      # build on a mismatch. The stage's layers stay in this job's builder cache, so the main build
      # reuses them. Skipped for every other component.
      - name: Pack the block library (webdesk-api)
        id: blocks
        if: matrix.component == 'webdesk-api'
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/blocks"
          docker buildx build -f webdesk/api/Dockerfile --target blocks-export --output "type=local,dest=$out" webdesk
          sha="$(cut -d' ' -f1 "$out/SHA256SUMS")"
          tgz="$(ls "$out"/gaiada-webdesk-blocks-*.tgz)"
          test "$(sha256sum "$tgz" | cut -d' ' -f1)" = "$sha"
          ver="$(basename "$tgz" .tgz)"
          ver="${ver#gaiada-webdesk-blocks-}"
          echo "block library $ver sha256 $sha"
          {
            echo "sha256=$sha"
            echo "version=$ver"
            echo "build_args<<BLOCKS_ARGS_EOF"
            echo "BLOCKS_SHA256=$sha"
            echo "BLOCKS_VERSION=$ver"
            echo "BLOCKS_ARGS_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          # Every component is a top-level directory EXCEPT synthetic-prober (observability stack,
          # under infra/) and webdesk-api (WSK-29 — webdesk/api/, a subdirectory of the webdesk/
          # Zone B project skeleton, not a top-level dir of its own). Handled with an expression
          # rather than by turning `component` into an object, because `matrix.component` must stay
          # a flat string: the GHCR prune step below builds `package-name: gaiada-${{ matrix.component }}`
          # from it, and the image name (`gaiada-webdesk-api`) is deliberately hyphenated even though
          # the source path (`webdesk/api`) is not — same convention synthetic-prober already sets.
          #
          # M6-P4r-a: webdesk-api's context is now ./webdesk (NOT ./webdesk/api), with the Dockerfile
          # at webdesk/api/Dockerfile. The image bakes in the block-library tarball (webdesk/blocks/)
          # and the contract generator inlines webdesk/delivery/vocabulary/, both siblings of api/.
          # webdesk/.dockerignore admits only api/, blocks/, delivery/. `file:` is set for that
          # component only; for every other component the expression is '' and docker/build-push-action
          # then passes no --file at all (it forwards `file` only when non-empty), so each keeps its
          # default <context>/Dockerfile.
          context: ${{ matrix.component == 'synthetic-prober' && './infra/observability/synthetic-prober' || matrix.component == 'webdesk-api' && './webdesk' || format('./{0}', matrix.component) }}
          file: ${{ matrix.component == 'webdesk-api' && './webdesk/api/Dockerfile' || '' }}
          # webdesk-api only (the pack step above leaves it empty for every other component):
          # BLOCKS_SHA256 / BLOCKS_VERSION. The Dockerfile re-packs the tarball itself and FAILS THE
          # BUILD if its sha256 or version differ from these, so the LABELs it sets are verified.
          build-args: ${{ steps.blocks.outputs.build_args }}
          push: true
          tags: ${{ env.IMAGE }}:${{ env.TAG }}
          provenance: false # we attach a richer SLSA attestation below
          sbom: false # we generate + attest the SBOM explicitly below
          # MON-09o-b: this build previously had NO cache-from/cache-to at all, so consecutive
          # release tags shared almost no layers on the VPS (measured: ~13 GB of app images for two
          # tags, because a diet-only fix caps a single image's size but does nothing about a
          # rebuild-from-scratch cost every tag). Registry cache, keyed PER COMPONENT: the cache ref
          # must be under `${{ env.IMAGE }}` (which already embeds `matrix.component`), never a
          # single shared `:buildcache` tag for the whole matrix — a shared ref would have every
          # component in this 9-way matrix overwrite the same cache manifest in parallel and each
          # job would mostly cache-miss against whichever sibling wrote last (or fail the OCI cache
          # export outright on the concurrent write). `mode=max` caches every intermediate layer
          # (not just the final stage), which is what makes an unchanged component's next tag a
          # near-zero-cost push instead of its full rebuild. `type=registry` (not `gha`) because the
          # cache must be visible to a manual `workflow_dispatch` re-run and to any future build,
          # not scoped to the Actions run/branch cache. This does not change what gets built, signed
          # or pushed — cache-from/to only affect layer reuse during the build step above cosign.
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE }}:buildcache,mode=max,image-manifest=true

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Generate SBOM (SPDX)
        if: matrix.component != 'report-renderer'
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: sbom.spdx.json

      # report-renderer is scoped to its SOURCE (package.json/package-lock.json under
      # ./report-renderer), not the built image — see the "SBOM SCOPING" note below the attest
      # step for why and the measured before/after numbers.
      #
      # SYFT_JAVASCRIPT_INCLUDE_DEV_DEPENDENCIES=true is REQUIRED, not cosmetic: `tsx` is listed
      # under devDependencies in report-renderer/package.json but is this image's actual CMD
      # (`npx tsx src/server.ts`) — syft drops devDependencies by default, which would silently
      # omit the real runtime entrypoint from the SBOM. The Dockerfile's `npm ci` has no
      # `--omit=dev`, so devDependencies are genuinely installed in the shipped image; the SBOM
      # should describe what's actually in the container, not just its "production" intent.
      - name: Generate SBOM (SPDX) — report-renderer, scoped to source
        if: matrix.component == 'report-renderer'
        uses: anchore/sbom-action@v0
        env:
          SYFT_JAVASCRIPT_INCLUDE_DEV_DEPENDENCIES: "true"
        with:
          path: ./report-renderer
          format: spdx-json
          output-file: sbom.spdx.json

      - name: Sign image (keyless)
        run: cosign sign --yes ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}

      # ── SBOM SCOPING (2026-08-06) — history + what changed ────────────────────────────────────
      #
      # This step failed RELIABLY for `report-renderer` on `alpha-01.017.0040a` — twice in a row,
      # each time after cosign's own 4 internal retries and ~2 minutes:
      #     POST https://rekor.sigstore.dev/api/v1/log/entries giving up after 4 attempt(s)
      # then SUCCEEDED on the `0040b` re-cut with no code change. That is fragility under Rekor
      # load, not a deterministic fault — worth stating plainly since an earlier pass at this
      # comment called it deterministic, which was wrong.
      #
      # Root cause: `report-renderer/Dockerfile` is the ONLY image in the estate built `FROM
      # mcr.microsoft.com/playwright:v1.61.1-noble` (it carries Chromium+Firefox+WebKit). SBOM'ing
      # the built image cataloged the whole base OS on top of the app: 826 packages (514 deb + ~306
      # npm + a few go/oci) at 17,080,639 bytes — by far the largest predicate of the nine
      # components, and Microsoft already owns that base image's own provenance; we don't control
      # or patch those OS packages ourselves, so cataloguing them added bulk without adding a
      # control.
      #
      # Fix: the "Generate SBOM (SPDX) — report-renderer, scoped to source" step above scans
      # `./report-renderer` directly (syft `dir:`, via anchore/sbom-action's `path` input) instead
      # of the built image, with `SYFT_JAVASCRIPT_INCLUDE_DEV_DEPENDENCIES=true` so the SBOM still
      # matches what `npm ci` actually installs into the container. Measured locally 2026-08-06
      # (syft 1.50.0, same base image, docker-archive scan of the built image vs dir scan of the
      # source): 17,080,639 bytes / 826 packages -> 451,910 bytes / 229 packages — a ~38x drop.
      # Spot-checked the scoped SBOM: `playwright`, `express`, `dotenv` (regular deps) and `tsx`,
      # `typescript`, `vitest`, `supertest` (dev deps, present because of the include-dev-deps flag
      # above) are all present as real packages with real versions.
      #
      # `continue-on-error` is REMOVED per the same sequencing already used below for SLSA
      # provenance: only pull the safety net once the fix is demonstrated, so a future genuine
      # attestation failure is loud again for every component, including this one.
      #
      # Honest limit of this proof: it is a local reproduction, not a real Rekor round-trip — the
      # actual test is the next release. A ~38x predicate reduction is a strong, directionally
      # correct fix for a size/load-based rejection, but if Rekor still rejects report-renderer's
      # (now much smaller) SBOM on the next cut, the release will now FAIL LOUD at this step
      # instead of silently degrading — that is the deliberate trade-off of removing the flag here.
      # If that happens, re-add `continue-on-error: true` to this step and reopen this note rather
      # than re-diagnosing from scratch.
      - name: Attest SBOM to the image (keyless)
        run: cosign attest --yes --type spdxjson --predicate sbom.spdx.json ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}

      # GitHub refuses attestations on user-owned PRIVATE repos ("Feature not available for
      # user-owned private repositories") — it needs a public repo or an org plan. Non-blocking
      # until then, because the controls deploy.yml actually ENFORCES are the two above (cosign
      # keyless signature + attested SBOM), and both succeed.
      #
      # ✅ 2026-08-05 RESOLVED: the outcome was observed rather than assumed, as intended. `0040a` failed
      # before reaching this step (Rekor would not take report-renderer's SBOM), so the check moved to the
      # `alpha-01.017.0040b` re-cut — where SLSA provenance succeeded on **all 9 components**. Precondition
      # met, so `continue-on-error` is now REMOVED: a future provenance failure is loud, which is the point.
      #
      # NOTE: the SBOM attestation step above went through the identical sequence — see the
      # "SBOM SCOPING (2026-08-06)" comment on that step for the report-renderer-specific history
      # and the before/after numbers that justified removing its `continue-on-error` too.
      - name: SLSA build provenance attestation
        uses: actions/attest-build-provenance@v1
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      # GHCR retention moved OUT of build-sign: see the `ghcr-prune` job at the bottom of this file.

  # WSK-69 - unchanged components: copy the previous release's signed image to the new tag, by DIGEST.
  # Nothing is rebuilt, re-signed or re-attested: the signature and SBOM attestation are bound to the
  # digest, which does not change. The digest is asserted unchanged after every copy, so a registry
  # that re-encoded the manifest would fail loudly here rather than at deploy.yml's cosign verify.
  retag:
    needs: plan
    if: needs.plan.outputs.has_retag == 'true'
    runs-on: ubuntu-latest
    env:
      OWNER: ${{ github.repository_owner }}
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
      RETAG: ${{ needs.plan.outputs.retag }}
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Re-tag unchanged components by digest
        run: |
          set -euo pipefail
          # `crane tag` re-points a tag at the EXISTING manifest bytes: nothing is copied or re-encoded, so the
          # digest (and the cosign .sig/.att keyed by it) is unchanged by construction. It replaced
          # `docker buildx imagetools create`, which (a) re-wrapped a single manifest into a new index unless
          # --prefer-index=false (346), and (b) walks the image's referrers while copying, so one pruned
          # attestation in report-renderer's `sha256-<digest>` referrers index failed 349's retag. crane is the
          # official go-containerregistry image, pinned by digest. It is DISTROLESS and runs as `nonroot`, so it never
          # reads /root/.docker: 351's retag failed `UNAUTHORIZED` with that mount. It runs as THIS user (the login file
          # is 0600 and the runner's) with DOCKER_CONFIG pointing at the mounted dir; reproduced and fixed on Linux
          # against GHCR with a file-based login (2026-10-11).
          crane() { docker run --rm --user "$(id -u):$(id -g)" -e DOCKER_CONFIG=/docker-config \
            -v "$HOME/.docker:/docker-config:ro" \
            gcr.io/go-containerregistry/crane@sha256:9162effd4c674ad2fa4e7170a894503ffff9114f15a57e75a0a32e111ad32d85 "$@"; }
          mapfile -t rows < <(printf '%s' "$RETAG" | jq -c '.[]')
          for row in "${rows[@]}"; do
            comp="$(jq -r .component <<<"$row")"
            from="$(jq -r .fromTag <<<"$row")"
            digest="$(jq -r .digest <<<"$row")"
            img="ghcr.io/${OWNER}/gaiada-${comp}"
            echo "::group::re-tag ${comp}: ${from} (${digest}) -> ${TAG}"
            crane tag "${img}@${digest}" "${TAG}"
            got="$(crane digest "${img}:${TAG}")"
            if [ "$got" != "$digest" ]; then
              echo "::error::${img}:${TAG} resolved to ${got}, expected ${digest} - the signature would NOT carry over. Re-run with force_all=true."
              exit 1
            fi
            echo "OK ${img}:${TAG} -> ${digest}"
            echo "::endgroup::"
          done

  # The single deploy point: once EVERY component is built, signed and attested, hand the
  # tag to deploy.yml. `git push --tags` is therefore the whole release-and-deploy action.
  # Deploy is still independently runnable (workflow_dispatch) for rollback.
  deploy:
    # WSK-69: build-sign and retag are each skipped when they have nothing to do, and a skipped `needs`
    # would skip deploy too - so run unless something FAILED or the run was cancelled. A failed plan,
    # build leg or re-tag still blocks the deploy exactly as a failed build leg always did.
    needs: [plan, build-sign, retag]
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') }}
    uses: ./.github/workflows/deploy.yml
    with:
      tag: ${{ github.event.inputs.tag || github.ref_name }}
    secrets: inherit

  # WebDesk's own deploy (M4 T4; wired in on the owner's decision 2026-10-12), AFTER the ERP deploy succeeded.
  # It is NOT in deploy.yml's COMPONENTS: that job runs `up --remove-orphans` against the `gaiada` project, and
  # WebDesk is its own compose project. deploy-webdesk.yml cosign-verifies gaiada-webdesk-api:<tag>, pulls it by
  # digest on the box, backs up, migrates (twice; the second must apply 0), swaps the api onto the release
  # overlay, health-checks and re-pins the previous image on a failed check. skip_if_current: most releases do
  # not touch WebDesk, and then it changes nothing (same digest running, no pending migration, identical tree)
  # instead of restarting the api for nothing. A WebDesk failure fails this job, never the ERP deploy above.
  deploy-webdesk:
    needs: [deploy]
    if: ${{ !cancelled() && needs.deploy.result == 'success' }}
    uses: ./.github/workflows/deploy-webdesk.yml
    with:
      tag: ${{ github.event.inputs.tag || github.ref_name }}
      mode: apply
      skip_if_current: true
    secrets: inherit

  # ── GHCR RETENTION (reference-aware; rewritten 2026-10-11) ────────────────────────────────────
  # History: nothing pruned the registry, private package storage hit the spending limit and every
  # Actions job stopped starting (594 versions by 2026-08-04). A first prune (actions/delete-package-
  # versions, `delete-only-untagged-versions`) then deleted the untagged CHILD manifest of a still-tagged
  # index (report-renderer sha256:249e5e4c lost sha256:f627854c; the tag became unpullable from GHCR).
  # "Untagged" is NOT "unreferenced". Also: deploy.yml verifies the cosign .sig/.att before deploy or
  # rollback, so a tagged image whose .sig/.att is pruned is undeployable.
  #
  # scripts/ci/ghcr-prune.mjs protects (to a fixed point) every tagged version, every child of a protected
  # index, the sha256-<digest>[.sig|.att] tags of protected digests, `subject`-linked manifests and the
  # buildcache; it NEVER deletes a tagged version and skips a whole package on any API/registry error.
  # Candidates are unreferenced AND older than 14 days.
  #
  # Runs only AFTER deploy succeeded (never races a release), and is DRY-RUN BY DEFAULT: the candidates
  # are listed in the job log. To turn deletion on set the repository VARIABLE GHCR_PRUNE_DELETE to "1"
  # (Settings > Secrets and variables > Actions > Variables); remove it or set it to anything else to
  # return to dry-run. Check a dry run's candidate list before flipping it.
  # `continue-on-error`: a retention failure must never fail a release that is already shipped.
  ghcr-prune:
    needs: [deploy]
    if: ${{ !cancelled() && needs.deploy.result == 'success' }}
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write # DELETE package versions (only used when GHCR_PRUNE_DELETE=1)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # GITHUB_TOKEN can only delete versions of packages linked to this repo; if GitHub answers 403 the
      # package is reported as skipped. A PAT with `delete:packages` in the GHCR_CLEANUP_TOKEN secret is used if set.
      - name: Prune unreferenced GHCR versions
        env:
          GH_TOKEN: ${{ secrets.GHCR_CLEANUP_TOKEN || secrets.GITHUB_TOKEN }}
          GHCR_OWNER: ${{ github.repository_owner }}
          PRUNE_DELETE: ${{ vars.GHCR_PRUNE_DELETE }}
        run: |
          if [ "$PRUNE_DELETE" = "1" ]; then
            GHCR_PRUNE_CONFIRM=delete node scripts/ci/ghcr-prune.mjs --delete --min-age-days 14
          else
            echo "GHCR_PRUNE_DELETE != 1: DRY RUN (nothing is deleted)"
            node scripts/ci/ghcr-prune.mjs --dry-run --min-age-days 14
          fi
