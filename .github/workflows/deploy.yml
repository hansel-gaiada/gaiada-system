# Single-point deploy to the VPS. Consumes the SIGNED images published by release.yml —
# the production box never compiles anything (see docs/blueprints/deployment-strategy.md).
#
# Two entry points:
#   1. Automatic — release.yml calls this via `workflow_call` once every image is built,
#      signed and attested. So `git push --tags` is the whole deploy.
#   2. Manual — `workflow_dispatch` with a tag. This is also the ROLLBACK path:
#      run it with the previous tag and the stack re-pins in seconds, no rebuild.
#
# Order is deliberate: verify signatures -> BACKUP -> pull -> migrate -> up -> health.
# Migrations only ever run after a successful backup, and a failed health check
# automatically re-pins the previously deployed tag.
#
# Required repo secrets: VPS_HOST, VPS_USER, VPS_SSH_KEY, VPS_SSH_KNOWN_HOSTS
# Required repo variable: DEPLOY_DIR (absolute path of the checkout on the VPS)
name: deploy

on:
  workflow_call:
    inputs:
      tag:
        description: "Image tag to deploy"
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to deploy (use a previous tag to roll back)"
        required: true
        type: string

# Never let two deploys race the same box. Do NOT cancel in progress — a half-applied
# migration is worse than a queued deploy.
concurrency:
  group: deploy-vps
  cancel-in-progress: false

permissions:
  contents: read
  packages: read
  id-token: write # cosign verification

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      TAG: ${{ inputs.tag }}
      OWNER: ${{ github.repository_owner }}
      DEPLOY_DIR: ${{ vars.DEPLOY_DIR }}
      # Which compose files the box runs. Default = the self-contained VPS stack. The
      # gda-aicenter trial adds the host-data overlay (Postgres/Redis/Ollama live on the host)
      # by setting COMPOSE_FILES to include docker-compose.hostdata.yml.
      COMPOSE_FILES: ${{ vars.COMPOSE_FILES || '-f docker-compose.vps.yml' }}
      # Optional lanes, comma-separated (data,bot,auth,multisite,whisper,jobs,mail-dev,scan).
      # Docker Compose reads COMPOSE_PROFILES natively, so this needs no --profile flags.
      # Empty = core only. mail-dev = MAIL-00 Mailpit sink; scan = MAIL-14 ClamAV — both MUST be
      # listed here (repo variable) or this job's `up -d --remove-orphans` deletes them.
      COMPOSE_PROFILES: ${{ vars.COMPOSE_PROFILES || '' }}
      COMPONENTS: >-
        wa-chat-bot mcp-hub ai-agents ai-gateway-go sync-engine-go
        search-crawl-go platform-nest platform-ui report-renderer
    steps:
      - uses: actions/checkout@v4

      # /VERSION is the single source of truth for the app version (docs/modules/VERSIONING.md).
      # The tag must be its lowercased, hyphenated form — a mismatch means someone tagged without
      # bumping, which would deploy a build that misreports itself on GET /health.
      - name: Resolve and verify app version
        id: version
        run: |
          set -euo pipefail
          APP_VERSION="$(tr -d '\r' < VERSION | head -1 | xargs)"
          expected="$(echo "$APP_VERSION" | tr '[:upper:] ' '[:lower:]-')"
          echo "VERSION file : $APP_VERSION"
          echo "expected tag : $expected"
          echo "actual tag   : $TAG"
          if [ "$TAG" != "$expected" ]; then
            echo "::error::Tag '$TAG' does not match /VERSION ('$APP_VERSION' => '$expected'). Bump /VERSION or retag."
            exit 1
          fi
          echo "app_version=$APP_VERSION" >> "$GITHUB_OUTPUT"

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      # cosign reads the Docker keychain, and GHCR packages are PRIVATE by default, so verifying
      # below fails with "UNAUTHORIZED: authentication required" without this. The job's
      # `packages: read` permission grants the right, but nothing was exchanging it for a token
      # on the RUNNER — the later GHCR login targets the VPS, not here.
      - name: Authenticate the runner to GHCR (for cosign)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Refuse to deploy anything that isn't the artifact our own release workflow signed.
      # This is the step that makes the WS10 supply-chain work actually load-bearing.
      - name: Verify image signatures
        run: |
          set -euo pipefail
          for c in $COMPONENTS; do
            img="ghcr.io/${OWNER}/gaiada-${c}:${TAG}"
            echo "::group::verify $img"
            cosign verify "$img" \
              --certificate-identity-regexp "https://github.com/${OWNER}/.+/.github/workflows/release.yml@.+" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              > /dev/null
            echo "OK $img"
            echo "::endgroup::"
          done

      - name: Set up SSH
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          # Pinned host key — never StrictHostKeyChecking=no on a deploy path.
          printf '%s\n' "${{ secrets.VPS_SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          cat >> ~/.ssh/config <<EOF
          Host vps
            HostName ${{ secrets.VPS_HOST }}
            User ${{ secrets.VPS_USER }}
            IdentityFile ~/.ssh/id_deploy
            IdentitiesOnly yes
          EOF
          chmod 600 ~/.ssh/config

      # Ship compose + scripts only. The VPS keeps its own .env (secrets never leave the box)
      # and never needs application source, since it no longer builds.
      # Ships compose + scripts + every path the compose files BIND-MOUNT. Missing a mount source
      # does not fail loudly: Docker silently creates an empty DIRECTORY in its place, so Postgres
      # skips an "init script" that is really a folder (leaving roles uncreated -> auth failures
      # that look like a bad password), and Cerbos crash-loops on a config it cannot find.
      # Keep this list in sync with the `- ../../` and `- ./` volume entries in the compose files.
      - name: Sync compose files, scripts and mounted config
        run: |
          set -euo pipefail
          ssh vps "mkdir -p '${DEPLOY_DIR}/infra/compose' '${DEPLOY_DIR}/infra/scripts' \
                            '${DEPLOY_DIR}/infra/observability' '${DEPLOY_DIR}/infra/db' \
                            '${DEPLOY_DIR}/platform-nest/cerbos'"
          scp infra/compose/*.yml vps:"${DEPLOY_DIR}/infra/compose/"
          scp infra/scripts/*.sh vps:"${DEPLOY_DIR}/infra/scripts/"
          scp infra/db/*.sh vps:"${DEPLOY_DIR}/infra/db/"
          rsync -az -e ssh infra/observability/ vps:"${DEPLOY_DIR}/infra/observability/"
          # Cerbos config + versioned policy repo (bind-mounted read-only at /config and /policies).
          #
          # ⚠ `--delete` IS LOAD-BEARING, added 2026-08-12 after it took production down.
          # Without it this rsync only ever ADDS and OVERWRITES, so a policy file DELETED in git
          # lived on forever on the box. Cerbos compiles its whole policy repo at startup and
          # REFUSES TO START on any compilation error — so the deploy that retired `team_lead`
          # shipped a `derived_roles.yaml` without it while the server kept a stale
          # `resource_team.yaml` that still referenced it:
          #
          #   resource_team.yaml:24:22: Derived role "team_lead" is not defined in any imports
          #
          # Cerbos crash-looped 41 times; authorization was down platform-wide until the orphan file
          # was removed by hand. Nothing in CI could have caught it — locally the file was gone, so
          # `cerbos compile` passed. The broken state existed ONLY in the union of new-plus-stale
          # files that the server assembled, which is precisely what `--delete` prevents.
          #
          # Safe here because this is a full mirror of a directory the deploy owns end to end
          # (`cerbos.yaml` + `policies/`); nothing on the box writes into it.
          rsync -az --delete -e ssh platform-nest/cerbos/ vps:"${DEPLOY_DIR}/platform-nest/cerbos/"
          # Keycloak realm import (bind-mounted at /opt/keycloak/data/import).
          if [ -d infra/compose/keycloak ]; then
            rsync -az -e ssh infra/compose/keycloak/ vps:"${DEPLOY_DIR}/infra/compose/keycloak/"
          fi
          ssh vps "chmod +x '${DEPLOY_DIR}/infra/scripts/'*.sh '${DEPLOY_DIR}/infra/db/'*.sh"
          # Fail loudly here rather than let Docker paper over a missing mount with an empty dir.
          ssh vps "test -f '${DEPLOY_DIR}/infra/db/init-bot.sh' \
                && test -f '${DEPLOY_DIR}/infra/db/init-cluster.sh' \
                && test -f '${DEPLOY_DIR}/platform-nest/cerbos/cerbos.yaml' \
                || { echo 'mounted config missing after sync'; exit 1; }"

      - name: Record currently deployed tag
        id: prev
        run: |
          set -euo pipefail
          prev="$(ssh vps "cat '${DEPLOY_DIR}/.deployed-tag' 2>/dev/null || true")"
          echo "tag=${prev}" >> "$GITHUB_OUTPUT"
          echo "Previously deployed: ${prev:-<none>}"

      - name: Authenticate the VPS to GHCR
        run: |
          set -euo pipefail
          # Short-lived job token — no long-lived registry PAT is stored on the box.
          echo '${{ secrets.GITHUB_TOKEN }}' \
            | ssh vps "docker login ghcr.io -u '${{ github.actor }}' --password-stdin"

      # ⚠ The box's .env is consumed TWO WAYS, and the two grammars disagree. `docker compose` parses
      # it itself, so `NAME=Gaiada Dev <a@b>` is a perfectly good literal and the stack runs. The
      # backup gate below SOURCES the same file in bash, where `<a@b>` is a redirection — so an
      # unquoted value with a space or `< > | & ; ( ) $ \`` is a syntax error there and nowhere else.
      #
      # On 2026-08-06 a hand-added MAIL_STREAM_*_FROM pair (never mirrored into .env.example) did
      # exactly this: it killed the backup step of an otherwise-green release, which tripped the
      # rollback and reverted a good deploy. The only clue in the log was
      #     ./infra/compose/.env: line 97: syntax error near unexpected token `newline'
      # with no statement of which variable, which consumer, or why compose had been happy with it.
      #
      # Checking it here turns that into an immediate, self-explaining stop BEFORE anything is
      # backed up, pulled, migrated or rolled back. Values are redacted from the output — bash prints
      # the offending line verbatim, and that line is by definition a config value.
      - name: Validate the box's .env is shell-sourceable
        run: |
          set -uo pipefail
          if ! ssh vps "bash -n '${DEPLOY_DIR}/infra/compose/.env'" 2>/tmp/envcheck.err; then
            echo "::error::${DEPLOY_DIR}/infra/compose/.env cannot be sourced by bash, which the backup gate and migration steps both require. Quote any value containing a space or any of < > | & ; ( ) \$ \` — docker compose accepts it unquoted, bash does not."
            sed -E 's/=.*/=<value redacted>/' /tmp/envcheck.err || true
            exit 1
          fi
          echo "OK: the box's .env can be sourced by both consumers."

      # PG_HOST is read from the box's own .env so backup.sh knows whether the core cluster is a
      # container to exec into or a host cluster to dump directly.
      - name: Backup databases (gate for migrations)
        run: ssh vps "cd '${DEPLOY_DIR}' && set -a && . ./infra/compose/.env && set +a && ./infra/scripts/backup.sh"

      - name: Pull images
        run: |
          set -euo pipefail
          ssh vps "cd '${DEPLOY_DIR}/infra/compose' && GAIADA_TAG='${TAG}' GHCR_OWNER='${OWNER}' APP_VERSION='${{ steps.version.outputs.app_version }}' \
            COMPOSE_PROFILES='${COMPOSE_PROFILES}' docker compose ${COMPOSE_FILES} pull"

      # Migrations run from the newly pulled platform image, as platform_owner
      # (MIGRATE_DATABASE_URL), before any service starts on the new schema.
      - name: Run migrations
        run: |
          set -euo pipefail
          ssh vps "cd '${DEPLOY_DIR}/infra/compose' && GAIADA_TAG='${TAG}' GHCR_OWNER='${OWNER}' APP_VERSION='${{ steps.version.outputs.app_version }}' \
            COMPOSE_PROFILES='${COMPOSE_PROFILES}' docker compose ${COMPOSE_FILES} run --rm --no-deps platform node dist/db/migrate.js"

      - name: Start services
        run: |
          set -euo pipefail
          ssh vps "cd '${DEPLOY_DIR}/infra/compose' && GAIADA_TAG='${TAG}' GHCR_OWNER='${OWNER}' APP_VERSION='${{ steps.version.outputs.app_version }}' \
            COMPOSE_PROFILES='${COMPOSE_PROFILES}' docker compose ${COMPOSE_FILES} up -d --no-build --remove-orphans"

      # CP-18 — force Cerbos to re-read its policy repo.
      #
      # `up -d` does NOT restart cerbos: its image and its compose definition are unchanged by a policy
      # edit, so compose correctly sees nothing to do. That leaves the reload to
      # `watchForChanges: true`, and there are two ways that quietly fails:
      #   * `rsync` writes a temp file and RENAMES it into place. The disk driver watches for changes,
      #     and a rename is not a modify — whether it is picked up depends on the inotify events the
      #     driver subscribes to.
      #   * A brand-new policy FILE has been observed not to be picked up at all through a bind mount.
      #
      # The failure mode is the reason this is worth a step of its own: an unloaded policy is not an
      # error anywhere. Cerbos keeps serving the OLD policy, so a resource kind or action it has not
      # heard of is DENIED — and the endpoint 403s for every user while every log line looks healthy.
      # It reads exactly like an application authorization bug, and it has cost a debugging session
      # before. A restart is ~1s and removes the whole question.
      #
      # Placed after `up -d` so a cerbos container that was just recreated is not restarted twice, and
      # before the health gate so a policy repo that fails to parse fails THIS deploy rather than
      # silently denying in production.
      - name: Reload Cerbos policies
        run: |
          set -euo pipefail
          ssh vps "cd '${DEPLOY_DIR}/infra/compose' && GAIADA_TAG='${TAG}' GHCR_OWNER='${OWNER}' \
            COMPOSE_PROFILES='${COMPOSE_PROFILES}' docker compose ${COMPOSE_FILES} restart cerbos"

      - name: Wait for health
        id: health
        run: |
          set -euo pipefail
          ssh vps "cd '${DEPLOY_DIR}/infra/compose' && GAIADA_TAG='${TAG}' GHCR_OWNER='${OWNER}' APP_VERSION='${{ steps.version.outputs.app_version }}' \
            COMPOSE_PROFILES='${COMPOSE_PROFILES}' COMPOSE_FILES='${COMPOSE_FILES}' bash -s" <<'REMOTE'
          set -euo pipefail
          C="docker compose ${COMPOSE_FILES}"
          for i in $(seq 1 60); do
            # Any container that declares a healthcheck and is not yet healthy, or is not running.
            #
            # ⚠ `-a` IS LOAD-BEARING, added 2026-08-12 after this gate passed through an outage.
            # Plain `docker compose ps` lists only RUNNING containers. A crash-looping service is in
            # state `restarting`, so it was omitted from the listing entirely — `bad` came back empty
            # and this loop printed "all services healthy" while Cerbos was failing to start on a
            # policy compilation error, 41 restarts deep, with authorization down platform-wide.
            # The awk filter was correct all along ($2!="running" would have caught `restarting`);
            # it simply never saw the row. A gate that cannot observe the failure it screens for is
            # worse than no gate, because the green tick is taken as evidence.
            #
            # With `-a`, an exited or restarting service is listed and therefore flagged, so the
            # deploy fails here — which is exactly what the "Reload Cerbos policies" step above says
            # is supposed to happen ("a policy repo that fails to parse fails THIS deploy rather than
            # silently denying in production"). That promise was untrue until this flag.
            bad="$($C ps -a --format '{{.Service}} {{.State}} {{.Health}}' \
                   | awk '$2!="running" || ($3!="" && $3!="healthy") {print $1}')"
            if [ -z "$bad" ]; then echo "all services healthy"; exit 0; fi
            echo "waiting on: $(echo $bad | tr '\n' ' ')"
            sleep 5
          done
          echo "TIMED OUT waiting for: $bad"
          $C ps
          exit 1
          REMOTE

      # Two records, because they are read by different things and only one of them was ever written.
      #
      # `.deployed-tag` is this workflow's own memory (the rollback target).
      #
      # `.env`'s GAIADA_TAG/APP_VERSION are what a HUMAN running `docker compose up -d` on the box
      # gets — and nothing has ever updated them, so they drift to whatever was last set by hand. That
      # is not cosmetic: compose substitutes GAIADA_TAG into every image reference, so a stale value
      # means the next `up -d` for ANY reason (adding a service, restarting one, editing a profile)
      # silently ROLLS THE WHOLE STACK BACK to an old tag, and APP_VERSION then makes /health report a
      # version that is not running. Observed drifting on both deploys of 2026-08-06 and corrected by
      # hand each time; written here so it stops being a manual step that gets forgotten.
      #
      # APP_VERSION contains spaces, so it MUST stay quoted — the precheck above now enforces that
      # for the whole file, and this write is one of the few things that could violate it.
      - name: Record deployed tag
        run: |
          set -euo pipefail
          ssh vps "echo '${TAG}' > '${DEPLOY_DIR}/.deployed-tag'"
          ssh vps "cd '${DEPLOY_DIR}/infra/compose' \
            && sed -i -E 's|^GAIADA_TAG=.*|GAIADA_TAG=${TAG}|' .env \
            && sed -i -E 's|^APP_VERSION=.*|APP_VERSION=\"${{ steps.version.outputs.app_version }}\"|' .env \
            && bash -n .env"
          echo "Recorded ${TAG} in .deployed-tag and in the box's .env (GAIADA_TAG + APP_VERSION)."

      # Retention. Nothing else prunes release images, and each deploy adds nine — one of them
      # (report-renderer, a headless-Chrome image) is ~3.6GB. On 2026-08-03 that silently filled
      # gda-aicenter's 49GB disk to 100%: eleven tags were resident, `docker system df` reported
      # 21.9GB reclaimable, and the box could no longer write a single byte. The deploy that found
      # it had ALREADY passed its health check and was undone by the one-line `.deployed-tag` write
      # failing on the full disk.
      #
      # Keeps this tag and the previous one, because the previous tag is the rollback target and
      # deleting it would turn a bad deploy into an outage. Everything older is re-pullable from
      # GHCR, so this trades a slower rare rollback-to-ancient-tag for a disk that cannot fill.
      # Non-fatal on purpose: housekeeping must never fail a healthy deploy — that is the exact
      # class of bug the rollback condition below was changed to stop.
      - name: Prune superseded images
        if: always() && steps.health.outcome == 'success'
        continue-on-error: true
        run: |
          ssh vps "KEEP='${TAG} ${{ steps.prev.outputs.tag }}'; \
            for img in \$(docker images 'ghcr.io/${OWNER}/gaiada-*' --format '{{.Repository}}:{{.Tag}}'); do \
              keep=no; for k in \$KEEP; do [ \"\${img##*:}\" = \"\$k\" ] && keep=yes; done; \
              [ \"\$keep\" = no ] && docker rmi \"\$img\" >/dev/null 2>&1 && echo \"pruned \$img\"; \
            done; df -h / | tail -1" || echo "::warning::image prune failed (non-fatal)"

      # Automatic rollback: re-pin the previous tag. Images are already on the box,
      # so this is a container restart, not a rebuild. Schema is NOT rolled back —
      # migrations are forward-only by design; the backup above is the escape hatch.
      #
      # Gated on the HEALTH step specifically, not on `failure()` alone. `failure()` fires for ANY
      # earlier step, which on 2026-08-03 meant the trivial `.deployed-tag` write failing on a full
      # disk rolled back a deploy whose services were already up and healthy — a bookkeeping error
      # reverting a good release. If health never ran (backup/migrate/pull failed) its outcome is
      # `skipped`, which is also not `success`, so those still roll back as before.
      - name: Roll back on failure
        if: failure() && steps.health.outcome != 'success' && steps.prev.outputs.tag != ''
        run: |
          set -euo pipefail
          echo "::error::Deploy of ${TAG} failed — rolling back to ${{ steps.prev.outputs.tag }}"
          ssh vps "cd '${DEPLOY_DIR}/infra/compose' && GAIADA_TAG='${{ steps.prev.outputs.tag }}' GHCR_OWNER='${OWNER}' \
            COMPOSE_PROFILES='${COMPOSE_PROFILES}' docker compose ${COMPOSE_FILES} up -d --no-build --remove-orphans"
          echo "::warning::Rolled back to ${{ steps.prev.outputs.tag }}. Schema was NOT reverted — check migrations."

      - name: Summary
        if: always()
        run: |
          {
            echo "### Deploy \`${TAG}\`"
            echo ""
            echo "- Previous tag: \`${{ steps.prev.outputs.tag || 'none' }}\`"
            echo "- Result: **${{ job.status }}**"
          } >> "$GITHUB_STEP_SUMMARY"
