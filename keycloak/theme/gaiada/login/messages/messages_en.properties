# Overrides of keycloak.v2's English texts. The realm's own localization texts (Realm settings > Localization) win over
# these; keycloak-passkey-realm.sh sets one there: rememberMe = "This is my own device" (PID-D10).

# PID-D9: the sign-in field takes a username or a phone number (an email still works, unadvertised).
usernameOrEmail=Username or phone number
# ONE text for a wrong name or number, a wrong password and a locked account, as Keycloak's own English has it: a locked
# account that read differently would tell a guesser that the number belongs to someone. Change all three together
# (the e2e "f locked" checks the locked text against this one).
invalidUserMessage=Invalid username, phone number or password.
accountTemporarilyDisabledMessage=Invalid username, phone number or password.
accountPermanentlyDisabledMessage=Invalid username, phone number or password.

# PID-D15: shown instead of the "Sign out from other devices" checkbox on the new-password page.
gaiadaLogoutOtherSessionsAlways=When you save your new password, every other device signed in to your account is signed out.
