# /etc/nginx/conf.d/erp-legacy-name-log.conf (hand-applied; http context, so both access_log lines stay active).
# ERP names Phase B4, compressed to ~48 h (owner ruling 2026-10-12, M4): log EVERY request that arrives on the
# legacy name erp.gaiada.online, so "no caller is left" is a measurement, not a two-week wait. The main access
# log has no Host field. $erp_legacy_host and $erp_legacy_keep are the maps in sites-enabled/erp.gaiada.online
# (keep=1 marks the exception paths: webhooks, mail, n8n, idp, .well-known). Remove this file at B4's end.
log_format erplegacy '$time_iso8601 $remote_addr "$request_method $uri" $status keep=$erp_legacy_keep "$http_user_agent"';
access_log /var/log/nginx/erp-legacy-name.log erplegacy if=$erp_legacy_host;
