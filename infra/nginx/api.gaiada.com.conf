# Public WebDesk delivery host: /v1, /forms, /media on api.gaiada.com (WSK-D43 as amended 2026-10-11).
# STAGED in /etc/nginx/sites-available on gda-aicenter; enable it only once the A record resolves, then run
# certbot --nginx (which adds the 443 server and the 80->443 redirect). Port 80 here exists for that first run.
#
# ── TOKENS IN THE URL ARE NEVER LOGGED ───────────────────────────────────────────────────────────────
# Two public routes carry a bearer token in the PATH: preview links (WSK-46, `/v1/t/:tenant/preview/:token`)
# and media upload links (WSK-43a, `/v1/t/:tenant/media/upload/:token`). The api redacts them in its own
# logs and Caddy writes no access log, but nginx's default access log records `$request` verbatim. So this
# host logs through `webdesk_redacted`: the token segment becomes `[redacted]`. The Referer is logged WITHOUT
# its query string, because the site's preview page carries the token as `?t=` and the browser sends that
# page as the Referer of its /v1 call. Residual: nginx's ERROR log quotes the request line on upstream errors;
# keep that file root-only.
#
# `map` and `log_format` live at the top of this file because sites-enabled/* is included in the http block.
map $request_uri $webdesk_redacted_uri {
    "~^(?<wd_pre>/v1/t/[^/]+/(?:preview|media/upload)/)[^/?]+(?<wd_rest>.*)$"  "${wd_pre}[redacted]${wd_rest}";
    default  $request_uri;
}
map $http_referer $webdesk_redacted_referer {
    "~^(?<wd_ref>[^?]*)\?"  "${wd_ref}?[redacted]";
    default  $http_referer;
}
log_format webdesk_redacted '$remote_addr - $remote_user [$time_local] '
                            '"$request_method $webdesk_redacted_uri $server_protocol" $status $body_bytes_sent '
                            '"$webdesk_redacted_referer" "$http_user_agent"';

server {
    listen 80;
    listen [::]:80;
    server_name api.gaiada.com;

    access_log /var/log/nginx/api.gaiada.com.access.log webdesk_redacted;
    error_log  /var/log/nginx/api.gaiada.com.error.log;

    location /.well-known/acme-challenge/ { root /var/www/html; }

    # Never public: Payload's old admin and GraphQL paths, and the control plane (served only on the internal
    # mTLS vhost control.webdesk.internal).
    location ~ ^/(admin|api/graphql|control)(/|$) {
        return 404;
    }

    location / {
        proxy_pass         http://127.0.0.1:8380;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "";
        # WSK-63a: a public request can never present the control channel's gate or mTLS headers.
        proxy_set_header   X-Webdesk-Control-Gate  "";
        proxy_set_header   X-Webdesk-Mtls-Cert-Pem "";
        proxy_read_timeout 60s;
        client_max_body_size 25m;
    }
}
