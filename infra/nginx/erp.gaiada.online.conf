# Gaiada ERP trial — proxies to platform-ui on the host loopback (:3005).
# TLS is added by certbot below; this block is the pre-cert / ACME-challenge form.
#

# Conditional websocket upgrade for n8n's editor push channel. The `location /` block below
# hardcodes Connection: upgrade, which Next.js tolerates; n8n does not — a permanent upgrade
# header breaks keep-alive on its ordinary REST calls.
map $http_upgrade $n8n_connection_upgrade {
    default upgrade;
    ''      close;
}

# Presence (not validity) of n8n's session cookie. Matched off the raw Cookie header on
# purpose: the cookie is named "n8n-auth" and nginx does NOT translate the dash, so
# $cookie_n8n_auth silently evaluates to the empty string for everyone — which reads as
# "nobody is ever logged in". Used only as a routing hint; see `location = /n8n/`.
map $http_cookie $n8n_has_session {
    default                 0;
    "~*(^|;\s*)n8n-auth="   1;
}

server {
    server_name erp.gaiada.online;

    location /.well-known/acme-challenge/ { root /var/www/html; }


    # Keycloak, mounted at /idp (KC_HTTP_RELATIVE_PATH). Deliberately NOT /auth: platform-ui
    # already serves /auth/login and /auth/callback, and shadowing those breaks the very flow
    # before anyone can authenticate.
    location /idp/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  443;
        proxy_buffer_size 16k;
        proxy_buffers 8 16k;
    }

    # =================================================================================
    # n8n automation console, mounted at /n8n/.
    #
    # READ THIS BEFORE TOUCHING proxy_pass. n8n 2.30.4's subpath support is half-built and
    # the asymmetry IS the design here:
    #   - N8N_PATH=/n8n/ makes it EMIT /n8n/-prefixed URLs. index.html references
    #     /n8n/assets/*, /n8n/static/*, /n8n/favicon.ico, and it ships
    #     `window.BASE_PATH = '/n8n/'`, which the SPA prepends to its REST calls too.
    #   - but it SERVES all of that at its own root: /assets/*, /static/*, /rest/*,
    #     /types/*, /webhook/*. Ask n8n itself for /n8n/assets/index-*.js and you get
    #     200 + text/html — the SPA fallback, not the bundle, and a blank editor.
    # So nginx STRIPS the prefix on the way in (proxy_pass WITH a trailing slash) and the two
    # halves line up: browser asks /n8n/rest/x, n8n answers /rest/x. Dropping that trailing
    # slash silently breaks the editor while /n8n/ still returns 200 — the worst failure shape.
    #
    # Guarded vs open:
    #   GUARDED — the editor and its /rest + /types API is an admin console holding
    #     HUB_SERVICE_TOKEN, PLATFORM_SERVICE_TOKEN and WhatsApp credentials; compromise
    #     there is total, so it gets a second gate on top of n8n's own login. Note the plain
    #     `location /n8n/`, NOT `^~`: `^~` would suppress the regex blocks below and put
    #     basic auth in front of the triggers.
    #   OPEN — webhook/form/mcp triggers are called by external systems and by the platform
    #     event bridge, and authenticate with their own shared secrets (N8N_BRIDGE_SECRET,
    #     INGEST_SECRET). Basic auth there would 401 every trigger SILENTLY: the bridge
    #     treats 4xx as "delivered" and acks, dropping events with no retry and no error.
    #
    # In-cluster callers are unaffected and must stay on http://n8n:5678 with no prefix —
    # see infra/compose/.env.example (AUTOMATION_URL, N8N_WEBHOOK_BASE_URL).
    # =================================================================================

    # The URL n8n prints in its own startup log has no trailing slash.
    location = /n8n { return 301 https://$host/n8n/; }

    # ---- the two halves of n8n's double-prefix bug --------------------------------------
    # Signing in from /n8n/ used to land on /n8n/n8n/ and show n8n's own 404. Cause: the SPA
    # builds its post-login target from the FULL browser pathname (already containing /n8n/)
    # and then prepends BASE_PATH again. The login itself always SUCCEEDED — session, deep
    # links, reloads and the editor all work — so this is purely a bad landing URL.
    #
    # (a) Remove the trigger. An unauthenticated hit on /n8n/ is sent straight to the sign-in
    # page, so the SPA never appends the ?redirect= param that it later mangles; with no
    # param, post-login routing is correct. The cookie test is a ROUTING HINT ONLY — n8n
    # still validates the session itself, and a forged cookie just gets proxied and rejected.
    location = /n8n/ {
        if ($n8n_has_session = 0) { return 302 https://$host/n8n/signin; }
        auth_basic           "Gaiada automation";
        auth_basic_user_file /etc/nginx/.htpasswd-erp;
        proxy_pass http://127.0.0.1:5678/;
        include snippets/gaiada-n8n-proxy.conf;
    }

    # (b) Safety net for any path that still doubles up (e.g. an expired-cookie edge case, or
    # a stale bookmark). Server-side only — it cannot catch the SPA's client-side history
    # push, which is exactly why (a) exists. Converges: /n8n/n8n/n8n/ -> /n8n/.
    location ~ ^/n8n/n8n(/.*)?$ {
        return 301 https://$host/n8n$1$is_args$args;
    }

    # OAuth2 credential callback: an external provider redirects the BROWSER here and that
    # redirect cannot be relied on to carry basic-auth credentials. Exact match, so it
    # outranks the guarded prefix below.
    location = /n8n/rest/oauth2-credential/callback {
        proxy_pass http://127.0.0.1:5678/rest/oauth2-credential/callback;
        include snippets/gaiada-n8n-proxy.conf;
    }

    # OPEN — triggers, and the ONLY place they are served. A regex location may not take a
    # proxy_pass with a URI part, hence the explicit rewrite to strip the prefix instead.
    #
    # COUPLED TO automation/.env: N8N_WEBHOOK_URL must be https://erp.gaiada.online/n8n/ so the
    # URLs n8n prints in the editor's "Production URL" field are the ones that actually resolve.
    # These eight names used to ALSO be proxied at the ERP root, because N8N_WEBHOOK_URL was the
    # bare origin. That handed n8n eight top-level path segments of the ERP's own namespace: the
    # day a platform-ui route lands under /form or /mcp it is silently answered by n8n instead,
    # and the collision is invisible until someone reports a 404 on a page that exists. The
    # trigger surface is reachable under the prefix, so the root duplicates bought nothing but
    # that risk. Anything external that was handed a root-form trigger URL must be re-pointed at
    # the /n8n/ form (verified none had been, at the time this was narrowed).
    location ~ ^/n8n/(webhook|webhook-test|webhook-waiting|form|form-test|form-waiting|mcp|mcp-test)(/|$) {
        rewrite ^/n8n/(.*)$ /$1 break;
        proxy_pass http://127.0.0.1:5678;
        include snippets/gaiada-n8n-proxy.conf;
    }

    # GUARDED — the editor plus everything it calls (/rest, /types, assets, static).
    location /n8n/ {
        auth_basic           "Gaiada automation";
        auth_basic_user_file /etc/nginx/.htpasswd-erp;
        proxy_pass http://127.0.0.1:5678/;   # trailing slash strips /n8n/ — see above
        include snippets/gaiada-n8n-proxy.conf;
    }

    # CP-5 — the client portal's Server-Sent Events stream. An EXACT-path location so it takes
    # precedence over `location /` without a regex, and so nothing else can accidentally inherit these
    # settings.
    #
    # WHY THIS BLOCK EXISTS AT ALL, given the endpoint already sends `X-Accel-Buffering: no` (which
    # nginx honours, so the stream works without any vhost change): the two settings BELOW cannot be
    # expressed from the application side.
    #
    #   1. `proxy_read_timeout`. nginx's default is 60s of silence before it closes an upstream
    #      connection. The backend heartbeats every 25s, so the default would in fact hold — but the
    #      margin is one missed beat, and a GC pause or a slow tick would drop the connection. The
    #      browser reconnects, so the symptom is not an outage: it is a portal that "goes quiet
    #      sometimes", which is the hardest class of bug to get reported accurately.
    #   2. `Connection`. `location /` hardcodes `Connection: upgrade` for Next's streaming. On a plain
    #      SSE GET that header is wrong — it asks the upstream to switch protocols for a request that
    #      is an ordinary keep-alive response — so it is cleared here.
    #
    # `proxy_buffering off` is the belt to the app's braces: if a future change drops the
    # X-Accel-Buffering header, this keeps the stream flowing rather than silently delivering nothing
    # until the buffer fills. An SSE endpoint behind a buffering proxy looks EXACTLY like an endpoint
    # that emits no events, which is why both mechanisms are worth having.
    location = /api/portal/stream {
        proxy_pass http://127.0.0.1:3005;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Connection        "";
        proxy_buffering off;
        proxy_cache off;
        # Comfortably longer than the backend's 30-minute connection rotation, so the SERVER decides
        # when a stream ends (and therefore when access is re-authorized) rather than the proxy.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        # Nothing about SSE should be gzipped: the compressor reintroduces buffering.
        gzip off;
    }

    location / {

        proxy_pass http://127.0.0.1:3005;
        # platform-ui builds absolute redirects from its own bind address, so the OIDC callback
        # sends the browser to https://<container-id>:3005/ -- authentication succeeds and then
        # lands nowhere. Rewrite any absolute Location back onto the public origin. Scoped to this
        # location so Keycloak's own /idp redirects are untouched.
        proxy_redirect ~^https?://[^/]+(/.*)$ https://erp.gaiada.online$1;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        # Next.js server actions / streaming
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_read_timeout 300s;
    }

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/erp.gaiada.online/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/erp.gaiada.online/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}

server {
    if ($host = erp.gaiada.online) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name erp.gaiada.online;
    return 404; # managed by Certbot


}
