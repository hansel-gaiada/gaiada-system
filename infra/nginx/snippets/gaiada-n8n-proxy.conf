# Common proxy settings for n8n (the gaiada-automation stack, published on the host
# loopback at 127.0.0.1:5678). Included by every location in n8n.gaiada.online.conf.
# Install to /etc/nginx/snippets/gaiada-n8n-proxy.conf.
#
# Deliberately omits TWO things, because they differ per including block:
#   - proxy_pass: some blocks strip the /n8n/ prefix (trailing slash) and some must not.
#   - auth_basic: the n8n surface splits into a guarded admin half and an open trigger
#     half, and each including block decides which it is.
proxy_http_version 1.1;
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host  $host;
# The editor's push channel (/rest/push) is a long-lived websocket. Conditional upgrade via
# the $n8n_connection_upgrade map — a hardcoded `Connection: upgrade` breaks keep-alive on
# n8n's ordinary REST calls.
proxy_set_header Upgrade           $http_upgrade;
proxy_set_header Connection        $n8n_connection_upgrade;
# Streams the push channel instead of buffering it into silence.
proxy_buffering off;
proxy_read_timeout 3600s;
proxy_send_timeout 3600s;
# Workflow import/export and binary-data uploads exceed nginx's 1m default.
client_max_body_size 100m;
