# ERP names Phase B: the legacy-name redirect is ON. Installed as snippets/erp-legacy-redirect.conf by
# scripts/phaseb/erp-name-cutover.sh once erp.gaiada.com is proven. $erp_legacy_redirect is 1 only for a
# GET/HEAD on erp.gaiada.online outside the kept paths (see the maps at the top of the vhost).
if ($erp_legacy_redirect) {
    return 301 https://erp.gaiada.com$request_uri;
}
