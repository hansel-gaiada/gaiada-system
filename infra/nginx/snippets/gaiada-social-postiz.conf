# SMM-04 — edge ingress for the contained Postiz engine. STATUS: PROTOTYPED, NOT APPLIED.
#
# HOW TO USE THIS FILE. It is NOT a drop-in `include` on its own — it holds the two `location`
# blocks that must be pasted into the `server {}` of erp.gaiada.online.conf, plus the reasoning
# that must survive with them. nginx config on this estate is hand-applied and never synced by
# CI (same as the CP-5 portal SSE block and the ASST-09 assistant block), so this file is the
# reviewed source and the box is a copy of it.
#
# ─────────────────────────────────────────────────────────────────────────────────────────────
# READ THIS FIRST: the preferred design exposes NOTHING of Postiz, and needs NONE of this.
# ─────────────────────────────────────────────────────────────────────────────────────────────
# Design §03 requires a public inbound door only because the networks demand a publicly
# reachable OAuth redirect URI. SMM-04 verified where Postiz points that URI: it builds
# `${FRONTEND_URL}/integrations/social/<provider>` and replays the identical string in the token
# exchange (tiktok.provider.ts:325-355). That target is a POSTIZ FRONTEND PAGE — so honouring
# it publicly means serving Postiz's own frontend to a browser, which directly contradicts
# containment invariant 5 ("Postiz frontend never served to anyone") and re-opens the AGPL
# frontend-JS conveyance vector §06 closed on purpose.
#
# The way out is config, not a fork: point FRONTEND_URL at a path WE serve
# (e.g. https://erp.gaiada.online/social), let platform-ui own
# `/social/integrations/social/<provider>`, catch the `code`, and hand it to Postiz's backend
# over the loopback API — `POST /integrations/social-connect/{integration}` exists for exactly
# this, and `GET /integrations/social/{integration}` accepts a `redirectUrl` parameter.
# Then Postiz stays entirely on 127.0.0.1 and the edge needs no Postiz location at all.
#
# THIS IS NOT YET VERIFIED end to end — it needs a real network app credential, which SMM-04
# did not have (all four reviews are still in flight, OQ-1). SMM-07 owns proving it. The blocks
# below are the FALLBACK for if it does not hold, and they are written to be as narrow as a
# browser-rendered callback can be. Prefer the design above; use these only with the widening
# in §"What this costs" understood and accepted.
#
# ─────────────────────────────────────────────────────────────────────────────────────────────
# FALLBACK — exact-path allowlist. Everything not named here must 404.
# ─────────────────────────────────────────────────────────────────────────────────────────────
# Place BOTH blocks inside `server { server_name erp.gaiada.online; ... }` in
# erp.gaiada.online.conf, ABOVE `location /`. Exact-match (`=`) and anchored-regex locations
# outrank the prefix locations around them, which is what keeps the surface to these paths only.
#
# Rate limit: add this next to the existing `limit_req_zone` declarations at the TOP of the
# file (http level — it may not live inside `server {}`):
#
#   limit_req_zone $binary_remote_addr zone=social_oauth:10m rate=20r/m;
#
# 20r/m with burst 10 is generous against real use — an OAuth callback fires once per account
# connect, a handful of times a week — while bounding a flood. Retune from observed traffic.

# ── 1. OAuth callbacks. FIVE exact paths, one per network we actually run. Not a regex over
# `[a-z]+`: that would silently expose all ~30 providers Postiz ships, including ones we have
# no app for and have never reviewed. Adding a network is a deliberate edit here.
# `redirectmeto.com` note: Postiz substitutes a third-party redirect shim when FRONTEND_URL is
# not https. Ours is https, so that branch is dead — but never let a non-https FRONTEND_URL
# reach production, or account connects would route through someone else's host.
location ~ ^/social/integrations/social/(instagram|facebook|linkedin|tiktok|youtube)$ {
    limit_req zone=social_oauth burst=10 nodelay;
    limit_req_status 429;

    proxy_pass http://127.0.0.1:4007;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;

    # The callback carries a single-use authorization code in the query string. Keep it out of
    # the access log: nginx logs are not a credential store, and a code plus a leaked client
    # secret is an account takeover.
    access_log off;
}

# ── 2. Platform webhooks — inbound status pings from the networks. TREATED AS TRIGGERS ONLY
# (design §03): the payload is never trusted, and the module always re-fetches authoritative
# state from Postiz's authenticated API. A forged webhook therefore costs at most one redundant
# authenticated fetch. Postiz's own webhook surface is `/api/webhooks*`; this exposes ONLY the
# receive path, never the management routes (`GET/POST/DELETE /webhooks`, which create and list
# them — those stay loopback-only and are reachable only by our adapter).
location ~ ^/social/api/webhooks/receive/(instagram|facebook|linkedin|tiktok|youtube)$ {
    limit_req zone=social_oauth burst=10 nodelay;
    limit_req_status 429;

    proxy_pass http://127.0.0.1:4007;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Bound the body — a webhook trigger is small, and an unbounded one is a cheap DoS.
    client_max_body_size 64k;
}

# ─────────────────────────────────────────────────────────────────────────────────────────────
# WHAT MUST STAY UNREACHABLE (and why no rule is needed for it)
# ─────────────────────────────────────────────────────────────────────────────────────────────
# There is no `location /social/` prefix block anywhere. Postiz publishes ONLY on
# 127.0.0.1:4007, so any path not matched above has no route to it and falls through to the
# ERP's own `location /`, which 404s it. That is the fail-closed default, and it is why this
# file adds locations and never a prefix:
#   * the admin UI (`/`, `/launches`, `/settings`, `/analytics`, `/billing`)
#   * the whole authenticated API (`/api/public/v1/*`) — our adapter reaches it over loopback
#   * `/api/auth/register` — additionally refused by the app itself
#     (DISABLE_REGISTRATION=true; verified: 400 "Registration is disabled")
#   * Temporal (no published port at all) and both Postgres instances (network-internal)
#
# VERIFY AFTER APPLYING — assert a 404/401 as hard as you assert the 200. A green reload proves
# nothing about what is exposed:
#   sudo nginx -t && sudo systemctl reload nginx
#   curl -s -o /dev/null -w '%{http_code}\n' https://erp.gaiada.online/social/            # 404
#   curl -s -o /dev/null -w '%{http_code}\n' https://erp.gaiada.online/social/launches    # 404
#   curl -s -o /dev/null -w '%{http_code}\n' https://erp.gaiada.online/social/api/public/v1/posts  # 404
#   curl -s -o /dev/null -w '%{http_code}\n' https://erp.gaiada.online/social/api/webhooks         # 404
#   curl -s -o /dev/null -w '%{http_code}\n' https://erp.gaiada.online/                   # 200 (unchanged)
# A 200 or 401 on any of the first four means the surface is wider than intended — a 401 is NOT
# acceptable here, because it proves the path reached Postiz.
#
# ─────────────────────────────────────────────────────────────────────────────────────────────
# WHAT THIS COSTS (the honest part)
# ─────────────────────────────────────────────────────────────────────────────────────────────
# Block 1 proxies to a Next.js PAGE, and a Next.js page does not render from its HTML alone —
# it pulls chunks from `/_next/static/*`. Those paths are NOT allowlisted above, so the callback
# page will arrive unstyled and, if the code exchange is client-side, may not complete at all.
# Making it work means also exposing `/social/_next/static/`, which is the Postiz frontend
# bundle — i.e. invariant 5 falls in substance, not just on a technicality.
# That is precisely why the preferred design at the top of this file exists, and why SMM-04
# records invariant 5 as HOLDING ONLY IF that design is adopted. Do not paste these blocks and
# then quietly widen them to `/social/_next/` without taking that back to the architect.
