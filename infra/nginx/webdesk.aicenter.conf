# nginx vhost — WebDesk (Zone B) public listener on gda-aicenter.
#
# STATUS: PLANNED. Not applied to the box. Authored as part of the sumopod->gda-aicenter
# consolidation (owner re-zoning 2026-08-31) — see
# ../../docs/plans/2026-08-31-workload-consolidation-to-aicenter.md.
#
# WHY THIS FILE EXISTS AT ALL: nginx already owns 0.0.0.0:80/:443 on this box (vhosts
# erp.gaiada.online, aicenter.gaiada.online, rhproptest.gaiada1.online, default — confirmed
# read-only 2026-08-31). WebDesk's own Caddy (`webdesk/docker-compose.aicenter.yml`, service
# `proxy`) is published on 127.0.0.1 ONLY — it is structurally incapable of being the public
# listener on this host. This vhost is the other half: nginx terminates TLS for the public
# WebDesk hostname and reverse-proxies to Caddy's loopback port. Caddy still owns the
# WSK-D20/D-5 denylist (/admin, /api/graphql, /control/*) — this vhost adds a SECOND,
# independent copy of that denylist ahead of the proxy_pass, on the estate's own precedent of
# defense-in-depth (Cerbos fails closed, RLS is a second gate behind app code, etc.). If nginx's
# copy and Caddy's copy ever disagree, that is a finding, not a feature — keep them identical.
#
# REPLACE <WEBDESK_PUBLIC_HOST> with the real hostname once DNS exists for it (a decision the
# owner makes — this file does not assume one). It must be a DIFFERENT hostname from
# erp.gaiada.online / aicenter.gaiada.online: WebDesk serves THIRD-PARTY client sites' /v1 reads
# and form posts, and must never share a TLS SAN or cookie-scoping origin with the ERP's own UI.
#
# CERTIFICATE: obtained the same way as the existing vhosts on this box (certbot, HTTP-01 via the
# /.well-known/acme-challenge/ location below) — do not invent a different mechanism.
#
# APPLY (manual — nginx config is never synced by CI on this box, same as every other hand-applied
# vhost here):
#   ssh gda-aicenter
#   sudo cp /etc/nginx/conf.d/webdesk.aicenter.conf /etc/nginx/conf.d/webdesk.aicenter.conf.bak-$(date -u +%Y%m%dT%H%M%SZ)   # if replacing
#   sudo cp infra/nginx/webdesk.aicenter.conf /etc/nginx/conf.d/webdesk.aicenter.conf
#   sudo certbot --nginx -d <WEBDESK_PUBLIC_HOST>     # first issuance only; certbot rewrites the
#                                                       # server{} block below to add ssl_certificate
#                                                       # lines and a :80->:443 redirect, same as the
#                                                       # three existing vhosts on this box
#   sudo nginx -t && sudo systemctl reload nginx
#
# VERIFY (from OFF the box — what the internet sees, not localhost):
#   curl -sI https://<WEBDESK_PUBLIC_HOST>/healthz          # expect 200
#   curl -sI https://<WEBDESK_PUBLIC_HOST>/admin             # expect 404 — 200 here means STOP,
#                                                              the route bypasses Caddy's denylist
#   curl -sI https://<WEBDESK_PUBLIC_HOST>/api/graphql       # expect 404
#   curl -sI https://<WEBDESK_PUBLIC_HOST>/control/v1/jobs   # expect 404 (control plane is
#                                                              A-initiated only; never reachable
#                                                              from this public vhost)
#   curl -sI https://erp.gaiada.online/                      # expect 200 — proves this change did
#                                                              not disturb the existing ERP vhost
#
# ROLLBACK: restore the timestamped .bak (or `sudo rm` this file if it was newly added),
# `sudo nginx -t && sudo systemctl reload nginx`. Additive-only file; cannot regress the other
# three vhosts by construction — verify with the erp.gaiada.online curl above regardless.

server {
    listen 80;
    listen [::]:80;
    server_name <WEBDESK_PUBLIC_HOST>;

    location /.well-known/acme-challenge/ { root /var/www/html; }

    location / { return 404; }   # no plaintext app traffic; certbot adds the 80->443 redirect here
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name <WEBDESK_PUBLIC_HOST>;

    # certbot fills these in on first issuance (`--nginx`) — placeholders so `nginx -t` fails
    # loudly if this file is deployed before that step, rather than silently serving plaintext.
    # ssl_certificate     /etc/letsencrypt/live/<WEBDESK_PUBLIC_HOST>/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/<WEBDESK_PUBLIC_HOST>/privkey.pem;

    client_max_body_size 32m;   # WEBDESK_MEDIA_MAX_UPLOAD_BYTES default is 25 MiB; leave headroom

    # ── Independent denylist copy, evaluated BEFORE the catch-all proxy_pass below. ──────────
    # Same three paths Caddy already refuses (webdesk/proxy/Caddyfile) — WSK-D20/D-5: Payload's
    # admin panel and raw REST, and the GraphQL surface, must never reach the public vhost.
    location ~ ^/(admin|api/graphql|control)(/|$) {
        return 404;
    }

    location = /healthz {
        proxy_pass http://127.0.0.1:8380/healthz;
        proxy_set_header Host $host;
    }

    # /v1 (contract reads), /forms, /media — the only paths a client site ever calls.
    location / {
        proxy_pass http://127.0.0.1:8380;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }
}
