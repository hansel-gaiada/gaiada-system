# WS9 operational alerts — the estate's health signals + the D15 dead-man's-switch. These fire to
# Alertmanager, which fans them to ≥2 independent transports (Telegram/email/ntfy/webhook).
groups:
  - name: gaiada_operational
    rules:
      # --- D15 dead-man's-switch. Watchdog ALWAYS fires; Alertmanager routes it to an EXTERNAL
      # heartbeat (healthchecks.io/Cronitor). If Prometheus itself is dead, the external service
      # stops seeing the heartbeat and pages — so a fully-dark box is detectable, not silently fine.
      - alert: Watchdog
        expr: vector(1)
        labels:
          severity: watchdog
        annotations:
          summary: "Prometheus is alive (dead-man's-switch heartbeat)"
          description: "Always-firing. Its ABSENCE at the external dead-man's-switch means the estate is dark."

      # --- A service's synthetic probe is failing outright.
      #
      # 2026-08-31 — SCOPED to job="blackbox-http" (this is WS9's own-endpoint probe job, defined
      # in prometheus.yml / the collector's prometheus/scrape config). Two more blackbox jobs land
      # on this estate the same day (rules/alerts-estate.yml): `blackbox-estate` (Plane A hosts,
      # helios/delphi reachability) and `client-properties` (Plane B — clients' own websites,
      # someone else's uptime). Both also emit `probe_success`, and an unscoped `probe_success == 0`
      # here would have fired THIS alert — page-all, our on-call — for a client's WordPress site
      # timing out. That is exactly the audience-conflation the rollout is designed to prevent:
      # our infra pages engineering, client sites page account managers, never the same pager.
      - alert: ServiceDown
        expr: probe_success{job="blackbox-http"} == 0
        for: 2m
        labels:
          severity: page
        annotations:
          summary: "{{ $labels.instance }} is failing its health probe"
          description: "Blackbox probe to {{ $labels.instance }} has failed for 2m."

      # --- Disk. The observability stack is itself the largest disk consumer on this box
      # (Prometheus 15d + Loki 7d + Tempo 7d), and a full disk has already rolled back a healthy
      # release once. `docker system df` showed ~0 reclaimable, so pruning is NOT a recovery lever
      # here — the only warning we get is this rule. Fires long before the write fails.
      #
      # MSO-02: generalized per host. `host!=""` excludes any pre-MSO-01 unlabeled series (they
      # wash out of the 30d retention window on their own — see design doc §4 cutover note) and
      # `mountpoint="/"` matches the estate endpoint's FS selector byte-for-byte (`FS` constant in
      # observability.controller.ts) so the alert and the console board can never disagree about
      # which filesystem they mean (contract note 10 flagged this divergence; closed here). Every
      # other label (host, env, instance, mountpoint) rides through unchanged — this expr does no
      # aggregation, so the alert inherits whatever host/env the series already carries from the
      # collector's external_labels (MSO-01).
      - alert: DiskSpaceLow
        expr: |
          (node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs",mountpoint="/",host!=""}
           / node_filesystem_size_bytes{fstype!~"tmpfs|overlay|squashfs",mountpoint="/",host!=""}) < 0.15
        for: 10m
        labels:
          severity: page
        annotations:
          summary: "Disk below 15% free on {{ $labels.host }}:{{ $labels.mountpoint }}"
          description: "{{ $labels.host }} ({{ $labels.instance }}:{{ $labels.mountpoint }}) has {{ $value | humanizePercentage }} free. Prune is not a lever on this box — reduce retention (Prometheus --storage.tsdb.retention.time, loki retention_period, tempo block_retention) or grow the volume."

      # --- Predictive: linear-extrapolate the last 6h of usage. Catches a runaway log/trace
      # producer while there is still time to act, which a static threshold does not.
      #
      # MSO-02: the predict_linear() core here MUST stay IDENTICAL to the estate endpoint's disk
      # projection query (observability.controller.ts, `diskProjResult`:
      # `predict_linear(node_filesystem_avail_bytes${FS}[6h], 24 * 3600)` before its display-only
      # /1024/1024/1024 conversion, which does not change the <0 sign this rule tests). Same reason
      # as the freshness/RemoteWriteStalled pairing below: if the console's projection and this
      # rule's projection can diverge, the board and the pager tell different stories about the
      # same host. `host!=""`/`mountpoint="/"` per the DiskSpaceLow comment above.
      - alert: DiskWillFillIn24h
        expr: |
          predict_linear(node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs",mountpoint="/",host!=""}[6h], 24 * 3600) < 0
        for: 30m
        labels:
          severity: page
        annotations:
          summary: "{{ $labels.host }}:{{ $labels.mountpoint }} projected to fill within 24h"
          description: "Trend over the last 6h projects {{ $labels.host }} ({{ $labels.instance }}:{{ $labels.mountpoint }}) full within 24h. Usual cause: a service logging at volume into Loki, or trace sampling turned up."

      # --- Datastores. MON-09k: these were completely unwatched, and the gap hid a real fault.
      # postgres-exporter and redis-exporter both pointed at container hostnames that are never
      # started on this box (Postgres/Redis run on the host), so `pg_up`/`redis_up` were 0 for as
      # long as the stack had been running. Prometheus showed BOTH TARGETS UP the whole time --- the
      # exporter was healthy, the database was simply unreachable to it, and no rule read the value.
      # A scrape target being up is not a check passing. These two rules are what make that visible.
      #
      # MSO-02: `host!=""` matches the estate endpoint's `pg_up{host!=""}`/`redis_up{host!=""}`
      # queries (observability.controller.ts) and excludes pre-cutover unlabeled series. No
      # aggregation is used, so host/env ride through from the series unchanged — each instance's
      # own host/env label is what the receiver routes on.
      - alert: PostgresDown
        expr: pg_up{host!=""} == 0
        for: 2m
        labels:
          severity: page
        annotations:
          summary: "Postgres unreachable from the exporter on {{ $labels.host }} ({{ $labels.instance }})"
          description: "pg_up=0 for 2m on {{ $labels.host }}. Either the database is down, or the exporter DSN points somewhere the database is not (PG_HOST). Check `docker logs` on the exporter before assuming an outage."

      - alert: RedisDown
        expr: redis_up{host!=""} == 0
        for: 2m
        labels:
          severity: page
        annotations:
          summary: "Redis unreachable from the exporter on {{ $labels.host }} ({{ $labels.instance }})"
          description: "redis_up=0 for 2m on {{ $labels.host }}. As with Postgres, suspect the exporter address (REDIS_URL, including its password) before concluding Redis is down --- a hostname without credentials connects and then fails every command."

      # --- MON-09r: the blind spot the 2026-08-18 relocation CREATED, closed here.
      #
      # Storage and alerting now run on the SumoPod VPS; gda-aicenter's collector scrapes locally
      # and remote-writes over WireGuard. That inverts a safety property. When Prometheus SCRAPED
      # those targets, losing them made `up` go to 0 and ServiceDown fired. With remote_write, a
      # dead tunnel means the series simply STOP ARRIVING: `up` goes ABSENT, not 0.
      # `probe_success == 0` and `up == 0` match nothing at all, so every existing alert goes quiet
      # and the estate looks calm at the exact moment we can no longer see it.
      #
      # Watchdog does NOT cover this: it is `vector(1)` evaluated locally on whichever Prometheus
      # runs it, so it keeps firing happily while the remote side has gone dark.
      #
      # absent_over_time() rather than absent(): absent() fires on a single missed evaluation,
      # which a routine restart or scrape hiccup would trigger. 10m of continuous absence is a
      # genuine feed outage.
      #
      # MSO-02: kept as the gda-aicenter-specific legacy form, belt-and-suspenders alongside the
      # generalized rule below, per design doc §8 ("kept until the label cutover proves out, then
      # retired — two rules briefly, drift-safe direction"). Retire once the generalized rule below
      # has run a full cycle on the remote without disagreeing with this one.
      - alert: RemoteWriteStalledLegacySingleHost
        expr: absent_over_time(up{job="otel-collector-self"}[10m])
        for: 0m
        labels:
          severity: page
          env: production
        annotations:
          summary: "No metrics received from gda-aicenter for 10m (legacy single-host rule)"
          description: "The remote_write feed has stopped: the collector is not reporting. Suspect the WireGuard link (10.88.0.1 <-> 10.88.0.2) or the collector itself. IMPORTANT: while this fires, every other alert in this file is meaningless rather than reassuring - their series are absent, so they cannot fire. Treat a quiet estate during this alert as UNKNOWN, not healthy. Superseded by the per-host RemoteWriteStalled rule below; kept temporarily as a cross-check (MSO-02, design doc §8)."

      # --- MSO-02: RemoteWriteStalled generalized per host.
      #
      # The legacy rule above only ever covered gda-aicenter (job="otel-collector-self" exists
      # nowhere else) and, being absent_over_time(), fires with NO labels at all when it fires —
      # an absent series carries none of the identity that was on the metric before it vanished.
      # That made it structurally unable to say WHICH host went dark or route by env, exactly the
      # gap this ticket exists to close (contract note 10).
      #
      # This form instead tracks freshness positively: for every host, the age (now - last sample
      # timestamp) of its `up` series over a 48h lookback. It is the SAME shape and the SAME 600s
      # ("10m") dark boundary as the estate endpoint's freshness query
      # (`max by (host) (last_over_time(timestamp(up{host!=""})[48h:1m]))`,
      # observability.controller.ts / estate-observability.ts) — deliberately, per design doc §6/§8:
      # if the console's freshness state and this alert's firing state can disagree, the board and
      # the pager tell two different stories about the same host. The only departure from the
      # controller's literal expression is grouping `by (host, env)` instead of `by (host)`: env is
      # a functional dependent of host (one env per host, stamped by the same collector
      # external_labels, MSO-01 §4), so this adds no new grouping key that could split a host's
      # series in two — it only carries env through so Alertmanager can route on it (OQ-2). The
      # controller does not need env from Prometheus because it joins to `infra_hosts` in
      # application code instead; a Prometheus alert has no such join available to it.
      #
      # Known bound (design doc §8, unchanged by this generalization): a host dark longer than the
      # 48h lookback drops out of the expression entirely — the console's inventory-driven "never"
      # state is the long-horizon catch for that case, not this alert.
      # ⚠ CORRECTED 2026-08-23 — `env!=""` added. The comment above states that grouping by (host, env)
      # "adds no new grouping key that could split a host's series in two", because env is a functional
      # dependent of host. **That is false in practice, and it produced a permanent false page.**
      # Measured on the live estate:
      #     host=gda-aicenter env="production"  age=46s      ✓
      #     host=sumopod      env="ops"         age=48s      ✓
      #     host=sumopod      env=""            age=142077s  ← FIRED
      # sumopod had a RETIRED label-set: `up` series that predate env being stamped. They stopped
      # ~39.5h ago, so their group is permanently stale and the alert pages forever — for a host whose
      # live series are one second old.
      #
      # Any label-set change on any host reproduces this: the OLD grouping keeps a frozen timestamp
      # inside the 48h lookback and fires until it ages out — then "resolves" for the wrong reason,
      # which is worse than never firing, because it teaches an operator the alert is noise.
      #
      # `env!=""` is the minimal correct filter: every real host stamps env (MSO-01 §4), so an
      # env-less series is by definition a retired or misconfigured label-set rather than a host.
      # A host genuinely missing env is caught by the console's inventory-driven "never" state
      # (design doc §6), which is the intended long-horizon catch and does not depend on this rule.
      - alert: RemoteWriteStalled
        expr: |
          (time() - max by (host, env) (last_over_time(timestamp(up{host!="",env!=""})[48h:1m]))) > 600
        for: 0m
        labels:
          severity: page
        annotations:
          summary: "No fresh metrics from {{ $labels.host }} for over 10m"
          description: "{{ $labels.host }} (env={{ $labels.env }}) has gone dark: its most recent `up` sample is over 600s old. Suspect the WireGuard link (10.88.0.1 <-> 10.88.0.2) for a remote host, or the collector/exporter itself. IMPORTANT: while this fires for a host, every other host-scoped alert for it is meaningless rather than reassuring — its series are stale/absent, so they cannot fire. Treat a quiet host during this alert as UNKNOWN, not healthy. This alert is never excluded from the estate console's rollup (design doc §6) — it renders as a whole-board banner, not a per-host row."

      # --- Event backbone: any dead-letter is worth a ticket (data path is dropping events).
      - alert: EventBackboneDeadLetters
        expr: increase(platform_events_dead_lettered_total[15m]) > 0
        for: 0m
        labels:
          severity: ticket
        annotations:
          summary: "Backbone events dead-lettered"
          description: "{{ $value }} event(s) moved to dead-letter in 15m (entity_type={{ $labels.entity_type }})."

      # --- Sync freshness: central hasn't seen a successful cycle recently (site offline / partition).
      - alert: SyncStale
        expr: sync_seconds_since_last_success > 900
        for: 5m
        labels:
          severity: ticket
        annotations:
          summary: "Cross-site sync is stale"
          description: "No successful sync cycle for {{ $value | humanizeDuration }}."

      # --- AI cost: steady daily cap nearly exhausted (per-tenant degradation imminent).
      - alert: GatewayBudgetNearCap
        expr: gateway_budget_calls_used / clamp_min(gateway_budget_calls_cap, 1) > 0.9
        for: 5m
        labels:
          severity: ticket
        annotations:
          summary: "AI gateway near daily call cap"
          description: "{{ $value | humanizePercentage }} of the daily AI call cap spent."

      # --- DR-burst budget is currently unlocked (informational-but-important: a declared failover).
      - alert: GatewayDRModeActive
        expr: gateway_dr_mode == 1
        for: 0m
        labels:
          severity: ticket
        annotations:
          summary: "AI gateway DR-burst budget is UNLOCKED"
          description: "A failover was declared; the bounded DR-burst AI budget is active. Confirm it's intended."

      # --- Agent quality: the WS8 collector is flagging a low-success / high-refusal agent.
      - alert: AgentQualityAlert
        expr: agent_quality_alert == 1
        for: 5m
        labels:
          severity: ticket
        annotations:
          summary: "Agent quality alert: {{ $labels.agent }} / {{ $labels.kind }}"
          description: "The WS8 observability collector flagged {{ $labels.agent }} ({{ $labels.kind }})."

      # --- Synthetic journey failing (functional, end-to-end — stronger signal than a liveness probe).
      - alert: SyntheticJourneyFailing
        expr: synthetic_journey_up == 0
        for: 3m
        labels:
          severity: page
        annotations:
          summary: "Synthetic journey '{{ $labels.journey }}' is failing"
          description: "The end-to-end journey {{ $labels.journey }} has not met its expected result for 3m."

      # --- The green-but-nonsense case: a journey SUCCEEDED, served by the echo terminator.
      #
      # ⚠ THIS IS THE ONLY ALERT THAT CATCHES A 200 THAT IS A TOTAL FAILURE. `echo` is the dev
      # terminator appended to every chain; it is Available() unconditionally and returns
      # "[echo — no provider key configured] <prompt>". So when every real provider is down, callers
      # receive a well-formed 200 with a body, `expectStatus: 200` passes, `expectBody: "text"` passes,
      # and `synthetic_journey_up` reads 1. Nothing else in this file can distinguish that from health.
      #
      # It is not hypothetical: one `provider=echo` success was served on 2026-08-24, alongside 1,995
      # real calls. It became visible only because the prober started recording WHICH provider served
      # (recordJSON) — before that label existed, this alert could not have been written.
      #
      # Severity is `page` deliberately. Serving echo means EVERY provider in the chain failed, and the
      # estate currently runs a chain of one (GEMINI_API_KEY / ANTHROPIC_API_KEY are unset), so the
      # distance between "primary degraded" and "answering with placeholder text" is a single hop.
      - alert: GatewayServedByEcho
        expr: synthetic_journey_up{provider="echo"} == 1
        for: 0m
        labels:
          severity: page
        annotations:
          summary: "AI gateway answered with the ECHO terminator — every real provider failed"
          description: "Journey {{ $labels.journey }} returned 200 but was served by `echo`, which emits placeholder text rather than model output. Callers are receiving well-formed nonsense. Check provider keys and upstream availability; a green dashboard here means nothing while this fires."

      # --- D13 detective: an agent wrote while served by a non-eval-cleared provider.
      - alert: AgentWroteOnUnevaledProvider
        expr: agent_writes_on_unevaled_provider > 0
        for: 0m
        labels:
          severity: page
        annotations:
          summary: "Agent write on an un-evaled provider (D13)"
          description: "{{ $value }} run(s) performed a write while served by a provider not eval-cleared for that agent."

      # --- Mail (MAIL-24, Finding 4): ANY auth-stream send failure. Magic-link mail is
      # single-attempt by design — the raw token is never persisted (M11/MAIL-10), so the standard
      # queued-retry sender loop (which re-renders from `mail_log.payload`) can never see or retry
      # these rows (src/mail/magic-link/service.ts's header). A failed send here means a real user
      # got a 202 and never received their sign-in link, with nothing else watching for it — so
      # this fires on ANY increase, deliberately separate from a failure-RATE threshold (unlike a
      # future generic notify-stream mail alert, which has a queued retry to absorb a transient
      # blip and can afford to wait for a rate).
      - alert: MailAuthStreamSendFailed
        expr: increase(mail_failed_total{stream="auth"}[15m]) > 0
        for: 0m
        labels:
          severity: ticket
        annotations:
          summary: "Auth-stream mail send failed (magic-link) — no automatic retry"
          description: "{{ $value }} auth-stream send failure(s) in 15m. Single-attempt by design (no raw-token persistence to retry from) — find the affected user via mail_log WHERE stream='auth' AND status='failed' and tell them to request a fresh sign-in link."

      # --- Mail (MAIL-09, design §11): queue depth. Rows accumulate `queued` with backoff when the
      # relay is down or creds are wrong (§7.8) — the sender itself never surfaces this on its own,
      # so a stuck queue is invisible without a metric watching mail_queue_depth{stream} (a gauge
      # sampled at each sender sweep, MAIL-04). Threshold and window per design §11 verbatim.
      - alert: MailQueueDepthHigh
        expr: mail_queue_depth > 50
        for: 15m
        labels:
          severity: ticket
        annotations:
          summary: "Mail queue depth elevated on stream {{ $labels.stream }}"
          description: "{{ $value }} row(s) queued on stream {{ $labels.stream }} for 15m+. Check relay reachability/creds; mail_log rows carry last_error per row."

      # --- Mail (MAIL-09, design §11/A8): failure-rate pager — "flip the transport" signal. A8
      # makes failover an OPERATOR action, not automatic; this is the alert that tells the operator
      # to flip MAIL_STREAM_*_TRANSPORT to the other leg (relay<->brevo). Deliberately a RATE over
      # 1h, unlike MailAuthStreamSendFailed's any-failure rule above — the notify stream has a
      # queued retry that can absorb a transient blip, so this waits for a sustained rate before
      # paging (mirrors the auth-stream comment's own reasoning, inverted).
      - alert: MailSendFailureRateHigh
        expr: |
          (
            sum by (stream) (increase(mail_failed_total[1h]))
            /
            clamp_min(sum by (stream) (increase(mail_failed_total[1h]) + increase(mail_sent_total[1h])), 1)
          ) > 0.2
        for: 0m
        labels:
          severity: page
        annotations:
          summary: "Mail send failure rate > 20% on stream {{ $labels.stream }} (last 1h)"
          description: "{{ $value | humanizePercentage }} of stream {{ $labels.stream }} sends failed in the last hour. Operator action per design A8: flip MAIL_STREAM_{{ $labels.stream }}_TRANSPORT to the other leg (relay<->brevo)."

      # --- Mail (MAIL-26): sustained magic-link rate-limit blocks — the probing signal, not a
      # failure signal. This endpoint returns the SAME 202 whether a mint was accepted or blocked
      # by the hourly rate limit (design §5.1's enumeration-resistance requirement — see
      # src/mail/magic-link/service.ts's header), so a rate-limited HAMMER against this route is
      # otherwise invisible in the HTTP layer entirely. A RATE over a window, not "any increase"
      # (unlike MailAuthStreamSendFailed above): a handful of blocked requests is normal operation
      # for a real user who double-clicked "resend"; a sustained run is what's worth a ticket.
      # `dimension` distinguishes "one address, many attempts" from "one IP, many addresses" per
      # `mail_magic_link_rate_limited_total`'s label (src/mail/metrics.ts) — this fires per-dimension.
      - alert: MailMagicLinkRateLimitSustained
        expr: increase(mail_magic_link_rate_limited_total[15m]) > 10
        for: 5m
        labels:
          severity: ticket
        annotations:
          summary: "Sustained magic-link rate-limit blocks on dimension {{ $labels.dimension }}"
          description: "{{ $value }} magic-link mint attempt(s) blocked by the hourly rate limit on dimension {{ $labels.dimension }} in 15m. The HTTP response never distinguished this from a normal 202 (by design) — this counter is the only signal. Per-attempt detail (which address/IP) requires log aggregation (WS9/Loki) over the `[magic-link:audit] mint.rate_limited` lines; this metric only says a sustained run is happening."

      # --- Mail (MAIL-26): sustained rejected magic-link consumes — token-space probing/replay.
      # Same reasoning as above, mirrored for the OTHER blind branch MAIL-11's QA gate flagged: a
      # rejected consume (unknown/expired/replayed token) writes no DB row and returns the same
      # generic 422 for all three, by design (see consumeMagicLink's doc comment). `reason` lets an
      # operator tell "one attacker guessing random tokens" (mostly `unknown`) apart from "a stale
      # or already-used link being retried" (mostly `expired`/`replayed`) WITHOUT the response ever
      # revealing that distinction to the caller — the label is metric-only.
      - alert: MailMagicLinkConsumeRejectedSustained
        expr: increase(mail_magic_link_consume_rejected_total[15m]) > 10
        for: 5m
        labels:
          severity: ticket
        annotations:
          summary: "Sustained rejected magic-link consumes, reason={{ $labels.reason }}"
          description: "{{ $value }} magic-link consume attempt(s) rejected (reason={{ $labels.reason }}) in 15m. The HTTP response never distinguished this from any other rejection (by design) — this counter is the only signal. Per-attempt detail (which token/IP) requires log aggregation (WS9/Loki) over the `[magic-link:audit] consume.rejected` lines; this metric only says a sustained run is happening."
