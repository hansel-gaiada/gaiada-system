# WS9 operational alerts — the estate's health signals + the D15 dead-man's-switch. These fire to
# Alertmanager, which fans them to ≥2 independent transports (Telegram/email/ntfy/webhook).
groups:
  - name: gaiada_operational
    rules:
      # --- D15 dead-man's-switch. Watchdog ALWAYS fires; Alertmanager routes it to an EXTERNAL
      # heartbeat (healthchecks.io/Cronitor). If Prometheus itself is dead, the external service
      # stops seeing the heartbeat and pages — so a fully-dark box is detectable, not silently fine.
      - alert: Watchdog
        expr: vector(1)
        labels:
          severity: watchdog
        annotations:
          summary: "Prometheus is alive (dead-man's-switch heartbeat)"
          description: "Always-firing. Its ABSENCE at the external dead-man's-switch means the estate is dark."

      # --- A service's synthetic probe is failing outright.
      - alert: ServiceDown
        expr: probe_success == 0
        for: 2m
        labels:
          severity: page
        annotations:
          summary: "{{ $labels.instance }} is failing its health probe"
          description: "Blackbox probe to {{ $labels.instance }} has failed for 2m."

      # --- Disk. The observability stack is itself the largest disk consumer on this box
      # (Prometheus 15d + Loki 7d + Tempo 7d), and a full disk has already rolled back a healthy
      # release once. `docker system df` showed ~0 reclaimable, so pruning is NOT a recovery lever
      # here — the only warning we get is this rule. Fires long before the write fails.
      - alert: DiskSpaceLow
        expr: |
          (node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs"}
           / node_filesystem_size_bytes{fstype!~"tmpfs|overlay|squashfs"}) < 0.15
        for: 10m
        labels:
          severity: page
        annotations:
          summary: "Disk below 15% free on {{ $labels.mountpoint }}"
          description: "{{ $labels.instance }}:{{ $labels.mountpoint }} has {{ $value | humanizePercentage }} free. Prune is not a lever on this box — reduce retention (Prometheus --storage.tsdb.retention.time, loki retention_period, tempo block_retention) or grow the volume."

      # --- Predictive: linear-extrapolate the last 6h of usage. Catches a runaway log/trace
      # producer while there is still time to act, which a static threshold does not.
      - alert: DiskWillFillIn24h
        expr: |
          predict_linear(node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs"}[6h], 24*3600) < 0
        for: 30m
        labels:
          severity: page
        annotations:
          summary: "{{ $labels.mountpoint }} projected to fill within 24h"
          description: "Trend over the last 6h projects {{ $labels.instance }}:{{ $labels.mountpoint }} full within 24h. Usual cause: a service logging at volume into Loki, or trace sampling turned up."

      # --- Event backbone: any dead-letter is worth a ticket (data path is dropping events).
      - alert: EventBackboneDeadLetters
        expr: increase(platform_events_dead_lettered_total[15m]) > 0
        for: 0m
        labels:
          severity: ticket
        annotations:
          summary: "Backbone events dead-lettered"
          description: "{{ $value }} event(s) moved to dead-letter in 15m (entity_type={{ $labels.entity_type }})."

      # --- Sync freshness: central hasn't seen a successful cycle recently (site offline / partition).
      - alert: SyncStale
        expr: sync_seconds_since_last_success > 900
        for: 5m
        labels:
          severity: ticket
        annotations:
          summary: "Cross-site sync is stale"
          description: "No successful sync cycle for {{ $value | humanizeDuration }}."

      # --- AI cost: steady daily cap nearly exhausted (per-tenant degradation imminent).
      - alert: GatewayBudgetNearCap
        expr: gateway_budget_calls_used / clamp_min(gateway_budget_calls_cap, 1) > 0.9
        for: 5m
        labels:
          severity: ticket
        annotations:
          summary: "AI gateway near daily call cap"
          description: "{{ $value | humanizePercentage }} of the daily AI call cap spent."

      # --- DR-burst budget is currently unlocked (informational-but-important: a declared failover).
      - alert: GatewayDRModeActive
        expr: gateway_dr_mode == 1
        for: 0m
        labels:
          severity: ticket
        annotations:
          summary: "AI gateway DR-burst budget is UNLOCKED"
          description: "A failover was declared; the bounded DR-burst AI budget is active. Confirm it's intended."

      # --- Agent quality: the WS8 collector is flagging a low-success / high-refusal agent.
      - alert: AgentQualityAlert
        expr: agent_quality_alert == 1
        for: 5m
        labels:
          severity: ticket
        annotations:
          summary: "Agent quality alert: {{ $labels.agent }} / {{ $labels.kind }}"
          description: "The WS8 observability collector flagged {{ $labels.agent }} ({{ $labels.kind }})."

      # --- Synthetic journey failing (functional, end-to-end — stronger signal than a liveness probe).
      - alert: SyntheticJourneyFailing
        expr: synthetic_journey_up == 0
        for: 3m
        labels:
          severity: page
        annotations:
          summary: "Synthetic journey '{{ $labels.journey }}' is failing"
          description: "The end-to-end journey {{ $labels.journey }} has not met its expected result for 3m."

      # --- D13 detective: an agent wrote while served by a non-eval-cleared provider.
      - alert: AgentWroteOnUnevaledProvider
        expr: agent_writes_on_unevaled_provider > 0
        for: 0m
        labels:
          severity: page
        annotations:
          summary: "Agent write on an un-evaled provider (D13)"
          description: "{{ $value }} run(s) performed a write while served by a provider not eval-cleared for that agent."

      # --- Mail (MAIL-24, Finding 4): ANY auth-stream send failure. Magic-link mail is
      # single-attempt by design — the raw token is never persisted (M11/MAIL-10), so the standard
      # queued-retry sender loop (which re-renders from `mail_log.payload`) can never see or retry
      # these rows (src/mail/magic-link/service.ts's header). A failed send here means a real user
      # got a 202 and never received their sign-in link, with nothing else watching for it — so
      # this fires on ANY increase, deliberately separate from a failure-RATE threshold (unlike a
      # future generic notify-stream mail alert, which has a queued retry to absorb a transient
      # blip and can afford to wait for a rate).
      - alert: MailAuthStreamSendFailed
        expr: increase(mail_failed_total{stream="auth"}[15m]) > 0
        for: 0m
        labels:
          severity: ticket
        annotations:
          summary: "Auth-stream mail send failed (magic-link) — no automatic retry"
          description: "{{ $value }} auth-stream send failure(s) in 15m. Single-attempt by design (no raw-token persistence to retry from) — find the affected user via mail_log WHERE stream='auth' AND status='failed' and tell them to request a fresh sign-in link."

      # --- Mail (MAIL-09, design §11): queue depth. Rows accumulate `queued` with backoff when the
      # relay is down or creds are wrong (§7.8) — the sender itself never surfaces this on its own,
      # so a stuck queue is invisible without a metric watching mail_queue_depth{stream} (a gauge
      # sampled at each sender sweep, MAIL-04). Threshold and window per design §11 verbatim.
      - alert: MailQueueDepthHigh
        expr: mail_queue_depth > 50
        for: 15m
        labels:
          severity: ticket
        annotations:
          summary: "Mail queue depth elevated on stream {{ $labels.stream }}"
          description: "{{ $value }} row(s) queued on stream {{ $labels.stream }} for 15m+. Check relay reachability/creds; mail_log rows carry last_error per row."

      # --- Mail (MAIL-09, design §11/A8): failure-rate pager — "flip the transport" signal. A8
      # makes failover an OPERATOR action, not automatic; this is the alert that tells the operator
      # to flip MAIL_STREAM_*_TRANSPORT to the other leg (relay<->brevo). Deliberately a RATE over
      # 1h, unlike MailAuthStreamSendFailed's any-failure rule above — the notify stream has a
      # queued retry that can absorb a transient blip, so this waits for a sustained rate before
      # paging (mirrors the auth-stream comment's own reasoning, inverted).
      - alert: MailSendFailureRateHigh
        expr: |
          (
            sum by (stream) (increase(mail_failed_total[1h]))
            /
            clamp_min(sum by (stream) (increase(mail_failed_total[1h]) + increase(mail_sent_total[1h])), 1)
          ) > 0.2
        for: 0m
        labels:
          severity: page
        annotations:
          summary: "Mail send failure rate > 20% on stream {{ $labels.stream }} (last 1h)"
          description: "{{ $value | humanizePercentage }} of stream {{ $labels.stream }} sends failed in the last hour. Operator action per design A8: flip MAIL_STREAM_{{ $labels.stream }}_TRANSPORT to the other leg (relay<->brevo)."

      # --- Mail (MAIL-26): sustained magic-link rate-limit blocks — the probing signal, not a
      # failure signal. This endpoint returns the SAME 202 whether a mint was accepted or blocked
      # by the hourly rate limit (design §5.1's enumeration-resistance requirement — see
      # src/mail/magic-link/service.ts's header), so a rate-limited HAMMER against this route is
      # otherwise invisible in the HTTP layer entirely. A RATE over a window, not "any increase"
      # (unlike MailAuthStreamSendFailed above): a handful of blocked requests is normal operation
      # for a real user who double-clicked "resend"; a sustained run is what's worth a ticket.
      # `dimension` distinguishes "one address, many attempts" from "one IP, many addresses" per
      # `mail_magic_link_rate_limited_total`'s label (src/mail/metrics.ts) — this fires per-dimension.
      - alert: MailMagicLinkRateLimitSustained
        expr: increase(mail_magic_link_rate_limited_total[15m]) > 10
        for: 5m
        labels:
          severity: ticket
        annotations:
          summary: "Sustained magic-link rate-limit blocks on dimension {{ $labels.dimension }}"
          description: "{{ $value }} magic-link mint attempt(s) blocked by the hourly rate limit on dimension {{ $labels.dimension }} in 15m. The HTTP response never distinguished this from a normal 202 (by design) — this counter is the only signal. Per-attempt detail (which address/IP) requires log aggregation (WS9/Loki) over the `[magic-link:audit] mint.rate_limited` lines; this metric only says a sustained run is happening."

      # --- Mail (MAIL-26): sustained rejected magic-link consumes — token-space probing/replay.
      # Same reasoning as above, mirrored for the OTHER blind branch MAIL-11's QA gate flagged: a
      # rejected consume (unknown/expired/replayed token) writes no DB row and returns the same
      # generic 422 for all three, by design (see consumeMagicLink's doc comment). `reason` lets an
      # operator tell "one attacker guessing random tokens" (mostly `unknown`) apart from "a stale
      # or already-used link being retried" (mostly `expired`/`replayed`) WITHOUT the response ever
      # revealing that distinction to the caller — the label is metric-only.
      - alert: MailMagicLinkConsumeRejectedSustained
        expr: increase(mail_magic_link_consume_rejected_total[15m]) > 10
        for: 5m
        labels:
          severity: ticket
        annotations:
          summary: "Sustained rejected magic-link consumes, reason={{ $labels.reason }}"
          description: "{{ $value }} magic-link consume attempt(s) rejected (reason={{ $labels.reason }}) in 15m. The HTTP response never distinguished this from any other rejection (by design) — this counter is the only signal. Per-attempt detail (which token/IP) requires log aggregation (WS9/Loki) over the `[magic-link:audit] consume.rejected` lines; this metric only says a sustained run is happening."
