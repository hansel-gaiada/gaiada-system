# WS9 Tempo — trace backend. Single-binary, local filesystem storage (trial scale). Receives OTLP
# from the collector; Grafana queries it as the Tempo datasource (with trace↔log correlation to Loki).
server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317

ingester:
  max_block_duration: 5m

compactor:
  compaction:
    # 2026-08-18: cut 168h -> 72h after MEASURING what actually consumes this box's disk.
    # The assumption going in was Prometheus (15d retention, the longest window). Wrong:
    #   prometheus-data  400 MB
    #   loki-data         29 MB
    #   tempo-data       4.0 GB   <-- ten times Prometheus, for the least-consulted signal
    # Traces are the signal nobody reads until an incident, and 3 days covers every incident
    # anyone has investigated here. Raise it again when there is disk to spare, but measure
    # first -- trimming the metric store would have freed almost nothing and lost the series
    # the alerts actually run on.
    # 2026-08-23: owner decision -- 72h everywhere, not 336h. Extra disk headroom on this box
    # (~105 G free vs gda-aicenter's ~9 G) was never a reason to keep traces three times longer;
    # 3 days still covers every incident anyone has investigated (see the note above). Now
    # matches infra/observability/tempo/tempo.yaml exactly -- the two hosts no longer disagree.
    block_retention: 72h

storage:
  trace:
    backend: local
    local:
      path: /var/tempo/blocks
    wal:
      path: /var/tempo/wal

usage_report:
  reporting_enabled: false
