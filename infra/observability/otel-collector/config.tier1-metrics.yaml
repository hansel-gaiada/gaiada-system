# OBS-01 (Tier 1) — minimal OTel Collector config for the metrics-only bring-up.
#
# Deliberately NOT the full WS9 config.yaml: Tier 1 brings up only otel-collector + prometheus
# (no Tempo/Loki), so the traces/logs pipelines and the filelog receiver in the known-good
# config.yaml would just be dead weight — every batch they'd try to export to tempo:4317 /
# http://loki:3100/otlp would fail with connection-refused (those services aren't running), and
# the filelog receiver would tail every container's docker json-file log for no consumer. This
# file keeps ONLY the metrics pipeline (OTLP in -> Prometheus exporter out) so platform's
# fail-soft OTel SDK can push mail_* (and other) metrics with no noisy, useless export attempts.
#
# Promoting to the full stack later is a drop-in: switch docker-compose.otel-metrics.yml (or its
# successor) back to config.yaml once Tempo/Loki/Grafana are brought up — nothing here conflicts
# with that config, this is a subset.
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 10s
  resourcedetection:
    detectors: [env, system]
    timeout: 5s
  # Cap memory so the collector can never OOM the box under a telemetry burst.
  memory_limiter:
    check_interval: 5s
    limit_percentage: 80
    spike_limit_percentage: 25

exporters:
  # Prometheus scrapes THIS endpoint for all app/business metrics pushed over OTLP.
  prometheus:
    endpoint: 0.0.0.0:8889
    resource_to_telemetry_conversion:
      enabled: true

service:
  telemetry:
    logs:
      level: info
    metrics:
      # Bind on all interfaces so Prometheus can scrape the collector's own metrics at
      # otel-collector:8888 (prometheus.yml expects this target). Default is localhost = unreachable cross-container.
      address: 0.0.0.0:8888
  pipelines:
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, resourcedetection, batch]
      exporters: [prometheus]
