extensions:
  # Backs the exporters' sending queues so a WireGuard outage buffers to disk instead of discarding.
  file_storage:
    directory: /var/lib/otelcol/queue
    timeout: 10s

# WS9 OpenTelemetry Collector — the single ingest point for the estate's telemetry.
# Services push OTLP (traces + metrics); this fans out to Tempo / Prometheus / Loki. Container
# stdout (JSON logs with trace_id) is tailed by the filelog receiver and shipped to Loki, so the
# services stay decoupled from the log backend.
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

  # Tail every gaiada container's JSON log file. The Docker json-file driver wraps each line as
  # {"log": "...", "stream": "...", "time": "..."}; we unwrap `log`, then parse the service's own
  # JSON (pino/slog) to lift trace_id/span_id/level so logs correlate to traces in Grafana.
  filelog:
    include:
      - /var/lib/docker/containers/*/*-json.log
    include_file_path: true
    operators:
      - type: json_parser
        parse_from: body
        parse_to: attributes.docker
      - type: move
        from: attributes.docker.log
        to: body
      - type: json_parser
        parse_from: body
        parse_to: attributes
        if: 'body matches "^\\s*\\{"'
      - type: severity_parser
        parse_from: attributes.level
        if: 'attributes.level != nil'

  # ── RELOCATION (docs/plans/2026-08-18-observability-relocation.md) ────────────────────────────
  # Prometheus PULLS, and these exporters have no published ports -- so a Prometheus on another host
  # cannot reach them without exposing eight-plus ports across the tunnel. Instead the collector
  # scrapes them HERE, locally, and remote-writes the result. One outbound flow crosses the link and
  # no inbound port is opened on this box.
  #
  # These jobs are copied from prometheus/prometheus.yml deliberately verbatim (names, targets and
  # blackbox's relabel_configs). Job and instance labels must not drift, or every existing alert rule
  # and dashboard query silently stops matching -- which would look exactly like a healthy quiet
  # system rather than like a broken pipeline.
  prometheus/scrape:
    config:
      scrape_configs:
        - job_name: otel-collector
          static_configs:
            - targets: ["otel-collector:8889"]
        - job_name: otel-collector-self
          static_configs:
            - targets: ["otel-collector:8888"]
        - job_name: postgres
          static_configs:
            - targets: ["postgres-exporter:9187", "postgres-exporter-bot:9187"]
        - job_name: redis
          static_configs:
            - targets: ["redis-exporter:9121", "redis-exporter-bot:9121"]
        - job_name: node
          static_configs:
            - targets: ["node-exporter:9100"]
        - job_name: cadvisor
          static_configs:
            - targets: ["cadvisor:8080"]
        - job_name: blackbox-http
          metrics_path: /probe
          params:
            module: [http_2xx]
          static_configs:
            - targets:
                - http://ai-gateway:3002/health
                - http://bot:3001/health
                - http://mcp-hub:3003/health
                - http://platform:3004/health
                - http://knowledge:3005/health
                - http://platform-ui:3005/
          relabel_configs:
            - source_labels: [__address__]
              target_label: __param_target
            - source_labels: [__param_target]
              target_label: instance
            - target_label: __address__
              replacement: blackbox-exporter:9115

processors:
  batch:
    timeout: 10s
  resourcedetection:
    detectors: [env, system]
    timeout: 5s
  # Cap memory so the collector can never OOM the box under a telemetry burst.
  memory_limiter:
    check_interval: 5s
    limit_percentage: 80
    spike_limit_percentage: 25

exporters:
  # Prometheus scrapes THIS endpoint for all app/business metrics pushed over OTLP.
  prometheus:
    endpoint: 0.0.0.0:8889
    resource_to_telemetry_conversion:
      enabled: true
  # RELOCATED to the SumoPod VPS over WireGuard. The queue is the important part: without a
  # persistent one, a tunnel blip drops telemetry silently and the gap is indistinguishable from a
  # quiet system. file_storage keeps the queue across a collector restart too.
  prometheusremotewrite:
    endpoint: http://10.88.0.2:19090/api/v1/write
    tls:
      insecure: true
    # DISABLED 2026-08-19. This promotes every resource attribute to a Prometheus label, and for
    # SCRAPED metrics the collector's prometheus receiver attaches a lot of them: http_scheme,
    # net_host_name, net_host_port, server_address, server_port, service_instance_id,
    # service_name, url_scheme. job and instance are already carried natively, so all that adds
    # is eight labels of noise on every series -- changing series identity and multiplying
    # cardinality for no gain. Found while investigating MON-09p, which surfaced the same
    # promotion through Prometheus's OTLP receiver.
    resource_to_telemetry_conversion:
      enabled: false
    retry_on_failure:
      enabled: true
      initial_interval: 5s
      max_interval: 60s
    # NOT `sending_queue`: the prometheusremotewrite exporter in collector 0.116.1 rejects that key
    # outright (it crash-looped on `'' has invalid keys: sending_queue`) and uses remote_write_queue
    # instead. ⚠ That queue is IN-MEMORY ONLY -- this exporter has no persistent-storage option, so a
    # tunnel outage longer than the queue survives loses those metrics, and a collector restart loses
    # whatever is buffered. Traces and logs below DO get the durable queue.
    # The durable alternative for metrics is Prometheus's OTLP receiver
    # (--web.enable-otlp-receiver) plus an otlphttp exporter, which does support file storage;
    # deliberately not taken mid-migration, tracked as MON-09p.
    remote_write_queue:
      enabled: true
      queue_size: 10000
      num_consumers: 5

  # MON-09p: metrics to Prometheus's OTLP receiver instead of remote_write, because THIS exporter
  # supports a disk-backed sending_queue and prometheusremotewrite does not (0.116.1 has only an
  # in-memory remote_write_queue, so a tunnel outage past the buffer loses metrics for good).
  # `prometheusremotewrite` above is deliberately left configured but unreferenced: reverting is
  # then a one-line change to the pipeline below, with no config archaeology, if label semantics
  # turn out to shift. job/instance are what every alert rule matches on, so that risk is real.
  otlphttp/metrics:
    endpoint: http://10.88.0.2:19090/api/v1/otlp
    retry_on_failure:
      enabled: true
    sending_queue:
      enabled: true
      storage: file_storage
      queue_size: 10000

  otlp/tempo:
    endpoint: 10.88.0.2:4317
    tls:
      insecure: true
    retry_on_failure:
      enabled: true
    # Durable across a tunnel blip AND a collector restart (file_storage extension).
    sending_queue:
      enabled: true
      storage: file_storage
  otlphttp/loki:
    endpoint: http://10.88.0.2:13100/otlp
    retry_on_failure:
      enabled: true
    sending_queue:
      enabled: true
      storage: file_storage
  debug:
    verbosity: basic

service:
  extensions: [file_storage]
  telemetry:
    logs:
      level: info
    metrics:
      # Bind on all interfaces so Prometheus can scrape the collector's own metrics at
      # otel-collector:8888 (prometheus.yml expects this target). Default is localhost = unreachable cross-container.
      address: 0.0.0.0:8888
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, resourcedetection, batch]
      exporters: [otlp/tempo]
    # App/business metrics pushed over OTLP keep landing on :8889 exactly as before, so anything
    # scraping the collector directly is unaffected.
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, resourcedetection, batch]
      exporters: [prometheus]
    # The scraped half, forwarded to the relocated Prometheus. Kept as a SEPARATE pipeline on
    # purpose: putting prometheusremotewrite on the pipeline above as well would export OTLP metrics
    # twice -- once directly, and again after this receiver scrapes them back off :8889 -- which
    # double-counts every app metric and is very hard to spot in a dashboard.
    metrics/scrape:
      receivers: [prometheus/scrape]
      processors: [memory_limiter, batch]
      # MON-09p ATTEMPTED AND REVERTED 2026-08-19. Switching to otlphttp (for its disk-backed
      # queue) made Prometheus's OTLP receiver promote every resource attribute to a label:
      # http_scheme, net_host_name, net_host_port, server_address, server_port,
      # service_instance_id, service_name, url_scheme -- SEVEN extra labels on every series.
      # job and instance survived, so rules still matched, but series IDENTITY changed: the
      # post-switch series are different series from the historical ones, breaking continuity
      # and multiplying cardinality. Verified live: up went 16 -> 30, pg_up 2 -> 4,
      # probe_success 6 -> 12, each instance appearing twice.
      #
      # Not worth it for durability that only bites on an outage longer than the 10k in-memory
      # queue. Reinstating remote_write. Making the OTLP path viable needs a resource/transform
      # processor stripping those attributes first -- that is the real MON-09p, and it should be
      # done deliberately with a cardinality check, not as a tail-end swap.
      exporters: [prometheusremotewrite]
    logs:
      receivers: [otlp, filelog]
      processors: [memory_limiter, resourcedetection, batch]
      exporters: [otlphttp/loki]
