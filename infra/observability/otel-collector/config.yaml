extensions:
  # Backs the exporters' sending queues so a WireGuard outage buffers to disk instead of discarding.
  file_storage:
    directory: /var/lib/otelcol/queue
    timeout: 10s

  # WSK-D63 (2): bearer auth for the WebDesk-only receiver `otlp/webdesk` below. NEVER a literal here.
  # The token comes from WEBDESK_OTLP_BEARER_TOKEN, which docker-compose.observability.yml passes with
  # an UNSENDABLE default when the variable is empty or unset. That default matters: this extension
  # refuses to start at all on an empty token ("no bearer token provided"), which would crash-loop
  # the ERP's own collector on a release that precedes minting the token, and the tempting fix (a
  # printable placeholder) would be an open door. The default is a lone U+0001 control character,
  # which no HTTP client can put in a header, so "empty" means "this receiver refuses
  # every request" while the collector still starts and the ERP's own pipelines are untouched. A real token must be a plain
  # string: letters, digits, _ or -, starting with a letter (so nothing along the way can re-type it).
  bearertokenauth/webdesk:
    scheme: Bearer
    token: ${env:WEBDESK_OTLP_BEARER_TOKEN}

# WS9 OpenTelemetry Collector — the single ingest point for the estate's telemetry.
# Services push OTLP (traces + metrics); this fans out to Tempo / Prometheus / Loki. Container
# stdout (JSON logs with trace_id) is tailed by the filelog receiver and shipped to Loki, so the
# services stay decoupled from the log backend.
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

  # WSK-D63 (2) / WebDesk M4 T6a: the ONE ingest point for WebDesk's telemetry (design v2 §03 channel 2).
  # WRITE-ONLY: a receiver has no query API and nothing else on this port answers a read. OTLP/HTTP
  # only (traces + logs; see the pipelines below). Reachable ONLY through the docker0 publish in
  # docker-compose.observability.yml (172.17.0.1:4319), which the webdesk egress guard opens for the
  # webdesk network alone (webdesk/ops/host/webdesk-egress-guard.sh). Bearer-authenticated; an
  # unauthenticated or wrong-token request is a 401 before any body is read.
  # Verified by webdesk/ops/scripts/check-otlp-write-only.mjs (wired into CI), which also fails the
  # build if this receiver loses its auth or a read surface appears next to it.
  otlp/webdesk:
    protocols:
      http:
        endpoint: 0.0.0.0:4319
        auth:
          authenticator: bearertokenauth/webdesk
        # Bounds one request (the default is 20 MiB). Part of the rate bound; see the guard's pps limit.
        max_request_body_size: 4194304

  # Tail every gaiada container's JSON log file. The Docker json-file driver wraps each line as
  # {"log": "...", "stream": "...", "time": "..."}; we unwrap `log`, then parse the service's own
  # JSON (pino/slog) to lift trace_id/span_id/level so logs correlate to traces in Grafana.
  filelog:
    include:
      - /var/lib/docker/containers/*/*-json.log
    include_file_path: true
    operators:
      - type: json_parser
        parse_from: body
        parse_to: attributes.docker
      - type: move
        from: attributes.docker.log
        to: body
      - type: json_parser
        parse_from: body
        parse_to: attributes
        if: 'body matches "^\\s*\\{"'
      - type: severity_parser
        parse_from: attributes.level
        if: 'attributes.level != nil'

  # ── RELOCATION (docs/plans/2026-08-18-observability-relocation.md) ────────────────────────────
  # Prometheus PULLS, and these exporters have no published ports -- so a Prometheus on another host
  # cannot reach them without exposing eight-plus ports across the tunnel. Instead the collector
  # scrapes them HERE, locally, and remote-writes the result. One outbound flow crosses the link and
  # no inbound port is opened on this box.
  #
  # These jobs are copied from prometheus/prometheus.yml deliberately verbatim (names, targets and
  # blackbox's relabel_configs). Job and instance labels must not drift, or every existing alert rule
  # and dashboard query silently stops matching -- which would look exactly like a healthy quiet
  # system rather than like a broken pipeline.
  prometheus/scrape:
    config:
      scrape_configs:
        - job_name: otel-collector
          static_configs:
            - targets: ["otel-collector:8889"]
        - job_name: otel-collector-self
          static_configs:
            - targets: ["otel-collector:8888"]
        - job_name: postgres
          static_configs:
            - targets: ["postgres-exporter:9187", "postgres-exporter-bot:9187"]
        - job_name: redis
          static_configs:
            - targets: ["redis-exporter:9121", "redis-exporter-bot:9121"]
        - job_name: node
          static_configs:
            - targets: ["node-exporter:9100"]
        - job_name: cadvisor
          static_configs:
            - targets: ["cadvisor:8080"]
        - job_name: blackbox-http
          metrics_path: /probe
          params:
            module: [http_2xx]
          static_configs:
            - targets:
                - http://ai-gateway:3002/health
                - http://bot:3001/health
                - http://mcp-hub:3003/health
                - http://platform:3004/health
                - http://knowledge:3005/health
                - http://platform-ui:3005/
          relabel_configs:
            - source_labels: [__address__]
              target_label: __param_target
            - source_labels: [__param_target]
              target_label: instance
            - target_label: __address__
              replacement: blackbox-exporter:9115

processors:
  batch:
    timeout: 10s
  resourcedetection:
    detectors: [env, system]
    timeout: 5s
  # Cap memory so the collector can never OOM the box under a telemetry burst.
  memory_limiter:
    check_interval: 5s
    limit_percentage: 80
    spike_limit_percentage: 25

  # ── WebDesk receiver processors (WSK-D63 (2)) ─────────────────────────────────────────────────
  # A SEPARATE, LOWER memory ceiling so WebDesk telemetry is shed first: the limiter checks the whole
  # collector's heap, so when it passes ~768 MiB (soft = limit - spike) pushes on the webdesk receiver
  # are refused while the ERP's own pipelines (80% of the host) keep going. Not a rate limit: it is a
  # pressure valve.
  memory_limiter/webdesk:
    check_interval: 5s
    limit_mib: 1024
    spike_limit_mib: 256
  # Stamps every webdesk record. `upsert` so a sender cannot claim another namespace.
  resource/webdesk:
    attributes:
      - key: service.namespace
        value: webdesk
        action: upsert
      - key: gaiada.ingest
        value: otlp-push/webdesk
        action: upsert
  # The one real RATE limit the pinned collector (0.116.1) offers: spans per second, per collector.
  # (No ratelimit processor exists in this version; the logs path is bounded by request size, the
  # memory valve above, and the guard's packet-rate limit.) A trace is decided 5s after its first span.
  tail_sampling/webdesk:
    decision_wait: 5s
    num_traces: 5000
    expected_new_traces_per_sec: 50
    policies:
      - name: webdesk-spans-per-second
        type: rate_limiting
        rate_limiting:
          spans_per_second: 500

exporters:
  # Prometheus scrapes THIS endpoint for all app/business metrics pushed over OTLP.
  prometheus:
    endpoint: 0.0.0.0:8889
    resource_to_telemetry_conversion:
      enabled: true
  # RELOCATED to the SumoPod VPS over WireGuard. The queue is the important part: without a
  # persistent one, a tunnel blip drops telemetry silently and the gap is indistinguishable from a
  # quiet system. file_storage keeps the queue across a collector restart too.
  prometheusremotewrite:
    endpoint: http://10.88.0.2:19090/api/v1/write
    tls:
      insecure: true
    # MSO-01 (docs/plans/2026-08-21-multi-server-observability.md §4): every series from this
    # collector was host-less, and BOTH node jobs (this box's and SumoPod's own) shared the
    # identical instance label `node-exporter:9100` — the only thing telling them apart was a
    # hand-added `host: sumopod` static label on the REMOTE side's own scrape config. A second
    # agent-bundle host onboarded without a label here would emit LITERALLY IDENTICAL series and
    # the remote store would interleave two hosts' samples into one series: corruption, not
    # ambiguity. This makes gda-aicenter host #1 of the pattern rather than a special case.
    external_labels:
      host: gda-aicenter
      env: production
    # DISABLED 2026-08-19. This promotes every resource attribute to a Prometheus label, and for
    # SCRAPED metrics the collector's prometheus receiver attaches a lot of them: http_scheme,
    # net_host_name, net_host_port, server_address, server_port, service_instance_id,
    # service_name, url_scheme. job and instance are already carried natively, so all that adds
    # is eight labels of noise on every series -- changing series identity and multiplying
    # cardinality for no gain. Found while investigating MON-09p, which surfaced the same
    # promotion through Prometheus's OTLP receiver.
    resource_to_telemetry_conversion:
      enabled: false
    retry_on_failure:
      enabled: true
      initial_interval: 5s
      max_interval: 60s
    # NOT `sending_queue`: the prometheusremotewrite exporter in collector 0.116.1 rejects that key
    # outright (it crash-looped on `'' has invalid keys: sending_queue`) and uses remote_write_queue
    # instead. ⚠ That queue is IN-MEMORY ONLY -- this exporter has no persistent-storage option, so a
    # tunnel outage longer than the queue survives loses those metrics, and a collector restart loses
    # whatever is buffered. Traces and logs below DO get the durable queue.
    # The durable alternative for metrics is Prometheus's OTLP receiver
    # (--web.enable-otlp-receiver) plus an otlphttp exporter, which does support file storage;
    # deliberately not taken mid-migration, tracked as MON-09p.
    remote_write_queue:
      enabled: true
      queue_size: 10000
      num_consumers: 5

  # MON-09p: metrics to Prometheus's OTLP receiver instead of remote_write, because THIS exporter
  # supports a disk-backed sending_queue and prometheusremotewrite does not (0.116.1 has only an
  # in-memory remote_write_queue, so a tunnel outage past the buffer loses metrics for good).
  # `prometheusremotewrite` above is deliberately left configured but unreferenced: reverting is
  # then a one-line change to the pipeline below, with no config archaeology, if label semantics
  # turn out to shift. job/instance are what every alert rule matches on, so that risk is real.
  otlphttp/metrics:
    endpoint: http://10.88.0.2:19090/api/v1/otlp
    retry_on_failure:
      enabled: true
    sending_queue:
      enabled: true
      storage: file_storage
      queue_size: 10000
    # MSO-01: NOT mirrored with `external_labels` — verified live (`otelcol-contrib validate`,
    # 2026-08-21) that this key does not exist on the otlphttp exporter's schema at all
    # (prometheusremotewrite-only field; validate fails with "invalid keys: external_labels"). The
    # design doc's plan to "mirror" host/env identity here was wrong about the mechanism: OTLP
    # carries identity through RESOURCE ATTRIBUTES, which Prometheus's OTLP receiver then promotes
    # to labels (see the MON-09p note above — that promotion is exactly what made switching to
    # this exporter multiply cardinality by 8 extra labels). Adding host/env correctly here means
    # a `resource` processor setting `host.name`/`deployment.environment` attributes on this
    # pipeline specifically, scoped so it doesn't also leak onto the traces/logs pipelines that
    # already carry their own resource attributes cleanly. Left undone: this exporter is
    # unreferenced by any active pipeline (MON-09p is reverted), so there is no live gap today —
    # tracked as a MON-09p follow-up rather than done speculatively here.

  otlp/tempo:
    endpoint: 10.88.0.2:4317
    tls:
      insecure: true
    retry_on_failure:
      enabled: true
    # Durable across a tunnel blip AND a collector restart (file_storage extension).
    sending_queue:
      enabled: true
      storage: file_storage
  otlphttp/loki:
    endpoint: http://10.88.0.2:13100/otlp
    retry_on_failure:
      enabled: true
    sending_queue:
      enabled: true
      storage: file_storage
  debug:
    verbosity: basic

service:
  extensions: [file_storage, bearertokenauth/webdesk]
  telemetry:
    logs:
      level: info
    metrics:
      # Bind on all interfaces so Prometheus can scrape the collector's own metrics at
      # otel-collector:8888 (prometheus.yml expects this target). Default is localhost = unreachable cross-container.
      address: 0.0.0.0:8888
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, resourcedetection, batch]
      exporters: [otlp/tempo]
    # App/business metrics pushed over OTLP keep landing on :8889 exactly as before, so anything
    # scraping the collector directly is unaffected.
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, resourcedetection, batch]
      exporters: [prometheus]
    # The scraped half, forwarded to the relocated Prometheus. Kept as a SEPARATE pipeline on
    # purpose: putting prometheusremotewrite on the pipeline above as well would export OTLP metrics
    # twice -- once directly, and again after this receiver scrapes them back off :8889 -- which
    # double-counts every app metric and is very hard to spot in a dashboard.
    metrics/scrape:
      receivers: [prometheus/scrape]
      processors: [memory_limiter, batch]
      # MON-09p ATTEMPTED AND REVERTED 2026-08-19. Switching to otlphttp (for its disk-backed
      # queue) made Prometheus's OTLP receiver promote every resource attribute to a label:
      # http_scheme, net_host_name, net_host_port, server_address, server_port,
      # service_instance_id, service_name, url_scheme -- SEVEN extra labels on every series.
      # job and instance survived, so rules still matched, but series IDENTITY changed: the
      # post-switch series are different series from the historical ones, breaking continuity
      # and multiplying cardinality. Verified live: up went 16 -> 30, pg_up 2 -> 4,
      # probe_success 6 -> 12, each instance appearing twice.
      #
      # Not worth it for durability that only bites on an outage longer than the 10k in-memory
      # queue. Reinstating remote_write. Making the OTLP path viable needs a resource/transform
      # processor stripping those attributes first -- that is the real MON-09p, and it should be
      # done deliberately with a cardinality check, not as a tail-end swap.
      exporters: [prometheusremotewrite]
    logs:
      receivers: [otlp, filelog]
      processors: [memory_limiter, resourcedetection, batch]
      exporters: [otlphttp/loki]
    # ── WebDesk (WSK-D63 (2)): own pipelines, same exporters, tagged service.namespace=webdesk. ─────
    # Traces and logs only. NO metrics pipeline on purpose: the only metrics exporter here is the
    # Prometheus endpoint :8889 the ERP's alert rules read, and an untrusted sender must not be able
    # to mint series into it (the design's "metric poisoning / alert-fatigue" risk). A metrics push
    # to this receiver gets a 404. NEVER add `otlp/webdesk` to a pipeline above, and never add
    # another receiver to these: the checker fails CI on both.
    traces/webdesk:
      receivers: [otlp/webdesk]
      processors: [memory_limiter/webdesk, resource/webdesk, tail_sampling/webdesk, batch]
      exporters: [otlp/tempo]
    logs/webdesk:
      receivers: [otlp/webdesk]
      processors: [memory_limiter/webdesk, resource/webdesk, batch]
      exporters: [otlphttp/loki]
