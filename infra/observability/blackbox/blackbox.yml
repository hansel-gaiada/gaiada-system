# WS9 blackbox_exporter — synthetic HTTP probes for the key service endpoints. Prometheus passes
# each target as ?target=; a 2xx (or the UI's 200) within 8s is a success. probe_success feeds the
# availability SLO + the ServiceDown alert.
modules:
  http_2xx:
    prober: http
    timeout: 8s
    http:
      valid_http_versions: ["HTTP/1.1", "HTTP/2.0"]
      valid_status_codes: [] # default = any 2xx
      method: GET
      preferred_ip_protocol: ip4
      fail_if_not_ssl: false

  # M4 (2026-10-11): WebDesk's content API. An unknown tenant on /v1 answers 401 problem+json from the
  # api itself (through nginx, Caddy and the api's tenant lookup), so this proves the api, not just the
  # proxy (Caddy answers /healthz on its own). Any other status or content type is a failure.
  http_401_problem:
    prober: http
    timeout: 8s
    http:
      valid_http_versions: ["HTTP/1.1", "HTTP/2.0"]
      valid_status_codes: [401]
      method: GET
      preferred_ip_protocol: ip4
      fail_if_header_not_matches:
        - header: Content-Type
          regexp: '^application/problem\+json'
