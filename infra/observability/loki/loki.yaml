# WS9 Loki — log backend. Single-binary, filesystem storage (trial scale). Receives logs from the
# collector's OTLP-HTTP exporter at /otlp; Grafana queries it as the Loki datasource.
auth_enabled: false

server:
  http_listen_port: 3100

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  retention_period: 168h # 7 days at trial scale
  allow_structured_metadata: true # required for OTLP ingest (trace_id etc. as structured metadata)

# OBS-02: retention_period above does NOTHING by itself — Loki only enforces it if the compactor
# is running with retention_enabled. Without this block logs would accumulate unbounded, which is
# exactly the disk-fills-then-a-deploy-rolls-back-a-healthy-release risk this box has already hit
# once (see infra/runbooks/observability-loki.md). delete_request_store is required for the
# TSDB+filesystem combination to actually process deletion markers.
compactor:
  working_directory: /loki/compactor
  compaction_interval: 10m
  retention_enabled: true
  retention_delete_delay: 2h
  retention_delete_worker_count: 150
  delete_request_store: filesystem

analytics:
  reporting_enabled: false
