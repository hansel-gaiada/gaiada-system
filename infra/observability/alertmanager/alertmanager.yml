# WS9 / D15 Alertmanager — fans alerts to ≥2 INDEPENDENT transports so a single failing path can't
# hide an incident, plus a dead-man's-switch route. Secrets come from the environment (Alertmanager
# expands ${VAR} when started with --enable-feature=... no — it does NOT expand env by default, so
# these are templated by envsubst at deploy time OR set here directly; see deploy-vps.md). Transports:
#   1. Telegram   (transport #1, already used by the cron healthcheck)
#   2. Email/SMTP (independent path)
#   3. ntfy       (self-hosted push, independent of any third party)
#   4. Webhook    (generic — Slack/Discord/custom)
#   + Watchdog → external dead-man's-switch (healthchecks.io / Cronitor)
global:
  resolve_timeout: 5m
  smtp_smarthost: "${SMTP_SMARTHOST}"
  smtp_from: "${SMTP_FROM}"
  smtp_auth_username: "${SMTP_USERNAME}"
  smtp_auth_password: "${SMTP_PASSWORD}"
  # MAIL-02: Alertmanager's built-in default is smtp_require_tls: true, which flatly refuses a
  # TLS-less smarthost — including the dev-stage Mailpit sink (authless, plaintext, MAIL-00).
  # Must default to "true" (real-relay-safe) so a missing env var never silently downgrades
  # security; the sink leg sets SMTP_REQUIRE_TLS=false explicitly in that environment's .env.
  smtp_require_tls: ${SMTP_REQUIRE_TLS}
  # ⚠ 2026-09-01 — VERIFIED LIVE ON SUMOPOD: SMTP_SMARTHOST is set to `mailpit:1025`, and NO
  # mailpit container runs in the gaiada-obs project on that box (`docker compose -p gaiada-obs ps`
  # shows 8 containers, none named mailpit). Every email_configs leg on every receiver below
  # (default-multi, page-all, account-managers) is therefore a NO-OP today: Alertmanager logs a
  # DNS/connect failure on each send attempt and moves on — it does not crash, and it does not
  # block the other transports in the same receiver, but nobody receives that email. Per
  # infra/runbooks/alerting-wire-a-real-receiver.md's own lesson (a receiver that LOOKS wired but
  # delivers nothing is worse than an honest gap), do not treat SMTP as a working leg of the ≥2
  # independent transports design until a real relay (R8, docs/superpowers/specs/2026-08-04-zone-
  # a-mail-design.md) is wired with real creds in SumoPod's own .env. Today the only CONFIRMED
  # working transport is the ntfy.sh webhook leg (verified 2026-09-01 with a synthetic client_page
  # alert observed landing on the account-managers ntfy.sh topic). Telegram is currently ALSO
  # broken, independent of the SMTP issue: live logs show `telegram: Unauthorized: invalid token
  # specified (401)` on every send attempt against page-all — TELEGRAM_BOT_TOKEN in SumoPod's .env
  # is stale/revoked. Do not assume Telegram reaches anyone until that token is rotated and a
  # send is reverified; ntfy.sh is the one transport genuinely proven end-to-end right now.

route:
  receiver: default-multi
  group_by: ["alertname", "instance"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    # The always-firing heartbeat goes ONLY to the external dead-man's-switch, never to humans.
    - matchers: ['severity="watchdog"']
      receiver: deadmansswitch
      group_wait: 0s
      group_interval: 1m
      repeat_interval: 1m
      continue: false
    # 2026-08-31 rollout (docs/plans/2026-08-31-helios-delphi-plane-a-rollout.md §4) — the second
    # audience split, alongside the env split below. `client_page`/`client_ticket` are severities
    # used ONLY by alerts-estate.yml's `gaiada_client_properties` group (a CLIENT's website is
    # unreachable / its cert is expiring) — deliberately spelled differently from `page`/`ticket`
    # so they cannot collide with any engineering matcher below by accident. Grouped by
    # property_domain (not instance) so a flapping client site produces one notification thread,
    # not one per probe target if a property ever has multiple monitored URLs.
    - matchers: ['severity=~"client_page|client_ticket"']
      receiver: account-managers
      group_by: ["alertname", "property_domain"]
      group_wait: 30s
      group_interval: 10m
      repeat_interval: 4h
      continue: false
    # MSO-02 / OQ-2 (owner: "use the best way n safest", answered 2026-08-21): production PAGES,
    # staging/dev/ops are TICKET-ONLY — never a page. Alert fatigue is the failure mode that makes
    # real pages get ignored: a staging box waking someone at 3am does not make the estate safer,
    # it trains the responder to treat the pager as noise, which is precisely how a genuine
    # production page gets snoozed later. This branches on the `env` label MSO-01 landed on every
    # series (and therefore on every host-scoped alert), so ONE rule file keeps covering every
    # host regardless of environment — the routing tree branches on env, the rules stay
    # env-agnostic (design doc §8). Matched BEFORE the generic severity="page" route below so it
    # takes precedence for exactly the environments it names.
    #
    # No `env` label at all (app-level alerts with no host attribution, e.g. SyntheticJourneyFailing,
    # MailSendFailureRateHigh, or the legacy RemoteWriteStalled cross-check which sets env:
    # production statically) deliberately falls through to the generic page route below and pages
    # — the fail-safe direction the D15 dead-man's-switch philosophy already takes: an alert this
    # estate cannot attribute to an environment is treated as production-worthy rather than
    # silently downgraded.
    - matchers: ['severity="page"', 'env=~"staging|dev|ops"']
      receiver: default-multi
      group_wait: 30s
      repeat_interval: 4h
      continue: false
    # Pages hit every human transport immediately. Reaches here for env="production" and for any
    # page-severity alert carrying no env label at all (see comment above).
    - matchers: ['severity="page"']
      receiver: page-all
      group_wait: 10s
      repeat_interval: 1h

receivers:
  # Default: the receiver for `severity: ticket` AND for anything unmatched.
  #
  # ⚠ 2026-08-23 — THIS RECEIVER HAD NO WORKING TRANSPORT, AND IT IS THE ONE THAT MATTERS MOST.
  # It carried only Telegram and email. Both were placeholders in every environment
  # (`ops@notify.gaiada.invalid` via a Mailpit sink; `ALERT_CHAT_ID=100000000` with a bot token that
  # fails `getMe`). Meanwhile `page-all` had the webhook legs — so the ONE receiver with a real
  # transport was the one reached least often.
  #
  # The cost was measured, not theoretical: `GatewayBudgetNearCap` fired ~13 h/day and
  # `SyntheticJourneyFailing` ~14 h/day for over 24 h — both `severity: ticket`, both routed here,
  # both delivered nowhere — while the AI gateway 429'd real user traffic for a third of every day.
  #
  # The webhook leg below is what makes the DEFAULT path capable of reaching a human. Do not remove it
  # on the grounds that "pages already have it": the default route is where most alerts land.
  - name: default-multi
    webhook_configs:
      # Primary reachable transport. Set ALERT_WEBHOOK_URL to an ntfy topic (or Slack/Discord webhook).
      # Left unset this posts to an unresolvable host and fails loudly in the Alertmanager log —
      # which is still strictly better than the previous state, where it failed SILENTLY.
      - url: "${ALERT_WEBHOOK_URL}"
        send_resolved: true
    telegram_configs:
      - bot_token: "${TELEGRAM_BOT_TOKEN}"
        chat_id: ${ALERT_CHAT_ID}
        api_url: "https://api.telegram.org"
        message: '{{ template "gaiada.telegram" . }}'
        send_resolved: true
    email_configs:
      - to: "${ALERT_EMAIL_TO}"
        send_resolved: true

  # Pages: all four transports at once — maximal independence for the worst incidents.
  - name: page-all
    telegram_configs:
      - bot_token: "${TELEGRAM_BOT_TOKEN}"
        chat_id: ${ALERT_CHAT_ID}
        api_url: "https://api.telegram.org"
        message: '{{ template "gaiada.telegram" . }}'
        send_resolved: true
    email_configs:
      - to: "${ALERT_EMAIL_TO}"
        send_resolved: true
    webhook_configs:
      # ntfy: self-hosted push. ntfy accepts a JSON webhook on its topic URL.
      - url: "http://ntfy/gaiada-alerts"
        send_resolved: true
      # Generic webhook (Slack/Discord/custom) — set ALERT_WEBHOOK_URL, else this receiver entry is
      # harmlessly a duplicate ntfy post; deploy notes explain wiring the real endpoint.
      - url: "${ALERT_WEBHOOK_URL}"
        send_resolved: true

  # Dead-man's-switch: post the heartbeat to an EXTERNAL monitor. If Prometheus/Alertmanager die,
  # the external monitor stops receiving pings and raises the alarm out-of-band.
  - name: deadmansswitch
    webhook_configs:
      - url: "${DEADMANSSWITCH_URL}"
        send_resolved: false

  # 2026-08-31 rollout — client-site health (Plane B, MON-01) goes to whoever owns the client
  # relationship, not to engineering. Deliberately a DIFFERENT transport set from page-all/
  # default-multi: no Telegram leg to the on-call engineer's phone. If AM_ALERT_WEBHOOK_URL/
  # AM_ALERT_EMAIL_TO are unset this receiver fails loudly in the Alertmanager log — same
  # "fail loud, not silent" posture as ALERT_WEBHOOK_URL's own comment above; do not let this
  # receiver go live without both wired, per the alerting-wire-a-real-receiver.md lesson (a
  # receiver with no real transport is indistinguishable from no alerting at all).
  #
  # AM_ALERT_WEBHOOK_URL: set to a SEPARATE ntfy.sh secret topic from the engineering
  # ALERT_WEBHOOK_URL above — e.g. https://ntfy.sh/<a-different-hard-to-guess-topic>. Reusing the
  # SAME topic as ALERT_WEBHOOK_URL would merge the two audiences back into one firehose with
  # different labels, defeating the entire point of this receiver split (2026-09-01 review). No
  # new vendor needed: this is the identical mechanism ALERT_WEBHOOK_URL already uses, just a
  # second, independent subscription that account managers install the ntfy app / open the topic
  # URL for. The self-hosted `ntfy` container in this compose project (used by page-all's
  # hardcoded `http://ntfy/gaiada-alerts` leg) is NOT an option here — it publishes no host port
  # and is unreachable from outside the compose network, so nobody could ever subscribe to it.
  # AM_ALERT_EMAIL_TO is real but currently lands nowhere until the SMTP no-op above (global
  # block comment) is resolved with a working relay — do not treat it as a working leg on its own.
  - name: account-managers
    webhook_configs:
      - url: "${AM_ALERT_WEBHOOK_URL}"
        send_resolved: true
    email_configs:
      - to: "${AM_ALERT_EMAIL_TO}"
        send_resolved: true

templates:
  - /etc/alertmanager/templates/*.tmpl
