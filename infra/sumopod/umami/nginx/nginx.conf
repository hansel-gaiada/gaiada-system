# Shared main config for the three nginx gates (edge, admin-gate, read-gate). Runs as uid 101 on a
# read-only rootfs: every writable path is under /tmp (tmpfs).
worker_processes 1;
pid /tmp/nginx.pid;
# crit, not warn/error: nginx writes `client: <address>` into every request-level error line (an upstream that is
# down, a body spilled to a temp file, ...). On the public edge that address is a VISITOR's, and the docker logs keep
# it. Found by M5 QA on sumopod (2026-10-13): a replay chunk spilled to /tmp and its warn line named the visitor.
# Diagnose with the collector's own logs (no addresses) and the healthchecks instead.
error_log /dev/stderr crit;

events { worker_connections 256; }

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  # No access log: a collector's access log is a visitor log (IPs, paths). Rule: no personal data in logs.
  access_log off;
  server_tokens off;

  # Bodies stay in memory up to each location's cap (the server cap is 32k; /lib/kestrel/r sets its own 320k), so a
  # body is never spilled to a temp file.
  client_body_buffer_size 32k;
  client_body_temp_path /tmp/client_body;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;

  # Rendered by the image entrypoint (envsubst) from /etc/nginx/templates/*.template into /tmp.
  include /tmp/*.conf;
}
