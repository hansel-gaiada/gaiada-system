# Shared main config for the three nginx gates (edge, admin-gate, read-gate). Runs as uid 101 on a
# read-only rootfs: every writable path is under /tmp (tmpfs).
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 256; }

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  # No access log: a collector's access log is a visitor log (IPs, paths). Rule: no personal data in logs.
  access_log off;
  server_tokens off;

  client_body_temp_path /tmp/client_body;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;

  # Rendered by the image entrypoint (envsubst) from /etc/nginx/templates/*.template into /tmp.
  include /tmp/*.conf;
}
