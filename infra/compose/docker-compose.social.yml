# Gaiada — the SMM department's publishing engine (Postiz, AGPL-3.0, CONTAINED).
#
# STATUS: PROTOTYPED. Verified on local Docker by SMM-04 (2026-08-13). NOT deployed anywhere.
# Read `docs/superpowers/plans/2026-08-13-smm-04-containment-spike.md` and
# `infra/runbooks/deploy-vps.md` §"Postiz / SMM" for the ORIGINAL containment analysis — still
# valid reading — then read the retarget note immediately below, which supersedes the HOST.
#
# ─── ⚠ RETARGETED to `gda-aicenter` — owner re-zoning, 2026-08-31. Supersedes the SumoPod ───
# ─── target set 2026-08-13/18 (addenda §A4k/§A4l). Do not revert without a new owner ruling. ───
#
# The 2026-08-31 estate re-zoning replaced the old capacity-driven Zone A/B model with a
# purpose-based one: "system lives in aicenter" — the ERP control plane AND everything
# operational to it, `gaiada-social` included, now belong on `gda-aicenter`. Observability
# (`gaiada-obs-*`) is the one thing that STAYS on SumoPod, deliberately — a monitor co-located
# with what it monitors dies with it.
#
# The original 2026-08-13 footprint tripwire (~3.4 GiB needed against ~4.0 GB available, already
# 2.45 GB into swap) does not apply to the box as it stands 2026-08-31: measured then, `gda-
# aicenter` is a GCE e2-standard-4 (4 vCPU / 15.6 GiB, ~10 GiB available, load ~2.1/4, 52 GB disk
# free) with headroom this stack's ~1.8 GiB actual RSS fits inside on its own — see the capacity
# verdict in `../../docs/plans/2026-08-31-workload-consolidation-to-aicenter.md`, which also
# covers what changes when this stack lands ALONGSIDE the other two workloads that ruling moved.
#
# THIS HOST IS NOT "OURS ALONE" EITHER, just for a different reason than SumoPod's. It runs the
# ERP's own host Postgres (not containerized), Keycloak and Cerbos on the SAME kernel — the
# control plane's own trust anchors. The rules below are unchanged in spirit (never an unscoped
# Docker command against this project) and the isolation requirement is, if anything, more load-
# bearing than it was on SumoPod:
#   * NEVER run a Docker command that is not scoped to `-p gaiada-social`. No `docker system
#     prune`, no `docker image prune -a`, no bare `--remove-orphans` (the ERP's own deploy
#     pipeline already scopes its `--remove-orphans` to project `gaiada`, which structurally
#     cannot see this project — see the "separate compose project" note below — but a human at
#     a shell on this box can still get it wrong by typing a bare command).
#   * NEVER publish a port on `0.0.0.0` here. Same DNAT-before-firewall reasoning as always.
#     `SOCIAL_BIND_ADDR` is the control, and its default is loopback for that reason.
#   * NEVER attach any service in this file to network `gaiada_default` (172.18.0.0/16 — the
#     ERP's own compose network). This project intentionally declares no external network
#     reference, so it gets its own isolated `gaiada-social_default` bridge; adding a
#     `networks: [gaiada_default]` line to any service below would be the single line that
#     defeats that isolation, and nothing here should ever need it — Postiz talks to
#     `platform-nest` over HTTP on loopback now (see below), not by joining the ERP's network.
#
# ─── The ERP now reaches this over LOOPBACK — the WireGuard hop is retired ───
# `platform-nest` and Postiz now run on the SAME machine (`gda-aicenter`). The WireGuard tunnel
# this section used to require (`10.88.0.1` <-> `10.88.0.2`, cross-host) no longer has a reason
# to exist for this hop and is NOT part of this retarget — do not stand it up here. `SOCIAL_
# BIND_ADDR` stays `127.0.0.1` (the default below), and `platform-nest`'s `SocialPublisher`
# adapter calls `http://127.0.0.1:${SOCIAL_POSTIZ_PORT:-4007}` directly, same-host, same as every
# other loopback-bound sidecar on this box (e.g. `report-renderer`). One consequence worth
# recording: `MAIN_URL`/`FRONTEND_URL` already point at `https://erp.gaiada.online/social` —
# a path `platform-ui` serves on THIS SAME box — so the OAuth callback strings that matter for
# already-connected accounts are UNCHANGED by this retarget (see the env block below); only the
# transport between `platform-nest` and Postiz's backend changes, from a cross-host tunnel to
# loopback.
#
# ─── EXECUTION NOTE, 2026-09-01: what actually landed differs from the paragraph above ───
# The design intent above (route the OAuth-facing URLs through platform-ui's
# `https://erp.gaiada.online/social`) was NOT wired up on either host as of this migration —
# SumoPod's live values were `http://10.88.0.2:4007` (the WireGuard address) for all three of
# MAIN_URL/FRONTEND_URL/BACKEND_URL, not the erp.gaiada.online path, and platform-ui has no route
# today that catches an OAuth redirect and forwards it to Postiz. This migration preserved that
# exact shape and only swapped the host part (10.88.0.2 -> 127.0.0.1) — the smallest change that
# cannot invalidate anything: 0 rows existed in Postiz's `Integration` table at migration time
# (verified both sides), so no redirect_uri string was actually load-bearing yet. Wiring the
# erp.gaiada.online/social path is real follow-up work, not done here — re-pointing these three
# vars is a two-sided edit (this file + a platform-ui route that doesn't exist yet) and should
# not be done as a side effect of a host migration.
#
# ─── Why this is a SEPARATE compose project, not a profile in docker-compose.vps.yml ───
# `name: gaiada-social` puts these containers in their own compose project. The deploy
# workflow runs `up -d --remove-orphans` against the `gaiada` project; that flag deletes any
# container IN THAT PROJECT whose profile is not in the command. A profile alone would make
# this stack's survival depend on someone remembering to keep `social` in the COMPOSE_PROFILES
# repo variable forever. A separate project cannot be seen by that command at all, so the
# trap is structurally unreachable rather than merely documented. The `social` profile is kept
# on top of that so nothing here can start by accident. Precedent on the same box:
# `gaiada-automation` (n8n), `gaiada-loki`, `gaiada-otel-metrics`, `gaiada-alertmanager`.
#
# ─── The trim: upstream ships NINE services, this runs FIVE ───
# Dropped: `spotlight` (dev error viewer; upstream already gates it behind profile `debug`),
# `temporal-admin-tools` (a CLI toolbox, not a runtime dependency), `temporal-ui` (our doctrine
# forbids exposing it), and `temporal-elasticsearch` (see the `temporal` service note below).
# All four drops are packaging/config — category (a) of the design §06 fork-touchpoint budget.
# No Postiz code is patched by this file.
#
# ─── Invocation (NEVER a bare `up -d` — the profile is required) ───
#   cd infra/compose
#   COMPOSE_PROFILES=social docker compose -f docker-compose.social.yml up -d
# Do NOT add this file to the COMPOSE_FILES repo variable and do NOT add `social` to the
# COMPOSE_PROFILES repo variable: this stack is deliberately NOT part of the release deploy.
# It is pinned by digest and upgraded deliberately, never carried along by `git push --tags`.

name: gaiada-social

services:
  # ── The publishing engine. AGPL-3.0. Reached ONLY over its REST API, from the
  # platform-nest SocialPublisher adapter (SMM-05). Its UI is not routed anywhere.
  postiz:
    profiles: [social]
    # PINNED BY DIGEST, deliberately. `:latest` plus the deploy's `docker compose pull` would
    # silently roll an unreviewed AGPL engine onto the live box between releases; the licence
    # boundary is a reviewed surface, so it moves only when a human moves it. This digest is
    # the image SMM-04 measured and drove.
    image: ghcr.io/gitroomhq/postiz-app@sha256:785f97312f66a347fb96cdccc4ded5a33ced69a672c89a9adc8054e7d6a21dc5
    restart: unless-stopped
    # MEASURED at 2.27-2.83 GiB RSS (SMM-04), and STILL DRIFTING UPWARD when the measurement
    # ended (2.27 -> 2.75 GiB in ~45s) — treat that range as a floor, not a settled figure.
    # Node is not told about this limit, so hitting it is an OOM-kill, not graceful degradation.
    #
    # HISTORY: 3g at SMM-04 (2026-08-13, sized for the original ~4 GB `gda-aicenter` footprint
    # tripwire) -> 4g on the 2026-08-18 SumoPod retarget (12 GiB available there justified a
    # wider margin) -> back to 3g here on the 2026-08-31 retarget to `gda-aicenter`, which has
    # only ~10 GiB available shared with the ERP's own containers AND the other two workloads
    # this same ruling moved (webdesk, lab-runner). 3g restores the ORIGINAL SMM-04 figure — a
    # 6% margin over the measured 2.83 GiB peak — because a box this tight cannot afford the
    # wider margin SumoPod's spare 12 GiB allowed. Revisit again only with fresh soak evidence on
    # THIS host, not by copying either old number forward.
    mem_limit: 3g
    cpus: 1.50
    # PIDS_LIMIT CORRECTED 2026-09-01: shipped at 256 in the 2026-08-31 retarget, never soak-tested
    # against Postiz's actual thread footprint. Landing on `gda-aicenter` immediately went
    # `unhealthy` (healthcheck's own `node -e` subprocess hit SIGABRT/exit 134 trying to fork
    # while the cgroup was already at 249/256) with memory nowhere near its cap (2.2/3 GiB, 73%).
    # SumoPod's own 13-day-old production instance — which has NEVER had a pids_limit — measured
    # 259 threads steady-state at the same moment, confirming this is Postiz's real footprint, not
    # a leak triggered by the migration. 512 restores a real margin (2x the measured steady-state)
    # without meaningfully weakening the fork-bomb guard this field exists for.
    pids_limit: 512
    environment:
      # --- URLs. MAIN_URL/FRONTEND_URL are load-bearing: Postiz builds each network's OAuth
      # redirect_uri as `${FRONTEND_URL}/integrations/social/<provider>` (verified in
      # tiktok.provider.ts:325-355), and that exact string is both registered with the network
      # and replayed in the token exchange. Changing it invalidates every connected account.
      # See the spike report §7 for why this SHOULD point at a path WE serve, not at Postiz.
      #
      # ↳ NEITHER HOST MOVE CHANGES THESE STRINGS, and that is the point. FRONTEND_URL still
      #   names `https://erp.gaiada.online/social` — a path `platform-ui` serves, and since the
      #   2026-08-31 retarget that is now the SAME machine this file runs on. That remains ideal
      #   for the same reason it was when the two were separate machines: the OAuth callback is a
      #   browser redirect to a public URL, so it belongs at the edge that is already public,
      #   already TLS-terminated, already rate-limited and already reviewed — `platform-ui`
      #   catches the `code` and hands it to Postiz's backend over loopback now (previously over
      #   the WireGuard link to SumoPod; same call, simpler transport). Because the redirect_uri
      #   string is unchanged by either retarget, moving hosts CANNOT invalidate an already-
      #   connected account; that hazard is real but this change does not trip it.
      MAIN_URL: ${SOCIAL_POSTIZ_MAIN_URL:?}
      FRONTEND_URL: ${SOCIAL_POSTIZ_FRONTEND_URL:?}
      NEXT_PUBLIC_BACKEND_URL: ${SOCIAL_POSTIZ_BACKEND_URL:?}
      BACKEND_INTERNAL_URL: 'http://localhost:3000'
      JWT_SECRET: ${SOCIAL_POSTIZ_JWT_SECRET:?}
      DATABASE_URL: postgresql://postiz:${SOCIAL_POSTIZ_DB_PASSWORD:?}@social-postgres:5432/postiz
      REDIS_URL: redis://social-redis:6379
      TEMPORAL_ADDRESS: social-temporal:7233
      IS_GENERAL: 'true'
      # VERIFIED by SMM-04: with this true, POST /api/auth/register returns
      # 400 "Registration is disabled". Containment invariant — the only principals that ever
      # exist inside Postiz are the ones we provision. Bootstrap needs it FALSE exactly once
      # (see the runbook); it must be flipped back before the edge is opened.
      DISABLE_REGISTRATION: ${SOCIAL_POSTIZ_DISABLE_REGISTRATION:-true}
      RUN_CRON: 'true'
      STORAGE_PROVIDER: 'local'
      UPLOAD_DIRECTORY: '/uploads'
      NEXT_PUBLIC_UPLOAD_DIRECTORY: '/uploads'
      NX_ADD_PLUGINS: 'false'
      API_LIMIT: ${SOCIAL_POSTIZ_API_LIMIT:-30}
      # --- Platform-app credentials (design §11 custody split (a)): the group's OWN app
      # secrets, injected here and NOWHERE else. Never per-tenant rows, never in n8n
      # credentials, never in the browser. Client network tokens are created and held by
      # Postiz's own OAuth machinery and are never copied out (custody split (c)).
      # Every one of these is listed HERE on purpose: a var in .env does nothing unless the
      # service's `environment:` block names it. That trap has burned real tickets.
      FACEBOOK_APP_ID: ${SOCIAL_FACEBOOK_APP_ID:-}
      FACEBOOK_APP_SECRET: ${SOCIAL_FACEBOOK_APP_SECRET:-}
      LINKEDIN_CLIENT_ID: ${SOCIAL_LINKEDIN_CLIENT_ID:-}
      LINKEDIN_CLIENT_SECRET: ${SOCIAL_LINKEDIN_CLIENT_SECRET:-}
      TIKTOK_CLIENT_ID: ${SOCIAL_TIKTOK_CLIENT_ID:-}
      TIKTOK_CLIENT_SECRET: ${SOCIAL_TIKTOK_CLIENT_SECRET:-}
      YOUTUBE_CLIENT_ID: ${SOCIAL_YOUTUBE_CLIENT_ID:-}
      YOUTUBE_CLIENT_SECRET: ${SOCIAL_YOUTUBE_CLIENT_SECRET:-}
      # X ships DISABLED in every scope (addendum OQ-2 / D-14): a $0 publish path is what keeps
      # social.publishPost eligible for the D14 executable-approval registry. Empty on purpose.
      X_API_KEY: ''
      X_API_SECRET: ''
    volumes:
      - social-postiz-config:/config/
      - social-postiz-uploads:/uploads/
    ports:
      # ⚠ THE SINGLE MOST DANGEROUS LINE IN THIS FILE. Read before editing.
      #
      # `SOCIAL_BIND_ADDR` is the ONLY thing standing between this container and the public
      # internet, because Docker publishes ports by writing its own DNAT + FORWARD rules that
      # are evaluated BEFORE ufw's. A `0.0.0.0` bind here is reachable from the internet even
      # on a box whose firewall says "deny incoming", and the firewall will report success.
      # On `gda-aicenter` that would expose an AGPL engine holding live client OAuth tokens on
      # the SAME box as the ERP's host Postgres, Keycloak and Cerbos. There is no scenario in
      # which this value is `0.0.0.0`.
      #
      # One legitimate value since the 2026-08-31 retarget to gda-aicenter, and it is also the
      # default so a missing var fails SAFE:
      #   127.0.0.1   — `platform-nest` now runs on the SAME box and reaches this over loopback.
      #                 The former `10.88.0.2` WireGuard-address option (for the cross-host
      #                 SumoPod deploy) is retired along with that target — do not reintroduce it
      #                 here; a stray WireGuard peer address bound to a port on THIS box would be
      #                 a meaningless, silently-wrong value now that there is no tunnel to bind to.
      #
      # Nothing else about the exposure model changed: Temporal still publishes no port at all,
      # and both Postgres instances remain network-internal.
      - "${SOCIAL_BIND_ADDR:-127.0.0.1}:${SOCIAL_POSTIZ_PORT:-4007}:5000"
    networks: [social-app, social-temporal]
    healthcheck:
      test: ["CMD", "node", "-e", "const r=require('http').get('http://localhost:5000/',res=>process.exit(res.statusCode<500?0:1));r.on('error',()=>process.exit(1));r.setTimeout(4000,()=>{r.destroy();process.exit(1)})"]
      interval: 30s
      timeout: 10s
      retries: 10
      # MEASURED: ~90-150s to healthy on a 16 GB dev box with the image already local.
      # `gda-aicenter` has less headroom (~10 GiB available, 4 vCPU, load already ~2.1/4) and is
      # NOT idle the way a dev box is — 27 other containers are competing for the same 4 cores.
      # Expect this window to be tighter than the dev-box figure, not looser, and the FIRST boot
      # also pulls ~1.9 GB compressed and expands it to 5.66 GB, which is not covered by this
      # window either. Do not tighten without re-measuring on the real box.
      start_period: 240s
    depends_on:
      social-postgres: {condition: service_healthy}
      social-redis: {condition: service_healthy}
      social-temporal: {condition: service_healthy}

  # ── Postiz's OWN Postgres. Per the db-topology doctrine of per-service isolation, and per
  # design §03: its DB is opaque to us and we never query it from platform-nest.
  social-postgres:
    profiles: [social]
    image: postgres:17-alpine
    restart: unless-stopped
    mem_limit: 512m
    cpus: 0.50
    pids_limit: 128
    environment:
      POSTGRES_USER: postiz
      POSTGRES_PASSWORD: ${SOCIAL_POSTIZ_DB_PASSWORD:?}
      POSTGRES_DB: postiz
    volumes:
      - social-postiz-pg:/var/lib/postgresql/data
    networks: [social-app]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postiz -d postiz"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ── Postiz's OWN Redis. Upstream uses redis:7.2 (debian, 170 MB); alpine is 57 MB and is
  # what SMM-04 measured. Packaging only.
  social-redis:
    profiles: [social]
    image: redis:7.2-alpine
    restart: unless-stopped
    mem_limit: 320m
    cpus: 0.25
    pids_limit: 128
    command: ["redis-server", "--save", "60", "1", "--maxmemory", "192mb", "--maxmemory-policy", "noeviction"]
    volumes:
      - social-redis-data:/data
    networks: [social-app]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s

  # ── Temporal — the queue engine Postiz's publisher actually runs on. Not optional.
  #
  # ELASTICSEARCH IS DROPPED HERE, and this is the one trim that needed proving rather than
  # asserting. `ENABLE_ES` is deliberately UNSET: auto-setup.sh:46 defaults it to false, and
  # the false branch (auto-setup.sh:251) provisions the POSTGRES visibility schema
  # (`temporal_visibility`) instead of an ES index. SMM-04 verified end to end with no ES host
  # in existence: cluster health SERVING, `temporal workflow list` returned live rows, and the
  # visibility rows were readable in Postgres.
  #
  # THE CATCH — and this is a REQUIRED BOOTSTRAP STEP, not a nicety. The SQL visibility store
  # allows at most THREE custom search attributes of type Text (columns text01..text03).
  # Temporal pre-registers two of its own (`CustomStringField`, `CustomTextField`), and Postiz's
  # backend registers two more (`organizationId`, `postId` — temporal.register.js). 2 + 2 = 4,
  # so the backend dies on boot with "cannot have more than 3 search attribute of type Text",
  # never binds its API port, and every /api call 502s while the CONTAINER STILL REPORTS
  # HEALTHY (the healthcheck only probes the Next frontend on :5000). Free a slot ONCE, before
  # first starting Postiz — see the runbook. Config only; no Postiz code is touched.
  social-temporal:
    profiles: [social]
    image: temporalio/auto-setup:1.28.1
    restart: unless-stopped
    mem_limit: 768m
    cpus: 0.50
    pids_limit: 256
    environment:
      DB: postgres12
      DB_PORT: '5432'
      POSTGRES_USER: temporal
      POSTGRES_PWD: ${SOCIAL_TEMPORAL_DB_PASSWORD:?}
      POSTGRES_SEEDS: social-temporal-postgres
      TEMPORAL_NAMESPACE: default
      # NO ENABLE_ES / ES_SEEDS / ES_VERSION — that is the whole Elasticsearch drop.
      # NO DYNAMIC_CONFIG_FILE_PATH either: upstream points it at development-sql.yaml, which
      # exists only in their bind-mounted ./dynamicconfig directory, not in the image. Setting
      # it without that mount makes Temporal look for a file that isn't there.
    networks: [social-temporal]
    healthcheck:
      test: ["CMD", "temporal", "operator", "cluster", "health", "--address", "social-temporal:7233"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s
    depends_on:
      social-temporal-postgres: {condition: service_healthy}
    # NO published port. Upstream publishes 127.0.0.1:7233; nothing of ours needs it, and the
    # adapter never talks to Temporal — it talks to Postiz's REST API. Use `docker compose exec`
    # for the bootstrap step instead of opening a port for it.

  # ── Temporal's OWN Postgres — a SECOND Postgres instance, on a different major than Postiz's.
  # Upstream uses postgres:16 (debian, 642 MB); alpine is 420 MB.
  #
  # DISK HISTORY, since the number moved with each retarget and the box matters this time:
  # SMM-04 (2026-08-13, on `gda-aicenter`) counted this image as zero new bytes because the box
  # already had it. The 2026-08-18 SumoPod retarget made it 420 new MB there (`postiz:latest`'s
  # own postgres:17-alpine + redis:7.2-alpine added another ~480 MB), day-one total ~7.6 GB
  # against 169 GB free — noise. Back on `gda-aicenter` since 2026-08-31, the image is again
  # already local (SMM-04 pulled it here originally) — but free disk on THIS box is 52 GB, not
  # 169 GB, and the runbook's capacity verdict is where that budget is actually spent, not here.
  # Packaging only; this comment exists so the number is traceable, not because it is load-
  # bearing in this file.
  social-temporal-postgres:
    profiles: [social]
    image: postgres:16-alpine
    restart: unless-stopped
    mem_limit: 384m
    cpus: 0.50
    pids_limit: 128
    environment:
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: ${SOCIAL_TEMPORAL_DB_PASSWORD:?}
    volumes:
      - social-temporal-pg:/var/lib/postgresql/data
    networks: [social-temporal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temporal"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  social-postiz-pg:
  social-postiz-uploads:   # media storage — UNBOUNDED growth, see the runbook's disk note
  social-postiz-config:
  social-redis-data:
  social-temporal-pg:

networks:
  # Two networks, mirroring upstream's split: Temporal's database is not reachable from the
  # Postiz app, and Postiz's database is not reachable from Temporal. Postiz sits on both
  # because it is the only thing that talks to Temporal.
  social-app:
  social-temporal:
