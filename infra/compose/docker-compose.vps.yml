# Gaiada trial stack — everything on one VPS with one command:
#   cd infra/compose && cp .env.example .env   # fill it in
#   docker compose -f docker-compose.vps.yml up -d --build
# Only WAHA's dashboard (localhost) and nothing else is exposed beyond the box;
# the bot reaches Telegram/WAHA outbound. Backups: see ../scripts/backup.sh + the runbook.
name: gaiada

services:
  # PROFILE data — omit to use an EXTERNAL Postgres (set PG_HOST). See runbooks/deploy-vps.md.
  postgres:
    profiles: [data]
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: gaiada # bootstrap/maintenance DB only; app data lives in gaiada_platform/_knowledge/_bot
      POSTGRES_PASSWORD: ${POSTGRES_SUPER_PASSWORD:?}
      # Per-service owner (migrator) + runtime roles — see infra/db/init-cluster.sh (DB topology plan).
      # (bot roles live on the isolated pg-bot instance, not here.)
      PLATFORM_OWNER_PASSWORD: ${PLATFORM_OWNER_PASSWORD:?}
      PLATFORM_APP_PASSWORD: ${PLATFORM_APP_PASSWORD:?}
      SYNC_APP_PASSWORD: ${SYNC_APP_PASSWORD:?}
      KNOWLEDGE_OWNER_PASSWORD: ${KNOWLEDGE_OWNER_PASSWORD:?}
      KNOWLEDGE_APP_PASSWORD: ${KNOWLEDGE_APP_PASSWORD:?}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?}
      N8N_DB_PASSWORD: ${N8N_DB_PASSWORD:?}
    ports:
      - "127.0.0.1:55433:5432" # localhost-only; lets the standalone automation stack (n8n) reach gaiada_n8n
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ../../infra/db/init-cluster.sh:/docker-entrypoint-initdb.d/10-init-cluster.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d gaiada"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Isolated instance for the WhatsApp bot's PII/crypto-shred store (DB topology plan Phase E).
  pg-bot:
    profiles: [bot]
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: gaiada # bootstrap DB only; the bot store lives in gaiada_bot
      POSTGRES_PASSWORD: ${POSTGRES_SUPER_PASSWORD:?}
      BOT_OWNER_PASSWORD: ${BOT_OWNER_PASSWORD:?}
      BOT_APP_PASSWORD: ${BOT_APP_PASSWORD:?}
    volumes:
      - pg-bot-data:/var/lib/postgresql/data
      - ../../infra/db/init-bot.sh:/docker-entrypoint-initdb.d/10-init-bot.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d gaiada"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Core Redis — platform event backbone (Redis Streams relay/consumer + dead-letter).
  # PROFILE data — omit to use an EXTERNAL Redis (set REDIS_URL).
  redis:
    profiles: [data]
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data

  # Bot Redis — BullMQ media queue, isolated with the bot's data plane (DB topology plan Phase F).
  redis-bot:
    profiles: [bot]
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-bot-data:/data

  waha:
    # Pinned (never :latest — a floating tag can shift engine/payload behavior under you, an
    # error the aire project hit). NOWEB variant = Baileys engine, no Chromium (lighter). Bump
    # deliberately. Since 2026.6.1 all former Plus features ship in this free Core image.
    # 2026-07-29: tried bumping to noweb-2026.7.1 to fix a re-pair failure — it did NOT help, so the
    # pin is back on the version that demonstrably paired and ran WORKING earlier the same day.
    # Symptom (identical on BOTH versions): creds cleared, then Baileys logs `not logged in,
    # attempting registration...` -> `Error: Connection Failure`, retrying every ~2s, so WhatsApp
    # refuses the registration handshake and no QR is ever issued. Network was ruled out
    # (wss://web.whatsapp.com/ws/chat opens fine from inside this container; an earlier "unreachable"
    # reading was a false negative from wget lacking CA certs in this image). Remaining explanation
    # is an upstream WhatsApp-side throttle/block on the number or egress IP, most likely earned by
    # a ~2s reconnect storm during the Docker Desktop outage. Fix = wait it out with the session
    # STOPPED (retrying extends it). Don't re-bump on a hunch: 2026.7.1 was tested and ruled out.
    image: devlikeapro/waha:noweb-2026.6.2
    profiles: [bot]
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000" # dashboard via SSH tunnel only; never public
    environment:
      # Baileys-based, browser-free engine (per request). Sessions must be created with the NOWEB
      # store enabled (config.noweb.store.enabled=true) to expose chats/contacts — set at session
      # creation, not here; see the bot's session bootstrap / go-live runbook.
      WHATSAPP_DEFAULT_ENGINE: NOWEB
      WHATSAPP_HOOK_URL: "http://bot:3001/webhook?token=${WEBHOOK_SECRET:?}"
      # Subscribe to session.status too (not just message) so the bot can see reconnect/ban/logout
      # state changes instead of relying only on RESTART_ALL_SESSIONS + polling (aire gap).
      WHATSAPP_HOOK_EVENTS: "message,session.status"
      # Download inbound media so the bot's media-enrichment (voice/image → text via gateway
      # vision) actually receives files; without this WAHA serves no media URL.
      WHATSAPP_DOWNLOAD_MEDIA: "True"
      WHATSAPP_API_KEY: ${WAHA_API_KEY:?}
      WAHA_DASHBOARD_USERNAME: admin
      WAHA_DASHBOARD_PASSWORD: ${WAHA_DASHBOARD_PASSWORD:?}
      # Persisted sessions (waha-sessions volume) auto-restart on boot, so a linked number
      # survives restarts/redeploys WITHOUT a fresh QR scan (aire's key reconnect lesson).
      WHATSAPP_RESTART_ALL_SESSIONS: "True"
    volumes:
      - waha-sessions:/app/.sessions

  # AI gateway — the Go service (ai-gateway-go/) IS the gateway. The Node ai-gateway/ it
  # replaced was retired 2026-07-14 after code-complete parity + green build/tests; the service
  # keeps the name `ai-gateway` on port 3002 so every caller (bot, hub, knowledge, media-worker)
  # reaches it unchanged at http://ai-gateway:3002.
  # TLS is OFF here so the plain-HTTP contract callers speak keeps working; switch
  # GATEWAY_TLS_MODE to permissive/enforced once callers are enrolled with client certs.
  ai-gateway:
    image: ghcr.io/${GHCR_OWNER:-hansel-gaiada}/gaiada-ai-gateway-go:${GAIADA_TAG:-latest}
    restart: unless-stopped
    environment:
      # GATEWAY_PORT defaults to 3002 in config.go — left unset so callers need no URL change.
      GATEWAY_TOKEN: ${GATEWAY_TOKEN:?}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # Local-first: point at an Ollama on the VPS (e.g. http://host.docker.internal:11434);
      # empty disables the local provider and the chain goes straight to cloud/echo.
      OLLAMA_URL: ${OLLAMA_URL:-}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2}
      # OpenAI-compatible cloud brain (Ollama Cloud https://ollama.com/v1). When OPENAI_API_KEY is
      # set, LLM_CHAIN below routes text to it first; media/embeds fail over to whisper/gemini/ollama.
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-deepseek-v4-flash}
      # Vision model for image media (image/* only). Ollama Cloud: qwen3.5 accepts images, glm-5.2
      # does not. Audio/PDF are not vision-handled and fail over to whisper/gemini on MEDIA_CHAIN.
      OPENAI_VISION_MODEL: ${OPENAI_VISION_MODEL:-qwen3.5:397b}
      OPENAI_MAX_TOKENS: ${OPENAI_MAX_TOKENS:-1024}
      # Text chain: OpenAI-compatible brain first, then local Ollama, then cloud fallbacks. A
      # provider whose key/URL is unset reports Available()=false and is skipped, so this order is
      # safe even when OPENAI_* is blank (it falls straight through to the old ollama,gemini,claude).
      LLM_CHAIN: ${LLM_CHAIN:-openai,ollama,gemini,claude}
      # Media chain: openai vision handles images; audio (and anything non-image) fails over to
      # whisper for transcription, then gemini. openai auto-skips when its key is unset.
      MEDIA_CHAIN: ${MEDIA_CHAIN:-openai,whisper,gemini}
      # Embeddings are a SEPARATE chain from generation. `ollama` is a local provider, so site mode
      # keeps it (only cloud providers get stripped) — which is how the trial box embeds locally
      # while all generation goes to Hermes. nomic-embed-text emits 768 dims, matching the
      # vector(768) column in platform migration 0034_module_search.sql.
      EMBED_CHAIN: ${EMBED_CHAIN:-ollama,gemini}
      OLLAMA_EMBED_MODEL: ${OLLAMA_EMBED_MODEL:-nomic-embed-text}
      WHISPER_URL: http://whisper:8000
      WHISPER_MODEL: ${WHISPER_MODEL:-Systran/faster-whisper-small}
      GATEWAY_DAILY_CALL_CAP: ${GATEWAY_DAILY_CALL_CAP:-2000}
      GATEWAY_TLS_MODE: "off"
      # `central` = this box holds the cloud keys. Set `site` to hold NO model key locally: the
      # provider list then drops gemini/claude/openai and auto-appends central-forward, which POSTs
      # the Gateway contract (/complete, /media) to GATEWAY_CENTRAL_URL. On the gda-aicenter trial
      # that URL is the hermes-gateway shim, making the local Hermes agent the stack's brain while
      # DLP, the daily cost cap, the egress audit and failover all stay here.
      GATEWAY_TOPOLOGY_MODE: ${GATEWAY_TOPOLOGY_MODE:-central}
      GATEWAY_CENTRAL_URL: ${GATEWAY_CENTRAL_URL:-}
      # Model-assisted DLP classifier stays opt-in; enable only where Ollama is reachable.
      DLP_CLASSIFIER_ENABLED: ${DLP_CLASSIFIER_ENABLED:-false}
      EGRESS_ALLOWLIST: generativelanguage.googleapis.com,api.anthropic.com,ollama.com,whisper,host.docker.internal
      # WA-hardening D: telemetry is a BASE default (not only the observability.yml overlay) so it
      # survives a plain `up -d --build ai-gateway` with vps+local files only. Fail-soft (WS9): a
      # no-op unless OTEL_ENABLED is truthy; unreachable collector just drops spans, never crashes.
      OTEL_ENABLED: ${OTEL_ENABLED:-0}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4318}
      OTEL_SERVICE_NAME: ai-gateway
    volumes:
      - gateway-data:/app/data # egress audit (JSONL)

  # Keycloak (5b) — self-hosted IdP. Realm imported from ./keycloak on first boot. Backed by
  # Postgres (gaiada_keycloak) instead of embedded H2 (DB topology plan Phase D) — durable + backed
  # up with the core instance. Kept on start-dev for the trial (no TLS/hostname setup); a prod
  # deploy should move to `start` (KC_HOSTNAME + TLS) — see the plan's deploy notes.
  keycloak:
    profiles: [auth]
    image: quay.io/keycloak/keycloak:26.0
    restart: unless-stopped
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?}
      KC_HEALTH_ENABLED: "true"
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://${PG_HOST:-postgres}:5432/gaiada_keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?}
      # Behind nginx: Keycloak must build absolute URLs (issuer, auth endpoint, redirects) for the
      # PUBLIC host, not the container. Without KC_PROXY_HEADERS it trusts its own socket and mints
      # http://localhost URLs that the browser cannot follow and the platform will not accept.
      # Mounted at /idp, NOT /auth — the UI already owns /auth/callback and /auth/login, so /auth
      # would shadow the app's own OIDC routes.
      KC_HOSTNAME: ${KC_HOSTNAME:-}
      KC_HTTP_RELATIVE_PATH: ${KC_HTTP_RELATIVE_PATH:-/}
      KC_PROXY_HEADERS: ${KC_PROXY_HEADERS:-}
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro
      - kc-data:/opt/keycloak/data
    depends_on:
      postgres:
        condition: service_healthy

  # Cerbos (5b) — policy decision point. Policies from ./cerbos/policies (read-only).
  cerbos:
    image: ghcr.io/cerbos/cerbos:latest
    restart: unless-stopped
    command: ["server", "--config=/config/cerbos.yaml"]
    volumes:
      - ../../platform-nest/cerbos:/config:ro
      - ../../platform-nest/cerbos/policies:/policies:ro

  platform:
    image: ghcr.io/${GHCR_OWNER:-hansel-gaiada}/gaiada-platform-nest:${GAIADA_TAG:-latest}
    restart: unless-stopped
    environment:
      PLATFORM_SERVICE_TOKEN: ${PLATFORM_SERVICE_TOKEN:?}
      # Runtime = restricted platform_app; migrations/grants run as platform_owner (MIGRATE_DATABASE_URL).
      DATABASE_URL: postgres://platform_app:${PLATFORM_APP_PASSWORD:?}@${PG_HOST:-postgres}:5432/gaiada_platform
      MIGRATE_DATABASE_URL: postgres://platform_owner:${PLATFORM_OWNER_PASSWORD:?}@${PG_HOST:-postgres}:5432/gaiada_platform
      AUTH_MODE: ${PLATFORM_AUTH_MODE:-dev}
      # ISSUER must match the `iss` claim the IdP actually stamps, which is the PUBLIC url once
      # Keycloak sits behind a reverse proxy. JWKS stays INTERNAL so token verification never
      # hairpins out through nginx and back. Splitting them is deliberate, not an inconsistency.
      OIDC_ISSUER: ${OIDC_ISSUER:-http://keycloak:8080/realms/gaiada}
      OIDC_JWKS_URI: ${OIDC_JWKS_URI:-http://keycloak:8080/realms/gaiada/protocol/openid-connect/certs}
      OIDC_AUDIENCE: ${OIDC_AUDIENCE:-gaiada-platform}
      CERBOS_URL: http://cerbos:3592
      # 5c.4 file store — persistent volume so attachments survive restarts.
      FILES_DIR: /data/files
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      # Admin/Systems console aggregator (Phase C) — read-only probes of each downstream
      # service. All fail-soft: an unset URL just reports "not configured" in the console.
      GATEWAY_URL: http://ai-gateway:3002
      GATEWAY_TOKEN: ${GATEWAY_TOKEN:-}
      BOT_URL: http://bot:3001
      ADMIN_TOKEN: ${BOT_ADMIN_TOKEN:-}
      HUB_URL: http://mcp-hub:3003
      HUB_SERVICE_TOKEN: ${HUB_SERVICE_TOKEN:-}
      KNOWLEDGE_URL: http://knowledge:3005
      KNOWLEDGE_SERVICE_TOKEN: ${KNOWLEDGE_SERVICE_TOKEN:-}
      # Agent runner (B2) — enables /api/:t/agents/* endpoints
      AGENTS_URL: http://agent-runner:3006
      AGENT_RUNNER_TOKEN: ${AGENT_RUNNER_TOKEN:-}
      # WD-04 (Web Dev Phase 1): in-ERP audio upload -> server-side transcription. Calls the
      # whisper container DIRECTLY (same container ai-gateway's MEDIA_CHAIN uses) — never via
      # ai-gateway-go — because meeting-length audio would exceed the gateway's ~2.5-min
      # per-call timeout. Empty WHISPER_URL => the upload endpoint refuses cleanly.
      WHISPER_URL: http://whisper:8000
      WHISPER_MODEL: ${WHISPER_MODEL:-Systran/faster-whisper-small}
      MEETING_AUDIO_MAX_BYTES: ${MEETING_AUDIO_MAX_BYTES:-209715200}
      # Automation is the separate `gaiada-automation` n8n stack; set these only if n8n is
      # reachable from this network. AUTOMATION_API_KEY is an n8n Public-API key → the
      # Systems→Automation console then lists real workflows + last-run.
      AUTOMATION_URL: ${AUTOMATION_URL:-}
      AUTOMATION_API_KEY: ${AUTOMATION_API_KEY:-}
      # Event → n8n bridge (WS4 §4). Off unless all four are set. N8N_BRIDGE_SECRET must match
      # the value the event workflows check. Only set N8N_WEBHOOK_BASE_URL if n8n is reachable.
      N8N_WEBHOOK_BASE_URL: ${N8N_WEBHOOK_BASE_URL:-}
      N8N_BRIDGE_SECRET: ${N8N_BRIDGE_SECRET:-}
      N8N_BRIDGE_EVENTS: ${N8N_BRIDGE_EVENTS:-}
      # DEF-1 (2026-07-30): the ingest proxy waits on the dispatcher, which does real AI work inline
      # (MOM + 3 extractions + a recording-context read) measured at 15-23s. This was never forwarded
      # to the container, so it silently used the old 5s code default and EVERY ingest returned
      # dispatcher_unreachable — the run completed server-side but the recording never flipped to
      # `ingested` nor linked pipeline_run_id, breaking the capture->run chain.
      N8N_BRIDGE_TIMEOUT_MS: ${N8N_BRIDGE_TIMEOUT_MS:-30000}
      # Search-marketing (SM-05/SM-06). All optional: with DATAFORSEO_* unset the paid driver is
      # not registered and every paid search capability fails closed, while the $0 pillars
      # (crawler audits, keyword clustering, AI drafts) keep working. ONE shared deposit pool —
      # never per-client keys. Keep the queue on 'standard' ($0.0006/SERP vs Live's $0.002).
      DATAFORSEO_LOGIN: ${DATAFORSEO_LOGIN:-}
      DATAFORSEO_PASSWORD: ${DATAFORSEO_PASSWORD:-}
      DATAFORSEO_QUEUE: ${DATAFORSEO_QUEUE:-standard}
      # SM-33/34/35 (tracker §6): "live" (default) registers real vendor drivers per their own
      # credentials below; "simulate" registers synthetic drivers instead, so dev/staging demos the
      # department at $0 real spend without empty tables.
      SEARCH_PROVIDER_MODE: ${SEARCH_PROVIDER_MODE:-live}
      # SM-48 (tracker §6s): a PLATFORM-LEVEL, tenant-agnostic portfolio-domain list (comma-separated),
      # folded into simulate mode's SERP candidate pool ONLY — never read by the live drivers. Fixes
      # the gap where a simulated rank-pull always returned position: null. Deliberately NOT per-tenant
      # (search_data_cache is shared, no-RLS market data — D-4). Unset (default) => today's simulated
      # SERP, byte for byte.
      SEARCH_SIMULATION_PORTFOLIO_DOMAINS: ${SEARCH_SIMULATION_PORTFOLIO_DOMAINS:-}
      # Semrush Analytics API v3 (SM-34). Empty SEMRUSH_API_KEY => not registered, independently of
      # the other two vendors' own credential checks. Design addendum §A3.3/§A7 OQ-9 (BINDING): the
      # plan price/allowance are UNVERIFIED owner-supplied facts (read off the Semrush account
      # console) — BOTH must be positive or the driver does NOT register even with the key set.
      SEMRUSH_API_KEY: ${SEMRUSH_API_KEY:-}
      SEMRUSH_BASE_URL: ${SEMRUSH_BASE_URL:-https://api.semrush.com}
      SEMRUSH_DATABASE: ${SEMRUSH_DATABASE:-us}
      SEMRUSH_MONTHLY_PLAN_PRICE_USD: ${SEMRUSH_MONTHLY_PLAN_PRICE_USD:-}
      SEMRUSH_MONTHLY_UNIT_ALLOWANCE: ${SEMRUSH_MONTHLY_UNIT_ALLOWANCE:-}
      # Ahrefs API v3 (SM-35). Empty AHREFS_API_KEY => not registered, independently of the other two
      # vendors' own credential checks. AHREFS_RANK_TRACKER_PROJECT_ID only gates the 'serp'
      # capability (Ahrefs's SERP Overview needs a pre-existing Rank Tracker project); unset refuses
      # that one capability cleanly, no effect on volume/difficulty/backlinks/competitors. Design
      # addendum §A3.3/§A7 OQ-10 (BINDING): the API-tier price/allowance are UNVERIFIED owner-supplied
      # facts — BOTH must be positive or the driver does NOT register even with the key set.
      AHREFS_API_KEY: ${AHREFS_API_KEY:-}
      AHREFS_BASE_URL: ${AHREFS_BASE_URL:-https://api.ahrefs.com/v3}
      AHREFS_COUNTRY: ${AHREFS_COUNTRY:-us}
      AHREFS_RANK_TRACKER_PROJECT_ID: ${AHREFS_RANK_TRACKER_PROJECT_ID:-}
      AHREFS_MONTHLY_API_TIER_PRICE_USD: ${AHREFS_MONTHLY_API_TIER_PRICE_USD:-}
      AHREFS_MONTHLY_UNIT_ALLOWANCE: ${AHREFS_MONTHLY_UNIT_ALLOWANCE:-}
      SEARCH_GLOBAL_MONTHLY_CAP_USD: ${SEARCH_GLOBAL_MONTHLY_CAP_USD:-150}
      SEARCH_TENANT_MONTHLY_CAP_USD: ${SEARCH_TENANT_MONTHLY_CAP_USD:-}
      SEARCH_BUDGET_WARN_RATIO: ${SEARCH_BUDGET_WARN_RATIO:-0.8}
      SEARCH_PILLAR_SEO: ${SEARCH_PILLAR_SEO:-1}
      SEARCH_PILLAR_SEM: ${SEARCH_PILLAR_SEM:-1}
      SEARCH_PILLAR_GEO: ${SEARCH_PILLAR_GEO:-1}
      N8N_BRIDGE_ENTITY_TYPES: ${N8N_BRIDGE_ENTITY_TYPES:-}
      # Event → knowledge-graph bridge (WS8 Step E). Forwards business events on these entity streams
      # to the knowledge service /graph/ingest (reuses KNOWLEDGE_URL/TOKEN above). Off unless set.
      GRAPH_BRIDGE_ENTITY_TYPES: ${GRAPH_BRIDGE_ENTITY_TYPES:-}
      # ORG-6 release train (WSD-8 go-live 2026-07-22): shared-service assignments + reconciler.
      # Dark by default (empty/unset -> off); "1"/"true" flips the whole train on.
      SERVICE_ASSIGNMENTS_ENABLED: ${SERVICE_ASSIGNMENTS_ENABLED:-}
      # WA-hardening D: base telemetry default (see ai-gateway comment above for rationale).
      OTEL_ENABLED: ${OTEL_ENABLED:-0}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4318}
      OTEL_SERVICE_NAME: platform
      # App version (docs/modules/VERSIONING.md), surfaced by GET /health. deploy.yml sets this
      # from /VERSION so a running box can always be asked what it is.
      APP_VERSION: ${APP_VERSION:-}
    volumes:
      - platform-files:/data/files
    # SM-45: gives depends_on: condition: service_healthy something to attach to. GET /health is
    # the same root probe the admin console + mcp-hub's module-tools bootstrap already hit; node:22
    # -alpine ships busybox wget so no extra package is needed in the image. Use 127.0.0.1, NOT
    # localhost — busybox wget resolves localhost to ::1 first and the app only binds 0.0.0.0
    # (IPv4), so "localhost" gets a false-negative "connection refused" from inside the container.
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3004/health"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy
      # Every request authorizes against Cerbos; start it first (fail-closed if it's down).
      cerbos:
        condition: service_started
      redis:
        condition: service_started
      # WD-04: platform calls whisper directly for in-ERP audio uploads. No healthcheck defined
      # on the whisper image (first request downloads its model, so "healthy" isn't meaningful at
      # boot) — service_started is enough; the upload path itself tolerates whisper being briefly
      # unready (retry action on failure).
      whisper:
        condition: service_started

  # Sync engine (WS1 T2) — CENTRAL role. Serves push/pull over mTLS to remote site nodes and runs
  # the tombstone GC sweep. Reconciles the SAME gaiada_platform DB the platform writes (the sync
  # tables + the outbox hlc column ship in platform-nest migrations 0012/0013). Idle until a real
  # second site is enrolled; deploying it now is harmless (no site nodes → nothing to serve).
  # ONE-TIME cert provisioning (mTLS is mandatory here, unlike the gateway): the gateway persists
  # the internal CA to the gateway-data volume; issue this node's server cert from it once, e.g.
  #   docker compose run --rm --entrypoint /synccert sync-central \
  #     -ca-cert /gateway-ca/ca-cert.pem -ca-key /gateway-ca/ca-key.pem \
  #     -cn central -out-cert /app/data/sync.crt -out-key /app/data/sync.key
  # then issue each site node's client cert (CN = its NODE_ID) and add it to site_subscriptions.
  sync-central:
    profiles: [multisite]
    image: ghcr.io/${GHCR_OWNER:-hansel-gaiada}/gaiada-sync-engine-go:${GAIADA_TAG:-latest}
    restart: unless-stopped
    environment:
      SYNC_MODE: central
      NODE_ID: central
      # Runtime = restricted sync_app (scoped to the sync footprint; DENIED platform-internal tables).
      DATABASE_URL: postgres://sync_app:${SYNC_APP_PASSWORD:?}@${PG_HOST:-postgres}:5432/gaiada_platform
      SYNC_LISTEN_ADDR: 0.0.0.0:3013
      SYNC_CA_CERT: /gateway-ca/ca-cert.pem
      SYNC_CERT: /app/data/sync.crt
      SYNC_KEY: /app/data/sync.key
      # Empty = accept any CA-signed node (the site_subscriptions ACL is then the sole tenant
      # gate); set to a comma list of node CNs to also pin an allowlist.
      SYNC_ALLOWED_CNS: ${SYNC_ALLOWED_CNS:-}
      # WA-hardening D: base telemetry default (see ai-gateway comment above for rationale).
      OTEL_ENABLED: ${OTEL_ENABLED:-0}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4318}
      OTEL_SERVICE_NAME: sync-engine
    volumes:
      - sync-data:/app/data
      - gateway-data:/gateway-ca:ro # reuse the gateway's persisted internal CA
    depends_on:
      postgres:
        condition: service_healthy

  # SM-07 crawl worker (search-crawl-go). Job-mode by design (one container run = one crawl of one
  # registered+verified search_properties row, then exit) — NOT part of the always-on stack, so
  # profile-gated + restart:"no" like sync-central's spirit but without the "unless-stopped" server
  # lifecycle. Dispatch a crawl with:
  #   docker compose -f docker-compose.vps.yml --profile jobs run --rm \
  #     -e TENANT_ID=<company uuid> -e PROPERTY_ID=<search_properties uuid> search-crawl
  # Egress is fully closed by default: it has no allowlist of its own baked in — the ONLY hosts a
  # run may reach are resolved at dispatch from that tenant's own search_properties row (SM-07
  # egress guard, internal/egress). No inbound ports (Zone A egress-only, design §05 table).
  search-crawl:
    image: ghcr.io/${GHCR_OWNER:-hansel-gaiada}/gaiada-search-crawl-go:${GAIADA_TAG:-latest}
    restart: "no"
    profiles: ["jobs"] # never starts with a plain `up -d`; run explicitly per crawl
    environment:
      # Runtime = platform_app (NOBYPASSRLS) — identical runtime privilege to platform-nest
      # itself; the crawl worker gets no elevated DB grant.
      DATABASE_URL: postgres://platform_app:${PLATFORM_APP_PASSWORD:?}@${PG_HOST:-postgres}:5432/gaiada_platform
      # Deliberately `:-` (empty default), NOT `:?`. Compose validates interpolation for EVERY
      # service in the file regardless of active profile, so a `:?` here made *every* compose
      # command on this project fail ("required variable TENANT_ID is missing") even though
      # search-crawl is profile-gated and never started by `up -d` — it blocked routine
      # `up -d`/`build`/`ps` on the whole stack. The enforcement is not lost: cmd/crawl/main.go's
      # requireEnv() exits with "missing required env TENANT_ID" on an empty value, which is the
      # correct place for it — the run fails fast, and unrelated commands keep working.
      TENANT_ID: "${TENANT_ID:-}" # set per run: docker compose --profile jobs run -e TENANT_ID=<company uuid> …
      PROPERTY_ID: "${PROPERTY_ID:-}" # set per run: -e PROPERTY_ID=<search_properties uuid>
      AUDIT_LOG_PATH: /app/data/egress-audit.jsonl
      REPORT_PATH: /app/data/report.json
      MAX_PAGES: ${SEARCH_CRAWL_MAX_PAGES:-25}
      MIN_HOST_GAP_MS: ${SEARCH_CRAWL_MIN_HOST_GAP_MS:-1000}
    volumes:
      - search-crawl-data:/app/data
    depends_on:
      postgres:
        condition: service_healthy

  platform-ui:
    image: ghcr.io/${GHCR_OWNER:-hansel-gaiada}/gaiada-platform-ui:${GAIADA_TAG:-latest}
    restart: unless-stopped
    environment:
      PLATFORM_URL: http://platform:3004
      PLATFORM_SERVICE_TOKEN: ${PLATFORM_SERVICE_TOKEN:?}
      SESSION_SECRET: ${UI_SESSION_SECRET:?}
      # UI-side mirror of the backend flag (ORG-13; default OFF). Must match the platform's
      # SERVICE_ASSIGNMENTS_ENABLED so the Connect-service UI surfaces only when the backend
      # actually serves it (writes 409 while off).
      SERVICE_ASSIGNMENTS_ENABLED: ${SERVICE_ASSIGNMENTS_ENABLED:-}
      APP_VERSION: ${APP_VERSION:-}
      # OIDC (authorization-code + PKCE, public client — no secret).
      # AUTH_URL is BROWSER-facing so it must be the public host; TOKEN_URL is a server-to-server
      # call from this container, so it stays internal. Mixing those up is the classic failure:
      # the redirect works, then the code exchange dies on DNS or a proxy loop.
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-gaiada-ui}
      OIDC_AUTH_URL: ${OIDC_AUTH_URL:-}
      OIDC_TOKEN_URL: ${OIDC_TOKEN_URL:-}
      OIDC_REDIRECT_URI: ${OIDC_REDIRECT_URI:-}
      # Mirrors the platform's mode so the login page can hide the dev email box when it is
      # disabled server-side — otherwise the page's primary action is the one that cannot work.
      AUTH_MODE: ${PLATFORM_AUTH_MODE:-dev}
      # The address the BROWSER used. Without it, redirects are built from the container's bind
      # address and the OIDC callback lands on an unreachable host.
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-}
    ports:
      - "3005:3005"
    depends_on:
      platform:
        condition: service_healthy

  # Self-hosted transcription (5a.3) — CPU image; audio transcribes locally, never
  # leaving the box. First request downloads the model into the volume (be patient).
  # PROFILE whisper — omit to transcribe elsewhere (e.g. a local workstation). Platform's
  # WHISPER_URL then points nowhere and the upload endpoint refuses cleanly by design.
  whisper:
    profiles: [whisper]
    image: fedirz/faster-whisper-server:latest-cpu
    restart: unless-stopped
    volumes:
      - whisper-models:/root/.cache/huggingface

  knowledge:
    image: ghcr.io/${GHCR_OWNER:-hansel-gaiada}/gaiada-ai-agents:${GAIADA_TAG:-latest}
    command: ["npx", "tsx", "src/knowledge/service.ts"]
    restart: unless-stopped
    environment:
      KNOWLEDGE_SERVICE_TOKEN: ${KNOWLEDGE_SERVICE_TOKEN:?}
      # Runtime = knowledge_app; schema DDL runs as knowledge_owner (MIGRATE_DATABASE_URL).
      KNOWLEDGE_DATABASE_URL: postgres://knowledge_app:${KNOWLEDGE_APP_PASSWORD:?}@${PG_HOST:-postgres}:5432/gaiada_knowledge
      MIGRATE_DATABASE_URL: postgres://knowledge_owner:${KNOWLEDGE_OWNER_PASSWORD:?}@${PG_HOST:-postgres}:5432/gaiada_knowledge
      PLATFORM_URL: http://platform:3004
      PLATFORM_SERVICE_TOKEN: ${PLATFORM_SERVICE_TOKEN:?}
      GATEWAY_URL: http://ai-gateway:3002
      GATEWAY_TOKEN: ${GATEWAY_TOKEN:?}
      # WA-hardening D: base telemetry default (see ai-gateway comment above for rationale).
      OTEL_ENABLED: ${OTEL_ENABLED:-0}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4318}
      OTEL_SERVICE_NAME: knowledge
    depends_on:
      postgres:
        condition: service_healthy
      # SM-45: knowledge calls platform's API right away (module contract reads); wait for the real
      # healthcheck, not just "container process started", to close the same boot-order race.
      platform:
        condition: service_healthy
      ai-gateway:
        condition: service_started

  # B2: agent-runner (WS8) — goal queue + durable run store around the proven runners
  # (runOrchestrator / runWriteAgent / traceRun). Serves /goals, /runs, /metrics/agents; reached
  # by platform-nest /api/:t/agents/* proxy. Tables (agent_goals / agent_runs) live in gaiada_knowledge
  # alongside the episodic store; no new DB/role needed.
  agent-runner:
    image: ghcr.io/${GHCR_OWNER:-hansel-gaiada}/gaiada-ai-agents:${GAIADA_TAG:-latest}
    command: ["npx", "tsx", "src/runner/service.ts"]
    restart: unless-stopped
    environment:
      AGENT_RUNNER_TOKEN: ${AGENT_RUNNER_TOKEN:?}
      # Runtime = knowledge_app (same as knowledge service); DDL runs as knowledge_owner.
      AGENTS_DATABASE_URL: postgres://knowledge_app:${KNOWLEDGE_APP_PASSWORD:?}@${PG_HOST:-postgres}:5432/gaiada_knowledge
      MIGRATE_DATABASE_URL: postgres://knowledge_owner:${KNOWLEDGE_OWNER_PASSWORD:?}@${PG_HOST:-postgres}:5432/gaiada_knowledge
      GATEWAY_URL: http://ai-gateway:3002
      GATEWAY_TOKEN: ${GATEWAY_TOKEN:?}
      HUB_URL: http://mcp-hub:3003
      HUB_SERVICE_TOKEN: ${HUB_SERVICE_TOKEN:?}
    depends_on:
      postgres:
        condition: service_healthy
      ai-gateway:
        condition: service_started
      mcp-hub:
        condition: service_started

  mcp-hub:
    image: ghcr.io/${GHCR_OWNER:-hansel-gaiada}/gaiada-mcp-hub:${GAIADA_TAG:-latest}
    restart: unless-stopped
    ports:
      - "127.0.0.1:3003:3003" # localhost-only; lets the standalone automation stack (n8n) reach the hub
    environment:
      HUB_SERVICE_TOKEN: ${HUB_SERVICE_TOKEN:?}
      GATEWAY_URL: http://ai-gateway:3002
      GATEWAY_TOKEN: ${GATEWAY_TOKEN:?}
      PLATFORM_URL: http://platform:3004
      PLATFORM_SERVICE_TOKEN: ${PLATFORM_SERVICE_TOKEN:?}
      KNOWLEDGE_URL: http://knowledge:3005
      KNOWLEDGE_SERVICE_TOKEN: ${KNOWLEDGE_SERVICE_TOKEN:?}
      # WS2 §5: make the versioned `mcp_tool` Cerbos policy authoritative (in-code stays as fallback).
      CERBOS_URL: http://cerbos:3592
      # WS2 §7: site hub (fronts this platform). The central hub runs as mcp-hub-central below.
      HUB_TOPOLOGY: site
      # WS2 §3: mTLS off until certs are enrolled (mirrors the gateway's GATEWAY_TLS_MODE: off).
      # Enroll with synccert (see mcp-hub/.env.example), mount them, then set HUB_TLS_MODE: enforced.
      HUB_TLS_MODE: ${HUB_TLS_MODE:-off}
      # WS11 delivery tools (build item 9). All fail CLOSED when unset (github.repoStatus / deploy.staging
      # simply refuse), so leaving these blank is safe — set them to enable the code + deploy stages.
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GITHUB_ORG: ${GITHUB_ORG:-}
      DEPLOY_STAGING_URL: ${DEPLOY_STAGING_URL:-}
      DEPLOY_STAGING_TOKEN: ${DEPLOY_STAGING_TOKEN:-}
      # WA-hardening D: base telemetry default (see ai-gateway comment above for rationale).
      OTEL_ENABLED: ${OTEL_ENABLED:-0}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4318}
      OTEL_SERVICE_NAME: mcp-hub
    volumes:
      - hub-data:/app/data # tool audit
    # SM-45: this closes the boot-order half of the fix — condition: service_healthy on platform
    # means the hub's FIRST module-tools fetch (at boot) usually just succeeds instead of needing a
    # retry. It is deliberately NOT the whole fix: a platform restart after the hub is already up
    # can't be helped by any depends_on ordering, which is why module-tools.ts also self-heals via
    # startModuleToolsBootstrap()'s retry-with-backoff + periodic re-fetch.
    depends_on:
      ai-gateway:
        condition: service_started
      platform:
        condition: service_healthy
      cerbos:
        condition: service_started

  # Central hub (WS2 §7): SAME codebase, HUB_TOPOLOGY=central — adds cross-company/management tools
  # (real rollup.metrics over the platform's D12 /rollups read). Idle-but-defined like sync-central;
  # in a single-region v1 it points at the same platform. Not published (reach it via the internal
  # network / an enrolled mTLS peer). Give it a real second-site platform URL when one exists.
  mcp-hub-central:
    profiles: [multisite]
    image: ghcr.io/${GHCR_OWNER:-hansel-gaiada}/gaiada-mcp-hub:${GAIADA_TAG:-latest}
    restart: unless-stopped
    environment:
      HUB_SERVICE_TOKEN: ${HUB_SERVICE_TOKEN:?}
      GATEWAY_URL: http://ai-gateway:3002
      GATEWAY_TOKEN: ${GATEWAY_TOKEN:?}
      PLATFORM_URL: http://platform:3004
      PLATFORM_SERVICE_TOKEN: ${PLATFORM_SERVICE_TOKEN:?}
      KNOWLEDGE_URL: http://knowledge:3005
      KNOWLEDGE_SERVICE_TOKEN: ${KNOWLEDGE_SERVICE_TOKEN:?}
      CERBOS_URL: http://cerbos:3592
      HUB_TOPOLOGY: central
      HUB_TLS_MODE: ${HUB_TLS_MODE:-off}
    volumes:
      - hub-central-data:/app/data
    depends_on:
      ai-gateway:
        condition: service_started
      platform:
        condition: service_healthy
      cerbos:
        condition: service_started

  bot:
    profiles: [bot]
    image: ghcr.io/${GHCR_OWNER:-hansel-gaiada}/gaiada-wa-chat-bot:${GAIADA_TAG:-latest}
    restart: unless-stopped
    environment:
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:?}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      GATEWAY_URL: http://ai-gateway:3002
      GATEWAY_TOKEN: ${GATEWAY_TOKEN:?}
      WAHA_URL: http://waha:3000
      WAHA_API_KEY: ${WAHA_API_KEY:?}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      # Isolated bot instance (pg-bot) + bot Redis (redis-bot). Runtime = bot_app; DDL = bot_owner.
      DATABASE_URL: postgres://bot_app:${BOT_APP_PASSWORD:?}@pg-bot:5432/gaiada_bot
      MIGRATE_DATABASE_URL: postgres://bot_owner:${BOT_OWNER_PASSWORD:?}@pg-bot:5432/gaiada_bot
      MANAGEMENT_GROUP_ID: ${MANAGEMENT_GROUP_ID:-}
      POST_TO_GROUPS: ${POST_TO_GROUPS:-false}
      REDIS_URL: redis://redis-bot:6379
      # A3: group registry lives on the writable bot-data volume so the ERP can edit it. No seed
      # file is mounted — there is no committed real registry (only config/groups.example.yaml in the
      # image), so the bot boots in trial mode (monitor all, log discovered) until the ERP's
      # Group Registry surface writes /app/data/groups.yaml. To pre-seed instead, drop a real
      # groups.yaml next to this compose file and set GROUPS_SEED_FILE to a read-only mount of it.
      GROUPS_FILE: /app/data/groups.yaml
      # WA-hardening D: base telemetry default (see ai-gateway comment above for rationale) — this is
      # the exact gap the 2026-07-29 incident review found: OTEL_ENABLED had silently fallen off the
      # bot after a plain `up -d --build bot` (vps+local only) recreated it without the observability
      # overlay. Baking the default into the base file means it can no longer be forgotten.
      OTEL_ENABLED: ${OTEL_ENABLED:-0}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4318}
      OTEL_SERVICE_NAME: wa-chat-bot
    volumes:
      - bot-data:/app/data # LocalKms keys + schedule state + discovery + groups registry (EXCLUDE keys.json from backups!)
    depends_on:
      pg-bot:
        condition: service_healthy
      ai-gateway:
        condition: service_started

  bot-media-worker:
    profiles: [bot]
    image: ghcr.io/${GHCR_OWNER:-hansel-gaiada}/gaiada-wa-chat-bot:${GAIADA_TAG:-latest}
    command: ["npx", "tsx", "src/media-worker.ts"]
    restart: unless-stopped
    environment:
      GATEWAY_URL: http://ai-gateway:3002
      GATEWAY_TOKEN: ${GATEWAY_TOKEN:?}
      WAHA_URL: http://waha:3000
      WAHA_API_KEY: ${WAHA_API_KEY:?}
      DATABASE_URL: postgres://bot_app:${BOT_APP_PASSWORD:?}@pg-bot:5432/gaiada_bot
      MIGRATE_DATABASE_URL: postgres://bot_owner:${BOT_OWNER_PASSWORD:?}@pg-bot:5432/gaiada_bot
      REDIS_URL: redis://redis-bot:6379
      MEDIA_WORKER_CONCURRENCY: ${MEDIA_WORKER_CONCURRENCY:-2}
      # WA-hardening D: base telemetry default (see ai-gateway comment above for rationale).
      OTEL_ENABLED: ${OTEL_ENABLED:-0}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4318}
      OTEL_SERVICE_NAME: bot-media-worker
    volumes:
      - bot-data:/app/data
    depends_on:
      pg-bot:
        condition: service_healthy
      redis-bot:
        condition: service_started

volumes:
  pg-data:
  pg-bot-data:
  redis-data:
  redis-bot-data:
  whisper-models:
  kc-data:
  waha-sessions:
  gateway-data:
  hub-data:
  hub-central-data:
  bot-data:
  platform-files:
  sync-data:
  search-crawl-data:
