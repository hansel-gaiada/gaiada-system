# Gaiada trial stack — everything on one VPS with one command:
#   cd infra/compose && cp .env.example .env   # fill it in
#   docker compose -f docker-compose.vps.yml up -d --build
# Only WAHA's dashboard (localhost) and nothing else is exposed beyond the box;
# the bot reaches Telegram/WAHA outbound. Backups: see ../scripts/backup.sh + the runbook.
name: gaiada

services:
  # PROFILE data — omit to use an EXTERNAL Postgres (set PG_HOST). See runbooks/deploy-vps.md.
  postgres:
    profiles: [data]
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: gaiada # bootstrap/maintenance DB only; app data lives in gaiada_platform/_knowledge/_bot
      POSTGRES_PASSWORD: ${POSTGRES_SUPER_PASSWORD:?}
      # Per-service owner (migrator) + runtime roles — see infra/db/init-cluster.sh (DB topology plan).
      # (bot roles live on the isolated pg-bot instance, not here.)
      PLATFORM_OWNER_PASSWORD: ${PLATFORM_OWNER_PASSWORD:?}
      PLATFORM_APP_PASSWORD: ${PLATFORM_APP_PASSWORD:?}
      SYNC_APP_PASSWORD: ${SYNC_APP_PASSWORD:?}
      KNOWLEDGE_OWNER_PASSWORD: ${KNOWLEDGE_OWNER_PASSWORD:?}
      KNOWLEDGE_APP_PASSWORD: ${KNOWLEDGE_APP_PASSWORD:?}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?}
      N8N_DB_PASSWORD: ${N8N_DB_PASSWORD:?}
    ports:
      - "127.0.0.1:55433:5432" # localhost-only; lets the standalone automation stack (n8n) reach gaiada_n8n
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ../../infra/db/init-cluster.sh:/docker-entrypoint-initdb.d/10-init-cluster.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d gaiada"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Isolated instance for the WhatsApp bot's PII/crypto-shred store (DB topology plan Phase E).
  pg-bot:
    profiles: [bot]
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: gaiada # bootstrap DB only; the bot store lives in gaiada_bot
      POSTGRES_PASSWORD: ${POSTGRES_SUPER_PASSWORD:?}
      BOT_OWNER_PASSWORD: ${BOT_OWNER_PASSWORD:?}
      BOT_APP_PASSWORD: ${BOT_APP_PASSWORD:?}
    volumes:
      - pg-bot-data:/var/lib/postgresql/data
      - ../../infra/db/init-bot.sh:/docker-entrypoint-initdb.d/10-init-bot.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d gaiada"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Core Redis — platform event backbone (Redis Streams relay/consumer + dead-letter).
  # PROFILE data — omit to use an EXTERNAL Redis (set REDIS_URL).
  redis:
    profiles: [data]
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data

  # Bot Redis — BullMQ media queue, isolated with the bot's data plane (DB topology plan Phase F).
  redis-bot:
    profiles: [bot]
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-bot-data:/data

  waha:
    # Pinned (never :latest — a floating tag can shift engine/payload behavior under you, an
    # error the aire project hit). NOWEB variant = Baileys engine, no Chromium (lighter). Bump
    # deliberately. Since 2026.6.1 all former Plus features ship in this free Core image.
    # 2026-07-29: tried bumping to noweb-2026.7.1 to fix a re-pair failure — it did NOT help; the
    # failure was byte-identical, so it is NOT a minimum-client-version rejection. Symptom: creds
    # cleared, then Baileys logs `not logged in, attempting registration...` -> `Error: Connection
    # Failure`, retrying every ~2s, so WhatsApp refuses the registration handshake and no QR is ever
    # issued. Network was ruled out (wss://web.whatsapp.com/ws/chat opens fine from inside this
    # container; an earlier "unreachable" reading was a false negative from wget lacking CA certs in
    # this image). Leading explanation remains an upstream WhatsApp-side throttle/block on the number
    # or egress IP, earned by a ~2s reconnect storm during the Docker Desktop outage — see
    # docs/runbooks/wa-ban-recovery.md. That is NOT fixed by any image bump.
    #
    # 2026-07-31: bumped 2026.6.2 -> 2026.7.2. This is NOT a re-test of the ruled-out 2026.7.1 —
    # 2026.7.2 shipped 2026-07-29 (upstream, same day as our incident) and its changelog names a
    # "WhatsApp Web version compatibility" fix in the NOWEB engine plus a timestamp/message-sorting
    # fix, i.e. a distinct change from 7.1. Taken to stay current with WA-side protocol drift, which
    # is the one thing a pinned Baileys build silently rots against. NOT verified against a live
    # pairing yet (the number is still out of the loop; dev runs on the WAHA sim per
    # docs/superpowers/plans/2026-07-29-waha-sim-dev-harness.md) — treat re-pair as UNPROVEN until a
    # QR scan actually succeeds. If pairing still fails identically, the block theory stands: STOP
    # the session and wait, do not bump again.
    #
    # Escape hatch added in 2026.7.x: WAHA_NOWEB_WA_VERSION / WAHA_NOWEB_WA_VERSION_FORCE pin or
    # force the WhatsApp Web protocol version independently of the image, so a future WA-side
    # version rejection can be worked around without a rebuild. Left unset (upstream default).
    image: devlikeapro/waha:noweb-2026.7.2
    profiles: [bot]
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000" # dashboard via SSH tunnel only; never public
    environment:
      # Baileys-based, browser-free engine (per request). Sessions must be created with the NOWEB
      # store enabled (config.noweb.store.enabled=true) to expose chats/contacts — set at session
      # creation, not here; see the bot's session bootstrap / go-live runbook.
      WHATSAPP_DEFAULT_ENGINE: NOWEB
      WHATSAPP_HOOK_URL: "http://bot:3001/webhook?token=${WEBHOOK_SECRET:?}"
      # Subscribe to session.status too (not just message) so the bot can see reconnect/ban/logout
      # state changes instead of relying only on RESTART_ALL_SESSIONS + polling (aire gap).
      WHATSAPP_HOOK_EVENTS: "message,session.status"
      # Download inbound media so the bot's media-enrichment (voice/image → text via gateway
      # vision) actually receives files; without this WAHA serves no media URL.
      WHATSAPP_DOWNLOAD_MEDIA: "True"
      WHATSAPP_API_KEY: ${WAHA_API_KEY:?}
      WAHA_DASHBOARD_USERNAME: admin
      WAHA_DASHBOARD_PASSWORD: ${WAHA_DASHBOARD_PASSWORD:?}
      # Persisted sessions (waha-sessions volume) auto-restart on boot, so a linked number
      # survives restarts/redeploys WITHOUT a fresh QR scan (aire's key reconnect lesson).
      WHATSAPP_RESTART_ALL_SESSIONS: "True"
    volumes:
      - waha-sessions:/app/.sessions

  # AI gateway — the Go service (ai-gateway-go/) IS the gateway. The Node ai-gateway/ it
  # replaced was retired 2026-07-14 after code-complete parity + green build/tests; the service
  # keeps the name `ai-gateway` on port 3002 so every caller (bot, hub, knowledge, media-worker)
  # reaches it unchanged at http://ai-gateway:3002.
  # TLS is OFF here so the plain-HTTP contract callers speak keeps working; switch
  # GATEWAY_TLS_MODE to permissive/enforced once callers are enrolled with client certs.
  ai-gateway:
    image: ghcr.io/${GHCR_OWNER:-hansel-gaiada}/gaiada-ai-gateway-go:${GAIADA_TAG:-latest}
    restart: unless-stopped
    environment:
      # GATEWAY_PORT defaults to 3002 in config.go — left unset so callers need no URL change.
      GATEWAY_TOKEN: ${GATEWAY_TOKEN:?}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # Local-first: point at an Ollama on the VPS (e.g. http://host.docker.internal:11434);
      # empty disables the local provider and the chain goes straight to cloud/echo.
      OLLAMA_URL: ${OLLAMA_URL:-}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2}
      # OpenAI-compatible cloud brain (Ollama Cloud https://ollama.com/v1). When OPENAI_API_KEY is
      # set, LLM_CHAIN below routes text to it first; media/embeds fail over to whisper/gemini/ollama.
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-deepseek-v4-flash}
      # Vision model for image media (image/* only). Ollama Cloud: qwen3.5 accepts images, glm-5.2
      # does not. Audio/PDF are not vision-handled and fail over to whisper/gemini on MEDIA_CHAIN.
      OPENAI_VISION_MODEL: ${OPENAI_VISION_MODEL:-qwen3.5:397b}
      OPENAI_MAX_TOKENS: ${OPENAI_MAX_TOKENS:-1024}
      # Text chain: OpenAI-compatible brain first, then local Ollama, then cloud fallbacks. A
      # provider whose key/URL is unset reports Available()=false and is skipped, so this order is
      # safe even when OPENAI_* is blank (it falls straight through to the old ollama,gemini,claude).
      # NOTE (ASST-15/16): "hermes" is NOT in this default. chain.RunWithHint only reorders a
      # provider that is ALREADY a member of this list — a per-thread brain-picker hint of
      # "hermes" silently falls through to the normal first-in-order provider if "hermes" isn't
      # listed here, even with HERMES_URL/HERMES_MODEL both set. Operators who want the brain
      # picker's "hermes" option to actually work must add it to LLM_CHAIN in .env, e.g.
      # `LLM_CHAIN=openai,ollama,gemini,claude,hermes` (appended LAST — hermes only wins on an
      # explicit hint or if every earlier provider is unavailable, so unhinted callers on existing
      # deployments see no change). This default is deliberately left unchanged here: adding
      # "hermes" to it would alter the unhinted default chain for every existing caller of this
      # gateway (wa-chat-bot, knowledge, search) on every deployment that doesn't override
      # LLM_CHAIN — an operator decision, not something to flip silently in the shared default.
      #
      # ⚠ SITE TOPOLOGY CHANGES WHAT THIS LIST MEANS (learned the hard way 2026-08-06, gda-aicenter).
      # With GATEWAY_TOPOLOGY_MODE=site, cmd/gateway/main.go:53 STRIPS gemini/claude/openai from this
      # chain (a site gateway holds no cloud keys) and appends a `central-forward` provider. So
      # `LLM_CHAIN=gemini,claude,hermes` becomes the effective chain `[hermes, central-forward, echo]`
      # — two of the three names you wrote are silently gone. And because that box's
      # GATEWAY_CENTRAL_URL points at hermes-gateway itself, central-forward reaches the SAME Hermes:
      # when the hermes provider was 401ing (it sent no bearer until HERMES_TOKEN, above), Hermes still
      # answered via central-forward, so nothing looked broken except a "served by" badge that never
      # named Hermes and a brain picker that was inert for EVERY option. If you are debugging why a
      # picked brain never wins, check TOPOLOGY_MODE before you touch this line.
      #
      # ⚠ 2026-08-26 — THE CHAIN NAMES PROVIDERS IT DOES NOT HAVE. Read this before trusting it.
      # On gda-aicenter the live value is `gemini,claude,openai`, but `GEMINI_API_KEY` and
      # `ANTHROPIC_API_KEY` are BOTH EMPTY (owner: not available at this stage). A keyless provider
      # reports `Available() == false` and is skipped SILENTLY — no error, no metric, no log line.
      # `gateway_egress_requests_total` confirms it: gemini and claude have no series at all, because
      # they are never attempted.
      #
      # So the effective chain is ONE provider: `openai`, which here is NOT OpenAI — it points at
      # `https://ollama.com` (`OPENAI_BASE_URL`) running `deepseek-v4-flash`. Per the owner's own
      # standing rule that endpoint is "borrowed + SHARED + weekly-rate-limited ... do NOT make it a
      # hard prod dependency". It currently is one. Measured 2026-08-24: 10-17s latency, ~25% of probe
      # runs timing out at 30s, and one response served by the `echo` terminator.
      #
      # THE NAMES ARE LEFT IN DELIBERATELY rather than trimmed to `openai`: the chain is SELF-HEALING,
      # so dropping a real key into `GEMINI_API_KEY` restores failover with no further edit. Trimming
      # would make the config truthful today and add a forgotten step later. The cost of leaving them
      # is a misleading startup log line (`llm: [gemini claude openai]`) — mitigated by the prober's
      # `recordJSON: ["provider"]`, which records WHICH provider actually served, and by the
      # `GatewayServedByEcho` alert that fires the moment the chain falls through to placeholder text.
      LLM_CHAIN: ${LLM_CHAIN:-openai,ollama,gemini,claude}
      # Media chain: openai vision handles images; audio (and anything non-image) fails over to
      # whisper for transcription, then gemini. openai auto-skips when its key is unset.
      MEDIA_CHAIN: ${MEDIA_CHAIN:-openai,whisper,gemini}
      # Embeddings are a SEPARATE chain from generation. `ollama` is a local provider, so site mode
      # keeps it (only cloud providers get stripped) — which is how the trial box embeds locally
      # while all generation goes to Hermes. nomic-embed-text emits 768 dims, matching the
      # vector(768) column in platform migration 0034_module_search.sql.
      EMBED_CHAIN: ${EMBED_CHAIN:-ollama,gemini}
      OLLAMA_EMBED_MODEL: ${OLLAMA_EMBED_MODEL:-nomic-embed-text}
      WHISPER_URL: http://whisper:8000
      WHISPER_MODEL: ${WHISPER_MODEL:-Systran/faster-whisper-small}
      GATEWAY_DAILY_CALL_CAP: ${GATEWAY_DAILY_CALL_CAP:-2000}
      GATEWAY_TLS_MODE: "off"
      # `central` = this box holds the cloud keys. Set `site` to hold NO model key locally: the
      # provider list then drops gemini/claude/openai and auto-appends central-forward, which POSTs
      # the Gateway contract (/complete, /media) to GATEWAY_CENTRAL_URL. On the gda-aicenter trial
      # that URL is the hermes-gateway shim, making the local Hermes agent the stack's brain while
      # DLP, the daily cost cap, the egress audit and failover all stay here.
      GATEWAY_TOPOLOGY_MODE: ${GATEWAY_TOPOLOGY_MODE:-central}
      GATEWAY_CENTRAL_URL: ${GATEWAY_CENTRAL_URL:-}
      # ASST-15 — hermes-gateway wired as a NAMED chain provider ("hermes"), distinct from the
      # central-forward path above (GATEWAY_TOPOLOGY_MODE=site + GATEWAY_CENTRAL_URL), which also
      # happens to point at hermes-gateway on this box today but goes through the OLDER
      # central-forward provider, not this one. Both can point at the same shim; they are two
      # separate code paths. Empty URL => HermesProvider.Available()==false, fail-soft (no crash,
      # provider just never wins). HERMES_MODEL is NOT this gateway choosing Hermes' model — it is
      # only whatever hermes-gateway itself is configured with, threaded through for the wire's
      # `meta` field (see ai-gateway-go/internal/providers/hermes.go). Adding these two vars alone
      # does NOT put "hermes" into LLM_CHAIN above — see the LLM_CHAIN comment for why that matters
      # for ASST-16's per-thread brain-picker hint.
      HERMES_URL: ${HERMES_URL:-}
      HERMES_MODEL: ${HERMES_MODEL:-}
      # HERMES_TOKEN (fix 2026-08-06): the bearer hermes-gateway REQUIRES — it authenticates before
      # it routes, so the `hermes` provider used to 401 on every call and had never once served.
      # OPTIONAL: empty falls back to GATEWAY_TOKEN (envOr treats a set-but-empty var as unset),
      # which is the key hermes-gateway's own env file defines. Set it only to give the shim its
      # own distinct secret.
      HERMES_TOKEN: ${HERMES_TOKEN:-}
      # Model-assisted DLP classifier stays opt-in; enable only where Ollama is reachable.
      DLP_CLASSIFIER_ENABLED: ${DLP_CLASSIFIER_ENABLED:-false}
      EGRESS_ALLOWLIST: generativelanguage.googleapis.com,api.anthropic.com,ollama.com,whisper,host.docker.internal
      # WA-hardening D: telemetry is a BASE default (not only the observability.yml overlay) so it
      # survives a plain `up -d --build ai-gateway` with vps+local files only. Fail-soft (WS9): a
      # no-op unless OTEL_ENABLED is truthy; unreachable collector just drops spans, never crashes.
      OTEL_ENABLED: ${OTEL_ENABLED:-0}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4318}
      OTEL_SERVICE_NAME: ai-gateway
    volumes:
      - gateway-data:/app/data # egress audit (JSONL)

  # Keycloak (5b) — self-hosted IdP. Realm imported from ./keycloak on first boot. Backed by
  # Postgres (gaiada_keycloak) instead of embedded H2 (DB topology plan Phase D) — durable + backed
  # up with the core instance. Kept on start-dev for the trial (no TLS/hostname setup); a prod
  # deploy should move to `start` (KC_HOSTNAME + TLS) — see the plan's deploy notes.
  keycloak:
    profiles: [auth]
    image: quay.io/keycloak/keycloak:26.0
    restart: unless-stopped
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?}
      KC_HEALTH_ENABLED: "true"
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://${PG_HOST:-postgres}:5432/gaiada_keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?}
      # Behind nginx: Keycloak must build absolute URLs (issuer, auth endpoint, redirects) for the
      # PUBLIC host, not the container. Without KC_PROXY_HEADERS it trusts its own socket and mints
      # http://localhost URLs that the browser cannot follow and the platform will not accept.
      # Mounted at /idp, NOT /auth — the UI already owns /auth/callback and /auth/login, so /auth
      # would shadow the app's own OIDC routes.
      KC_HOSTNAME: ${KC_HOSTNAME:-}
      KC_HTTP_RELATIVE_PATH: ${KC_HTTP_RELATIVE_PATH:-/}
      KC_PROXY_HEADERS: ${KC_PROXY_HEADERS:-}
      # MAIL-03: realm SMTP against the Mailpit dev sink (mailpit:1025, mail-dev profile).
      # NOT substituted into the realm-import JSON's `smtpServer` block (settled ex-Q-V6, see
      # docs/runbooks/idp-keycloak.md) — Keycloak's DirImportProvider does not expand `${env.*}`
      # placeholders anywhere in a realm export. These vars exist so a fresh boot's
      # `./keycloak/configure-smtp.sh` (run once after `--import-realm` completes) has real
      # values to push via kcadm; they do nothing on their own. Defaults are the dev-sink shape
      # (no auth, no TLS, reserved-TLD from-address) so an unconfigured fresh box behaves exactly
      # like the box this was proven against, not silently mail-less nor pointed at a real relay.
      KC_SMTP_HOST: ${KC_SMTP_HOST:-mailpit}
      KC_SMTP_PORT: ${KC_SMTP_PORT:-1025}
      KC_SMTP_FROM: ${KC_SMTP_FROM:-no-reply@auth.gaiada.invalid}
      KC_SMTP_FROM_DISPLAY_NAME: ${KC_SMTP_FROM_DISPLAY_NAME:-Gaiada Auth (dev)}
      KC_SMTP_AUTH: ${KC_SMTP_AUTH:-false}
      KC_SMTP_SSL: ${KC_SMTP_SSL:-false}
      KC_SMTP_STARTTLS: ${KC_SMTP_STARTTLS:-false}
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro
      - kc-data:/opt/keycloak/data
    depends_on:
      postgres:
        condition: service_healthy

  # Cerbos (5b) — policy decision point. Policies from ./cerbos/policies (read-only).
  # OBS-03 (2026-08-06): pinned off `latest` — this is the authz engine, the one component still
  # on a floating tag. 0.54.0 is the exact version already running (confirmed via
  # `docker inspect` image digest sha256:211c261f6031675522a35c6055b13fd719c4aff13747307e4bcb6907326537ef,
  # which matches this tag), so this pin is a version no-op. `--log-level=warn` silences the
  # per-call gRPC "Handled request" access-log spam (no config-file key for it in this version);
  # decision audit (allow/deny + matched policy) is enabled separately in cerbos.yaml and still
  # emits regardless of --log-level (validated empirically against a throwaway container).
  cerbos:
    image: ghcr.io/cerbos/cerbos:0.54.0
    restart: unless-stopped
    command: ["server", "--config=/config/cerbos.yaml", "--log-level=warn"]
    # OBS-04: embed the compose service label into each json-file log line's `attrs` object
    # so the otel-collector (config.tier2-logs.yaml) can lift it into an OTel `container.name`
    # resource attribute, restoring a working per-container LogQL query in Loki (the
    # runbook's documented `{container=~".*cerbos.*"}` was confirmed broken — no `container`
    # label has ever existed). Does not change what Cerbos logs, only how Docker tags the
    # line on disk.
    logging:
      driver: json-file
      options:
        labels: "com.docker.compose.service"
    volumes:
      - ../../platform-nest/cerbos:/config:ro
      - ../../platform-nest/cerbos/policies:/policies:ro

  platform:
    image: ghcr.io/${GHCR_OWNER:-hansel-gaiada}/gaiada-platform-nest:${GAIADA_TAG:-latest}
    restart: unless-stopped
    # NET-01/NET-02: host-native nginx proxies the provider-webhook namespace (/api/mail/) here.
    # 🚨 The 127.0.0.1 prefix is load-bearing. A bare "3004:3004" binds 0.0.0.0 and would expose
    # the ENTIRE backend API straight to the internet, bypassing nginx and every rule in the
    # vhost. Loopback-only means nginx is the sole path in. Verify after any change with
    # `ss -tlnp` that :3004 is bound to 127.0.0.1 and nothing else.
    ports:
      - "127.0.0.1:3004:3004"
    environment:
      PLATFORM_SERVICE_TOKEN: ${PLATFORM_SERVICE_TOKEN:?}
      # Runtime = restricted platform_app; migrations/grants run as platform_owner (MIGRATE_DATABASE_URL).
      DATABASE_URL: postgres://platform_app:${PLATFORM_APP_PASSWORD:?}@${PG_HOST:-postgres}:5432/gaiada_platform
      MIGRATE_DATABASE_URL: postgres://platform_owner:${PLATFORM_OWNER_PASSWORD:?}@${PG_HOST:-postgres}:5432/gaiada_platform
      AUTH_MODE: ${PLATFORM_AUTH_MODE:-dev}
      # ISSUER must match the `iss` claim the IdP actually stamps, which is the PUBLIC url once
      # Keycloak sits behind a reverse proxy. JWKS stays INTERNAL so token verification never
      # hairpins out through nginx and back. Splitting them is deliberate, not an inconsistency.
      OIDC_ISSUER: ${OIDC_ISSUER:-http://keycloak:8080/realms/gaiada}
      OIDC_JWKS_URI: ${OIDC_JWKS_URI:-http://keycloak:8080/realms/gaiada/protocol/openid-connect/certs}
      OIDC_AUDIENCE: ${OIDC_AUDIENCE:-gaiada-platform}
      CERBOS_URL: http://cerbos:3592
      # 5c.4 file store — persistent volume so attachments survive restarts.
      FILES_DIR: /data/files
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      # Admin/Systems console aggregator (Phase C) — read-only probes of each downstream
      # service. All fail-soft: an unset URL just reports "not configured" in the console.
      GATEWAY_URL: http://ai-gateway:3002
      GATEWAY_TOKEN: ${GATEWAY_TOKEN:-}
      # ASST-06 — assistant-specific tunables (see platform-nest/.env.example for the full
      # rationale). Both were read by config.ts and documented there already but had NO
      # passthrough row here, so setting either in infra/compose/.env would have had ZERO
      # effect on the container — the exact class of bug the INTEGRATION_TOKEN_KEY /
      # MEETING_VIDEO_MAX_BYTES comments above already caught twice on this box.
      ASSISTANT_STREAM_IDLE_TIMEOUT_MS: ${ASSISTANT_STREAM_IDLE_TIMEOUT_MS:-60000}
      ASSISTANT_CONTEXT_CHAR_BUDGET: ${ASSISTANT_CONTEXT_CHAR_BUDGET:-12000}
      BOT_URL: http://bot:3001
      # Same shared secret the bot service reads (see its ADMIN_TOKEN below). The two read
      # DIFFERENT .env names, so a deployment that sets only ADMIN_TOKEN left this empty and
      # every bot-admin proxy call 401'd — the console reported "bot admin unreachable" as if
      # the bot were down. Fall through to ADMIN_TOKEN so one .env name is enough.
      ADMIN_TOKEN: ${BOT_ADMIN_TOKEN:-${ADMIN_TOKEN:-}}
      HUB_URL: http://mcp-hub:3003
      HUB_SERVICE_TOKEN: ${HUB_SERVICE_TOKEN:-}
      # Assurance elevation (mcp-hub design §2, 2026-08-06). The platform is one of only TWO
      # services entitled to mint `verified` hub principals (it is the IdP); this is what lets the D14
      # agent re-drive clear `approvals.resolveExecute`'s minAssurance floor. Optional + fail-closed:
