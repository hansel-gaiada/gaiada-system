      KNOWLEDGE_PUBLIC_MAX_PAGES: ${KNOWLEDGE_PUBLIC_MAX_PAGES:-150}
      KNOWLEDGE_INTERNAL_TENANT_IDS: ${KNOWLEDGE_INTERNAL_TENANT_IDS:-}
      KNOWLEDGE_INDEX_FILE_CONTENTS: ${KNOWLEDGE_INDEX_FILE_CONTENTS:-1}
      # Agent runner (B2) — enables /api/:t/agents/* endpoints
      AGENTS_URL: http://agent-runner:3006
      AGENT_RUNNER_TOKEN: ${AGENT_RUNNER_TOKEN:-}
