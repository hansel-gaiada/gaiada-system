      # row means the container sees an empty value and silently falls back to the code default.
      # Verified empty in the running container on 2026-08-03 before this line existed. Same class
      # as the N8N_BRIDGE_TIMEOUT_MS forward and the dropped Google/Ads credentials.
      MEETING_VIDEO_MAX_BYTES: ${MEETING_VIDEO_MAX_BYTES:-524288000}
      # W0-3 Keycloak admin (client-portal account provisioning). Forwarded here or the container
      # sees nothing -- compose passes through only what is listed, which is how
      # MEETING_VIDEO_MAX_BYTES arrived empty on the VPS despite being set in .env.
      # Internal URL, so /idp on the compose network rather than the public host.
      KEYCLOAK_ADMIN_BASE_URL: ${KEYCLOAK_ADMIN_BASE_URL:-http://keycloak:8080/idp}
      KEYCLOAK_ADMIN_REALM: ${KEYCLOAK_ADMIN_REALM:-gaiada}
      KEYCLOAK_ADMIN_CLIENT_ID: ${KEYCLOAK_ADMIN_CLIENT_ID:-gaiada-provisioner}
      KEYCLOAK_ADMIN_CLIENT_SECRET: ${KEYCLOAK_ADMIN_CLIENT_SECRET:-}
      # The SAME omission again, and this one had been silently disabling THREE shipped features on
      # this box: a 43-char value sat in .env while the container saw an empty string, because no row
      # forwarded it. It signs W0 client-invite tokens (`core/client-invites.ts`), signs SEO's Google
      # OAuth state tokens (`modules/search/google/oauth-state.ts`), and is the key `core/secret-box.ts`
      # encrypts stored integration secrets with — so invites 503'd, and the OAuth/secret paths could
      # never have worked in production either. Caught 2026-08-03 by the first live invite walk.
      #
      # Deliberately NOT `:?`. Absence already fails closed with a typed, specific refusal naming this
      # variable, which is a better failure than refusing to start the whole stack on a box that does
      # not use these features.
      INTEGRATION_TOKEN_KEY: ${INTEGRATION_TOKEN_KEY:-}
      # Automation is the separate `gaiada-automation` n8n stack; set these only if n8n is
      # reachable from this network. AUTOMATION_API_KEY is an n8n Public-API key → the
      # Systems→Automation console then lists real workflows + last-run.
      AUTOMATION_URL: ${AUTOMATION_URL:-}
      AUTOMATION_API_KEY: ${AUTOMATION_API_KEY:-}
      # The BROWSER-reachable editor origin, for the console's "Open in n8n" link. NOT the same as
      # AUTOMATION_URL: that one is in-cluster (http://n8n:5678) and resolves nowhere outside this
      # network, so using it for the link gave a button no browser could follow. On gda-aicenter:
      # https://erp.gaiada.online/n8n/ (must match N8N_EDITOR_BASE_URL in automation/.env). Leave
      # empty and the UI hides the button rather than offering a dead link.
      AUTOMATION_PUBLIC_URL: ${AUTOMATION_PUBLIC_URL:-}
      # Event → n8n bridge (WS4 §4). Off unless all four are set. N8N_BRIDGE_SECRET must match
      # the value the event workflows check. Only set N8N_WEBHOOK_BASE_URL if n8n is reachable.
      N8N_WEBHOOK_BASE_URL: ${N8N_WEBHOOK_BASE_URL:-}
      N8N_BRIDGE_SECRET: ${N8N_BRIDGE_SECRET:-}
      N8N_BRIDGE_EVENTS: ${N8N_BRIDGE_EVENTS:-}
      # DEF-1 (2026-07-30): the ingest proxy waits on the dispatcher, which does real AI work inline
      # (MOM + 3 extractions + a recording-context read) measured at 15-23s. This was never forwarded
      # to the container, so it silently used the old 5s code default and EVERY ingest returned
      # dispatcher_unreachable — the run completed server-side but the recording never flipped to
      # `ingested` nor linked pipeline_run_id, breaking the capture->run chain.
      N8N_BRIDGE_TIMEOUT_MS: ${N8N_BRIDGE_TIMEOUT_MS:-30000}
      # Search-marketing (SM-05/SM-06). All optional: with DATAFORSEO_* unset the paid driver is
      # not registered and every paid search capability fails closed, while the $0 pillars
      # (crawler audits, keyword clustering, AI drafts) keep working. ONE shared deposit pool —
      # never per-client keys. Keep the queue on 'standard' ($0.0006/SERP vs Live's $0.002).
      DATAFORSEO_LOGIN: ${DATAFORSEO_LOGIN:-}
      DATAFORSEO_PASSWORD: ${DATAFORSEO_PASSWORD:-}
      DATAFORSEO_QUEUE: ${DATAFORSEO_QUEUE:-standard}
      # SM-33/34/35 (tracker §6): "live" (default) registers real vendor drivers per their own
      # credentials below; "simulate" registers synthetic drivers instead, so dev/staging demos the
      # department at $0 real spend without empty tables.
      SEARCH_PROVIDER_MODE: ${SEARCH_PROVIDER_MODE:-live}
      # SM-48 (tracker §6s): a PLATFORM-LEVEL, tenant-agnostic portfolio-domain list (comma-separated),
