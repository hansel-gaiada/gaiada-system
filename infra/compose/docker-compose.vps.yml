      # SERP, byte for byte.
      SEARCH_SIMULATION_PORTFOLIO_DOMAINS: ${SEARCH_SIMULATION_PORTFOLIO_DOMAINS:-}
      # Semrush Analytics API v3 (SM-34). Empty SEMRUSH_API_KEY => not registered, independently of
