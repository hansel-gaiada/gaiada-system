      # plan price/allowance are UNVERIFIED owner-supplied facts (read off the Semrush account
      # console) — BOTH must be positive or the driver does NOT register even with the key set.
      SEMRUSH_API_KEY: ${SEMRUSH_API_KEY:-}
      SEMRUSH_BASE_URL: ${SEMRUSH_BASE_URL:-https://api.semrush.com}
      SEMRUSH_DATABASE: ${SEMRUSH_DATABASE:-us}
      SEMRUSH_MONTHLY_PLAN_PRICE_USD: ${SEMRUSH_MONTHLY_PLAN_PRICE_USD:-}
      SEMRUSH_MONTHLY_UNIT_ALLOWANCE: ${SEMRUSH_MONTHLY_UNIT_ALLOWANCE:-}
      # Ahrefs API v3 (SM-35). Empty AHREFS_API_KEY => not registered, independently of the other two
      # vendors' own credential checks. AHREFS_RANK_TRACKER_PROJECT_ID only gates the 'serp'
      # capability (Ahrefs's SERP Overview needs a pre-existing Rank Tracker project); unset refuses
      # that one capability cleanly, no effect on volume/difficulty/backlinks/competitors. Design
      # addendum §A3.3/§A7 OQ-10 (BINDING): the API-tier price/allowance are UNVERIFIED owner-supplied
      # facts — BOTH must be positive or the driver does NOT register even with the key set.
      AHREFS_API_KEY: ${AHREFS_API_KEY:-}
      AHREFS_BASE_URL: ${AHREFS_BASE_URL:-https://api.ahrefs.com/v3}
      AHREFS_COUNTRY: ${AHREFS_COUNTRY:-us}
      AHREFS_RANK_TRACKER_PROJECT_ID: ${AHREFS_RANK_TRACKER_PROJECT_ID:-}
      AHREFS_MONTHLY_API_TIER_PRICE_USD: ${AHREFS_MONTHLY_API_TIER_PRICE_USD:-}
      AHREFS_MONTHLY_UNIT_ALLOWANCE: ${AHREFS_MONTHLY_UNIT_ALLOWANCE:-}
      SEARCH_GLOBAL_MONTHLY_CAP_USD: ${SEARCH_GLOBAL_MONTHLY_CAP_USD:-150}
      SEARCH_TENANT_MONTHLY_CAP_USD: ${SEARCH_TENANT_MONTHLY_CAP_USD:-}
      SEARCH_BUDGET_WARN_RATIO: ${SEARCH_BUDGET_WARN_RATIO:-0.8}
      SEARCH_PILLAR_SEO: ${SEARCH_PILLAR_SEO:-1}
      SEARCH_PILLAR_SEM: ${SEARCH_PILLAR_SEM:-1}
      SEARCH_PILLAR_GEO: ${SEARCH_PILLAR_GEO:-1}
      # ── Added 2026-08-01 (tracker §6bw): these were read by config.ts and documented in
      # platform-nest/.env.example, but had NO passthrough here — so setting them in
      # infra/compose/.env had ZERO effect on the container. Found while bringing the stack to
      # latest for staging. This is the department's signature failure shape at the infra layer: an
      # operator supplies a real credential, the plumbing silently drops it, and the platform reports
      # the vendor as "not configured" — indistinguishable in every log and surface from a deliberate
      # choice not to configure it. It would have been discovered by a human wondering why real
      # Google keys changed nothing in staging.
      #
      # SM-25a/25c: the client-account Google surfaces (GSC/GA4/Ads). Empty => those capabilities
      # refuse cleanly and no OAuth flow is offered; the platform never invents a connection.
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:-}
      GOOGLE_OAUTH_REDIRECT_URI: ${GOOGLE_OAUTH_REDIRECT_URI:-}
      GOOGLE_ADS_DEVELOPER_TOKEN: ${GOOGLE_ADS_DEVELOPER_TOKEN:-}
      GOOGLE_ADS_LOGIN_CUSTOMER_ID: ${GOOGLE_ADS_LOGIN_CUSTOMER_ID:-}
      # SM-56 / SM-20: two SEPARATE external-callback secrets, deliberately not one. The first guards
      # a paid-vendor postback (DataForSEO), the second a script inside the client's OWN Ads account
      # — two different trust boundaries, so one shared value would mean compromising either grants
      # both. Unset is FAIL-CLOSED at both edges (every request refused), never skip-the-check.
      SEARCH_CALLBACK_SECRET: ${SEARCH_CALLBACK_SECRET:-}
      SEARCH_SEM_CALLBACK_SECRET: ${SEARCH_SEM_CALLBACK_SECRET:-}
      # SM-26 / addendum §A12.6 — the Ads WRITE mode, INDEPENDENT of SEARCH_PROVIDER_MODE above (that
      # one governs where DATA comes from). Defaults to 'simulate' here and on any unrecognised value.
      # 'live' additionally REFUSES TO BOOT without a registered live executor, so a half-finished
      # staging cutover fails at startup rather than at the moment a client's approved ad change
      # silently does nothing after its one-shot approval has already been spent.
      SEARCH_ADS_WRITE_MODE: ${SEARCH_ADS_WRITE_MODE:-simulate}
      N8N_BRIDGE_ENTITY_TYPES: ${N8N_BRIDGE_ENTITY_TYPES:-}
      # Event → knowledge-graph bridge (WS8 Step E). Forwards business events on these entity streams
      # to the knowledge service /graph/ingest (reuses KNOWLEDGE_URL/TOKEN above). Off unless set.
      GRAPH_BRIDGE_ENTITY_TYPES: ${GRAPH_BRIDGE_ENTITY_TYPES:-}
      # TR-21 (tracker/reporting §6.3) — the PDF export path's call to the `report-renderer`
      # sidecar. RENDERER_TOKEN is the SAME shared bearer token that service's own env carries
      # below (report-renderer's auth.ts checks it too) — one shared secret, not two independently
      # rotated ones. PLATFORM_UI_INTERNAL_URL must be byte-identical to report-renderer's own copy
      # (its same-origin/SSRF guard compares against it). Any of the three unset -> the pdf export
      # endpoint refuses with an honest 503 rather than half-attempting the call (config.ts).
      REPORT_RENDERER_URL: ${REPORT_RENDERER_URL:-http://report-renderer:3007}
      RENDERER_TOKEN: ${RENDERER_TOKEN:?}
      PLATFORM_UI_INTERNAL_URL: ${PLATFORM_UI_INTERNAL_URL:-http://platform-ui:3005}
      # LMS L5 — the lab runner (`lab-runner/`), which executes a learner's submission in a capped,
      # unprivileged, network-less container. It does NOT run on this box: it lives on SumoPod bound
      # to 127.0.0.1, and the only path to it is an SSH tunnel with a port-restricted key
      # (`gaiada-lab-tunnel.service` on this host, listening on the docker gateway). So the URL is
      # host.docker.internal, not a compose service name — there is no lab-runner container here.
      #
      # Both unset -> a lab attempt is REFUSED with an honest message rather than accepted and left
      # pending forever against a runner that cannot be reached (config.ts states the same rule).
      # LAB_RUNNER_TOKEN is the SAME shared bearer the sidecar's own env carries.
      LAB_RUNNER_URL: ${LAB_RUNNER_URL:-}
      LAB_RUNNER_TOKEN: ${LAB_RUNNER_TOKEN:-}
      # D14-04 — the single-use execution grant the platform mints when a human approves a suspended
      # automation write, and the hub verifies before lifting its impact gate. ONE shared HMAC secret,
      # so this exact value must also appear in the mcp-hub service block below; a mismatch or an
      # absence rejects every grant (fail CLOSED — approved writes keep suspending forever, which is
      # safe but silent, so check mcp-hub's /admin/info `policy.executionGrantConfigured` after
      # setting it). Deliberately NOT `:?`: a box that never approves automation writes should still
      # boot. openssl rand -hex 32.
      APPROVAL_GRANT_SECRET: ${APPROVAL_GRANT_SECRET:-}
      # ORG-6 release train (WSD-8 go-live 2026-07-22): shared-service assignments + reconciler.
      # Dark by default (empty/unset -> off); "1"/"true" flips the whole train on.
      SERVICE_ASSIGNMENTS_ENABLED: ${SERVICE_ASSIGNMENTS_ENABLED:-}
      # IAM Phase 2 (P2-05/P2-06/P2-09): the POSITION reconciler - placement provisions access, a
      # transfer moves it, a termination removes it. Dark by default, exactly like the ORG-6 train
      # above (empty/unset -> off; "1"/"true" on).
      #
      # THIS LINE IS WHY THE FLAG WORKS AT ALL. Setting POSITION_SYNC_ENABLED in the box `.env`
      # alone does NOTHING: compose reads `.env` for variable INTERPOLATION, it does not pass it
      # into the container. Verified on the live box 2026-08-18 - hire/transfer/terminate each
      # returned 2xx with `reconciled: null` and ZERO `user_roles.managed_by_position` rows, i.e.
      # the seats moved and the authorization did not. The flows look healthy while the half that
      # matters is inert.
      #
      # WARNING: turning this ON changes live authorization for every position holder. Grants
      # materialise from role-sets, and closing a seat REVOKES what only that seat justified. The
      # mass-revoke brake (position-reconciler.ts) is what stops a bad org edit doing that
      # estate-wide; the drift sweep reports rather than auto-heals.
      POSITION_SYNC_ENABLED: ${POSITION_SYNC_ENABLED:-}
      # P2-09's sweep interval. The EXPIRY half of that loop runs regardless of the flag above,
      # because P2-08's grant surface can write `expires_at` whether or not positions are live.
      # NOT the `${VAR:-}` form: that passes an EMPTY string when unset, which reached the app
      # as 0 and busy-looped the sweep at ~46% CPU (2026-08-18). A real default means the
      # container never receives a value the app has to guess about.
      POSITION_DRIFT_SWEEP_INTERVAL_MS: ${POSITION_DRIFT_SWEEP_INTERVAL_MS:-86400000}
      # OBS-01 follow-up (2026-08-06 incident): platform used to read the SAME shared OTEL_ENABLED
      # as the other 5 telemetry-carrying services. Turning it on for platform alone meant either an
      # unscoped `.env` edit (which once accidentally restarted ai-gateway) or a shell-level override
      # on a scoped `up -d platform` that a plain release then silently reverts (compose recreates
      # from file defaults, which are `0`). PLATFORM_OTEL_ENABLED is a DISTINCT var referenced only in
      # this block, so `platform` can default to "on" across releases while ai-gateway/knowledge/
      # mcp-hub/bot/bot-media-worker (and the idle sync-central) keep defaulting to OTEL_ENABLED's `0`.
      OTEL_ENABLED: ${PLATFORM_OTEL_ENABLED:-0}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4318}
      OTEL_SERVICE_NAME: platform
      # ── MAIL-04 (design §4.1/§10/§12) — src/mail/ is core infra (A1), no per-tenant gate. ──────────
      # Master gate stays OFF by default: the sender loop never starts and enqueueMail no-ops with
      # zero side effects (config.ts's own header on this block). Flip to 1 only once the mail-dev
      # profile (mailpit, above) is actually up — MAIL_ENABLED=1 with nothing listening at the relay
      # host just means every send backs off and retries, never a crash.
      MAIL_ENABLED: ${MAIL_ENABLED:-0}
      MAIL_SENDER_INTERVAL_MS: ${MAIL_SENDER_INTERVAL_MS:-15000}
      # Dev-stage default: BOTH streams point at the mail-dev Mailpit sink (`mailpit:1025`,
      # authless — empty user/password keeps the smtp adapter's TLS rule on the legal plaintext
      # branch, provider.ts). A8 operator failover flip stays available (`brevo`) for when real
      # Brevo credentials land at the staging reopen (§15 R3) — set the *_BREVO_* vars then and
      # flip *_TRANSPORT, no code change either way.
      MAIL_STREAM_NOTIFY_TRANSPORT: ${MAIL_STREAM_NOTIFY_TRANSPORT:-relay}
      MAIL_STREAM_NOTIFY_RELAY_HOST: ${MAIL_STREAM_NOTIFY_RELAY_HOST:-mailpit}
      MAIL_STREAM_NOTIFY_RELAY_PORT: ${MAIL_STREAM_NOTIFY_RELAY_PORT:-1025}
      MAIL_STREAM_NOTIFY_RELAY_USER: ${MAIL_STREAM_NOTIFY_RELAY_USER:-}
      MAIL_STREAM_NOTIFY_RELAY_PASSWORD: ${MAIL_STREAM_NOTIFY_RELAY_PASSWORD:-}
      MAIL_STREAM_NOTIFY_BREVO_HOST: ${MAIL_STREAM_NOTIFY_BREVO_HOST:-}
      MAIL_STREAM_NOTIFY_BREVO_PORT: ${MAIL_STREAM_NOTIFY_BREVO_PORT:-587}
      MAIL_STREAM_NOTIFY_BREVO_USER: ${MAIL_STREAM_NOTIFY_BREVO_USER:-}
      MAIL_STREAM_NOTIFY_BREVO_PASSWORD: ${MAIL_STREAM_NOTIFY_BREVO_PASSWORD:-}
      # A12: leave the FROM identity unset in dev so the compiled `*.gaiada.invalid` default (an
      # address that can never resolve or deliver) is what a misconfigured deployment actually
      # sends from — never a real-looking address nobody configured. Staging sets the real
      # notify-subdomain identity here (§15 R1).
      MAIL_STREAM_NOTIFY_FROM: ${MAIL_STREAM_NOTIFY_FROM:-}
      MAIL_STREAM_AUTH_TRANSPORT: ${MAIL_STREAM_AUTH_TRANSPORT:-relay}
      MAIL_STREAM_AUTH_RELAY_HOST: ${MAIL_STREAM_AUTH_RELAY_HOST:-mailpit}
      MAIL_STREAM_AUTH_RELAY_PORT: ${MAIL_STREAM_AUTH_RELAY_PORT:-1025}
      MAIL_STREAM_AUTH_RELAY_USER: ${MAIL_STREAM_AUTH_RELAY_USER:-}
      MAIL_STREAM_AUTH_RELAY_PASSWORD: ${MAIL_STREAM_AUTH_RELAY_PASSWORD:-}
      MAIL_STREAM_AUTH_BREVO_HOST: ${MAIL_STREAM_AUTH_BREVO_HOST:-}
      MAIL_STREAM_AUTH_BREVO_PORT: ${MAIL_STREAM_AUTH_BREVO_PORT:-587}
      MAIL_STREAM_AUTH_BREVO_USER: ${MAIL_STREAM_AUTH_BREVO_USER:-}
      MAIL_STREAM_AUTH_BREVO_PASSWORD: ${MAIL_STREAM_AUTH_BREVO_PASSWORD:-}
      MAIL_STREAM_AUTH_FROM: ${MAIL_STREAM_AUTH_FROM:-}
      MAIL_REPLY_DOMAIN: ${MAIL_REPLY_DOMAIN:-}
      # A12: NOT defaulted to the real erp host here — an operator sets the box's real public URL
      # in its own (gitignored) .env; the compiled `https://erp.gaiada.invalid` fallback is what a
      # forgotten override actually produces (obviously fake, never a live link).
      MAIL_LINK_BASE_URL: ${MAIL_LINK_BASE_URL:-}
      # Minted as a random local on the box (design §12 — dev stage has no external secrets at
      # all); never committed. Empty = the delivery-event webhook / inbound intake fail-closed.
      MAIL_WEBHOOK_TOKEN: ${MAIL_WEBHOOK_TOKEN:-}
      MAIL_INBOUND_TOKEN: ${MAIL_INBOUND_TOKEN:-}
      # MAIL-37: which upstream peers may set X-Forwarded-For for the inbound webhook's
      # per-source rate limiter. Defaults to EMPTY = trust nothing = fall back to the socket
      # address, so an unset value is safe (coarse) rather than exploitable. Deliberately a
      # SEPARATE key from MAIL_MAGIC_LINK_TRUSTED_PROXIES — they gate different network hops
      # and must never be unioned. Production value once NET-01's nginx route is applied:
      # `172.17.0.1,127.0.0.1`. nginx is host-native and reaches this container through a
      # loopback-published port, so Docker hairpin-NAT means the app observes the bridge
      # gateway rather than 127.0.0.1 — reasoned from this repo, NOT yet measured on the box.
      # Narrow it to the measured peer once traffic flows.
      MAIL_INBOUND_TRUSTED_PROXIES: ${MAIL_INBOUND_TRUSTED_PROXIES:-}
      MAIL_INBOUND_MAX_BYTES: ${MAIL_INBOUND_MAX_BYTES:-5242880}
      # MAIL-13 inbound hardening. NOTE: the HMAC verifier behind MAIL_INBOUND_SIGNING_KEY is OURS,
      # not Brevo's — Brevo does not sign inbound webhooks (it offers basic-auth-in-URL / a token
      # header only), so MAIL_INBOUND_TOKEN above is the provider-side check and this is defence in
      # depth. Empty key = signature check disabled; the token check still fails closed.
      MAIL_INBOUND_SIGNING_KEY: ${MAIL_INBOUND_SIGNING_KEY:-}
      MAIL_INBOUND_SIGNATURE_TOLERANCE_S: ${MAIL_INBOUND_SIGNATURE_TOLERANCE_S:-300}
      MAIL_INBOUND_MAX_ATTACHMENT_BYTES: ${MAIL_INBOUND_MAX_ATTACHMENT_BYTES:-10485760}
      MAIL_INBOUND_MAX_ATTACHMENTS: ${MAIL_INBOUND_MAX_ATTACHMENTS:-10}
      MAIL_INBOUND_RATE_PER_MIN: ${MAIL_INBOUND_RATE_PER_MIN:-60}
      # 'clamav' only once the `scan` profile (above) is actually up; 'off' otherwise (default) —
      # attachment downloads then stay admin-only rather than half-working against an absent scanner.
      MAIL_INBOUND_SCAN: ${MAIL_INBOUND_SCAN:-off}
      # clamd endpoint for the scan profile's service. Unreachable scanner ⇒ attachments stay
      # 'pending' and download 403s at every privilege (fail-closed on exposure, fail-soft on boot).
      MAIL_CLAMAV_HOST: ${MAIL_CLAMAV_HOST:-clamav}
      MAIL_CLAMAV_PORT: ${MAIL_CLAMAV_PORT:-3310}
      MAIL_CLAMAV_TIMEOUT_MS: ${MAIL_CLAMAV_TIMEOUT_MS:-30000}
      # §9/§15 R5 — stays 0 for real users until the staging SLO gate closes. MAIL-10 is a later
      # ticket; wired here now so its landing needs no second compose edit.
      MAIL_MAGIC_LINKS_ENABLED: ${MAIL_MAGIC_LINKS_ENABLED:-0}
      # MAIL-10 — token TTL + the two rate-limit dimensions (design §9). Wired here in the same
      # change that adds them to config.ts, per the standing compose-passthrough rule.
      MAIL_MAGIC_LINK_TTL_SECONDS: ${MAIL_MAGIC_LINK_TTL_SECONDS:-900}
      MAIL_MAGIC_LINK_RATE_PER_ADDRESS_HOUR: ${MAIL_MAGIC_LINK_RATE_PER_ADDRESS_HOUR:-3}
      MAIL_MAGIC_LINK_RATE_PER_IP_HOUR: ${MAIL_MAGIC_LINK_RATE_PER_IP_HOUR:-10}
      # MAIL-24 (QA-MAIL-11 Finding 3) — trusted-proxy allowlist for the magic-link controller's
      # x-forwarded-for read. Empty (default) = trust nothing = the per-IP rate limit always keys
      # on the raw socket address. Set to the real reverse-proxy's IP ONLY once one is in front of
      # this service (compose-env-passthrough trap — a var only in `.env` ships silently disabled).
      MAIL_MAGIC_LINK_TRUSTED_PROXIES: ${MAIL_MAGIC_LINK_TRUSTED_PROXIES:-}
      # App version (docs/modules/VERSIONING.md), surfaced by GET /health. deploy.yml sets this
      # from /VERSION so a running box can always be asked what it is.
      APP_VERSION: ${APP_VERSION:-}
      # ── SMM-06 · the ERP half of the two-host publisher contract ────────────────────────────────
      # 🚨 THE COMPOSE ENV-PASSTHROUGH TRAP. Until this block existed, every SOCIAL_* var could be
      # set correctly in `.env` on the live box and the API container would still never see one:
      # compose passes `.env` to variable INTERPOLATION, not into the container. The symptom is not
      # a crash — the publisher is designed so that a missing base URL is a SUPPORTED keyless mode,
      # so the module boots green, every read serves, and only the publish path refuses
      # `publisher_not_configured` (503). A silently-degraded feature that looks healthy is exactly
      # the shape this estate has been bitten by before, which is why it is called out here.
      #
      # Postiz's OWN vars (FACEBOOK_APP_ID, JWT_SECRET, the DB passwords…) are NOT here on purpose:
      # they belong to the licence-zone host in docker-compose.social.yml. Only the ERP's half of
      # the contract lives on this box. See platform-nest/.env.example §SMM-05/06.
      SOCIAL_PUBLISHER_DRIVER: ${SOCIAL_PUBLISHER_DRIVER:-postiz}
      # The WireGuard peer address — NOT a public hostname, NOT https. main.ts refuses BOOT on a
      # public-looking value; leaving it empty is the supported keyless default.
      SOCIAL_POSTIZ_BASE_URL: ${SOCIAL_POSTIZ_BASE_URL:-}
      SOCIAL_POSTIZ_API_PREFIX: ${SOCIAL_POSTIZ_API_PREFIX:-/api/public/v1}
      SOCIAL_POSTIZ_CONNECT_TIMEOUT_MS: ${SOCIAL_POSTIZ_CONNECT_TIMEOUT_MS:-5000}
      SOCIAL_POSTIZ_READ_TIMEOUT_MS: ${SOCIAL_POSTIZ_READ_TIMEOUT_MS:-30000}
      SOCIAL_POSTIZ_UPLOAD_TIMEOUT_MS: ${SOCIAL_POSTIZ_UPLOAD_TIMEOUT_MS:-120000}
      # Backs the `default` alias only. Per-client keys resolve from
      # SOCIAL_POSTIZ_ORG_API_KEY__<ALIAS> and must be added here explicitly as each org is
      # provisioned — an alias with no matching var REFUSES (`org_key_unresolved`) and never falls
      # back to this one, which is what stops client A publishing with client B's credential.
      SOCIAL_POSTIZ_ORG_API_KEY: ${SOCIAL_POSTIZ_ORG_API_KEY:-}
      # Per-network DEPLOYMENT gate, above the per-engagement tool_scope. x/youtube/tiktok stay off:
      # x is metered (OQ-2/D-14 keeps the publish path $0), youtube and tiktok are audit-locked.
      SOCIAL_NETWORKS_ENABLED: ${SOCIAL_NETWORKS_ENABLED:-instagram,facebook,linkedin}
      SOCIAL_DEFAULT_USAGE_BUDGET_USD: ${SOCIAL_DEFAULT_USAGE_BUDGET_USD:-10}

      # SMM-38 `direct` driver — LinkedIn/YouTube first-light credentials.
      # Runbook: docs/runbooks/social-first-light-linkedin-youtube.md
      #
      # Passed through EMPTY on purpose. A var in `.env` does nothing unless it is listed here — the
      # INTEGRATION_TOKEN_KEY incident (a 43-char value in `.env`, `""` in the container, three
      # shipped features that could never have worked) is why these are declared before the values
      # exist. Empty is the honest resting state: `checkLinkedInConnectReadiness` /
      # `checkYouTubeConnectReadiness` refuse with a NAMED reason (`platform_app_not_registered`)
      # rather than half-working, and no `:?` guard is used so absence stays a specific runtime
      # refusal instead of blocking the whole stack from starting.
      #
      # All strings — the `${VAR:-}` + `??` "empty becomes 0" trap applies to NUMERIC vars only.
      SOCIAL_LINKEDIN_CLIENT_ID: ${SOCIAL_LINKEDIN_CLIENT_ID:-}
      SOCIAL_LINKEDIN_CLIENT_SECRET: ${SOCIAL_LINKEDIN_CLIENT_SECRET:-}
      SOCIAL_LINKEDIN_REDIRECT_URI: ${SOCIAL_LINKEDIN_REDIRECT_URI:-}
      SOCIAL_LINKEDIN_ORGANIZATION_URN: ${SOCIAL_LINKEDIN_ORGANIZATION_URN:-}
      SOCIAL_YOUTUBE_CLIENT_ID: ${SOCIAL_YOUTUBE_CLIENT_ID:-}
      SOCIAL_YOUTUBE_CLIENT_SECRET: ${SOCIAL_YOUTUBE_CLIENT_SECRET:-}
      SOCIAL_YOUTUBE_REDIRECT_URI: ${SOCIAL_YOUTUBE_REDIRECT_URI:-}
      # OQ-3 own-brand-first gate: only clients listed here may run the connect ceremony at all.
      SOCIAL_OWN_BRAND_CLIENT_IDS: ${SOCIAL_OWN_BRAND_CLIENT_IDS:-}
      SOCIAL_CONNECT_REDIRECT_URL: ${SOCIAL_CONNECT_REDIRECT_URL:-}

      # MON-12c — the Plane B sweep loop. Absent/anything-but-"1" means the runner never starts, and
      # that default is deliberate: this loop DIALS CLIENT WEBSITES, so probing a third party must be
      # a decision someone made and not a consequence of a container booting. Until this line existed
      # the flag could not be switched on at all — setting it in `.env` did nothing, because a var
      # absent from this block is simply not in the process environment.
      MONITORING_RUNNER_ENABLED: ${MONITORING_RUNNER_ENABLED:-}
      # `:-}` supplies an EMPTY STRING when unset, and `Number("")` is 0. config.ts parses this with
      # readIntervalMs() (floor 1s) precisely so an empty passthrough cannot become a 0 ms busy loop
      # hammering client sites. Do not "simplify" that parse back to `Number(x ?? 60_000)`.
      MONITORING_RUNNER_INTERVAL_MS: ${MONITORING_RUNNER_INTERVAL_MS:-}
    volumes:
      - platform-files:/data/files
    # SM-45: gives depends_on: condition: service_healthy something to attach to. GET /health is
    # the same root probe the admin console + mcp-hub's module-tools bootstrap already hit; node:22
    # -alpine ships busybox wget so no extra package is needed in the image. Use 127.0.0.1, NOT
    # localhost — busybox wget resolves localhost to ::1 first and the app only binds 0.0.0.0
    # (IPv4), so "localhost" gets a false-negative "connection refused" from inside the container.
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3004/health"]
      interval: 5s
      timeout: 3s
      retries: 20
      # start_period was 10s, giving a total budget of 10s + 20x5s = 110s. This platform takes
      # ~130s to reach "Server listening" on the VPS (module registration, Cerbos, DB, OTel), so
      # compose declared it unhealthy ~19s BEFORE it was ready. That aborts `up -d` with
      # "dependency failed to start", which leaves every dependent (platform-ui, mcp-hub,
      # knowledge, report-renderer, agent-runner) in the CREATED state, never started -- and the
      # box then serves 502 from nginx even though platform itself comes healthy a few seconds
      # later. That is exactly the 2026-08-24 outage. Failures inside start_period do not count
      # toward `retries`, so a generous start_period costs nothing on a fast boot: the container
      # is marked healthy on the first successful probe either way.
      start_period: 300s
    depends_on:
      postgres:
        condition: service_healthy
      # Every request authorizes against Cerbos; start it first (fail-closed if it's down).
      cerbos:
        condition: service_started
      redis:
        condition: service_started
      # WD-04: platform calls whisper directly for in-ERP audio uploads. No healthcheck defined
      # on the whisper image (first request downloads its model, so "healthy" isn't meaningful at
      # boot) — service_started is enough; the upload path itself tolerates whisper being briefly
      # unready (retry action on failure).
      whisper:
        condition: service_started

  # Sync engine (WS1 T2) — CENTRAL role. Serves push/pull over mTLS to remote site nodes and runs
  # the tombstone GC sweep. Reconciles the SAME gaiada_platform DB the platform writes (the sync
  # tables + the outbox hlc column ship in platform-nest migrations 0012/0013). Idle until a real
  # second site is enrolled; deploying it now is harmless (no site nodes → nothing to serve).
  # ONE-TIME cert provisioning (mTLS is mandatory here, unlike the gateway): the gateway persists
  # the internal CA to the gateway-data volume; issue this node's server cert from it once, e.g.
  #   docker compose run --rm --entrypoint /synccert sync-central \
  #     -ca-cert /gateway-ca/ca-cert.pem -ca-key /gateway-ca/ca-key.pem \
  #     -cn central -out-cert /app/data/sync.crt -out-key /app/data/sync.key
  # then issue each site node's client cert (CN = its NODE_ID) and add it to site_subscriptions.
  sync-central:
    profiles: [multisite]
    image: ghcr.io/${GHCR_OWNER:-hansel-gaiada}/gaiada-sync-engine-go:${GAIADA_TAG:-latest}
    restart: unless-stopped
    environment:
      SYNC_MODE: central
      NODE_ID: central
      # Runtime = restricted sync_app (scoped to the sync footprint; DENIED platform-internal tables).
      DATABASE_URL: postgres://sync_app:${SYNC_APP_PASSWORD:?}@${PG_HOST:-postgres}:5432/gaiada_platform
      SYNC_LISTEN_ADDR: 0.0.0.0:3013
      SYNC_CA_CERT: /gateway-ca/ca-cert.pem
      SYNC_CERT: /app/data/sync.crt
      SYNC_KEY: /app/data/sync.key
      # Empty = accept any CA-signed node (the site_subscriptions ACL is then the sole tenant
      # gate); set to a comma list of node CNs to also pin an allowlist.
      SYNC_ALLOWED_CNS: ${SYNC_ALLOWED_CNS:-}
      # WA-hardening D: base telemetry default (see ai-gateway comment above for rationale).
      OTEL_ENABLED: ${OTEL_ENABLED:-0}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4318}
      OTEL_SERVICE_NAME: sync-engine
    volumes:
      - sync-data:/app/data
      - gateway-data:/gateway-ca:ro # reuse the gateway's persisted internal CA
    depends_on:
      postgres:
        condition: service_healthy

  # SM-07 crawl worker (search-crawl-go). Job-mode by design (one container run = one crawl of one
  # registered+verified search_properties row, then exit) — NOT part of the always-on stack, so
  # profile-gated + restart:"no" like sync-central's spirit but without the "unless-stopped" server
  # lifecycle. Dispatch a crawl with:
  #   docker compose -f docker-compose.vps.yml --profile jobs run --rm \
  #     -e TENANT_ID=<company uuid> -e PROPERTY_ID=<search_properties uuid> search-crawl
  # Egress is fully closed by default: it has no allowlist of its own baked in — the ONLY hosts a
  # run may reach are resolved at dispatch from that tenant's own search_properties row (SM-07
  # egress guard, internal/egress). No inbound ports (Zone A egress-only, design §05 table).
  search-crawl:
    image: ghcr.io/${GHCR_OWNER:-hansel-gaiada}/gaiada-search-crawl-go:${GAIADA_TAG:-latest}
    restart: "no"
    profiles: ["jobs"] # never starts with a plain `up -d`; run explicitly per crawl
    environment:
      # Runtime = platform_app (NOBYPASSRLS) — identical runtime privilege to platform-nest
      # itself; the crawl worker gets no elevated DB grant.
      DATABASE_URL: postgres://platform_app:${PLATFORM_APP_PASSWORD:?}@${PG_HOST:-postgres}:5432/gaiada_platform
      # Deliberately `:-` (empty default), NOT `:?`. Compose validates interpolation for EVERY
      # service in the file regardless of active profile, so a `:?` here made *every* compose
      # command on this project fail ("required variable TENANT_ID is missing") even though
      # search-crawl is profile-gated and never started by `up -d` — it blocked routine
      # `up -d`/`build`/`ps` on the whole stack. The enforcement is not lost: cmd/crawl/main.go's
      # requireEnv() exits with "missing required env TENANT_ID" on an empty value, which is the
      # correct place for it — the run fails fast, and unrelated commands keep working.
      TENANT_ID: "${TENANT_ID:-}" # set per run: docker compose --profile jobs run -e TENANT_ID=<company uuid> …
      PROPERTY_ID: "${PROPERTY_ID:-}" # set per run: -e PROPERTY_ID=<search_properties uuid>
      AUDIT_LOG_PATH: /app/data/egress-audit.jsonl
      REPORT_PATH: /app/data/report.json
      MAX_PAGES: ${SEARCH_CRAWL_MAX_PAGES:-25}
      MIN_HOST_GAP_MS: ${SEARCH_CRAWL_MIN_HOST_GAP_MS:-1000}
    volumes:
      - search-crawl-data:/app/data
    depends_on:
      postgres:
        condition: service_healthy

  platform-ui:
    image: ghcr.io/${GHCR_OWNER:-hansel-gaiada}/gaiada-platform-ui:${GAIADA_TAG:-latest}
    restart: unless-stopped
    environment:
      PLATFORM_URL: http://platform:3004
      PLATFORM_SERVICE_TOKEN: ${PLATFORM_SERVICE_TOKEN:?}
      SESSION_SECRET: ${UI_SESSION_SECRET:?}
      # UI-side mirror of the backend flag (ORG-13; default OFF). Must match the platform's
      # SERVICE_ASSIGNMENTS_ENABLED so the Connect-service UI surfaces only when the backend
      # actually serves it (writes 409 while off).
      SERVICE_ASSIGNMENTS_ENABLED: ${SERVICE_ASSIGNMENTS_ENABLED:-}
      APP_VERSION: ${APP_VERSION:-}
      # OIDC (authorization-code + PKCE, public client — no secret).
      # AUTH_URL is BROWSER-facing so it must be the public host; TOKEN_URL is a server-to-server
      # call from this container, so it stays internal. Mixing those up is the classic failure:
      # the redirect works, then the code exchange dies on DNS or a proxy loop.
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-gaiada-ui}
      OIDC_AUTH_URL: ${OIDC_AUTH_URL:-}
      OIDC_TOKEN_URL: ${OIDC_TOKEN_URL:-}
      OIDC_REDIRECT_URI: ${OIDC_REDIRECT_URI:-}
      # Mirrors the platform's mode so the login page can hide the dev email box when it is
      # disabled server-side — otherwise the page's primary action is the one that cannot work.
      AUTH_MODE: ${PLATFORM_AUTH_MODE:-dev}
      # The address the BROWSER used. Without it, redirects are built from the container's bind
      # address and the OIDC callback lands on an unreachable host.
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-}
    ports:
      - "3005:3005"
    depends_on:
      platform:
        condition: service_healthy

  # TR-19 (tracker/reporting §6.3) — report-renderer sidecar. The ONLY image in the estate
  # carrying Chromium (Playwright); platform-ui's own image stays browser-free (Next standalone).
  # Renders an internal platform-ui print route (TR-20) to print-grade PDF for report exports
  # (TR-21 mints the one-shot jobToken URL this service is handed). Internal network ONLY — no
  # published port here by design; holds no tenant credential, only the shared RENDERER_TOKEN.
  # Origin-locked to PLATFORM_UI_INTERNAL_URL (src/auth.ts's isAllowedRenderUrl) so a leaked
  # token cannot turn this into an SSRF proxy against the internal network — the same discipline
  # as ai-gateway-go's DialContext egress allowlist / search-crawl-go's egress guard.
  # CAVEAT: Docker build unverified in this dev env (no Docker) — validate on a Docker host before
  # deploy, same caveat already carried by ai-gateway-go/render-gateway-go. See
  # infra/runbooks/deploy-vps.md.
  report-renderer:
    image: ghcr.io/${GHCR_OWNER:-hansel-gaiada}/gaiada-report-renderer:${GAIADA_TAG:-latest}
    restart: unless-stopped
    environment:
      RENDERER_TOKEN: ${RENDERER_TOKEN:?}
      # TR-20/21 are not built yet; this points at platform-ui's internal (unpublished-outside-
      # the-network) origin so the render/SSRF guard has a real value to lock against today, even
      # though nothing serves a real /print/reports/:jobToken route until TR-20 lands.
      PLATFORM_UI_INTERNAL_URL: ${PLATFORM_UI_INTERNAL_URL:-http://platform-ui:3005}
    healthcheck:
      # node is guaranteed present (it's the runtime); avoids relying on curl/wget being in the
      # Playwright base image.
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3007/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 20
      # 10s -> 300s, for the same reason as `platform` above and BEFORE it bites rather than after.
      # This is a Playwright image: it is large, and its boot has no reason to stay under 110s
      # forever. When platform's boot crossed that line on 2026-08-24 compose aborted `up -d` and
      # left every dependent in the CREATED state, which is what served 502 to the public — the
      # failure was not a slow container, it was a budget that could be exceeded at all.
      # Failures inside start_period do not count toward `retries`, so this costs nothing when the
      # container is quick: it is marked healthy on the first successful probe either way.
      start_period: 300s
    depends_on:
      platform-ui:
        condition: service_started

  # Self-hosted transcription (5a.3) — CPU image; audio transcribes locally, never
  # leaving the box. First request downloads the model into the volume (be patient).
  # PROFILE whisper — omit to transcribe elsewhere (e.g. a local workstation). Platform's
  # WHISPER_URL then points nowhere and the upload endpoint refuses cleanly by design.
  whisper:
    profiles: [whisper]
    image: fedirz/faster-whisper-server:latest-cpu
    restart: unless-stopped
    volumes:
      - whisper-models:/root/.cache/huggingface

  knowledge:
    image: ghcr.io/${GHCR_OWNER:-hansel-gaiada}/gaiada-ai-agents:${GAIADA_TAG:-latest}
    command: ["npx", "tsx", "src/knowledge/service.ts"]
    restart: unless-stopped
    environment:
      KNOWLEDGE_SERVICE_TOKEN: ${KNOWLEDGE_SERVICE_TOKEN:?}
      # Runtime = knowledge_app; schema DDL runs as knowledge_owner (MIGRATE_DATABASE_URL).
      KNOWLEDGE_DATABASE_URL: postgres://knowledge_app:${KNOWLEDGE_APP_PASSWORD:?}@${PG_HOST:-postgres}:5432/gaiada_knowledge
      MIGRATE_DATABASE_URL: postgres://knowledge_owner:${KNOWLEDGE_OWNER_PASSWORD:?}@${PG_HOST:-postgres}:5432/gaiada_knowledge
      PLATFORM_URL: http://platform:3004
      PLATFORM_SERVICE_TOKEN: ${PLATFORM_SERVICE_TOKEN:?}
      GATEWAY_URL: http://ai-gateway:3002
      GATEWAY_TOKEN: ${GATEWAY_TOKEN:?}
      # WA-hardening D: base telemetry default (see ai-gateway comment above for rationale).
      OTEL_ENABLED: ${OTEL_ENABLED:-0}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4318}
      OTEL_SERVICE_NAME: knowledge
    depends_on:
      postgres:
        condition: service_healthy
      # SM-45: knowledge calls platform's API right away (module contract reads); wait for the real
      # healthcheck, not just "container process started", to close the same boot-order race.
      platform:
        condition: service_healthy
      ai-gateway:
        condition: service_started

  # B2: agent-runner (WS8) — goal queue + durable run store around the proven runners
  # (runOrchestrator / runWriteAgent / traceRun). Serves /goals, /runs, /metrics/agents; reached
  # by platform-nest /api/:t/agents/* proxy. Tables (agent_goals / agent_runs) live in gaiada_knowledge
  # alongside the episodic store; no new DB/role needed.
  agent-runner:
    image: ghcr.io/${GHCR_OWNER:-hansel-gaiada}/gaiada-ai-agents:${GAIADA_TAG:-latest}
    command: ["npx", "tsx", "src/runner/service.ts"]
    restart: unless-stopped
    environment:
      AGENT_RUNNER_TOKEN: ${AGENT_RUNNER_TOKEN:?}
      # Runtime = knowledge_app (same as knowledge service); DDL runs as knowledge_owner.
      AGENTS_DATABASE_URL: postgres://knowledge_app:${KNOWLEDGE_APP_PASSWORD:?}@${PG_HOST:-postgres}:5432/gaiada_knowledge
      MIGRATE_DATABASE_URL: postgres://knowledge_owner:${KNOWLEDGE_OWNER_PASSWORD:?}@${PG_HOST:-postgres}:5432/gaiada_knowledge
      GATEWAY_URL: http://ai-gateway:3002
      GATEWAY_TOKEN: ${GATEWAY_TOKEN:?}
      HUB_URL: http://mcp-hub:3003
      HUB_SERVICE_TOKEN: ${HUB_SERVICE_TOKEN:?}
      # Assurance elevation (mcp-hub design §2): the agent runner is the OTHER entitled caller — it
      # carries the triggering human's envelope, never an identity of its own. Without this the whole
      # agent-write half of D14 stays inert.
      HUB_ASSURANCE_TOKEN: ${HUB_ASSURANCE_TOKEN:-}
      # T6 (ASST-23) — the provider the D13 write gate sees. This is NOT cosmetic: `service.ts` resolves
      # `cfg.servingProvider ?? deps.lastProvider() ?? null` and then passes `provider ?? "echo"` into
      # runWriteAgent. Left unset, a runner that has not yet observed a real provider hands the write
      # gate `"echo"`, which is NOT in task-filer's `evaledProviders: ["openai"]` — so D13 correctly
      # STRIPS its write tools and forces the agent read-only. The assistant would then never propose a
      # write, and the failure is SILENT: no error, no log, just a chat that quietly only ever reads,
      # while every local test passes because the tests pass a provider explicitly.
      #
      # `openai` matches the taskFiler enrollment (ai-agents/src/specialists.ts) and the pre-existing
      # taskTriager precedent. The value names the ENROLLED provider identity the eval suite certified,
      # not the vendor actually serving — the Gateway's own chain decides that.
      #
      # Defaulted (`:-openai`) rather than required (`:?`) on purpose: an absent value must not stop the
      # whole stack from coming up over one agent capability. This is the same class of trap as
      # APPROVAL_GRANT_SECRET, which WAS passed through for three services while `.env` simply had no
      # value — so every D14 grant was rejected until 2026-08-06. A passthrough line is not a set value.
      AGENT_SERVING_PROVIDER: ${AGENT_SERVING_PROVIDER:-openai}
    depends_on:
      postgres:
        condition: service_healthy
      ai-gateway:
        condition: service_started
      mcp-hub:
        condition: service_started

  mcp-hub:
    image: ghcr.io/${GHCR_OWNER:-hansel-gaiada}/gaiada-mcp-hub:${GAIADA_TAG:-latest}
    restart: unless-stopped
    ports:
      - "127.0.0.1:3003:3003" # localhost-only; lets the standalone automation stack (n8n) reach the hub
    environment:
      HUB_SERVICE_TOKEN: ${HUB_SERVICE_TOKEN:?}
      # The hub VERIFIES this token (design §2 conjunct 1) — it must be set here as well as on the
      # two entitled callers, or their elevated requests authenticate as ordinary `low` callers and
      # every agent write denies with "requires verified assurance".
      HUB_ASSURANCE_TOKEN: ${HUB_ASSURANCE_TOKEN:-}
      GATEWAY_URL: http://ai-gateway:3002
      GATEWAY_TOKEN: ${GATEWAY_TOKEN:?}
      PLATFORM_URL: http://platform:3004
      PLATFORM_SERVICE_TOKEN: ${PLATFORM_SERVICE_TOKEN:?}
      KNOWLEDGE_URL: http://knowledge:3005
      KNOWLEDGE_SERVICE_TOKEN: ${KNOWLEDGE_SERVICE_TOKEN:?}
      # WS2 §5: make the versioned `mcp_tool` Cerbos policy authoritative (in-code stays as fallback).
      CERBOS_URL: http://cerbos:3592
      # WS2 §7: site hub (fronts this platform). The central hub runs as mcp-hub-central below.
      HUB_TOPOLOGY: site
      # WS2 §3: mTLS off until certs are enrolled (mirrors the gateway's GATEWAY_TLS_MODE: off).
      # Enroll with synccert (see mcp-hub/.env.example), mount them, then set HUB_TLS_MODE: enforced.
      HUB_TLS_MODE: ${HUB_TLS_MODE:-off}
      # D14-04 — the OTHER half of the shared execution-grant secret (see the platform service above;
      # both blocks must carry it or the two sides can never agree). Empty ⇒ every presented
      # `x-approval-grant` is rejected and medium+/unclassified automation writes keep suspending:
      # fail-closed, and visible on /admin/info as policy.executionGrantConfigured=false.
      APPROVAL_GRANT_SECRET: ${APPROVAL_GRANT_SECRET:-}
      # WS11 delivery tools (build item 9). All fail CLOSED when unset (github.repoStatus / deploy.staging
      # simply refuse), so leaving these blank is safe — set them to enable the code + deploy stages.
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GITHUB_ORG: ${GITHUB_ORG:-}
      DEPLOY_STAGING_URL: ${DEPLOY_STAGING_URL:-}
      DEPLOY_STAGING_TOKEN: ${DEPLOY_STAGING_TOKEN:-}
      # WA-hardening D: base telemetry default (see ai-gateway comment above for rationale).
      OTEL_ENABLED: ${OTEL_ENABLED:-0}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4318}
      OTEL_SERVICE_NAME: mcp-hub
    volumes:
      - hub-data:/app/data # tool audit
    # SM-45: this closes the boot-order half of the fix — condition: service_healthy on platform
    # means the hub's FIRST module-tools fetch (at boot) usually just succeeds instead of needing a
    # retry. It is deliberately NOT the whole fix: a platform restart after the hub is already up
    # can't be helped by any depends_on ordering, which is why module-tools.ts also self-heals via
    # startModuleToolsBootstrap()'s retry-with-backoff + periodic re-fetch.
    depends_on:
      ai-gateway:
        condition: service_started
      platform:
        condition: service_healthy
      cerbos:
        condition: service_started

  # Central hub (WS2 §7): SAME codebase, HUB_TOPOLOGY=central — adds cross-company/management tools
  # (real rollup.metrics over the platform's D12 /rollups read). Idle-but-defined like sync-central;
  # in a single-region v1 it points at the same platform. Not published (reach it via the internal
  # network / an enrolled mTLS peer). Give it a real second-site platform URL when one exists.
  mcp-hub-central:
    profiles: [multisite]
    image: ghcr.io/${GHCR_OWNER:-hansel-gaiada}/gaiada-mcp-hub:${GAIADA_TAG:-latest}
    restart: unless-stopped
    environment:
      HUB_SERVICE_TOKEN: ${HUB_SERVICE_TOKEN:?}
      # Same token on the central hub — cross-company tools are exactly where the tier matters.
      HUB_ASSURANCE_TOKEN: ${HUB_ASSURANCE_TOKEN:-}
      GATEWAY_URL: http://ai-gateway:3002
      GATEWAY_TOKEN: ${GATEWAY_TOKEN:?}
      PLATFORM_URL: http://platform:3004
      PLATFORM_SERVICE_TOKEN: ${PLATFORM_SERVICE_TOKEN:?}
      KNOWLEDGE_URL: http://knowledge:3005
      KNOWLEDGE_SERVICE_TOKEN: ${KNOWLEDGE_SERVICE_TOKEN:?}
      CERBOS_URL: http://cerbos:3592
      HUB_TOPOLOGY: central
      HUB_TLS_MODE: ${HUB_TLS_MODE:-off}
      # D14-04: same shared secret as the site hub — this is the SAME codebase, so an omission here
      # would make the central hub the one place where approved writes silently never resume.
      APPROVAL_GRANT_SECRET: ${APPROVAL_GRANT_SECRET:-}
    volumes:
      - hub-central-data:/app/data
    depends_on:
      ai-gateway:
        condition: service_started
      platform:
        condition: service_healthy
      cerbos:
        condition: service_started

  bot:
    profiles: [bot]
    image: ghcr.io/${GHCR_OWNER:-hansel-gaiada}/gaiada-wa-chat-bot:${GAIADA_TAG:-latest}
    restart: unless-stopped
    environment:
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:?}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      GATEWAY_URL: http://ai-gateway:3002
      GATEWAY_TOKEN: ${GATEWAY_TOKEN:?}
      WAHA_URL: http://waha:3000
      WAHA_API_KEY: ${WAHA_API_KEY:?}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      # Isolated bot instance (pg-bot) + bot Redis (redis-bot). Runtime = bot_app; DDL = bot_owner.
      DATABASE_URL: postgres://bot_app:${BOT_APP_PASSWORD:?}@pg-bot:5432/gaiada_bot
      MIGRATE_DATABASE_URL: postgres://bot_owner:${BOT_OWNER_PASSWORD:?}@pg-bot:5432/gaiada_bot
      MANAGEMENT_GROUP_ID: ${MANAGEMENT_GROUP_ID:-}
      POST_TO_GROUPS: ${POST_TO_GROUPS:-false}
      REDIS_URL: redis://redis-bot:6379
      # A3: group registry lives on the writable bot-data volume so the ERP can edit it. No seed
      # file is mounted — there is no committed real registry (only config/groups.example.yaml in the
      # image), so the bot boots in trial mode (monitor all, log discovered) until the ERP's
      # Group Registry surface writes /app/data/groups.yaml. To pre-seed instead, drop a real
      # groups.yaml next to this compose file and set GROUPS_SEED_FILE to a read-only mount of it.
      GROUPS_FILE: /app/data/groups.yaml
      # WA-hardening D: base telemetry default (see ai-gateway comment above for rationale) — this is
      # the exact gap the 2026-07-29 incident review found: OTEL_ENABLED had silently fallen off the
      # bot after a plain `up -d --build bot` (vps+local only) recreated it without the observability
      # overlay. Baking the default into the base file means it can no longer be forgotten.
      OTEL_ENABLED: ${OTEL_ENABLED:-0}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4318}
      OTEL_SERVICE_NAME: wa-chat-bot
    volumes:
      - bot-data:/app/data # LocalKms keys + schedule state + discovery + groups registry (EXCLUDE keys.json from backups!)
    depends_on:
      pg-bot:
        condition: service_healthy
      ai-gateway:
        condition: service_started

  bot-media-worker:
    profiles: [bot]
    image: ghcr.io/${GHCR_OWNER:-hansel-gaiada}/gaiada-wa-chat-bot:${GAIADA_TAG:-latest}
    command: ["npx", "tsx", "src/media-worker.ts"]
    restart: unless-stopped
    environment:
      GATEWAY_URL: http://ai-gateway:3002
      GATEWAY_TOKEN: ${GATEWAY_TOKEN:?}
      WAHA_URL: http://waha:3000
      WAHA_API_KEY: ${WAHA_API_KEY:?}
      DATABASE_URL: postgres://bot_app:${BOT_APP_PASSWORD:?}@pg-bot:5432/gaiada_bot
      MIGRATE_DATABASE_URL: postgres://bot_owner:${BOT_OWNER_PASSWORD:?}@pg-bot:5432/gaiada_bot
      REDIS_URL: redis://redis-bot:6379
      MEDIA_WORKER_CONCURRENCY: ${MEDIA_WORKER_CONCURRENCY:-2}
      # WA-hardening D: base telemetry default (see ai-gateway comment above for rationale).
      OTEL_ENABLED: ${OTEL_ENABLED:-0}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4318}
      OTEL_SERVICE_NAME: bot-media-worker
    volumes:
      - bot-data:/app/data
    depends_on:
      pg-bot:
        condition: service_healthy
      redis-bot:
        condition: service_started

  # MAIL-00 (design §4.3) — dev-stage fake-SMTP sink for the Zone A mail subsystem. Catches
  # everything, sends nothing; the real Workspace-relay/Brevo/DNS work is staging-only (design §15
  # R1-R3/R9 — MAIL-01A/01B). Keycloak/Alertmanager/platform all point their SMTP at
  # `mailpit:1025` over this compose network — zero SMTP egress from the box in dev.
  # SECURITY (binding, design A11): SMTP is internal-only; the UI+API (:8025) are published
  # LOOPBACK-ONLY (`127.0.0.1:8025:8025`) and must NEVER be internet-exposed — this sink will
  # hold live password-reset and magic-link mail. Reach it via
  # `ssh -L 8025:localhost:8025 gda-aicenter` then browse http://localhost:8025.
  # Pinned release (verified on gda-aicenter 2026-08-04: `docker run --rm
  # axllent/mailpit:v1.30.6 version` -> "v1.30.6"; never :latest, same estate rule as waha/keycloak).
  # Profile `mail-dev` MUST be in the GitHub repo variable COMPOSE_PROFILES (same change as this
  # ticket) or deploy.yml's `up -d --remove-orphans` deletes this container on the next deploy —
  # the whisper near-miss trap (design §4.3 / plan standing rule 2).
  mailpit:
    profiles: [mail-dev]
    image: axllent/mailpit:v1.30.6
    restart: unless-stopped
    environment:
      # Persist captured mail across restarts so Mailpit API evidence survives a redeploy.
      MP_DATABASE: /data/mailpit.db
    ports:
      - "127.0.0.1:8025:8025" # UI+API — LOOPBACK ONLY, never publish this beyond the box
    volumes:
      - mailpit-data:/data
    healthcheck:
      # `readyz` auto-detects the container's own bind interface/port (see `mailpit readyz --help`).
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  # MAIL-14 (design §7.6) — ClamAV, the FIRST actual instantiation of this pattern in the estate
  # (until now it existed only as the webdesk-blueprint pattern). Scans inbound mail attachments
  # before any user may download them (MAIL_INBOUND_SCAN=clamav; unscannable stays quarantined —
  # fail-closed exposure). Own `scan` profile, deliberately NOT `mail-dev`: real inbound at
  # staging still needs scanning after the Mailpit sink retires (design §4.3). Runbook note:
  # webdesk C-02 upload scanning will later reuse this same service.
  # Pinned release (verified on gda-aicenter 2026-08-04: `clamav/clamav:1.5.3` — digest-identical
  # to `:stable` at pin time; never `:latest`). freshclam definitions persist to a named volume so
  # a restart does not re-download the whole database.
  # Profile `scan` MUST be in the GitHub repo variable COMPOSE_PROFILES (same orphan trap as
  # mailpit above).
  clamav:
    profiles: [scan]
    image: clamav/clamav:1.5.3
    restart: unless-stopped
    volumes:
      - clamav-data:/var/lib/clamav
    healthcheck:
      # Official image ships clamdcheck.sh; exits 0 only once clamd is up AND has loaded signatures
      # (the first boot can take a few minutes while freshclam downloads the database).
      test: ["CMD", "/usr/local/bin/clamdcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 180s

volumes:
  pg-data:
  pg-bot-data:
  redis-data:
  redis-bot-data:
  whisper-models:
  kc-data:
  waha-sessions:
  gateway-data:
  hub-data:
  hub-central-data:
  bot-data:
  platform-files:
  sync-data:
  search-crawl-data:
  mailpit-data:
  clamav-data:
