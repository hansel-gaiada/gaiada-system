      #  INTERNAL tier -> every active company unless KNOWLEDGE_INTERNAL_TENANT_IDS narrows it.
      KNOWLEDGE_INGEST_ENABLED: ${KNOWLEDGE_INGEST_ENABLED:-0}
      KNOWLEDGE_INGEST_INTERVAL_MS: ${KNOWLEDGE_INGEST_INTERVAL_MS:-21600000}
