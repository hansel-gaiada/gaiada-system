# WS9 Observability — COLLECTION ONLY. Merged into the `gaiada` compose project so it shares the
# network with the core services. Bring the whole estate up WITH observability:
#   docker compose -f docker-compose.vps.yml -f docker-compose.observability.yml up -d
# It is opt-in (kept in its own file like the separate automation stack) and adds no runtime
# dependency to the data plane: services export telemetry only when OTEL_ENABLED=1 (see the core
# compose env additions).
#
# MSO-00 (2026-08-21, docs/plans/2026-08-21-multi-server-observability.md §1/§9): this file used to
# ALSO define prometheus/grafana/loki/tempo/alertmanager(+render)/ntfy — the STORAGE + ALERTING
# layer. The 2026-08-18 relocation (docs/plans/2026-08-18-observability-relocation.md) moved that
# layer to the SumoPod VPS (`infra/compose/docker-compose.obs-remote.yml`, project `gaiada-obs`,
# `10.88.0.2`) and stopped the local copies BY NAME, but never removed their service definitions
# from this file — and this file has stayed in the `COMPOSE_FILES` repo variable the whole time, so
# EVERY DEPLOY SINCE resurrected them. `alpha-01.059.0116a` did exactly that on 2026-08-19-ish,
# leaving a second, disconnected Prometheus scraping 14 targets and evaluating the full rule set on
# gda-aicenter for two days before this was caught. That zombie is a live trap: anyone probing
# `:9090`/`:3001`/`:9093` on this box tests the WRONG stack.
#
# This file is now what it always should have been: the pieces that are BY DESIGN local to
# gda-aicenter because they either scrape locally (otel-collector, node-exporter, cadvisor,
# blackbox-exporter, the postgres/redis exporters) or run functional probes against this box
# (synthetic-prober), plus the per-service OTEL_ENABLED merge-overrides. No storage, no query UI,
# no alerting lives here. Grafana/Prometheus/Loki/Tempo/Alertmanager are reached at `10.88.0.2` —
# see docker-compose.obs-remote.yml on the SumoPod side for that half.
#
# `COMPOSE_FILES` needed NO change for this split: the filename is unchanged, only its content —
# so the existing repo variable (`-f docker-compose.vps.yml -f docker-compose.hostdata.yml
# -f docker-compose.observability.yml`) already points at the corrected file once this ships.
name: gaiada

services:
  # --- Pipeline: OTLP ingest → fan out to Prometheus/Tempo/Loki ---
  otel-collector:
    # MON-09q: runs as ROOT, and this is a considered tradeoff rather than laziness.
    #
    # The filelog receiver tails /var/lib/docker/containers/*/*-json.log. That directory is
    # `drwx--x--- root root` (0710): traversable, but NOT LISTABLE by anyone else. The image
    # defaults to uid 10001, so the receiver's glob could never expand and it logged
    # `no files match the configured criteria` on every start. Container logs have therefore
    # NEVER reached Loki on this box -- a pre-existing fault, not a regression from the 2026-08-18
    # relocation, and it went unnoticed for the same reason everything else did: nothing ever
    # looked at Loki. Proven rather than assumed: uid 10001 gets 'Permission denied' listing the
    # dir while uid 0 lists 35 entries, against 34 real *-json.log files.
    #
    # Alternatives considered: loosening 0710 on a Docker-owned system directory (worse, and
    # global), or switching log sources entirely (a bigger change than the fault warrants).
    # Reading every container's stdout is already this component's whole job, so root buys no
    # capability it did not effectively have -- and BOTH host mounts below are :ro.
    user: "0:0"
    image: otel/opentelemetry-collector-contrib:0.116.1
    restart: unless-stopped
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ../../infra/observability/otel-collector/config.yaml:/etc/otelcol/config.yaml:ro
      # Read-only tail of container stdout for the filelog receiver (logs → Loki).
      # MON relocation: backs the exporters' persistent sending queue (file_storage
      # extension). Without a durable directory a WireGuard outage would drop telemetry silently,
      # and a silent gap looks identical to a quiet system.
      - otel-queue:/var/lib/otelcol/queue
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    # MSO-00: `depends_on: [tempo, loki]` was removed here. Both were LOCAL services before the
    # relocation; this collector now ships traces/logs to 10.88.0.2 over the exporters in
    # config.yaml, not to anything in this compose project. Left in place, this would have been a
    # hard `docker compose config` error the moment prometheus/tempo/loki/grafana/alertmanager were
    # deleted below (depends_on must name a service defined in the SAME project).

  # --- Exporters ---
  # MON-09j: the exporters must reach the DATABASE, and on gda-aicenter Postgres and Redis run
  # on the HOST, not in Docker (hostdata.yml !resets those container services). Hardcoding
  # `postgres:5432` / `redis://redis:6379` therefore pointed both exporters at services that
  # are deliberately never started: they scraped fine, so Prometheus showed the targets UP,
  # while `pg_up`/`redis_up` sat at 0 and nobody was watching those. A green target is not a
  # working check --- the exporter answering says nothing about the thing it measures.
  #
  # Fixed by reusing the SAME vars the app services already use (PG_HOST, REDIS_URL), so there
  # is one source of truth for 'where is the database' and the exporters cannot drift from the
  # platform's own connection. Defaults keep the all-in-Docker local topology working.
  # NB: this must live HERE and not in hostdata.yml --- observability.yml is loaded LAST in
  # COMPOSE_FILES, so anything hostdata.yml set for these services would be overridden back.
  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.16.0
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # Was `postgres:$POSTGRES_SUPER_PASSWORD@.../gaiada` --- a user AND a database that do not
      # exist on this box. POSTGRES_SUPER_PASSWORD belongs to the CONTAINER Postgres (profile
      # `data`, never started here); the host instance serves `gaiada_platform` through the
      # per-service roles in vps.yml. So the exporter authenticated as nobody against nothing,
      # and reported pg_up=0 while its scrape target showed green.
      # Now it reuses the platform's own runtime role: the credential we already know works,
      # because the application is up on it.
      # NOTE: platform_app is intentionally restricted (NOBYPASSRLS), so collectors needing
      # pg_monitor return nothing. That is a far smaller gap than a blind exporter; the proper
      # fix is a dedicated read-only pg_monitor role (MON-09m), needing rights not held here.
      # MON-09m: a dedicated READ-ONLY role, not the application's runtime user.
      # platform_app is intentionally NOBYPASSRLS and lacks the privileges several collectors need,
      # so those returned nothing while pg_up read 1 -- monitoring that is up and partially blind.
      # gaiada_exporter holds ONLY pg_monitor (the built-in role for exactly this) plus CONNECT.
      # It can read monitoring views and functions and no table data, so pointing an exporter at
      # it does not hand a scraping component access to business rows.
      # Falls back to platform_app if PG_EXPORTER_PASSWORD is unset, so a box without the role
      # provisioned keeps the previous (reduced) behaviour instead of losing the exporter entirely.
      DATA_SOURCE_NAME: "postgresql://${PG_EXPORTER_USER:-gaiada_exporter}:${PG_EXPORTER_PASSWORD:-${PLATFORM_APP_PASSWORD}}@${PG_HOST:-postgres}:5432/gaiada_platform?sslmode=disable"
    # MSO-00: `depends_on: [prometheus]` removed — prometheus is no longer a service in this
    # project (it lives on obs-remote.yml/SumoPod now). This exporter is scraped BY the otel
    # collector's prometheus/scrape receiver, not the other way round, so it never actually needed
    # to wait on a Prometheus container in the first place.

  postgres-exporter-bot:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.16.0
    restart: unless-stopped
    # MON-09k, two separate faults found while wiring the PostgresDown alert:
    #  1. This pointed at database `gaiada` on pg-bot, but the bot service uses `gaiada_bot`
    #     (see vps.yml). `gaiada` exists there, so it CONNECTED and looked fine while reporting
    #     on a database nothing uses --- a monitor aimed at the wrong target, which is worse than
    #     no monitor because it produces confident numbers about nothing.
    #  2. pg-bot is postgres:17, and exporter v0.16.0 predates PG17 splitting
    #     pg_stat_bgwriter.checkpoints_timed out into pg_stat_checkpointer. The stat_bgwriter
    #     collector therefore errors on every scrape. Disabled here rather than pinned to a newer
    #     exporter, so the fix is verifiable now and does not couple to an untested image bump;
    #     the host Postgres is 15 and its exporter keeps the collector.
    command: ["--no-collector.stat_bgwriter"]
    environment:
      DATA_SOURCE_NAME: "postgresql://postgres:${POSTGRES_SUPER_PASSWORD}@pg-bot:5432/gaiada_bot?sslmode=disable"

  redis-exporter:
    image: oliver006/redis_exporter:v1.67.0
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # REDIS_URL carries the host, port AND password the platform already uses. Sending the whole
    # URL rather than a host means the exporter authenticates; a hostname alone would connect and
    # then fail every command with NOAUTH, which reports as up-but-empty.
    command: ["--redis.addr=${REDIS_URL:-redis://redis:6379}"]

  redis-exporter-bot:
    image: oliver006/redis_exporter:v1.67.0
    restart: unless-stopped
    command: ["--redis.addr=redis://redis-bot:6379"]

  node-exporter:
    image: prom/node-exporter:v1.8.2
    restart: unless-stopped
    command:
      - "--path.rootfs=/host"
    pid: host
    volumes:
      - /:/host:ro,rslave

  cadvisor:
    # MON-09n: v0.52.1 was TRIED and reverted. It produced the same zero per-container metrics
    # AND resurrected the `Failed to create existing container` spam that `cgroup: host` had
    # silenced on v0.49.1 -- strictly worse, so the version gap was not the cause after all.
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    restart: unless-stopped
    privileged: true
    # MON-09l: with the mounts alone, cAdvisor logged 'Failed to create existing container:
    # /system.slice/docker-<hash>' for EVERY container and produced only host cgroup series --
    # 51 of them, none carrying a `name` label. So per-container CPU/memory did not exist while
    # the cadvisor scrape target sat green. Third instance today of the same shape: a collector
    # that answers is not a collector that collects.
    #
    # On a cgroup-v2 host cAdvisor additionally needs /dev/kmsg (kernel event source) and
    # /dev/disk (block device stats); without them container discovery fails per-container
    # rather than failing loudly at startup, which is why it looked healthy.
    # --docker_only drops the host-cgroup noise that was all it managed to report before.
    # --docker_only was tried and REMOVED: with container discovery still broken (below) it cut
    # cadvisor from 49 host-cgroup series to exactly 1, trading a partial signal for none. An
    # optimisation that reduces coverage while the underlying fault is unfixed is a regression.
    command:
      - "--store_container_labels=false"
      # (--containerd=/var/run/containerd/containerd.sock was tried and removed: no effect on
      # discovery, and unverified config that changes nothing is just future confusion.)
    # MON-09n, the actual fix. This host is cgroup v2 (cgroup2fs), and on cgroup v2 Docker gives
    # each container a PRIVATE cgroup namespace: inside cadvisor, /sys/fs/cgroup shows only its
    # own cgroup, so the paths it needs (/system.slice/docker-<id>.scope) do not exist. It logged
    # `Failed to create existing container: /system.slice/docker-<hash>` once per container and
    # produced only host-level series with no `name` label -- i.e. no per-container metrics at all,
    # while its scrape target stayed green.
    #
    # The earlier /dev/kmsg + /dev/disk additions were necessary but not sufficient; they silenced
    # some startup noise without granting visibility. Joining the HOST cgroup namespace is what
    # actually lets it see other containers' cgroups.
    cgroup: host
    devices:
      - /dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro

  blackbox-exporter:
    image: prom/blackbox-exporter:v0.25.0
    restart: unless-stopped
    command: ["--config.file=/etc/blackbox/blackbox.yml"]
    volumes:
      - ../../infra/observability/blackbox/blackbox.yml:/etc/blackbox/blackbox.yml:ro

  # Synthetic JOURNEY prober — functional probes (real authenticated requests through the provider
  # chain / tool catalog), not just liveness. Exports synthetic_journey_up/_duration_ms over OTLP.
  synthetic-prober:
    # MON-09f: `image` AND `build`. The image is what deploy.yml can actually start --- it runs
    # `up -d --no-build`, so a build-only service has nothing to launch and the deploy dies at
    # that service (it did). release.yml now builds and pushes this tag like any other component.
    # `build` stays so local development can still `docker compose build synthetic-prober`.
    image: ghcr.io/${GHCR_OWNER:-hansel-gaiada}/gaiada-synthetic-prober:${GAIADA_TAG:-latest}
    build: ../../infra/observability/synthetic-prober
    restart: unless-stopped
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4318"
      OTEL_SERVICE_NAME: "synthetic-prober"
      PROBER_JOURNEYS_FILE: /journeys.json
      PROBE_INTERVAL_MS: ${PROBE_INTERVAL_MS:-30000}
      GATEWAY_TOKEN: ${GATEWAY_TOKEN:-}
    volumes:
      - ../../infra/observability/synthetic-prober/journeys.json:/journeys.json:ro
    depends_on:
      - otel-collector

  # --- Merge-overrides: switch ON telemetry export for the core services. Compose merges these
  # `environment` maps into the services defined in docker-compose.vps.yml, so OTEL is enabled ONLY
  # when this observability file is included — the data plane never depends on the collector. Each
  # service's telemetry bootstrap reads OTEL_ENABLED + OTEL_EXPORTER_OTLP_ENDPOINT + OTEL_SERVICE_NAME.
  ai-gateway:
    environment:
      OTEL_ENABLED: "1"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4318"
      OTEL_SERVICE_NAME: "ai-gateway"
  platform:
    environment:
      OTEL_ENABLED: "1"
      # MON-09i: lets the admin Observability console (/systems/observability) read this box's own
      # health back out of Prometheus. Set HERE rather than in vps.yml or .env deliberately:
      #  * it is only meaningful when the observability stack is deployed, and this file IS that
      #    condition -- so the console cannot be configured to point at a Prometheus that is absent;
      #  * a literal beats an env var because the address is fixed inside the compose project, and
      #    a var in .env silently does nothing unless a service's environment block lists it,
      #    which is a trap this repo has already been bitten by.
      # Unset => the console reports itself unconfigured; it never implies the box is healthy.
      # Points at the RELOCATED Prometheus over WireGuard (docs/plans/2026-08-18-observability-
      # relocation.md). The local one is decommissioned, so the in-project name no longer resolves.
      # Not localhost and not a compose service name: this crosses hosts now.
      PROMETHEUS_URL: "http://10.88.0.2:19090"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4318"
      OTEL_SERVICE_NAME: "platform"
  sync-central:
    environment:
      OTEL_ENABLED: "1"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4318"
      OTEL_SERVICE_NAME: "sync-engine"
  knowledge:
    environment:
      OTEL_ENABLED: "1"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4318"
      OTEL_SERVICE_NAME: "knowledge"
  mcp-hub:
    environment:
      OTEL_ENABLED: "1"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4318"
      OTEL_SERVICE_NAME: "mcp-hub"
  bot:
    environment:
      OTEL_ENABLED: "1"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4318"
      OTEL_SERVICE_NAME: "wa-chat-bot"
  bot-media-worker:
    environment:
      OTEL_ENABLED: "1"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4318"
      OTEL_SERVICE_NAME: "bot-media-worker"

volumes:
  # MSO-00: prometheus-data/tempo-data/loki-data/grafana-data/alertmanager-data/
  # alertmanager-config/ntfy-data removed — they belonged to the storage/alerting services deleted
  # above, which now live only in docker-compose.obs-remote.yml on the SumoPod side. Those NAMED
  # volumes still exist on gda-aicenter today, undeleted, holding real historical data. See the
  # MSO-00 execution record in docs/plans/2026-08-21-multi-server-observability.md for the
  # decommission status and why they were deliberately NOT dropped here.
  otel-queue:
