# ⚠ SUPERSEDED (MSO-00, 2026-08-21) — DO NOT bring this file up. It predates the WS9 stack
# consolidation (2026-08-13) and the 2026-08-18 relocation. otel-collector + Prometheus now live
# as described in docker-compose.observability.yml (collection, gda-aicenter) and
# docker-compose.obs-remote.yml (storage, SumoPod `10.88.0.2:19090`). Not in the COMPOSE_FILES
# repo variable; confirmed 2026-08-21 that nothing currently running on gda-aicenter was started
# from it (docker ps -a shows no `gaiada-otel-metrics-*` container, only the leftover
# `gaiada-otel-metrics_prometheus-data` VOLUME from when it last ran). Kept for provenance, not
# deleted.
#
# OBS-01 (Tier 1) — otel-collector + Prometheus ONLY, run as their OWN compose project, attached
# to the existing `gaiada` stack network as an external network. Same precedent as MAIL-02's
# docker-compose.alertmanager-mail.yml: a separate compose project survives
# `docker compose -p gaiada ... up -d --remove-orphans` on the main stack, because
# --remove-orphans only prunes services within the SAME project that aren't in its current
# compose files — it never touches a different project's containers.
#
# WHY NOT docker-compose.observability.yml: that file is the FULL WS9 stack (+Tempo/Loki/Grafana/
# 6 exporters/ntfy) merged into the MAIN `gaiada` project (name: gaiada) — bringing it up would
# mean either (a) adding it to the main project's COMPOSE_FILES, which risks deploy.yml's
# --remove-orphans reaping anything not listed, or (b) a second alertmanager, duplicating MAIL-02.
# This box is disk-constrained (76% / 12G free at authoring time) and the ticket scope is
# deliberately Tier 1: just enough to let the 5 mail alert rules evaluate and reach the ALREADY
# running gaiada-alertmanager project. Grafana/Loki/Tempo/exporters are a separate decision.
#
# otel-collector originally used config.tier1-metrics.yaml (metrics only, no Tempo/Loki running).
#
# OBS-02 (2026-08-06): promoted to config.tier2-logs.yaml now that Loki is up as its own project
# (docker-compose.loki.yml, project gaiada-loki) — adds the filelog receiver + logs pipeline back,
# still with no traces/Tempo (unchanged reasoning: don't export toward a target that isn't
# running). See config.tier2-logs.yaml's header for the promotion path to the full stack.
#
# `user: "0:0"` is required for the filelog receiver to read container logs on this box: measured
# directly — /var/lib/docker/containers is root:root mode 710 (owner rwx, group/other cannot even
# list it), and the individual *-json.log files are root:root mode 640. The image's default
# non-root uid (10001), even with the root GID added via group_add, could not list the directory
# (mode 710 has no group-read bit) — confirmed with `setpriv --reuid=10001 --regid=10001
# --groups=0` failing "Permission denied" on this exact box, while `--reuid=0 --regid=0` (root,
# which bypasses DAC checks) succeeded. Root here is scoped to a read-only bind mount; the
# container gets no other elevated capability.
#
# Bring up:
#   cd infra/compose
#   docker compose -f docker-compose.otel-metrics.yml up -d
# Tear down (keeps the shared network + main project untouched):
#   docker compose -f docker-compose.otel-metrics.yml down
name: gaiada-otel-metrics

services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.116.1
    restart: unless-stopped
    user: "0:0"
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ../observability/otel-collector/config.tier2-logs.yaml:/etc/otelcol/config.yaml:ro
      # Read-only tail of container stdout for the filelog receiver (logs -> Loki). Same mount as
      # the known-good docker-compose.observability.yml.
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    networks:
      - stack

  prometheus:
    image: prom/prometheus:v3.1.0
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=15d"
      - "--web.enable-lifecycle"
    volumes:
      - ../observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../observability/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    ports:
      # loopback-only (SSH tunnel) — mirrors every other admin UI on this box.
      - "127.0.0.1:9090:9090"
    depends_on:
      - otel-collector
    networks:
      - stack

networks:
  # The main stack's implicit default network (project `gaiada`, no explicit `networks:` block in
  # docker-compose.vps.yml => Compose names it "gaiada_default"). Referenced external so Prometheus
  # can resolve `alertmanager` (already running as the gaiada-alertmanager project) and so `platform`
  # etc. can resolve `otel-collector` by service name, without merging into the main project.
  stack:
    name: gaiada_default
    external: true

volumes:
  prometheus-data:
