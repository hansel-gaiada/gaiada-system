# WebDesk (Zone B) — OTel Collector stub, WSK-01.
#
# Fail-soft posture (§09/§11): OTEL_ENABLED=false is a supported state everywhere in this
# project, so this collector only needs to exist, not do anything clever yet. The real write-only
# push to a dedicated Zone A OTLP ingest listener is a WSK-28 deliverable and does not exist —
# this config never names a Zone A host.

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch: {}

exporters:
  debug:
    verbosity: basic

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug]
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug]
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug]
