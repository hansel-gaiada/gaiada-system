# Site CI/CD for a WebDesk-generated repo (kind: wp). Source of truth: webdesk/templates/ in the
# gaiada monorepo; edit there, not in the published template repo.
#
# verify: skipped entirely when this repo IS a template (name starts with "template-", or a
#   .template marker file exists). Otherwise requires CONTRACT.lock, then installs and builds.
# deploy: default branch only, after verify. Gated by the org secret WEBDESK_DEPLOY_GRANT, which the
#   ERP grants only to registered repos that have a lock. The real target is defined by M6-P6.
name: site

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      is_template: ${{ steps.tpl.outputs.template }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Detect template repo
        id: tpl
        run: |
          name="${GITHUB_REPOSITORY#*/}"
          if [ "${name#template-}" != "$name" ] || [ -f .template ]; then
            echo "template=true" >> "$GITHUB_OUTPUT"
            echo "Template repo: verify skipped."
          else
            echo "template=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Require CONTRACT.lock
        if: steps.tpl.outputs.template != 'true'
        run: |
          if [ ! -f CONTRACT.lock ]; then
            echo "::error::CONTRACT.lock is missing. This repo has not been filled by code.scaffold; nothing here may build or deploy without the lock."
            exit 1
          fi
      - name: PHP lint (php:8.3-cli, no network, read-only mount)
        if: steps.tpl.outputs.template != 'true'
        run: |
          docker run --rm --network none -v "$PWD:/src:ro" -w /src php:8.3-cli \
            sh -c 'find wp-content -name "*.php" -print0 | xargs -0 -n1 php -l'

  deploy:
    needs: verify
    if: needs.verify.outputs.is_template != 'true' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    steps:
      - name: Require deploy grant
        env:
          GRANT: ${{ secrets.WEBDESK_DEPLOY_GRANT }}
        run: |
          if [ -z "$GRANT" ]; then
            echo "::error::this repo has not been granted deploy access (no webdev_sites row or no CONTRACT.lock) — see M6-P4g"
            exit 1
          fi
      - name: Deploy (placeholder)
        run: echo "Deploy target is defined by M6-P6; nothing is deployed from this template."
