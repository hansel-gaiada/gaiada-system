# WebDesk Zone B — helios production overlay (WSK-28, owner ruling 2026-08-27)
#
# Used WITH the base file, never alone:
#   docker compose -f docker-compose.yml -f docker-compose.helios.yml <cmd>
#
# =============================================================================================
# WHY AN OVERLAY, AND WHY `!reset` ON EVERY `ports:`
# =============================================================================================
# The base file is a DEV stack: `payload`, `payload-gateway`, `api` and `worker` all run
# `echo ... && sleep infinity` on a bare node image, and every backing service PUBLISHES a host
# port on 0.0.0.0. Both are wrong here, and the second is dangerous:
#
#   helios serves 23 live third-party client sites. Publishing Postgres, Redis and MinIO on
#   0.0.0.0 there would put Zone B's datastores on the same public interface as those sites.
#
# Compose MERGES `ports` additively across files — an overlay cannot remove a published port by
# redeclaring the list. That is why every service below carries `ports: !reset []`: it clears the
# base file's publication instead of appending to it. Verify with
# `docker compose ... config | grep -A3 ports:` and confirm the ONLY published port is proxy's,
# bound to 127.0.0.1. A standalone file was the alternative, and rejected: it would duplicate ~120
# lines of `environment:` that must stay identical to the base or the app misbehaves in ways no
# gate here would catch.
#
# CAREFUL — `!reset` REMOVES a key; it cannot reset-and-replace. Written as `ports: !reset` with a
# list underneath, Compose discards the list too: the first version of this file resolved to a proxy
# with NO published port and api/payload with NO command, and `docker compose config` exited 0 on
# it. Replacement needs `!override`. Both tags are used deliberately below — `!reset []` where the
# value must disappear (every backing service's ports), `!override` where it must be replaced
# (proxy's ports, each real command, proxy's depends_on). Audit the RESOLVED config, not the
# overlay, before believing either.
#
# `profiles: !reset []` for the same mechanical reason — the base gates these on the `dev` profile,
# and this overlay is the production definition, so they must be unconditional.
#
# =============================================================================================
# THE TOPOLOGY THIS ENFORCES
# =============================================================================================
#   internet :443 -> nginx (EXISTING on helios, 23 client vhosts, NOT touched by this file)
#                      `- webdesk vhost -> 127.0.0.1:8380 -> proxy (Caddy, this stack)
#                                                              |- /v1     -> payload-gateway
#                                                              |- /forms  -> api
#                                                              |- /media  -> api
#                                                              |- /healthz
#                                                              `- 404: /admin* /api/* /control/*
#
#   private docker network, NO host ports at all:
#     postgres  redis  minio  payload (admin, internal listener)  payload-gateway  api
#
# Payload's admin panel is reachable ONLY from inside the Docker network — i.e. over SSH with a
# tunnel. That is design D-5 / WSK-D20 ("Payload admin is never public") and it is deliberately
# stricter than the pilot CMS already running on delphi, which publishes
# `pilot-fullstack-cms-admin.gaiada.online` to the open internet.
#
# =============================================================================================
# WHAT IS DELIBERATELY ABSENT
# =============================================================================================
# * `worker` — no worker entrypoint exists yet. `api/package.json` has exactly one start script
#   (`node dist/main.js`); queue consumers are WSK-07/11 scope. Running the base file's stub in
#   production would be a container that prints a sentence and sleeps, so it is not here. When a
#   real worker lands, add it with the api image and its own command.
# * `clamav`, `imgproxy`, `otel-collector`, `status-page`, `mailpit` — not in this first cut. They
#   are additive and none is on the request path for /v1, /forms or /media.
# * MinIO is NOT publicly routed. Public media is served THROUGH the api (`/media/*`), which reads
#   from MinIO over the private network. If a future feature needs browser-facing presigned S3
#   URLs, that is a routing decision to make explicitly, not to discover in production.

services:
  # --- the one public listener -----------------------------------------------------------------
  proxy:
    profiles: !reset []
    ports: !override
      # 127.0.0.1 ONLY. nginx on this box is the thing that reaches it; nothing else should.
      # 8380 verified free on helios before choosing it (22/53/80/443/3306/5432/6379/6432/8080/
      # 8082/8443/9000/9001/11000/11211/12000-20000-odd are taken by the existing estate).
      - "127.0.0.1:${WEBDESK_PROXY_HTTP_PORT:-8380}:80"
    environment:
      # WSK-28's CDN-bypass gate on /media/*. Empty = NOT enforced (a documented dev fail-soft),
      # which is fail-OPEN in production — run `node ops/scripts/check-cdn-bypass.mjs
      # --assert-configured` on the box before trusting it.
      WEBDESK_EDGE_VERIFY_SECRET: ${WEBDESK_EDGE_VERIFY_SECRET:-}
    # The base file has `proxy` depend on `status-page`, which this cut excludes — an undefined
    # dependency makes the whole project invalid, so the list is replaced rather than appended.
    # Consequence, stated rather than discovered later: the Caddyfile's `/status/*` route will
    # serve an empty volume and 404 until status-page is added. A 404 is not an exposure, so this
    # is an acceptable first cut, but the public route does exist.
    # `payload-gateway` is added because Caddy proxies /v1 to it and the base file omits it — an
    # ordering bug that only shows up as a cold-start 502 on the one path clients actually use.
    depends_on: !override
      - api
      - payload
      - payload-gateway
    restart: unless-stopped

  # --- Payload: INTERNAL listener (admin + Payload REST). Never public. ------------------------
  payload:
    profiles: !reset []
    image: !reset null
    build:
      context: ./payload
    command: !override ["node", "server.js"]
    ports: !reset []
    restart: unless-stopped

  # --- Payload: PUBLIC gateway (/v1 + /healthz only, no payload/next import) -------------------
  payload-gateway:
    profiles: !reset []
    image: !reset null
    build:
      # Same image as `payload` on purpose — the gateway script ships inside it
      # (src/public-gateway.mjs, verified present in the built image). A different COMMAND, not a
      # different build.
      context: ./payload
    command: !override ["node", "src/public-gateway.mjs"]
    ports: !reset []
    restart: unless-stopped

  # --- the API: control plane, forms, media ----------------------------------------------------
  api:
    profiles: !reset []
    image: !reset null
    build:
      context: ./api
    command: !override ["node", "dist/main.js"]
    ports: !reset []
    # THE COMPOSE-ENV-PASSTHROUGH TRAP, caught by actually booting the real image (the base file
    # was written for a `sleep infinity` stub that read no env at all, so nothing ever noticed).
    # The api refuses to boot in production without STORAGE_ACCESS_KEY_ID / STORAGE_SECRET_ACCESS_KEY
    # — correctly, via its own requireInProd — and the base file passes MINIO_ENDPOINT / MINIO_ROOT_*
    # instead, which the application does not read. First `up` gave a clean crash loop:
    #   "[webdesk:api] STORAGE_ACCESS_KEY_ID is not set — refusing to boot in production."
    # Mapping keys MERGE across compose files, so this adds to the base's 36 vars rather than
    # replacing them. Defaulted to the MinIO root credentials the same way imgproxy already does.
    environment:
      APP_DATABASE_URL: ${APP_DATABASE_URL}
      STORAGE_ENDPOINT: ${STORAGE_ENDPOINT:-http://minio:9000}
      STORAGE_ACCESS_KEY_ID: ${STORAGE_ACCESS_KEY_ID:-${MINIO_ROOT_USER}}
      STORAGE_SECRET_ACCESS_KEY: ${STORAGE_SECRET_ACCESS_KEY:-${MINIO_ROOT_PASSWORD}}
      STORAGE_REGION: ${STORAGE_REGION:-us-east-1}
      # MinIO is not S3-virtual-host addressable, so path style is mandatory here.
      STORAGE_FORCE_PATH_STYLE: ${STORAGE_FORCE_PATH_STYLE:-true}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      # --- WSK-22 control channel (§03 Layers 1-2) ------------------------------------------
      # All five are already in .env.example and NONE of them reached the container — the same
      # passthrough trap as STORAGE_*, but on the security-critical vars. Setting them in .env
      # would have silently done nothing, and the failure mode is not subtle: the api REFUSES to
      # boot without the CA (correctly), so the whole service, including the PUBLIC /forms and
      # /media surface, stays down. They are read via a `requireEnv` helper in
      # src/control/auth/real-control-channel-authenticator.ts, not `process.env.X` directly,
      # which is why a grep for process.env missed them.
      #
      # WEBDESK_CONTROL_MTLS_CA_PEM has NO default and is the hard prerequisite: it is the
      # synccert CA (issue per infra/runbooks/webdesk-zoneb-box-hardening.md §5). The other four
      # DO have in-code defaults pointing at erp.gaiada.online's Keycloak realm — passed
      # explicitly here anyway, because an environment silently inheriting a hardcoded issuer is
      # how a box ends up trusting the wrong identity provider.
      WEBDESK_CONTROL_MTLS_CA_PEM: ${WEBDESK_CONTROL_MTLS_CA_PEM:-}
      WEBDESK_CONTROL_MTLS_ALLOWED_CN: ${WEBDESK_CONTROL_MTLS_ALLOWED_CN:-platform-nest-webdesk}
      WEBDESK_CONTROL_OIDC_ISSUER: ${WEBDESK_CONTROL_OIDC_ISSUER:-}
      WEBDESK_CONTROL_OIDC_AUDIENCE: ${WEBDESK_CONTROL_OIDC_AUDIENCE:-webdesk-control-plane}
      WEBDESK_CONTROL_OIDC_JWKS_URI: ${WEBDESK_CONTROL_OIDC_JWKS_URI:-}
    restart: unless-stopped

  # --- backing services: private network, zero host ports -------------------------------------
  postgres:
    profiles: !reset []
    ports: !reset []
    restart: unless-stopped

  redis:
    profiles: !reset []
    ports: !reset []
    restart: unless-stopped

  minio:
    profiles: !reset []
    ports: !reset []
    restart: unless-stopped
