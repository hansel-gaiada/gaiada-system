# WebDesk Zone B — gda-aicenter overlay (2026-08-31 re-zoning, supersedes the sumopod target for
# WebDesk specifically).
#
# Used WITH the base file, never alone:
#   docker compose -f docker-compose.yml -f docker-compose.aicenter.yml <cmd>
#
# WHY THIS FILE EXISTS: the owner's 2026-08-31 estate re-zoning replaced the Zone A/B tier model.
# The new rule is purpose-based, not spare-capacity-based: "system lives in aicenter" — the ERP
# control plane AND everything operational to it (WebDesk included) now belong on `gda-aicenter`.
# `docker-compose.sumopod.yml` remains in the repo as the record of the superseded 2026-08-29
# ruling (WSK-D27); do not delete it, and do not run both overlays against the same box.
#
# Design: ../docs/blueprints/webdesk-design-v2.md §03 (co-tenancy cost, restated for THIS box —
# it is materially worse than the sumopod case: gda-aicenter runs the ERP's own host Postgres,
# Keycloak and Cerbos on the SAME kernel, not merely "neighbours"). Runbook:
# ../docs/plans/2026-08-31-workload-consolidation-to-aicenter.md.
#
# =============================================================================================
# WHAT THIS OVERLAY ENFORCES, restated per the sumopod file's own precedent
# =============================================================================================
#   * Its OWN compose project (`name: webdesk` — unchanged), so the estate's `--remove-orphans`
#     trap (scoped to project `gaiada`) cannot reach it.
#   * Its OWN docker network (`webdesk_default`, created implicitly since this project declares
#     none of its own). NEVER add `networks: [gaiada_default]` to any service below — that
#     single line would be the whole isolation story failing silently. There is no route from
#     this project's network to the ERP's `gaiada_default` (172.18.0.0/16) by construction, as
#     long as that line is never added.
#   * NO host ports at all except `proxy`, bound to 127.0.0.1. A NEW public nginx vhost
#     (`../infra/nginx/webdesk.aicenter.conf`) is the actual public listener — nginx already
#     owns 0.0.0.0:80/:443 on this box, so Caddy structurally cannot be. See that file.
#   * Own Postgres, own Redis, own RustFS — no reuse of the host Postgres instance the ERP uses.
#     Collapsing WebDesk into the ERP's host Postgres would destroy the credential separation
#     that is the one containment property the design has left after co-tenancy (v2.0 §03: "Zone
#     B holds no Zone A credential"). Never do this regardless of how tempting the ops
#     simplicity looks.
#   * `cpus` + `mem_limit` + `pids_limit` on EVERY service — the estate's own "empty env var
#     becomes zero" trap (`${VAR:-}` + a busy loop at 46% CPU) means these must be literal
#     numbers below, never left to an interpolated default that could resolve empty.
#   * `no-new-privileges` + full cap-drop + read-only rootfs where the process can tolerate it
#     (the api needs a writable /tmp for Node — given as an explicit tmpfs,
#     never a writable rootfs). `cap_drop: [ALL]` is on EVERY service below (M4 F3, 2026-10-11),
#     with the MINIMUM `cap_add` each image's entrypoint needs, each commented with the reason.
#     scripts/check-compose-hardening.mjs fails CI if a service loses it, and
#     ops/probes/compose-boot-proof.sh boots these real files and checks `docker inspect`.
#   * A PINNED network subnet (M4 F2): see the `networks:` block at the bottom of this file.
#
# ALWAYS AUDIT THE RESOLVED CONFIG, NEVER THE OVERLAY (same trap as the sumopod file: `!reset`
# on an empty `ports:` block still exits 0 if written wrong):
#   docker compose -f docker-compose.yml -f docker-compose.aicenter.yml config | grep -A3 'ports:'
# The only published port must be proxy's, on 127.0.0.1.
#
# =============================================================================================
# CAPACITY — WSK-D72 (owner, 2026-10-12): a 1.0 vCPU PROJECT BUDGET on a 2-vCPU box
# =============================================================================================
# gda-aicenter was 4 vCPU at the 2026-08-31 survey and is now an e2-highmem-2: 2 vCPU / 16 GiB, shared with
# the whole ERP. The old ceilings summed to 3.25 vCPU, more than the box. The owner chose the no-cost option:
# WebDesk's CPU ceilings sum to 1.0 vCPU (api 0.40, postgres 0.30, proxy/redis/rustfs 0.10 each), so WebDesk
# alone can never take more than half the box. Measured at rest 2026-10-11: ~0.1 vCPU total; one full site
# build is 34 /v1 reads. Memory ceilings are unchanged (~2.75 GiB of 16). Revisit before a second tenant
# (docs/blueprints/webdesk-tenant-cost-and-quotas.md §4).
#
# =============================================================================================
# WHAT IS DELIBERATELY ABSENT (same reasoning as the sumopod file)
# =============================================================================================
# * No `ports:` for the control channel, by design (WSK-63a): mTLS terminates in the host-nginx vhost
#   `control.webdesk.internal` (ops/nginx/), listening on the docker0 address, and reaches the same
#   loopback `proxy` above. Do not add a published port or a gaiada_default network for it.
# * `worker` — no real entrypoint exists yet (api/package.json has one start script). Shipping
#   the base file's stub here would be a container that prints a sentence and sleeps.
# * `clamav`, `imgproxy`, `otel-collector`, `status-page`, `wd-backup-sentinel` — additive, none
#   on the /v1, /forms or /media request path. Land them in a follow-up ticket once the base
#   three services are DEV-VERIFIED on this box.

services:

  # --- the one published listener, loopback only ------------------------------------------------
  proxy:
    # M4 F4: pinned by digest (the multi-arch index `caddy:2-alpine` named on 2026-10-11, from
    # `docker buildx imagetools inspect caddy:2-alpine`). Bump deliberately: re-run that command,
    # change the digest here, run ops/probes/compose-boot-proof.sh.
    image: caddy:2-alpine@sha256:d8542f48d34a9cf4e4c11a478865229840e87e4c96ea3f439101f31a5d35f75f
    profiles: !reset []
    ports: !override
      - "127.0.0.1:${WEBDESK_PROXY_HTTP_PORT:-8380}:80"
    depends_on: !override
      - api
    # WSK-63a: the gate secret Caddy compares against X-Webdesk-Control-Gate on /control/* (compose
    # env-passthrough trap: a var in .env does nothing unless it is listed here). Required, not
    # defaulted: the Caddyfile fails closed on an empty value, so a missing one would silently leave
    # the control channel permanently 404 - better to refuse to start. `environment` is a MAP, so this
    # merges with the base file's WEBDESK_EDGE_VERIFY_SECRET (no !override, which would drop it).
    environment:
      WEBDESK_CONTROL_GATE_SECRET: ${WEBDESK_CONTROL_GATE_SECRET:?WEBDESK_CONTROL_GATE_SECRET is required - 64 hex chars, shared with the host-nginx control.webdesk.internal vhost (infra/runbooks/webdesk-control-channel.md)}
    # M4 F3. caddy:2-alpine runs as root and binds :80 INSIDE the container, and its binary carries the
    # file capability `cap_net_bind_service=ep` (checked with getcap on the pinned digest). With the
    # bounding set emptied by cap_drop, that file cap would make exec FAIL unless the cap is added back.
    # It writes only /data and /config (root-owned volumes) and reads a world-readable Caddyfile, so it
    # needs no DAC_OVERRIDE.
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    cpus: 0.10
    mem_limit: 256m
    pids_limit: 128

  # --- payload and payload-gateway: RETIRED (WSK-48a: /v1 is served by the api's `delivery` module;
  # --- WSK-48b: the Payload app and its `payload` service are deleted, WSK-D37) ---

  # --- forms . mail . media . control plane -----------------------------------------------------
  api:
    profiles: !reset []
    image: !reset null
    build:
      context: .
      dockerfile: api/Dockerfile
    command: !override ["node", "dist/main.js"]
    ports: !reset []
    # Same passthrough-trap fix as the sumopod overlay: these are required in
    # api/src/storage/storage.config.ts and are NOT in the base file's `api` block.
    environment:
      STORAGE_ACCESS_KEY_ID: ${STORAGE_ACCESS_KEY_ID:?STORAGE_ACCESS_KEY_ID is required - the dedicated service key from scripts/storage-bootstrap.mjs}
      STORAGE_SECRET_ACCESS_KEY: ${STORAGE_SECRET_ACCESS_KEY:?STORAGE_SECRET_ACCESS_KEY is required - the dedicated service key from scripts/storage-bootstrap.mjs}
      STORAGE_BUCKET_MEDIA: ${STORAGE_BUCKET_MEDIA:-media}
      STORAGE_BUCKET_VIDEO: ${STORAGE_BUCKET_VIDEO:-video}
      STORAGE_BUCKET_UPLOADS: ${STORAGE_BUCKET_UPLOADS:-uploads}
      STORAGE_BUCKET_ARTIFACTS: ${STORAGE_BUCKET_ARTIFACTS:-artifacts}
      WEBDESK_MEDIA_MAX_UPLOAD_BYTES: ${WEBDESK_MEDIA_MAX_UPLOAD_BYTES:-26214400}
      WEBDESK_MEDIA_PRESIGN_TTL_SECONDS: ${WEBDESK_MEDIA_PRESIGN_TTL_SECONDS:-900}
      # M4: 5 GiB = the code default and the live value (was 10 GiB here; cost doc s5). The read-quota
      # vars (WEBDESK_READ_QUOTA_*) are passed through in the BASE file's api block.
      WEBDESK_TENANT_STORAGE_QUOTA_BYTES: ${WEBDESK_TENANT_STORAGE_QUOTA_BYTES:-5368709120}
      # WSK-43a: the bucket retention the media-purge job waits out (the SAME variable storage-bootstrap.mjs applies; empty = 1).
      WEBDESK_STORAGE_LOCK_DAYS: ${WEBDESK_STORAGE_LOCK_DAYS:-}
      # WSK-43a: the browser origins (https://host[:port], comma separated) that may call the public media upload route; the ERP editor's origin. Empty = no CORS headers.
      WEBDESK_UPLOAD_CORS_ORIGINS: ${WEBDESK_UPLOAD_CORS_ORIGINS:-}
      API_KEY_PEPPER: ${API_KEY_PEPPER}
      # Control-channel CA (WSK-22), fixed 2026-09-01 after a 337+-restart crash loop: `env_file`
      # on a quoted multi-line PEM is what broke, on THIS box specifically to an empty string (see
      # real-control-channel-authenticator.ts's header comment for the full incident and why the
      # old sumopod value was never usable either). A file mount is immune to that class of bug by
      # construction — a literal path here, not `${VAR}` interpolation, so it can never silently
      # resolve empty the way the old inline var did. Reuses the SAME host path the control
      # vhost's own Caddy `trusted_ca_cert_file` already expects (see
      # ../infra/runbooks/webdesk-zoneb-box-hardening.md §5) — one file, one source of truth.
      WEBDESK_CONTROL_MTLS_CA_FILE: /etc/webdesk/certs/ca-cert.pem
      # WSK-40 — the pinned editorial JWKS (design §5): the ERP's PUBLIC Ed25519 key(s), 1 normally, 2
      # during a rotation overlap. Same discipline and channel class as the CA above: a literal path,
      # a read-only FILE mount, shape-validated at boot (a present-but-truncated or non-Ed25519 file
      # refuses boot). Absent → the api still boots (/v1 delivery stays up) and every content write
      # answers 503 editorial-keys-not-configured. No private key ever lives on this box (D39).
      # Install / rotate: ../infra/runbooks/webdesk-editorial-keys.md.
      WEBDESK_EDITORIAL_JWKS_FILE: /etc/webdesk/editorial/editorial.jwks.json
      # M4 F1 — the pinned WS4 JWKS: the PUBLIC half of the ERP's WS4 v2 (EdDSA) approval-assertion key,
      # a SEPARATE key pair and a SEPARATE file from the editorial set above (the api refuses boot if the
      # two share a kid or a key). Same discipline: literal path, read-only FILE mount, shape-validated at
      # boot (present but malformed → boot refused). Absent → v2 is unavailable and WS4 v1 (HMAC,
      # WEBDESK_APPROVAL_ASSERTION_KEY in /etc/webdesk/.env, NOT .env.control) works only while it is set.
      # Live since 2026-10-12 with kid ws4-2026-10, and v1 is retired there. No private key ever lives on
      # this box. Install / rotate: ../infra/runbooks/webdesk-ws4-keys.md.
      WEBDESK_WS4_JWKS_FILE: /etc/webdesk/ws4/ws4.jwks.json
    # Everything else control-channel (WSK-22) still comes from its own env file, NOT `.env`
    # (single-line secrets only now — the CA left this file on purpose, see above). On THIS box
    # the file is `/etc/webdesk/.env.control`, owned by the dedicated `webdesk-svc` unix user,
    # mode 0600 — see the runbook's filesystem/secrets section. Never root:root, never
    # world-readable, never in the release image.
    env_file:
      - .env.control
    volumes:
      # Read-only bind mount of the pinned synccert CA public cert. Host path is
      # `/etc/webdesk/certs/ca-cert.pem` (0700 `/etc/webdesk`, owned `webdesk-svc` on this box) —
      # see webdesk/README.md's WSK-22 operator steps for how it gets there. Never bind-mount the
      # CA *key* material; Zone B only ever holds the CA's public certificate (design §03).
      - /etc/webdesk/certs/ca-cert.pem:/etc/webdesk/certs/ca-cert.pem:ro
      # WSK-40 — the pinned editorial JWKS, public keys only, read-only FILE mount (see the env row
      # above). If the host file does not exist when the container is created, Docker creates an
      # empty DIRECTORY at the host path; the api treats that as "not configured" (503 on writes), and
      # the runbook removes it before installing the real file.
      - /etc/webdesk/editorial/editorial.jwks.json:/etc/webdesk/editorial/editorial.jwks.json:ro
      # M4 F1 — the pinned WS4 JWKS, public keys only, read-only FILE mount (see the env row above).
      # Same footgun as the editorial file: a missing host file becomes an empty DIRECTORY, which the
      # api treats as "v2 unavailable"; the runbook removes it before installing the real file.
      - /etc/webdesk/ws4/ws4.jwks.json:/etc/webdesk/ws4/ws4.jwks.json:ro
    # M4 F3: node:22-alpine, no entrypoint script, no privileged port (listens on 3000), writes only to
    # the /tmp tmpfs. It runs as root (the image has no USER) but never chowns or switches user, so it
    # needs NO capability. Live-apply note: without DAC_OVERRIDE, root in the container cannot read a
    # bind-mounted host file that is mode 0600 and owned by another uid; the three mounted files above
    # are PUBLIC material and must be readable by "other" (0644/0444). Check before the recreate.
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cpus: 0.40
    mem_limit: 768m
    pids_limit: 256

  # --- datastores: private network only, own containers (never the ERP's host Postgres) ---------
  postgres:
    # M4 F4: digest of the multi-arch index `postgres:16-alpine` named on 2026-10-11
    # (`docker buildx imagetools inspect postgres:16-alpine`). The data volume is a 16.x cluster, so a
    # minor bump is safe; never move the major tag without a dump/restore.
    image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    profiles: !reset []
    ports: !reset []
    # M4 F3. The official entrypoint starts as root, chmods PGDATA (0700), chowns PGDATA and
    # /var/run/postgresql to postgres (`find ... -exec chown`), then `exec gosu postgres`:
    #   CHOWN + FOWNER (chown/chmod of dirs it may not own yet), DAC_OVERRIDE (traverse 0700
    #   postgres-owned dirs while still root), SETUID + SETGID (the gosu drop). After the drop the
    #   server runs as uid 999. The initdb.d script runs as postgres.
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    cpus: 0.30
    mem_limit: 1024m
    pids_limit: 256

  redis:
    # M4 F4: digest of the multi-arch index `redis:7-alpine` named on 2026-10-11 (7.4.11). The live
    # container ran an OLDER image under this same tag (plan F4); the recreate picks this one up.
    image: redis:7-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
    profiles: !reset []
    ports: !reset []
    # M4 F3. Entrypoint (read on the pinned digest): as root it runs `find . ! -user redis -exec chown
    # redis`, then `setpriv --reuid redis --regid redis --clear-groups`: CHOWN, SETUID, SETGID. No
    # DAC_OVERRIDE: /data is a flat directory of redis-owned files that root only lists and chowns.
    # Residual risk for the apply: a live volume holding a 0700 redis-owned SUBDIRECTORY would need it.
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    cpus: 0.10
    mem_limit: 256m
    pids_limit: 128

  rustfs:
    profiles: !reset []
    ports: !reset []
    # M4 F3. The image's USER is rustfs (uid 10001) and /entrypoint.sh has no gosu/su-exec: it only
    # mkdirs and chowns data dirs best-effort (`chown ... || true`), which are no-ops for a user that
    # already owns /data. Nothing needs a capability, so none is added. (Image digest-pinned in base.)
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    cpus: 0.10
    mem_limit: 512m
    pids_limit: 128

  # No `cloudflared` service here — this box already has a public listener (nginx) that the
  # sumopod box lacked for this purpose. Exposure is `../infra/nginx/webdesk.aicenter.conf`
  # (a vhost) plus the loopback `proxy` above, not a tunnel. Do not port the sumopod file's
  # tunnel service here; it would be a second, redundant public entry point to reason about.

# =============================================================================================
# M4 F2: the default network's subnet is PINNED to what it is on gda-aicenter today.
# =============================================================================================
# The host egress guard (ops/host/webdesk-egress-guard.sh, run at boot by webdesk-host-deny.service)
# reads this network's subnet from Docker ONCE and writes iptables rules against it. Docker picks the
# next free 172.x/16 whenever the network is recreated (any `docker compose down`), so an unpinned
# network could come back on another subnet and sit outside every rule until the unit is restarted.
# Pinning means a recreate yields the same subnet and the rules stay valid. 172.19.0.0/16 is the live
# value (2026-10-11); the ERP's `gaiada_default` is 172.18.0.0/16. Do not change it without
# `systemctl restart webdesk-host-deny` afterwards and containment probe 3.
networks:
  default:
    ipam:
      config:
        - subnet: 172.19.0.0/16
