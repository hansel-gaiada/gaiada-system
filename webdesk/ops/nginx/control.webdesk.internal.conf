# WSK-63a - the ERP -> WebDesk control channel, host-nginx side (design write-plane section 11).
#
# TEMPLATE. The only placeholder is ${WEBDESK_CONTROL_GATE_SECRET}; render with
#   envsubst '${WEBDESK_CONTROL_GATE_SECRET}' < control.webdesk.internal.conf > <rendered>
# (naming the variable keeps every nginx $variable below intact). The rendered file holds a secret:
# root:root 0600. Never commit a rendered copy. Procedure: infra/runbooks/webdesk-control-channel.md.
#
# WHAT THIS VHOST IS: the only place mTLS terminates. Caddy stays loopback-only (v2 section 03 AC 2),
# so TLS client-cert verification happens here, then the request is proxied to Caddy on
# 127.0.0.1:8380 with two headers nginx fully controls:
#   X-Webdesk-Mtls-Cert-Pem  OVERWRITTEN with the cert nginx just verified (base64 PEM). A client
#                            supplied value is never forwarded: proxy_set_header replaces it, and an
#                            empty value (no verified cert) removes the header entirely.
#   X-Webdesk-Control-Gate   the shared secret. Caddy routes /control/* to the api ONLY when it matches.
# The public api.gaiada.online vhost must strip both (runbook step 6), and Caddy strips both on its
# public routes, so neither header can arrive from the internet.
#
# LISTENER CHOICE (deliberate):
#   172.17.0.1:9443 - the docker0 gateway, which is what `extra_hosts: control.webdesk.internal:host-gateway`
#   resolves to inside the platform container (confirmed 2026-10-10: host.docker.internal -> 172.17.0.1
#   there; Postgres, Redis and :4310 already listen on that address for the same reason).
#   * Not 127.0.0.1: a container cannot reach the host's loopback.
#   * Not 0.0.0.0 and not :443: a wildcard or shared :443 listener would put an mTLS surface on the
#     public IP (nginx binds the wildcard when one exists on the port, and SNI alone would then
#     select this vhost). 172.17.0.1 is unreachable from outside the box.
#   * Not a docker `ports:` publication: no new host port in compose (section 03 AC 2); this is a
#     host service on an internal address.
#   * BOOT HAZARD: if docker0 is not up when nginx starts, a bind to 172.17.0.1 fails and EVERY vhost
#     on the box (ERP included) stays down. The runbook sets net.ipv4.ip_nonlocal_bind=1 before the
#     first reload, which removes that failure mode. Do not skip it.
#
# njs (libnginx-mod-http-js) supplies base64 for the forwarded cert - nginx has no native base64.
# The module is loaded by the package's /etc/nginx/modules-enabled symlink (before http{}).
# These two directives sit at http level because sites-enabled/* is included inside http{}.

js_import webdesk_control from /etc/nginx/njs/webdesk-control-cert.js;
js_set $webdesk_client_cert_b64 webdesk_control.certB64;

server {
    listen 172.17.0.1:9443 ssl;
    server_name control.webdesk.internal;

    # Server cert: issued from the estate internal CA (CN=gaiada-internal-ca) with
    # SAN DNS:control.webdesk.internal and EKU serverAuth (runbook step 2).
    ssl_certificate         /etc/nginx/webdesk-control/server.crt;
    ssl_certificate_key     /etc/nginx/webdesk-control/server.key;
    ssl_protocols           TLSv1.2 TLSv1.3;
    ssl_session_tickets     off;

    # Client certs: must chain to the internal CA, directly (depth 1: no intermediates exist).
    # Behaviour worth knowing: nginx completes the TLS handshake and then answers HTTP 400
    # (496 no cert / 495 bad cert); it does not abort the handshake. The request never reaches
    # proxy_pass, which is the property that matters (proved in the WSK-63a mini-topology).
    ssl_verify_client       on;
    ssl_client_certificate  /etc/nginx/webdesk-control/ca-cert.pem;
    ssl_verify_depth        1;

    access_log /var/log/nginx/control.webdesk.internal.access.log;
    error_log  /var/log/nginx/control.webdesk.internal.error.log;

    client_max_body_size 1m;

    # Only the control plane is served here. Everything else is 404, so this listener can never
    # become a second way to reach /v1, /forms or /media.
    location /control/ {
        # Defence in depth: ssl_verify_client on already refuses these, but proxying is gated on the
        # verdict again so a future change to the directive above cannot silently open the path.
        if ($ssl_client_verify != SUCCESS) { return 403; }

        proxy_pass         http://127.0.0.1:8380;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";
        proxy_set_header   Host $host;

        # The two security headers. proxy_set_header REPLACES any inbound header of the same name.
        proxy_set_header   X-Webdesk-Mtls-Cert-Pem $webdesk_client_cert_b64;
        proxy_set_header   X-Webdesk-Control-Gate  "${WEBDESK_CONTROL_GATE_SECRET}";

        # Authorization (Layer 2 token), X-Ws4-Assertion (Layer 4) and Idempotency-Key pass through
        # unchanged: nginx proves the transport identity, it does not read those.
        proxy_read_timeout 120s;
    }

    location / { return 404; }
}
