# WSK-63a proof only: the staged public vhost (api.gaiada.online.conf on gda-aicenter) PLUS the two
# header-strip lines the runbook (step 6) adds. Listens on loopback 8081 in the test netns instead of :80.
server {
    listen 127.0.0.1:8081;
    server_name api.gaiada.online;

    location / {
        proxy_pass         http://127.0.0.1:80;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "";
        # WSK-63a: the control-channel headers are minted ONLY by the control vhost. An empty value
        # makes nginx drop the header, so a public caller can never present either one.
        proxy_set_header   X-Webdesk-Control-Gate  "";
        proxy_set_header   X-Webdesk-Mtls-Cert-Pem "";
        proxy_read_timeout 60s;
        client_max_body_size 25m;
    }
}
